constituents:
  - compound: flavonoids
    compoundRu: флавоноиды
    classRu: флавоноиды
    effectRu: содержание до 3 %; основные компоненты — кверцетин, рутин, изокверцитрин, кемпферол, астрагалин, никотифлорин и гиперозид
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Flavonoids (up to 3%): Chief components are quercetin, rutin, isoquercitrin, kaempferol, astragalin (WHO 2002), nicotiflorin (Hänsel et al. 1994; Willer 1997) and hyperoside (Willer 1997; WHO 2002)"
  - compound: chlorogenic and caffeic acids
    compoundRu: хлорогеновая и кофейная кислоты
    classRu: фенолокислоты
    effectRu: в скрининге 68 растительных экстрактов, включая этанольный экстракт цветков бузины, была активность против Bacillus subtilis, Staphylococcus aureus, Salmonella typhi, Klebsiella pneumoniae и Pseudomonas aeruginosa; по поиску литературы, антибактериальные свойства цветков могут быть связаны с хлорогеновой и кофейной кислотами
    evidence: review
    doc: assessment-report
    page: 11
    quote: Izzo et al. (1995) investigated 68 plant extracts from 65 species (including elder flower ethanol extract) for antibacterial activity against eight gram-positive and eight gram-negative bacteria. Elder flower showed activity against Bacillus subtilis, Staphylococcus aureus, Salmonella typhi, Klebsiella pneumoniae and Pseudomonas aeruginosa. According to Izzo et al. (1995), a search of the literature showed that antibacterial properties of elder flower could be attributed to chlorogenic and caffeic acids.
  - compound: elder flower extract
    compoundRu: экстракт цветков бузины
    classRu: экстракт
    effectRu: по данным исследования, экстракт цветков подавляет высвобождение макрофагами провоспалительных цитокинов, вызванное пародонтальными патогенами P. gingivalis, A. actinomycetemcomitans и отдельными компонентами этих микробов, и подавляет активацию нейтрофилов
    evidence: in-vitro
    doc: assessment-report
    page: 11
    quote: The study indicated that elder flower extract inhibits macrophage release of pro-inflammatory cytokines induced by P. gingivalis, A. actinomycetemcomitans, and selected components of these pathogens. Moreover, the elder flower extract suppressed the activation of neutrophils, which have also been implicated as effectors of periodontal tissue destruction.
  - compound: rutin and quercetin
    compoundRu: рутин и кверцетин
    classRu: флавоноиды
    effectRu: сообщали, что рутин и кверцетин, содержащиеся в цветках бузины, ингибируют ксантиноксидазу и теоретически могут влиять на плазменный уровень кофеина и теофиллина
    evidence: review
    doc: assessment-report
    page: 12
    quote: The flavonoids rutin and quercetin, which are found in elder flower, have been reported to inhibit xanthine oxidase (Nagao et al. 1999), and may theoretically affect caffeine and theophylline plasmatic levels.
  - compound: potassium- and flavonoid-rich extract of elder flower
    compoundRu: настой цветков и экстракт, богатый калием и флавоноидами
    classRu: экстракт
    effectRu: у крыс внутрижелудочное введение настоя цветков (20 мл/кг) или экстракта, богатого калием и флавоноидами, вызывало диурез; эффект был сильнее, чем у теофиллина (5 мг/кг)
    evidence: animal
    doc: assessment-report
    page: 12
    quote: According to Rebuelta et al. (1983), intragastric administration of an elder flower infusion (20 ml/kg body weight), or of a potassium-and flavonoid-rich extract of the elder flower extract, had a diuretic effect in rats. The diuretic effect was greater than that observed with theophylline (5 mg/kg body weight).
