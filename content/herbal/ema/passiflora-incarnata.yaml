constituents:
  - compound: flavonoid C-glycosides (isovitexin, isoorientin, schaftoside, vicenin-2, swertisin)
    compoundRu: C-гликозиды флавоноидов (изовитексин, изоориентин, шафтозид, виценин-2, свертизин)
    classRu: флавоноиды
    effectRu: Флавоноиды — главным образом C-гликозиды апигенина и лютеолина, например изовитексин, изоориентин и их 2"-β-D-глюкозиды, шафтозид, изошафтозид, виценин-2 и свертизин; состав заметно меняется в зависимости от источника
    doc: assessment-report
    page: 3
    quote: Flavonoids, mainly C-glycosides of apigenin and luteolin, e.g. isovitexin, isoorientin and their 2"-β-D-glucosides, schaftoside, isoschaftoside, vicenin-2 and swertisin, with considerable variation in qualitative and quantitative composition according to source
    evidence: review
  - compound: passion flower dry extract (DER 5-7:1, ethanol 50 %)
    compoundRu: сухой экстракт пассифлоры (DER 5–7:1, этанол 50 %)
    classRu: экстракт
    effectRu: In vitro фармакологические эффекты экстракта (в концентрациях до 1000 мкг/мл) опосредованы модуляцией системы ГАМК, включая сродство к рецепторам ГАМК-А (IC50 101 мкг/мл) и ГАМК-B (IC50 120 мкг/мл) и ингибирование захвата ГАМК (EC50 95,7 мкг/мл)
    doc: assessment-report
    page: 14
    quote: In vitro studies indicated that pharmacological effects of Passiflora incarnata (dry extract DER 5-7:1; extraction solvent 50% ethanol (V/V), at concentrations of the extract up to 1000 µg/ml) are mediated via modulation of the GABA system including affinity to GABAA (IC50 101µg/ml) and GABAB (IC50 120 µg/ml) receptors and inhibiting effects (EC50 95.7 µg/ml) on GABA uptake (Appel et al., 2011).
    evidence: in-vitro
  - compound: homoorientin, orientin, vitexin, isovitexin
    compoundRu: гомоориентин, ориентин, витексин, изовитексин
    classRu: флавоноиды
    effectRu: Анксиолитические свойства коммерческого сухого экстракта (DER 5–7:1; этанол 50 %) изучали у мышей в приподнятом крестообразном лабиринте; методом ВЭЖХ в экстракте определены как основные соединения гомоориентин, ориентин, витексин и изовитексин; при приёме внутрь в дозе 375 мг/кг экстракт оказывал анксиолитическое действие, сравнимое с диазепамом (1,5 мг/кг)
    doc: assessment-report
    page: 15
    quote: The anxiolytic properties of a commercial extract of Passiflora incarnata (dry extract DER 5-7:1; extraction solvent 50% ethanol (V/V)) was investigated in the elevated plus maze test in mice. Using an HPLC method the flavonoids homoorientin, orientin, vitexin and isovitexin were identified as major compounds in the extract. Following oral administration, the extract exerted an anxiolytic effect that was comparable to diazepam (1.5 mg/kg) at a dose of 375 mg/kg.
    evidence: animal
  - compound: tri-substituted benzoflavone derivative
    compoundRu: трёхзамещённое бензофлавоновое производное
    classRu: флавоноид
    effectRu: Опубликованные данные о фармакодинамике экстрактов пассифлоры и их компонентов, в частности этого производного, дают некоторую поддержку традиционному применению; структура вещества, по-видимому, неизвестна, его количества в сырье и препаратах в литературе не приводились, а достоверность этих данных была поставлена под сомнение (Holbik et al., 2010)
    doc: assessment-report
    page: 17
    quote: Published data on the pharmacodynamics of Passiflora extracts and its constituents, particularly the tri-substituted benzoflavone derivative, give some support to the traditional use of Passiflora for the relief of mild symptoms of mental stress and to aid sleep. The chemical structure of the benzoflavone derivative does not appear to be known and the amounts of substance present in the herbal substance/preparations have not been reported in the literature. Subsequently, the validity of these findings has been questioned by Holbik et al.,2010.
    evidence: review
