constituents:
  - compound: secoiridoid and iridoid glycosides (dihydrofoliamenthin, foliamenthin, menthiafolin, loganin, sweroside)
    compoundRu: секоиридоидные и иридоидные гликозиды (дигидрофолиаментин, фолиаментин, ментиафолин, логанин, свертизид)
    classRu: иридоиды (горькие вещества)
    effectRu: секоиридоидные гликозиды дигидрофолиаментин, фолиаментин и ментиафолин и в меньших количествах иридоидные гликозиды логанин и свертизид; общее количество горьких веществ, по литературным данным, около 1 %
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Iridoids: secoiridoid glycosides: dihydrofoliamenthin, foliamenthin, menthiafolin and smaller amounts of iridoid glycosides loganin and sweroside. The total amount of bitter substances is referred to be approximately 1%."
  - compound: loganin
    compoundRu: логанин
    classRu: иридоидный гликозид (горькое вещество листа)
    effectRu: для логанина, горького вещества листьев, сообщают о стимуляции пищеварительных функций, а также о некоторых защитных эффектах на печень и поджелудочную железу
    evidence: review
    doc: assessment-report
    page: 18
    quote: Supportive for the activity of Menyanthes trifoliata preparations are available data for loganin, the bitter compound of the leaves. Reported are stimulation of digestive functions (Takeda et al., 1980) as well as some protective effects on liver and pancreas (Kim et al., 2015; Park et al., 2011; Yamabe et al., 2010).
  - compound: lyophilized water extracts of the leaves
    compoundRu: лиофилизированные водные экстракты листьев
    classRu: водные экстракты
    effectRu: ограниченные скрининговые данные in vitro показывают лёгкое подавление синтеза простагландинов и слабую антитромбоцитарную активность
    evidence: in-vitro
    doc: assessment-report
    page: 18
    quote: There are limited in vitro screening data showing mild inhibition of prostaglandin biosynthesis and weak antiplatelet activity by the lyophilized Menyanthes trifoliata leaves water extracts, which were reported to be used in Sweden
  - compound: extract containing secoiridoid bitter agents
    compoundRu: экстракт листьев, содержащий горькие секоиридоиды
    classRu: секоиридоиды (горькие вещества)
    effectRu: экстракт листьев (DER 1:1, этанол 55 %), содержащий горькие секоиридоиды, проверяли на грамположительных и грамотрицательных бактериях и дрожжах — активность слабая
    evidence: in-vitro
    doc: assessment-report
    page: 19
    quote: An extract of the Menyanthes trifoliata L., leaves (DER 1:1 obtained with ethanol 55% (V/V)) containing secoiridoid bitter agents was dissolved in water, to obtain a test extract (1:7). It was tested against Gram-positive and Gram-negative bacteria and yeasts showing a weak activity (Weckesser et al., 2007).
