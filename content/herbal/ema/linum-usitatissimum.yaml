# EMA/HMPC facts for Лён обыкновенный (семена). Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian fields are
# a reader's rendering of the quoted English sentence; quotes are checked against the PDF page.
plant: linum-usitatissimum
status: reviewed
useType: both
facts:
  - kind: indication
    ru: Привычный запор или когда нужен мягкий стул (хорошо изученное применение)
    doc: monograph
    page: 3
    quote: Herbal medicinal product for the treatment of habitual constipation or in conditions in which easy defaecation with soft stool is desirable.
  - kind: indication
    ru: Обволакивающее при лёгком дискомфорте в ЖКТ (традиционное применение)
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product used as a demulcent preparation for the symptomatic relief of mild gastrointestinal discomfort.
  - kind: posology
    ru: Семена с 150 мл жидкости (вода, молоко, сок), затем поддерживать достаточный приём жидкости (хорошо изученное применение)
    doc: monograph
    page: 4
    quote: Take 10 - 15 g seeds with 150 ml water, milk, fruit juice or similar aqueous liquid 2 - 3 times daily; then maintain adequate fluid intake.
    dose: { preparationRu: семена с жидкостью, amount: "10-15", unit: г, waterMl: "150", timesPerDay: "2-3", populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: Слизистый настой — разовая доза 5–10 г семян в 250 мл воды, до трёх раз в течение дня (традиционное применение)
    doc: monograph
    page: 4
    quote: "Single dose 5 – 10 g in 250 ml water Daily dose: up to three times during the day"
    dose: { preparationRu: слизистый настой, amount: "5-10", unit: г семян, waterMl: "250", timesPerDay: до трёх, populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: Слизистый настой — замочить цельные или дроблёные семена в воде, принимать за полчаса до еды; время замачивания в монографии не указано (традиционное применение)
    doc: monograph
    page: 4
    quote: For a mucilaginous preparation, soak 5 - 10 g whole or broken seeds in 250 ml water for at least <x min> and take this half an hour before eating.
  - kind: posology
    ru: Действует через 12–24 часа; не принимать прямо перед сном (хорошо изученное применение)
    doc: monograph
    page: 4
    quote: "The effect starts 12 - 24 hours later. Warning: not to be taken immediately prior to bedtime."
  - kind: age
    ru: Детям младше 12 лет не рекомендуется
    doc: monograph
    page: 4
    quote: The use in children under 12 years of age is not recommended
    minAgeMonths: 144
  - kind: duration
    ru: Если запор не прошёл за 3 дня — к врачу или фармацевту
    doc: monograph
    page: 4
    quote: If the constipation does not resolve within 3 days, a doctor or a pharmacist should be consulted.
    maxDays: 3
  - kind: duration
    ru: Если симптомы держатся дольше 1 недели применения — к врачу или медработнику (традиционное применение)
    doc: monograph
    page: 4
    quote: If the symptoms persist for longer than 1 week during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
    maxDays: 7
  - kind: contraindication
    ru: Внезапное изменение стула дольше 2 недель, кровь из прямой кишки неясной причины, нет стула после слабительного (хорошо изученное применение)
    doc: monograph
    page: 4
    quote: Linseed should not be used by patients with a sudden change in bowel habit that persists for more than 2 weeks, undiagnosed rectal bleeding and failure to defaecate following the use of a laxative.
  - kind: contraindication
    ru: Сужения ЖКТ, болезни пищевода и кардии, непроходимость или паралич кишки, мегаколон (хорошо изученное применение)
    doc: monograph
    page: 4
    quote: Linseed should also not be used by patients suffering from abnormal constrictions in the gastro-intestinal tract, with diseases of the oesophagus and cardia or existing intestinal blockage (ileus), paralysis (ileus) of the intestine or megacolon.
  - kind: contraindication
    ru: Трудности с глотанием или любые проблемы с горлом (традиционное применение)
    doc: monograph
    page: 5
    quote: This product should not be taken by patients, who have difficulty swallowing or any throat problems.
  - kind: warning
    ru: При боли в животе или любом нарушении частоты стула — прекратить приём и обратиться к врачу (хорошо изученное применение)
    doc: monograph
    page: 5
    quote: If abdominal pain occurs or in cases of any irregularity of frequency of faeces, the use of linseed should be discontinued and medical advice must be sought.
  - kind: warning
    ru: Без достаточной жидкости семена набухают и могут закупорить горло или пищевод и вызвать удушье; без достаточного питья возможна непроходимость кишечника (хорошо изученное применение)
    doc: monograph
    page: 5
    quote: Taking this herbal substance without adequate fluid, may cause it to swell and block the throat or oesophagus and may cause choking. Intestinal obstruction may occur if adequate fluid intake is not maintained.
  - kind: warning
    ru: Боль в груди, рвота, трудно глотать или дышать после приёма — срочно к врачу (хорошо изученное применение)
    doc: monograph
    page: 5
    quote: If experiencing chest pain, vomiting, or difficulty in swallowing or breathing after taking this herbal substance, immediate medical attention should be sought.
  - kind: warning
    ru: Ослабленных и пожилых пациентов лечить под наблюдением
    doc: monograph
    page: 5
    quote: The treatment of debilitated patients and elderly should be supervised.
  - kind: warning
    ru: Длительный приём может давать эстрогенное действие (исследования у здоровых женщин) — женщинам с гормонозависимыми опухолями не рекомендуется
    doc: monograph
    page: 5
    quote: Investigations in healthy women suggest that long term use of linseed may have an oestrogenic effect, and its use is therefore not recommended in women with hormonally dependent tumours.
  - kind: interaction
    ru: Объёмные слабительные вроде семян льна могут замедлять всасывание других лекарств — принимать не менее чем за ½–1 час до или после них; чтобы снизить риск непроходимости, с препаратами, подавляющими перистальтику (опиоиды, лоперамид), — только под медицинским наблюдением (хорошо изученное применение)
    doc: monograph
    page: 5
    quote: Enteral absorption of concomitantly administered medicines may be delayed by bulk forming laxatives such as linseed. For this reason the product should be taken at least ½ to 1 hour before or after intake of other medicinal products. In order to decrease the risk of gastrointestinal obstruction (ileus), linseed should be used together with medicinal products known to inhibit peristaltic movement (e.g. opioids, loperamide) only under medical supervision.
  - kind: pregnancy
    ru: Сообщений о вреде при беременности и кормлении нет; исследования у здоровых женщин указывают на возможное эстрогенное действие льна. Безопасность не установлена, данных недостаточно — при беременности и кормлении не рекомендуется
    doc: monograph
    page: 6
    quote: There are no reports of any harmful or deleterious effects during pregnancy and lactation. Investigations in healthy women suggest that linseed may have an oestrogenic effect. Safety during pregnancy and lactation has not been established. In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Часто — вздутие; очень редко — реакции гиперчувствительности, включая анафилаксоподобные
    doc: monograph
    page: 6
    quote: Meteorism, occurring with the use of the product, is common. Reactions of hypersensitivity including anaphylaxis-like reactions may occur very rarely.
  - kind: overdose
    ru: Дискомфорт в животе, вздутие, возможна непроходимость кишечника; поддерживать достаточный приём жидкости, лечение симптоматическое (хорошо изученное применение)
    doc: monograph
    page: 6
    quote: Overdose with linseed may cause abdominal discomfort, flatulence and possibly intestinal obstruction. Adequate fluid intake should be maintained and management should be symptomatic.
constituents:
  - compound: mucilage, dietary fibre
    compoundRu: слизи и пищевые волокна
    classRu: полисахариды
    effectRu: около 25% семени — балластные вещества (слизь 3–6%, пищевые волокна 4–7%)
    evidence: review
    doc: assessment-report
    page: 4
    quote: The seeds contain nearly 25% of bulk materials (3 - 6% of mucilage, 4 - 7% of alimentary fibres)
  - compound: mucilage
    compoundRu: слизь
    classRu: полисахариды
    effectRu: набухшая слизь смазывает кишку и облегчает продвижение содержимого
    evidence: review
    doc: assessment-report
    page: 10
    quote: The swollen mass of mucilage forms a lubrication layer facilitating the transit of intestinal content
  - compound: mucilage
    compoundRu: слизь
    classRu: полисахариды
    effectRu: по оценке EMA, защитное действие на слизистую за счёт обволакивающего действия слизи
    evidence: review
    doc: assessment-report
    page: 8
    quote: This use is plausible, attributed to the protective effect on the mucosa by the coating action of the mucilage.
