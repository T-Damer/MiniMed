# EMA/HMPC facts for Золототысячник зонтичный. Draft artifact (status: proposed): Russian fields are
# a reader's rendering of the quoted English sentence; quotes are checked against the PDF page.
plant: centaurium-erythraea
status: proposed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано на длительном опыте
    doc: monograph
    page: 4
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Лёгкие расстройства пищеварения и временная потеря аппетита
    doc: monograph
    page: 4
    quote: Traditional herbal medicinal product used in mild dyspeptic/gastrointestinal disorders and in temporary loss of appetite.
  - kind: posology
    ru: Чай (настой) — взрослые и пожилые
    doc: monograph
    page: 4
    quote: "a) Herbal tea: 1-4 g of the comminuted herbal substance in 200 ml of boiling water as a herbal infusion, up to 4 times daily"
    dose: { preparationRu: настой, amount: "1-4", unit: г, waterMl: "200", timesPerDay: "до 4", populationRu: взрослые и пожилые }
  - kind: age
    ru: До 18 лет не рекомендуется
    doc: monograph
    page: 4
    quote: The use in children and adolescents under 18 years of age is not recommended
    minAgeMonths: 216
  - kind: duration
    ru: Если симптомы держатся дольше 2 недель — к врачу
    doc: monograph
    page: 4
    quote: If the symptoms persist longer than 2 weeks during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
    maxDays: 14
  - kind: contraindication
    ru: Аллергия на золототысячник; язвенная болезнь
    doc: monograph
    page: 5
    quote: Hypersensitivity to the active substance(s). Peptic ulcer.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 5
    quote: Interactions with other medicinal products and other forms of interaction None reported.
  - kind: pregnancy
    ru: При беременности и кормлении грудью не рекомендуется — данных недостаточно
    doc: monograph
    page: 5
    quote: In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Побочные эффекты не известны
    doc: monograph
    page: 6
    quote: Undesirable effects None known.
  - kind: overdose
    ru: При передозировке описаны расстройство желудка и тошнота
    doc: monograph
    page: 6
    quote: Stomach disturbances and nausea have been reported.
constituents:
  - compound: swertiamarin, gentiopicroside, sweroside, centapicrin
    compoundRu: сверциамарин, генциопикрозид, сверозид, центапикрин
    classRu: секоиридоидные гликозиды (горечи)
    effectRu: характерные горькие вещества травы; главным образом (75%) сверциамарин
    evidence: review
    doc: assessment-report
    page: 4
    quote: Secoiridoid glucosides are the characteristic bitter-tasting constituents, principally (75%) swertiamarin and smaller amounts of gentiopicroside (gentiopicrin) and sweroside (bitterness value ca. 12,000) and centapricin
  - compound: swertiamarin, sweroside
    compoundRu: сверциамарин, сверозид
    classRu: секоиридоиды
    effectRu: подавляли рост бактерий (B. cereus, B. subtilis, C. freundii, E. coli)
    evidence: in-vitro
    doc: assessment-report
    page: 14
    quote: "Antibacterial activity could be observed for swertiamarin and sweroside; both compounds inhibited the growth of Bacillus cereus, Bacillus subtilis, Citrobacter freundii and Escherichia coli."
