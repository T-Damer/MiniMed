# EMA/HMPC facts for Сенна (лист). Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian fields are a reader's
# rendering of the quoted English sentence; quotes are checked against the PDF page.
plant: senna-alexandrina
status: reviewed
useType: well-established
facts:
  - kind: indication
    ru: Кратковременно при эпизодическом запоре
    doc: monograph
    page: 3
    quote: Herbal medicinal product for short-term use in cases of occasional constipation.
  - kind: posology
    ru: 'Подростки старше 12 лет, взрослые и пожилые: разовая доза — препарат, соответствующий 10–30 мг гидроксиантраценовых производных (в пересчёте на сеннозид B), один раз в день на ночь; нужна наименьшая доза, дающая мягкий оформленный стул'
    doc: monograph
    page: 4
    quote: 'Adolescents over 12 years of age, adults, elderly Single dose: Herbal preparation equivalent to 10 – 30 mg hydroxyanthracene derivatives, calculated as sennoside B (photometric method) to be taken once daily at night. The correct individual dose is the smallest required to produce a comfortable soft-formed motion.'
    dose: { preparationRu: "препарат с гидроксиантраценовыми производными (в пересчёте на сеннозид B), один раз в день на ночь — доза по содержанию действующих веществ, не по массе листа", amount: "10-30", unit: мг гидроксиантраценовых производных, populationRu: "подростки старше 12 лет, взрослые и пожилые"}
  - kind: age
    ru: Детям младше 12 лет нельзя
    doc: monograph
    page: 4
    quote: The use in children under 12 years of age is contraindicated
    minAgeMonths: 144
  - kind: duration
    ru: Не дольше 1 недели; обычно хватает двух-трёх приёмов за неделю
    doc: monograph
    page: 4
    quote: Not to be used for more than 1 week. Usually it is sufficient to take this medicinal product up to two to three times during that week.
    maxDays: 7
  - kind: contraindication
    ru: Непроходимость и сужение кишки, атония, аппендицит, воспалительные болезни кишечника, боль в животе неясной причины, сильное обезвоживание; беременность и кормление грудью; дети младше 12 лет
    doc: monograph
    page: 4
    quote: Cases of intestinal obstructions and stenosis, atony, appendicitis, inflammatory bowel diseases (e.g. Crohn’s disease, ulcerative colitis), abdominal pain of unknown origin, severe dehydration state with water and electrolyte depletion. Pregnancy and lactation (see section 4.6 and 5.3). Children under 12 years of age.
  - kind: warning
    ru: Долгий приём стимулирующих слабительных нарушает работу кишки и вызывает зависимость; если слабительное нужно каждый день — искать причину запора
    doc: monograph
    page: 5
    quote: Long-term use of stimulant laxatives should be avoided, as use for more than a brief period of treatment may lead to impaired function of the intestine and dependence on laxatives. If laxatives are needed every day the cause of the constipation should be investigated.
  - kind: warning
    ru: Сначала — изменить питание и попробовать набухающие средства
    doc: monograph
    page: 5
    quote: Senna leaf preparations should only be used if a therapeutic effect cannot be achieved by a change of diet or the administration of bulk forming agents.
  - kind: warning
    ru: Нельзя принимать при копростазе и неуточнённых острых или стойких жалобах со стороны ЖКТ (боль в животе, тошнота, рвота) без указания врача — это могут быть признаки кишечной непроходимости
    doc: monograph
    page: 5
    quote: Like all laxatives, senna leaf preparations should not be taken by patients suffering from faecal impaction and undiagnosed, acute or persistent gastro-intestinal complaints, e.g. abdominal pain, nausea and vomiting, unless advised by a doctor, because these symptoms can be signs of potential or existing intestinal blockage (ileus).
  - kind: warning
    ru: Пациентам с заболеваниями почек следует учитывать возможный электролитный дисбаланс
    doc: monograph
    page: 5
    quote: Patients with kidney disorders should be aware of possible electrolyte imbalance.
  - kind: warning
    ru: "Недержание у взрослых: прокладки менять чаще, чтобы кожа не оставалась долго в контакте с калом"
    doc: monograph
    page: 5
    quote: When preparations containing senna leaf preparations are administered to incontinent adults, pads should be changed more frequently to prevent extended skin contact with faeces.
  - kind: interaction
    ru: Гипокалиемия (при длительном злоупотреблении слабительными) усиливает действие сердечных гликозидов и взаимодействует с антиаритмическими средствами; мочегонные, кортикостероиды и корень солодки могут усиливать потерю калия
    doc: monograph
    page: 6
    quote: Hypokalaemia (resulting from long-term laxative abuse) potentiates the action of cardiac glycosides and interacts with antiarrhythmic medicinal products. Concomitant use with diuretics, adrenocorticosteroids and liquorice root may enhance loss of potassium.
  - kind: interaction
    ru: Пациентам, принимающим сердечные гликозиды, антиаритмические средства, препараты, удлиняющие интервал QT, диуретики, кортикостероиды или корень солодки, перед приёмом листьев сенны нужно обратиться к врачу
    doc: monograph
    page: 5
    quote: Patients taking cardiac glycosides, antiarrhythmic medicinal products, medicinal products inducing QT-prolongation, diuretics, adrenocorticosteroids or liquorice root, have to consult a doctor before taking senna leaf preparations concomitantly.
  - kind: pregnancy
    ru: При беременности противопоказано — есть экспериментальные данные о генотоксическом риске ряда антраноидов (например, эмодина и алоэ-эмодина)
    doc: monograph
    page: 6
    quote: The use during pregnancy is contraindicated because experimental data concerning a genotoxic risk of several anthranoids, e.g. emodin and aloe- emodin.
  - kind: lactation
    ru: При кормлении грудью противопоказано — активные метаболиты антраноидов, например реин, в небольших количествах выделяются с грудным молоком
    doc: monograph
    page: 6
    quote: The use during lactation is contraindicated because after administration of anthranoids, active metabolites, such as rhein, were excreted in breast milk in small amounts.
  - kind: adverse
    ru: Боль и спазмы в животе, жидкий стул — особенно при раздражённой толстой кишке
    doc: monograph
    page: 7
    quote: Senna leaf preparations may produce abdominal pain and spasm and passage of liquid stools, in particular in patients with irritable colon.
  - kind: adverse
    ru: При долгом приёме — окрашивание слизистой кишки (псевдомеланоз), обычно проходит после отмены
    doc: monograph
    page: 7
    quote: Furthermore, chronic use may cause pigmentation of the intestinal mucosa (pseudomelanosis coli), which usually recedes when the patient stops taking the preparation.
  - kind: adverse
    ru: При долгом приёме — нарушение водно-солевого баланса, белок и кровь в моче
    doc: monograph
    page: 7
    quote: Long term use may lead to water and electrolyte imbalance and may result in albuminuria and haematuria.
  - kind: adverse
    ru: Моча может окраситься в жёлтый или красно-коричневый цвет (зависит от pH) — клинического значения это не имеет
    doc: monograph
    page: 7
    quote: Yellow or red-brown (pH dependent) discolouration of urine by metabolites, which is not clinically significant, may occur during the treatment.
  - kind: adverse
    ru: Возможны реакции гиперчувствительности (зуд, крапивница, местная или генерализованная сыпь)
    doc: monograph
    page: 7
    quote: Hypersensitivity reactions (pruritus, urticaria, local or generalised exanthema) may occur.
  - kind: warning
    ru: Боль в животе и жидкий стул могут быть следствием индивидуальной передозировки — тогда нужно снизить дозу
    doc: monograph
    page: 7
    quote: However, these symptoms may also occur generally as a consequence of individual overdosage. In such cases dose reduction is necessary.
  - kind: overdose
    ru: Схваткообразная боль и сильный понос с потерей жидкости и солей; лечение — поддерживающее, обильное питьё, контроль электролитов, особенно калия
    doc: monograph
    page: 7
    quote: The major symptoms of overdose/abuse are griping pain and severe diarrhoea with consequent losses of fluid and electrolytes. Treatment should be supportive with generous amounts of fluid. Electrolytes, especially potassium, should be monitored.
  - kind: overdose
    ru: Хроническая передозировка препаратов, содержащих антраноиды, может приводить к токсическому гепатиту
    doc: monograph
    page: 7
    quote: Chronic ingested overdoses of anthranoid containing medicinal products may lead to toxic hepatitis.
  - kind: statement
    ru: Плоды сенны, их экстракты и ряд гидроксиантраценовых производных (кроме сеннозидов, реина и сеннидинов) были мутагенны и генотоксичны в нескольких тест-системах in vitro; для сенны и алоэ-эмодина in vivo это не доказано
    doc: monograph
    page: 10
    quote: Senna pods, extracts thereof and several hydroxyl anthracene derivatives (except sennosides, rhein and sennidins) were mutagenic and genotoxic in several in vitro test systems. However, for senna and aloe-emodin this was not proven in in vivo systems.
  - kind: statement
    ru: В длительных исследованиях канцерогенности с плодами сенны сообщалось о влиянии на почки и толстую/слепую кишку
    doc: monograph
    page: 10
    quote: In long term carcinogenicity studies with senna pods effects on kidneys and colon/caecum were reported.
constituents:
  - compound: anthranoids
    compoundRu: антраноиды
    classRu: гидроксиантраценовые производные
    effectRu: действующие вещества листа; в листе — в виде диантронов
    evidence: review
    doc: assessment-report
    page: 4
    quote: The active constituents are the anthranoids that are present in the leaf of the herbal substance as dianthrones
  - compound: rheinanthrone
    compoundRu: реинантрон
    classRu: метаболит диантронов
    effectRu: в основном опосредует слабительное действие; образуется из диантронов кишечной флорой
    evidence: review
    doc: assessment-report
    page: 34
    quote: Laxative effects of senna preparations are mainly mediated by rheinanthrone, a metabolite formed in the intestinal flora from dianthrones.
