  - kind: posology
    ru: Препараты в твёрдых лекарственных формах для приёма внутрь
    doc: monograph
    page: 3
    quote: Herbal preparations in solid dosage forms for oral use.
  - kind: posology
    ru: Разовая доза 144–200 мг, 1–2 раза в день; суточная доза 144–400 мг
    doc: monograph
    page: 4
    quote: "Posology Adults and Elderly Single dose: 144-200 mg Dosage frequency: 1-2 times daily Daily dose: 144 - 400 mg"
    dose: { preparationRu: сухой экстракт, amount: "144-200", unit: мг, timesPerDay: "1-2", populationRu: "взрослые и пожилые" }
  - kind: posology
    ru: Приём внутрь
    doc: monograph
    page: 4
    quote: Method of administration Oral use
  - kind: age
    ru: Детям и подросткам до 18 лет не рекомендуется
    doc: monograph
    page: 4
    quote: "Daily dose: 144 - 400 mg The use in children and adolescents under 18 years of age is not recommended"
    minAgeMonths: 216
  - kind: age
    ru: Применение у детей и подростков до 18 лет не установлено, данных недостаточно
    doc: monograph
