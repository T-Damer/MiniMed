# EMA/HMPC facts for Родиола розовая (корневища и корни). Draft artifact (status: proposed): Russian
# fields are a reader's rendering of the quoted English sentence; quotes are checked against the PDF pages.
# The monograph (2024) is traditional use only, one indication, one preparation: dry extract.
plant: rhodiola-rosea
status: proposed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 3
    quote: The product is a traditional herbal medicinal product for use in specified indications exclusively based upon long-standing use.
  - kind: indication
    ru: Облегчение симптомов стресса, таких как усталость и истощение
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product for the relief of symptoms of stress, such as fatigue and exhaustion.
  - kind: posology
    ru: Сухой экстракт (DER 1,5–5:1, растворитель этанол 67–70 %)
    doc: monograph
