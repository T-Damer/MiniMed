constituents:
  - compound: salidroside and rosavins
    compoundRu: салидрозид и розавины
    classRu: фенилалканоиды
    effectRu: этанол 70 % даёт экстракты с низким содержанием салидрозида по сравнению с этанолом 40 %; розавины, напротив, лучше извлекаются этанолом 70 %
    evidence: review
    doc: assessment-report
    page: 4
    quote: Ethanol 70% V/V yields extracts with a low content of salidroside compared to ethanol 40% V/V; in contrast rosavins are more efficiently extracted by ethanol 70% (Kucinskaite et al., 2007).
  - compound: phenylethanoids (salidroside)
    compoundRu: фенилэтаноиды (салидрозид)
    classRu: фенилалканоиды
    effectRu: отдельные исследования на моделях противоусталостного и стресс-защитного действия указывают на возможную связь с традиционным применением; результаты исследований с изолированными веществами позволяют предположить, что фенилэтаноиды, например салидрозид, вносят вклад в эти эффекты
    evidence: review
    doc: assessment-report
    page: 28
    quote: Some of the studies (e.g. in models investigating anti-fatigue effects, stress-protective effects) indicate a possible relation to the traditional medicinal use. Results from studies performed with isolated constituents suggest that the phenylethanoids like salidroside contribute to these effects.
  - compound: ethanolic extract (ethanol 40%) of Rhodiola rosea roots
    compoundRu: этанольный экстракт (этанол 40 %) корней родиолы розовой
    classRu: этанольный экстракт
    effectRu: по данным авторов, экстракт удлинил время плавания до истощения на 24,6 % по сравнению с контрольными крысами и крысами, получавшими родиолу городчатую (Rhodiola crenulata)
    evidence: animal
    doc: assessment-report
    page: 11
    quote: "Abidov et al. (2003): The effects of oral treatment with an ethanolic extract (ethanol 40%) from Rhodiola rosea (50 mg per kg) and Rhodiola crenulata (50 mg per kg) roots on the duration of exhaustive swimming and ATP content in mitochondria of skeletal muscles in rats was investigated. According to the authors, the result showed that treatment with Rhodiola rosea extract prolonged the duration of exhaustive swimming by 24.6% in comparison with control rats and rats treated with Rhodiola crenulata."
  - compound: p-tyrosol
    compoundRu: п-тирозол
    classRu: фенилпропан
    effectRu: п-тирозол также проявлял антиаритмические и кардиопротективные свойства
    evidence: animal
    doc: assessment-report
    page: 19
    quote: It was found that p-tyrosol also exhibited antiarrhythmic and cardioprotective properties.
  - compound: Rhodiola extract (probe study of CYP enzymes)
    compoundRu: экстракт родиолы (проба на ферменты CYP)
    classRu: экстракт
    effectRu: 13 здоровых добровольцев получали пробные препараты с 14-дневным предварительным приёмом 290 мг экстракта и без него; отношение активного метаболита EXP-3174 к лозартану снизилось на 21 %, что указывает на сниженную активность CYP2C9
    evidence: clinical
    doc: assessment-report
    page: 48
    quote: "13 healthy volunteers received as probe drugs caffeine (CYP1A2), losartan (CYP2C9), omeprazole (CYP2C19), dextromethorphan (CYP2D6 and midazolam (CYP3A4) with and without 14 days pre-treatment with 290 mg Rhodiola extract. A 21% decreased ratio of the active metabolite EXP-3174 to the parent drug losartan was found, indicating a reduced CYP2C9 metabolic activity."
