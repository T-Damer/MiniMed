constituents:
  - compound: polysaccharides (inulin)
    compoundRu: полисахариды (инулин)
    classRu: полисахариды
    effectRu: общее количество углеводов может составлять до 70 % сухой массы, в основном инулин (около 45 %)
    evidence: review
    doc: assessment-report
    page: 6
    quote: "Polysaccharides: The total carbohydrates may represent up to 70% of the dry mass and contain mainly inulin (about 45%)."
  - compound: phenolic acids (chlorogenic, isochlorogenic, caffeic acids) and tannins
    compoundRu: фенолкарбоновые кислоты (хлорогеновая, изохлорогеновая, кофейная) и дубильные вещества
    classRu: полифенолы
    effectRu: свежий корень содержит 1,9–3,65 % полифенолов с хлорогеновой, изохлорогеновой и кофейной кислотами; дубильных веществ в корне немного
    evidence: review
    doc: assessment-report
    page: 5
    quote: "Phenolcarbonic acids and tannins: The fresh root contains 1.9 up to 3.65% polyphenols with chlorogenic acid, isochlorogenic acid and caffeic acid. More recent tests show the presence of derivatives of quinic acid. The root also contains a small amount of tannins."
  - compound: polyacetylenes
    compoundRu: полиацетилены
    classRu: полиацетилены
    effectRu: противомикробную активность приписывают полиацетиленовым компонентам, хотя в сухом сырье найдены только следы
    evidence: review
    doc: assessment-report
    page: 18
    quote: The antimicrobial activity is attributed to the polyacetylene constituents, although only traces have been found in the dried herb.
  - compound: arctiin
    compoundRu: арктиин
    classRu: лигнан
    effectRu: в исследовании in vitro арктиин значимо снижал выделение медиаторов воспаления (за счёт подавления дегрануляции и выделения цистеиниловых лейкотриенов)
    evidence: in-vitro
    doc: assessment-report
    page: 15
    quote: "In their investigation, arctiin was able to significantly reduce the release of inflammatory mediators in vitro (through inhibition of degranulation and cys-leukotriene release)."
