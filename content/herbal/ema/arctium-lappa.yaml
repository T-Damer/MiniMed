# EMA/HMPC facts for Лопух большой (корни). Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian fields
# are a reader's rendering of the quoted English sentence; quotes are checked against the PDF pages.
# The monograph (2010) is traditional use only; its three indications are numbered 1)-3) in the source:
# 1) flushing of the urinary tract, 2) temporary loss of appetite, 3) seborrhoeic skin conditions.
# The posology block is one list a)-f) for all indications.
