# EMA/HMPC facts for Пустырник (трава). Draft artifact (status: proposed): Russian fields are a
# reader's rendering of the quoted English sentence; quotes are checked against the PDF page.
plant: leonurus-cardiaca
status: proposed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано на длительном опыте
    doc: monograph
    page: 3
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Нервное напряжение
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product used to relieve symptoms of nervous tension.
  - kind: indication
    ru: Сердцебиение и другие «нервные» жалобы на сердце — после того как врач исключил серьёзное
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product used to relieve symptoms of nervous cardiac complaints such as palpitations, after serious conditions have been excluded by a medical doctor.
  - kind: posology
    ru: Чай — взрослые; в сутки 3–10 г
    doc: monograph
    page: 3
    quote: "a) Comminuted herbal substance for tea preparation: single dose 1.5 to 4.5 g, daily dose 3 to 10 g."
    dose: { preparationRu: настой, amount: "1.5-4.5", unit: г, populationRu: взрослые }
  - kind: age
    ru: До 18 лет не рекомендуется
    doc: monograph
    page: 3
    quote: The use in children and adolescents under 18 years of age is not recommended
    minAgeMonths: 216
  - kind: duration
    ru: Если симптомы держатся дольше 4 недель — к врачу
    doc: monograph
    page: 4
    quote: If the symptoms persist longer than 4 weeks during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
    maxDays: 28
  - kind: contraindication
    ru: Аллергия на пустырник
    doc: monograph
    page: 4
    quote: Hypersensitivity to the active substance.
  - kind: pregnancy
    ru: При беременности нельзя
    doc: monograph
    page: 4
    quote: Contraindicated during pregnancy.
  - kind: lactation
    ru: Безопасность при кормлении грудью не установлена
    doc: monograph
    page: 4
    quote: The safety during lactation has not been
  - kind: warning
    ru: Спиртовые препараты могут снижать внимание — не садиться за руль
    doc: monograph
    page: 5
    quote: May impair ability to drive and use machines. Affected patients should not drive or operate machinery.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 4
    quote: Interactions with other medicinal products and other forms of interaction None reported.
  - kind: adverse
    ru: Побочные эффекты не известны
    doc: monograph
    page: 5
    quote: Undesirable effects None known.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 5
    quote: No case of overdose has been reported.
constituents:
  - compound: iridoids (ajugoside, ajugol), ursolic acid, flavonoids
