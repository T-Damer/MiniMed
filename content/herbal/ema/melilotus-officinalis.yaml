    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 4
    quote: The product is a traditional herbal medicinal product for use in specified indications exclusively based upon long-standing use.
  - kind: indication
    ru: Показание 1 — облегчение симптомов дискомфорта и тяжести в ногах, связанных с небольшими нарушениями венозного кровообращения
    doc: monograph
    page: 4
    quote: Indication 1) Traditional herbal medicinal product to relieve symptoms of discomfort and heaviness of legs related to minor venous circulatory disturbances.
  - kind: indication
    ru: Показание 2 — лечение небольших воспалений кожи
    doc: monograph
    page: 4
    quote: Indication 2) Traditional herbal medicinal product used for the treatment of minor inflammations of the skin.
  - kind: posology
    ru: "Показание 1 — чай: 1,0–1,2 г измельчённой травы в кипятке в виде настоя 2 раза в день; суточная доза 2,0–2,4 г"
    doc: monograph
    page: 4
    quote: "Indication 1) Adults and elderly a) Single dose: Herbal tea: 1.0–1.2 g of comminuted herbal substance in boiling water as an herbal infusion 2 times daily Daily dose: 2.0–2.4 g"
    dose: { preparationRu: чай (настой), amount: "1.0-1.2", unit: г, timesPerDay: "2", populationRu: "взрослые и пожилые" }
  - kind: posology
    ru: "Тяжесть в ногах при небольших венозных нарушениях — порошок травы: разовая доза 250 мг, 3 раза в день; суточная доза 750 мг"
    doc: monograph
    page: 4
    quote: "b) Single dose: Powdered herbal substance: 250 mg 3 times daily Daily dose: 750 mg"
    dose: { preparationRu: порошок травы, amount: "250", unit: мг, timesPerDay: "3", populationRu: "взрослые и пожилые" }
  - kind: posology
    ru: Небольшие воспаления кожи — разовая доза 3 г жидкого экстракта в виде кожного пластыря на поражённый участок кожи; суточная доза 3–6 г (до двух пластырей)
    doc: monograph
    page: 4
    quote: "c) Single dose: 3 g of liquid extract, as a cutaneous patch applied to the affected skin area. Daily dose: 3–6 g (up to two patches)."
    dose: { preparationRu: жидкий экстракт в кожном пластыре, amount: "3", unit: г, populationRu: возраст не указан }
  - kind: posology
    ru: Жидкий экстракт — в полутвёрдых лекарственных формах для кожного применения
    doc: monograph
    page: 3
    quote: c) Herbal preparations in semi-solid dosage forms for cutaneous use
  - kind: posology
    ru: Порошок травы — в твёрдых лекарственных формах для приёма внутрь; чай — настой измельчённой травы для приёма внутрь
    doc: monograph
    page: 3
    quote: a) Comminuted herbal substance as herbal tea, infusion, for oral use b) Herbal substance in solid dosage forms for oral use
  - kind: posology
    ru: Показание 1 — приём внутрь; показание 2 — кожное применение
    doc: monograph
    page: 5
    quote: Method of administration Indication 1) Oral use Indication 2) Cutaneous use
  - kind: age
