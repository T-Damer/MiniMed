    doc: monograph
    page: 5
    quote: "Daily dose: 3–6 g (up to two patches). The use in children and adolescents under 18 years of age is not recommended"
    minAgeMonths: 216
  - kind: age
    ru: Применение у детей и подростков до 18 лет не установлено, данных недостаточно
    doc: monograph
