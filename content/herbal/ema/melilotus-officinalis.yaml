constituents:
  - compound: cinnamic acid and coumarin derivatives
    compoundRu: производные коричной кислоты и кумарина
    classRu: кумарины
    effectRu: главные характерные компоненты донника — производные коричной кислоты и кумарина; кумарина в сырье содержится 0,3–0,9 %
    evidence: review
    doc: assessment-report
    page: 4
    quote: The main characteristic constituents of melilot are cinnamic acid/coumarin derivates (HagerROM, 2014). Coumarin is contained in the herbal substance in quantities of 0.3–0.9%.
  - compound: coumarin
    compoundRu: кумарин
    classRu: кумарины
    effectRu: у кумарина слабое противовоспалительное и противоотёчное действие; у крыс после внутрибрюшинных инъекций 50 мг/кг он уменьшал карагениновый отёк лапы на 42 % (через 4 часа) и на 33 % (через 6 часов) по сравнению с физиологическим раствором
    evidence: animal
    doc: assessment-report
    page: 17
    quote: Coumarin possesses weak anti-inflammatory and antiedematous activities. After intraperitoneal injections of 50 mg/kg in rats the effect of coumarin decreased carragen-induced paw edema by 42% (after 4 hours) and by 33% (after 6 hours) in contrast to the effect of injection of normal saline
  - compound: coumarin and its simple derivatives vs 4-hydroxycoumarin derivatives
    compoundRu: кумарин и его простые производные; 4-гидроксикумарин и его димерные производные
    classRu: кумарины
    effectRu: кумарин и его простые производные, естественно присутствующие в траве донника, не влияют на свёртывание; 4-гидроксикумарин и его димерные производные появляются в растительном сырье только в результате грибковой инфекции
    evidence: review
    doc: assessment-report
    page: 18
    quote: In contrast to the coumarin and its simple derivatives, naturally occurring in Meliloti herba, which are devoid of effect on coagulation, 4-Hydroxycoumarin hydroxycoumarin and its dimeric derivatives appear in plant material only as a result of fungal infection.
  - compound: melilotoside
    compoundRu: мелилотозид
    classRu: гликозид кумаровой кислоты
    effectRu: мелилотозид (цис-О-кумаровый β-глюкозид) был активен против Giardia lamblia (IC50 12,5 и 16,8 мкг/мл)
    evidence: in-vitro
    doc: assessment-report
    page: 18
    quote: Melilotoside (cis-O-coumaric β-glucoside) was found to be active against Giardia lamblia (IC50 12.5 and 16.8 µg/ml) (Calzada et al., 2003).
  - compound: coumarin (toxicity)
    compoundRu: кумарин (токсичность)
    classRu: кумарины
    effectRu: полученные данные указывают, что кумарин вызывает нефропатию почек и желчного протока, гиперплазию печени, увеличение числа язв преджелудка, некроз, фиброз и цитологические изменения печени
    evidence: animal
    doc: assessment-report
    page: 22
    quote: "Data obtained indicate that coumarin causes: nephropathy in the kidney and of bile duct, hyperplasia in the liver, increased incidences of ulcers of the forestomach, and necrosis, fibrosis, and cytologic alteration of the liver."
