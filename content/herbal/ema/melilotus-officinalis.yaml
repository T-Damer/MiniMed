# EMA/HMPC facts for Донник лекарственный (трава). Draft artifact (status: proposed): Russian fields
# are a reader's rendering of the quoted English sentence; quotes are checked against the PDF pages.
# The monograph is traditional use only; two indications numbered 1)-2) in the source:
# 1) heavy legs / minor venous circulatory disturbances (oral), 2) minor skin inflammations (cutaneous).
plant: melilotus-officinalis
status: proposed
useType: traditional
facts:
