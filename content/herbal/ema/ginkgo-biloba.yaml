- compound: ginkgolide B
  compoundRu: гинкголид B
  classRu: терпеновые лактоны (дитерпены)
  effectRu: в оценке на тромбоцитах кролика половинное ингибирование PAF-опосредованной агрегации тромбоцитов человека достигалось гинкголидами A, B, C и EGb 761 при 13,7, 1,6 и 33,2 мкМ и 23,2 мкг/мл соответственно; из протестированных гинкголидов гинкголид B был самым сильным антагонистом
  evidence: in-vitro
  doc: assessment-report
  page: 33
  quote: The PAF-antagonistic activities of individual ginkgolides and EGb 761 were evaluated in rabbit platelets. PAF-mediated aggregation of human platelets was half-maximally inhibited (IC50) by ginkgolide A, B, C and EGb 761 at concentrations of 13.7, 1.6, 33.2 µM and 23.2 µg/ml, respectively. Of the ginkgolides tested, ginkgolide B exerted by far the most powerful antagonistic effect.
- compound: ginkgolic acids
  compoundRu: гинкголевые кислоты
  classRu: алкилфенольные кислоты
  effectRu: в исследовании in vitro на клетках кератиноцитов человека HaCaT и почечных эпителиальных клетках макак-резусов LLC-MK2 EGb 761, содержащий менее 5 ppm гинкголевых кислот, использовали как эталонное вещество; результаты подтверждают, что гинкголевые кислоты, которые в основном удаляются при производстве стандартизованного экстракта EGb 761, обладают значительным цитотоксическим потенциалом
  evidence: in-vitro
  doc: assessment-report
  page: 38
  quote: The cytotoxic potential of ginkgolic acids was assessed in this in vitro study. Test subjects were the human keratinocyte cell line HaCaT and the rhesus monkey kidney tubular epithelial cell line LLC-MK2. The influence of a defined mixture of ginkgolic acids on cell growth, viability, integrity and morphology was investigated in more detail. EGb 761, which contains less than 5 ppm ginkgolic acids, was used as reference substance. The results confirm, that ginkgolic acids, which are basically removed during production of the standardised extract EGb 761, carry a considerable cytotoxic potential.
