# EMA/HMPC facts for Гинкго двулопастный (листья). Draft artifact (status: proposed): Russian fields
# are a reader's rendering of the quoted English sentence; quotes are checked against the PDF pages.
# Monograph EMA/HMPC/321097/2012 has two columns: well-established use (dry extract, cognitive impairment) and traditional use (powdered leaf, cold hands and feet).
# Kept side by side as written: the well-established column says warfarin studies do not indicate an interaction; the traditional column says ginkgo leaf may increase the effects of coumarin anticoagulants.
plant: ginkgo-biloba
status: proposed
useType: both
facts:
