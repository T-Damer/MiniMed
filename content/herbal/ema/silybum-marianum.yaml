constituents:
- compound: flavonolignans (silibinin, isosilibinin A and B, silicristin, silidianin)
  compoundRu: флавонолигнаны (силибинин, изосилибинин A и B, силикристин, силидианин)
  classRu: флавонолигнаны
  effectRu: 'составляют 1,3–3 % плодов: силибинин, изосилибинин (A и B), силикристин и силидианин'
  evidence: review
  doc: assessment-report
  page: 4
  quote: Flavonolignans (1.3-3%) - Flavonol derivatives, silibinin and isosilibinin (A and B), silicristin and silidianin
- compound: silibinin
  compoundRu: силибинин
  classRu: флавонолигнан
  effectRu: выделенный силибинин, главный компонент экстракта, стимулировал белковый синтез и вызывал стабилизацию мембран клеток печени, что может препятствовать транспорту токсинов и объяснять его пользу для восстановления печени
  evidence: review
  doc: assessment-report
  page: 38
  quote: Isolated silibinin, the major component of milk thistle extract, stimulated the protein biosynthesis and induced a membrane stabilization of hepatic cells that may prevent toxins transport and so explain its beneficial effect on liver recovery.
- compound: silymarin and silibinin
  compoundRu: силимарин и силибинин
  classRu: флавонолигнаны
  effectRu: быстро реагировали с гидроксильным радикалом и снижали перекисное окисление липидов, но не были эффективны в улавливании пероксида водорода
  evidence: review
  doc: assessment-report
  page: 31
  quote: Silymarin and silibinin were demonstrated to rapidly react with the radical hydroxyl and decrease lipidic peroxidation although they were not efficient in scavenging hydrogen peroxide radical.
- compound: silibinin (enzyme inhibition)
  compoundRu: силибинин (угнетение ферментов)
  classRu: флавонолигнан
  effectRu: угнетает ферменты I и II фазы, инактивирует цитохромы P450 3A4 и 2C9 и сильно угнетает UGT1A1; клиническое значение этих взаимодействий не определено или неизвестно
  evidence: review
  doc: assessment-report
  page: 39
  quote: Silibinin inhibits phase I and phase II enzymes and inactivates cytochromes P450 3A4 and 2C9. It is also a potent inhibitor of UGT1A1, an enzyme responsible for glucuronidation of several drugs such as naltrexone, buprenorphine, estradiol and irinotecan (concentration not stated). Nonetheless, the clinical relevance of these interactions is not well defined or unknown
- compound: silymarin
  compoundRu: силимарин
  classRu: смесь флавонолигнанов
  effectRu: в трёх открытых контролируемых исследованиях со 160 пациентами отмечено выраженное снижение повышенных трансаминаз, вызванное потенциально гепатотоксичными нейролептиками или анестетиками
  evidence: clinical
  doc: assessment-report
  page: 73
  quote: Results from three open controlled trials with 160 patients clearly showed a marked reduction of elevated transaminase levels induced by potentially hepatotoxic neuroleptics or anaesthetics.
