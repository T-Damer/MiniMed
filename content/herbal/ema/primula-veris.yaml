constituents:
  - compound: triterpene saponins
    compoundRu: тритерпеновые сапонины
    classRu: тритерпеновые сапонины (олеананового типа)
    effectRu: Характерные компоненты корня — тритерпеновые сапонины (обычно 3–10 [–12] %) и фенольные гликозиды
    doc: assessment-report
    page: 3
    quote: The characteristic constituents are triterpene saponins (usually 3 – 10 [-12]%) and phenolic glycosides.
    evidence: review
  - compound: Primula saponins (expectorant action)
    compoundRu: сапонины первоцвета (отхаркивающее действие)
    classRu: тритерпеновые сапонины
    effectRu: Механизм отхаркивающего действия сапонинов первоцвета пока удовлетворительно не выяснен; в литературе общее согласие, что сапонины местно раздражают слизистую желудка, это вызывает рефлекторное усиление бронхиальной секреции, затем разжижает слизь и снижает её вязкость
    doc: assessment-report
    page: 12
    quote: The mode of the expectorant action of Primula saponins is not yet satisfactorily clarified. In literature there is a general agreement that saponins irritate locally the gastric mucosa, which provokes a reflex increase in bronchial secretion, and subsequently dilutes the mucus and reduces its viscosity
    evidence: review
  - compound: primverin, primulaverin
    compoundRu: примверин, примулаверин
    classRu: фенольные гликозиды
    effectRu: Фенольные гликозиды примверин и примулаверин содержатся у обоих видов в очень разном количестве, до 2,3 %; это 2-примверозиды метиловых эфиров 4-метокси- и 5-метоксисалициловой кислоты
    doc: assessment-report
    page: 3
    quote: The phenolic glycosides primverin and primulaverin occur in both species in very variable amounts up to 2.3%, they are 2-primeverosides of 4-methoxy- and 5-methoxysalicilyc acid methyl esters
    evidence: review
  - compound: saponins (toxicity)
    compoundRu: сапонины (токсичность)
    classRu: тритерпеновые сапонины
    effectRu: Токсические эффекты корня первоцвета в основном приписывают сапонинам, повреждающим клеточные мембраны; это приводит к местному раздражению и, в более высоких дозах, к цитотоксичности
    doc: assessment-report
    page: 14
    quote: The toxic effects of Primula root are primarily ascribed to the saponins which damage the cell membranes; this results in local irritation and, at higher doses, in cytotoxicity.
    evidence: review
  - compound: primin (absent)
    compoundRu: примин (в корнях отсутствует)
    classRu: хиноидные соединения
    effectRu: Подземные органы не содержат примина и других хиноидных соединений, ответственных за контактно-аллергенные свойства надземных частей видов рода Primula
    doc: assessment-report
    page: 3
    quote: The underground organs do not contain primin or other quinoid compounds, which are responsible for contact allergenic properties of aerial parts of species of the genus Primula (Hausen 1978).
    evidence: review
