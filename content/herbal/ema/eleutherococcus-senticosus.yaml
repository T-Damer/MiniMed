constituents:
- compound: eleutheroside B (syringin)
  compoundRu: элеутерозид B (сиринген)
  classRu: фенилпропаноиды
  effectRu: фенилпропановое соединение (элеутерозид B, или сиринген), около 0,5 %
  evidence: review
  doc: assessment-report
  page: 3
  quote: 'phenyl propane compounds: eleutheroside B (or syringin) – 0.5% (Ovodov et al., 1967),'
- compound: eleutheroside E
  compoundRu: элеутерозид E
  classRu: лигнаны
  effectRu: по результатам исследования на мышах с принудительным плаванием, элеутерозид E может вносить вклад в противоутомительное действие и в подавление повышения кортикостерона, вызванного стрессом от плавания
  evidence: animal
  doc: assessment-report
  page: 20
  quote: Kimura et al., 2004; compared the effects of water extracts of Eleutherococcus senticosus bark on the swimming time, natural killer and blood corticosterone level using forced swimming stressed mice. It was concluded that eleutheroside E may contribute to the anti-fatigue action and to the inhibition of elevation of corticosterone induced by swimming stress.
- compound: eleutherosides
  compoundRu: элеутерозиды
  classRu: гликозиды
  effectRu: считается, что стимулирующее действие препаратов корня связано с активацией Т-лимфоцитов элеутерозидами
  evidence: review
  doc: assessment-report
  page: 16
  quote: The stimulating effect of Eleutherococcus root preparations is thought to involve the activation of T-lymphocytes by the eleutherosides.
- compound: eleutherosides
  compoundRu: элеутерозиды
  classRu: гликозиды
  effectRu: сообщается, что элеутерозиды усиливают действие инсулина на потребление глюкозы in vitro на диафрагме крысы
  evidence: in-vitro
  doc: assessment-report
  page: 27
  quote: The eleutherosides are reported to potentiate the effect of insulin on glucose consumption in vitro, using the rat diaphragm (Dardymov & Khasina, 1972c).
- compound: Eleutherococcus root constituents
  compoundRu: компоненты корня элеутерококка
  classRu: группа компонентов
  effectRu: из корня выделено более 35 соединений, поиск действующих веществ ещё не завершён
  evidence: review
  doc: assessment-report
  page: 3
  quote: Although over 35 compounds have been identified from the Eleutherococcus root, the search for active substances is not finished yet.
