plant: equisetum-arvense
status: reviewed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 4
    quote: The product is a traditional herbal medicinal product for use in specified indications exclusively based upon long-standing use.
  - kind: indication
    ru: Усилить мочеотделение для промывания мочевых путей — вспомогательно при лёгких мочевых жалобах
    doc: monograph
    page: 4
    quote: Traditional herbal medicinal product to increase the amount of urine to achieve flushing of the urinary tract as an adjuvant in minor urinary complaints.
  - kind: indication
    ru: Вспомогательно при поверхностных ранах
    doc: monograph
    page: 4
    quote: Traditional herbal medicinal product used for supportive treatment of superficial wounds.
  - kind: posology
    ru: Чай (настой или отвар 5–15 минут) — подростки, взрослые и пожилые
    doc: monograph
    page: 5
    quote: "a) Herbal tea: single dose: 1-4 g of the comminuted herbal substance in 150 ml of boiling water as an infusion or as a decoction (5-15 minutes), 3-4 times daily"
    dose: { preparationRu: настой или отвар, amount: "1-4", unit: г, waterMl: "150", timesPerDay: "3-4", populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: Отвар для повязок и промываний ран — 10 г на литр
    doc: monograph
    page: 6
    quote: "a) single dose: 10 g of the comminuted herbal substance in 1 l of water as decoction for impregnated dressing and irrigation"
    dose: { preparationRu: отвар для повязок, amount: "10", unit: г на литр, populationRu: "подростки, взрослые и пожилые" }
