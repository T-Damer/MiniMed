# EMA/HMPC facts for Толокнянка обыкновенная (лист). Draft artifact (status: proposed): Russian
# fields are a reader's rendering of the quoted English sentence; quotes are checked against the PDF.
plant: arctostaphylos-uva-ursi
status: proposed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано на длительном опыте
    doc: monograph
    page: 4
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Лёгкие повторные инфекции нижних мочевых путей у женщин (жжение, частое мочеиспускание) — после того как врач исключил серьёзное
    doc: monograph
    page: 4
    quote: Traditional herbal medicinal product used for relief of symptoms of mild recurrent lower urinary tract infections such as burning sensation during urination and/or frequent urination in women, after serious conditions have been excluded by a medical doctor.
  - kind: posology
    ru: Чай (настой или холодный настой) — взрослые женщины; не больше 8 г в сутки
    doc: monograph
    page: 4
    quote: "Herbal tea: 1.5-4 g of the comminuted herbal substance in 150 ml of boiling water as a herbal infusion or in 150 ml of water as a macerate 2 to 4 times daily Maximum daily dose: 8 g"
    dose: { preparationRu: настой или мацерат, amount: "1.5-4", unit: г, waterMl: "150", timesPerDay: "2-4", populationRu: взрослые женщины }
  - kind: age
    ru: До 18 лет не рекомендуется
    doc: monograph
    page: 5
    quote: The use in children and adolescents under 18 years of age is not recommended
    minAgeMonths: 216
  - kind: warning
    ru: Мужчинам не рекомендуется без наблюдения врача
    doc: monograph
    page: 5
    quote: The use in men is not recommended because of concerns requiring medical supervision.
  - kind: duration
    ru: Не дольше одной недели; если симптомы дольше 4 дней — к врачу
    doc: monograph
    page: 5
    quote: Not to be used for more than one week. If the symptoms persist for more than 4 days during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
    maxDays: 7
  - kind: contraindication
    ru: Аллергия на толокнянку; болезни почек
    doc: monograph
    page: 5
    quote: Hypersensitivity to the active substance. Kidney disorders
  - kind: warning
    ru: При температуре, болезненном мочеиспускании, спазмах, крови в моче — к врачу
    doc: monograph
    page: 5
    quote: If the symptoms worsen or if complaints such as fever, dysuria, spasms, or blood in urine occur during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
  - kind: warning
    ru: Моча может окраситься в зеленовато-коричневый цвет
    doc: monograph
    page: 5
    quote: Uvae ursi folium may cause a greenish-brown coloration of the urine.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 6
    quote: Interactions with other medicinal products and other forms of interaction None reported
  - kind: pregnancy
    ru: При беременности и кормлении грудью не рекомендуется — данных нет
    doc: monograph
    page: 6
    quote: In absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Тошнота, рвота, боль в желудке
    doc: monograph
    page: 6
    quote: Nausea, vomiting, stomach-ache have been reported.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 6
    quote: No case of overdose has been reported.
