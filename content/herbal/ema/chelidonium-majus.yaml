# EMA/HMPC facts for Чистотел большой (трава). EMA gave no monograph — a public statement: the
# benefit-risk of oral use is negative (liver damage). Draft artifact (status: proposed).
plant: chelidonium-majus
status: proposed
useType: public-statement
facts:
  - kind: statement
    ru: EMA не одобрила приём внутрь — польза не перевешивает риск из-за сообщений о поражении печени и желчных путей
    doc: public-statement
    page: 2
    quote: the benefit-risk assessment of oral use of Chelidonium majus is considered negative with respect to the establishment of a community monograph.
  - kind: statement
    ru: Эффективность не доказана; есть более безопасные растительные средства
    doc: public-statement
    page: 2
    quote: The HMPC concluded that evidence of clinical efficacy was lacking for monotherapy
  - kind: statement
    ru: Наружное применение (бородавки, мозоли) данными не подтверждено
    doc: public-statement
    page: 3
    quote: With regard to cutaneous use, the HMPC considered that the indication was not sufficiently supported by market information on monotherapy.
  - kind: warning
    ru: Описаны поражения печени и желчных путей после приёма препаратов чистотела
    doc: public-statement
    page: 2
    quote: there are 124 reported adverse drug reactions (derived from 56 spontaneous case reports) affecting the liver-biliary system after intake of medicinal products containing Chelidonium majus
  - kind: warning
    ru: В ряде стран препараты сняты с рынка — те, что давали больше 2,5 мг алкалоидов в сутки
    doc: public-statement
    page: 2
    quote: The products withdrawn to date have been those which would lead to a daily intake of more then 2.5 mg alkaloids from Chelidonium majus, according to the posology of the SPC.
constituents:
  - compound: benzylisoquinoline alkaloids (chelidonine, chelerythrine, sanguinarine, berberine, coptisine, protopine)
    compoundRu: алкалоиды (хелидонин, хелеритрин, сангвинарин, берберин, коптизин, протопин)
    classRu: бензилизохинолиновые алкалоиды
    effectRu: более двадцати алкалоидов — с ними связывают токсичность для печени
    evidence: review
    doc: public-statement
    page: 2
    quote: herba contains over 20 different alkaloids, among them alkaloids belonging to the benzylisoquinoline type
