    evidence: in-vitro
    doc: assessment-report
    page: 13
    quote: showed significant reduction of proliferation but improvement of the cell viability of human keratinocytes in vitro with wild pansy oligo and polysaccharides.
  - compound: infusion of the herb
    compoundRu: настой и отвар травы
    effectRu: подавляют золотистый стафилококк и кандиду
    evidence: in-vitro
