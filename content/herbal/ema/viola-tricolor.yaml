    doc: monograph
    page: 3
    quote: "5-20 g/l of comminuted herbal substance as an infusion. Apply as a wet dressing to the affected areas of the skin 2-3 times daily."
    dose: { preparationRu: настой для повязок, amount: "5-20", unit: г на литр, timesPerDay: "2-3", populationRu: "подростки, взрослые и пожилые"}
