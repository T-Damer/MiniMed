    evidence: review
    doc: assessment-report
    page: 18
    quote: Wild pansy belongs to herbs to be used with caution, due to salicylates content (Brinker 2001).
  - compound: oligo- and polysaccharides
    compoundRu: олиго- и полисахариды
    classRu: полисахариды (слизи)
