    quote: Open wounds, large areas of damaged skin.
  - kind: warning
    ru: Горячие ванны не следует применять при лихорадочных или инфекционных заболеваниях, сердечной недостаточности и гипертонии
    doc: monograph
    page: 4
    quote: Hot baths should not be used in case of febrile or infectious illnesses, in heart insufficiency and hypertension.
  - kind: warning
    ru: Пациенты с дефицитом «6GTP» (так в источнике; вероятно, дефицит Г6ФД) могут быть в группе риска гемолиза после лечения фиалкой трёхцветной
    doc: assessment-report
    page: 18
    quote: Patients with 6GTP deficiency can be at risk of haemolysis after Viola tricolor treatment.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 4
    quote: None reported.
  - kind: pregnancy
    ru: При беременности и кормлении грудью не рекомендуется — данных недостаточно
    doc: monograph
    page: 4
    quote: In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Описан случай гемолиза у ребёнка с дефицитом Г6ФД после приёма внутрь
    doc: monograph
    page: 5
    quote: One case of haemolysis in a child with G6PD deficiency has been reported after oral administration.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 5
    quote: No case of overdose has been reported.
