    quote: "b) Soft extract (DER 1:0.4-0.5) Single dose: 32 mg, 2-3 times daily. Daily dose: 64 – 96 mg (max 160 mg daily)."
    dose: { preparationRu: "мягкий экстракт (DER 1:0.4-0.5)", amount: "32", unit: мг, timesPerDay: "2-3", daily: "64-96 мг (не более 160 мг)", populationRu: взрослые и пожилые }
