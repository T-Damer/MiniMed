constituents:
  - compound: ∆7-sterols, ∆5-sterols
    compoundRu: ∆7-стерины (авенастерол, спинастерол) и ∆5-стерины (ситостерол, стигмастерол)
    classRu: стерины
    effectRu: предположительно действующие вещества (семена дают около 50% жирного масла)
    evidence: review
    doc: assessment-report
    page: 3
    quote: "The pumpkin seeds yield approximately 50% fatty oil, (mostly linoleic and oleic acid and tocopherol), but the putative active constituents are ∆7-sterols (avenasterol, spinasterol) and ∆5-sterols (sitosterol, stigmasterol)."
  - compound: cucurbitacins
    compoundRu: кукурбитацины
    classRu: тритерпеноиды
    effectRu: плоды культурных тыкв выведены свободными от кукурбитацинов; обратные мутации могут давать токсичные горькие плоды, поэтому наличие кукурбитацинов в семенах исключить нельзя
    evidence: review
    doc: assessment-report
    page: 6
    quote: Fruits of cultivated pumpkins have been cultured to be free of cucurbitacins and are assumed to contain a supressor gene or a mutation responsible for absence of cucurbitacins. However, back-mutations occur randomly which may lead to plants with toxic and bitter fruits. Therefore the presence of cucurbitacins in seeds cannot be excluded
  - compound: cucurbitine
    compoundRu: кукурбитин
    classRu: аминокислота
    effectRu: выделен из семян C. pepo (0,18–0,66%); к нему привлечено особое внимание из-за противоглистных свойств
    evidence: review
    doc: assessment-report
    page: 8
    quote: Particular attention has been paid to cucurbitine (3-amino-3-carboxy-pyrrolidine) for its anthelmintic properties isolated from Cucurbita pepo (0.18-0.66%) and Cucurbita moschata Duch., (0.4-0.84%) seeds.
  - compound: ∆5- and ∆7-sterols, tocopherol
    compoundRu: ∆5- и ∆7-стерины, токоферол (в этанольном экстракте семян)
    classRu: стерины
    effectRu: этанольный экстракт семян (DER 2:1), содержащий в основном триглицериды, ∆5- и ∆7-стерины и токоферол, не показал антиандрогенной активности в опыте на репортёрном гене рецептора андрогена
    evidence: in-vitro
    doc: assessment-report
    page: 19
    quote: "An ethanolic extract (DER 2:1) of Cucurbita pepo seeds containing mainly triglycerides, ∆5 – and ∆7- sterols and tocopherol did not show antiandrogenic activity. Experiments were performed in vitro by use of an androgen receptor responsive reporter gene assay (Schleich et al. 2006)."
  - compound: seed extract (5-α-reductase)
    compoundRu: экстракт семян (фермент 5-α-редуктаза)
    classRu: экстракт
    effectRu: в гомогенате плаценты человека экстракт ингибировал 5-α-редуктазу типа II на 90,4% при 10 мг/мл, на 71,4% при 2 мг/мл и на 29,6% при 0,4 мг/мл
    evidence: in-vitro
    doc: assessment-report
    page: 19
    quote: "Schmidlin and Kreuter (2003) described the influence of a Cucurbitae pepo seed extract on the activity of aromatase and 5-α-reductase Typ II in the homogenates of human and rat placenta. The pumpkin extract was as well tested in an experimental model of the prostate hyperthrophy induced by injection of testosterone in Sprague-Dawley castrated male rats. The incubation of human placenta homogenate with 10 mg/ml of the extract induced 44.7±0.2 – 55.9±15.7% reduction of the activity of aromatase. The activity of the enzyme 5-α-reductase Typ II in human placenta homogenate was inhibited at 90.4±2.4%, 71.4±4.1% and 29.6±7.9% respectively by 10 mg/ml, 2 mg/ml and 0.4 mg/ml concentrations of the extract."
