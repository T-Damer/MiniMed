constituents:
  - compound: mucilage polysaccharides
    compoundRu: слизистые полисахариды
    classRu: полисахариды (слизь)
    effectRu: слизь 5–11,6 % (в зависимости от периода вегетации) — смесь коллоидно растворимых полисахаридов
    evidence: review
    doc: assessment-report
    page: 6
    quote: 5-11.6% mucilage (depending on vegetative period) – consisting of the mixture of colloidally soluble polysaccharides
  - compound: polysaccharides from Althaea officinalis root
    compoundRu: полисахариды корня алтея
    classRu: полисахариды (слизь)
    effectRu: очищенные полисахариды корня изучали на изолированных щёчных мембранах свиньи — они показали умеренную адгезию к эпителиальной ткани, эффект зависел от концентрации
    evidence: in-vitro
    doc: assessment-report
    page: 24
    quote: Purified polysaccharides (carbohydrates content >95%) from Althaea officinalis root were investigated for bioadhesive effect on isolated porcine buccal membranes. Polysaccharides from marshmallow root showed a moderate adhesion to epithelial tissue. The adhesive effect was concentration dependent.
  - compound: rhamnogalacturonan
    compoundRu: рамногалактуронан
    classRu: полисахарид корня
    effectRu: в опыте на морских свинках (внутрь; кашель вызывали аэрозолем лимонной кислоты) полисахарид дозозависимо подавлял кашлевой рефлекс у животных без сенсибилизации
    evidence: animal
    doc: assessment-report
    page: 25
    quote: Antitussive effect of the polysaccharide rhamnogalacturonan isolated from roots of Althaea officinalis (25 and 50 mg/kg bw administered orally) has been studied in an in vivo study with sensitised (ovalbumin) and unsensitised male guinea pigs. The cough of guinea pigs was induced by 0.3 M citric acid aerosol. The polysaccharide dose dependently inhibited cough reflex in unsensitised animals.
  - compound: hypolaetin 8-glucoside
    compoundRu: гиполаэтин-8-глюкозид
    classRu: флавоноид
    effectRu: в опыте на крысах (в/б) был сильнее фенилбутазона в подавлении острой фазы воспаления, но слабее действовал в затяжной фазе
    evidence: animal
    doc: assessment-report
    page: 26
    quote: Hypolaetin 8-glucoside has been tested for its anti-inflammatory, analgesic and anti-ulcer activity in rats. The flavonoid (30, 60 and 90 mg/kg i.p.) was more potent than phenylbutazone (30, 60 and 90 mg/kg i.p.) in suppressing the acute phase of adjuvant carrageenan-induced inflammation but had less effect in the prolonged inflammatory phase.
  - compound: aqueous extract and polysaccharides of the root
    compoundRu: водный экстракт и полисахариды корня
    classRu: полисахариды
    effectRu: по выводу авторов, экстракты и полисахариды корня — эффективные стимуляторы клеточной физиологии эпителиальных клеток
    evidence: in-vitro
    doc: assessment-report
    page: 26
    quote: The authors concluded that extracts and polysaccharides from the roots of A. officinalis are effective stimulators of cell physiology of epithelial cells
