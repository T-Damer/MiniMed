# EMA/HMPC facts for Пастушья сумка обыкновенная (трава). Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian
# fields are a reader's rendering of the quoted English sentence; quotes are checked against the PDF pages.
plant: capsella-bursa-pastoris
status: reviewed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 3
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Уменьшение обильных менструальных кровотечений у женщин с регулярным циклом — после того как врач исключил серьёзные состояния
    doc: monograph
    page: 2
    quote: Traditional herbal medicinal product for the reduction of heavy menstrual bleeding in women with regular menstrual cycles, after serious conditions have been excluded by a medical doctor.
  - kind: posology
    ru: Взрослые — начинать за 3–5 дней до менструации и продолжать во время менструального кровотечения
    doc: monograph
    page: 3
    quote: Adults Use to be started 3-5 days before the menstruation and to be continued during menstrual bleeding.
  - kind: posology
    ru: Измельчённая трава для чая — взрослые, разовая доза 1–5 г, 2–4 раза в день (суточная доза 3–20 г)
    doc: monograph
    page: 3
    quote: "Adults Use to be started 3-5 days before the menstruation and to be continued during menstrual bleeding. a) Comminuted herbal substance: 1-5 g as a single dose for the preparation of herbal tea, 2-4 times daily (daily dose: 3-20 g)."
    dose: { preparationRu: измельчённая трава для чая, amount: "1-5", unit: г, timesPerDay: "2-4", populationRu: взрослые }
  - kind: posology
    ru: Жидкий экстракт — взрослые, разовая доза 1–4 мл, 3 раза в день (суточная доза 3–12 мл)
    doc: monograph
    page: 3
    quote: "Adults Use to be started 3-5 days before the menstruation and to be continued during menstrual bleeding. a) Comminuted herbal substance: 1-5 g as a single dose for the preparation of herbal tea, 2-4 times daily (daily dose: 3-20 g). b) Liquid extract: 1-4 ml as a single dose, 3 times daily (daily dose: 3-12 ml)."
    dose: { preparationRu: жидкий экстракт, amount: "1-4", unit: мл, timesPerDay: "3", populationRu: взрослые }
  - kind: posology
    ru: Приём внутрь
    doc: monograph
    page: 3
    quote: "Method of administration Oral use."
  - kind: age
    ru: Подросткам до 18 лет не рекомендуется — из-за опасений, требующих медицинской консультации
    doc: monograph
    page: 3
    quote: The use in adolescents under 18 years of age is not recommended because of concerns requiring medical advice.
    minAgeMonths: 216
  - kind: duration
    ru: Если симптомы сохраняются во время применения, обратиться к врачу или медработнику
    doc: monograph
    page: 3
    quote: "Duration of use If the symptoms persist during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted."
  - kind: contraindication
    ru: Гиперчувствительность к траве пастушьей сумки
    doc: monograph
    page: 3
    quote: Hypersensitivity to the active substance.
  - kind: warning
    ru: При ухудшении симптомов — к врачу или медработнику
    doc: monograph
    page: 4
    quote: If the symptoms worsen during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 4
    quote: "Interactions with other medicinal products and other forms of interaction Well-established use Traditional use None reported."
  - kind: pregnancy
    ru: Безопасность при беременности и кормлении грудью не установлена; данных недостаточно, применение не рекомендуется
    doc: monograph
    page: 4
    quote: Safety during pregnancy and lactation has not been established. In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Нежелательные эффекты не известны; при их появлении — к врачу или медработнику
    doc: monograph
    page: 4
    quote: None known. If adverse reactions occur, a doctor or a qualified health care practitioner should be consulted.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 5
    quote: No case of overdose has been reported.
  - kind: statement
    ru: Исследований репродуктивной токсичности, генотоксичности и канцерогенности не проводилось
    doc: monograph
    page: 5
    quote: Tests on reproductive toxicity, genotoxicity and carcinogenicity have not been performed.
  - kind: statement
    ru: Исследований гемостатического действия не найдено
    doc: assessment-report
    page: 17
    quote: Studies on haemostatic activity have not been found.
  - kind: statement
    ru: Правдоподобие эффективности при уменьшении кровотечения нельзя дополнительно подтвердить клиническими данными — их нет
    doc: assessment-report
    page: 18
    quote: The plausibility of efficacy for the specific indications of Capsella bursa-pastoris herb in the context of reduction of bleeding cannot be further substantiated by clinical data, as they are not available.
  - kind: statement
    ru: Присутствие глюкозинолатов в препаратах пастушьей сумки, применяемых в небольших количествах и ограниченное время, не считается проблемой безопасности
    doc: assessment-report
    page: 17
    quote: the presence of glucosinolates in Capsella preparations which are administered in small quantities for a limited duration of time is considered not to be a concern for safety.
constituents:
  - compound: flavonoids
    compoundRu: флавоноиды
    classRu: флавоноиды
    effectRu: выделенные из травы флавоноиды, по сообщениям, снижали проницаемость сосудов у мышей
    evidence: animal
    doc: assessment-report
    page: 15
    quote: Flavonoid components isolated from Capsella have been reported to reduce blood vessel permeability in mice
  - compound: quaternary ammonium salt
    compoundRu: четвертичная аммониевая соль
    classRu: четвертичное аммониевое соединение
    effectRu: выделена из травы; по сообщениям, ответственна за её активность
    evidence: review
    doc: assessment-report
    page: 4
    quote: A quaternary ammonium salt has been isolated from the herb which is reported to be responsible for its activity
  - compound: unidentified alkaloids
    compoundRu: неидентифицированные алкалоиды
    classRu: алкалоиды
    effectRu: два неидентифицированных алкалоида, как утверждается, оказывают физиологическое действие на матку
    evidence: review
    doc: assessment-report
    page: 15
    quote: Two unidentified alkaloid components of Capsella have been stated to elicit a physiological activity on the uterus
  - compound: purified substance from the alcohol extract
    compoundRu: очищенное вещество из спиртового экстракта
    classRu: имеет некоторые признаки полипептида
    effectRu: вызывало сокращение матки крысы, равное действию окситоцина (0,1 МЕ); не менялось под действием атропина, но подавлялось конкурентными ингибиторами окситоцина
    evidence: animal
    doc: assessment-report
    page: 15
    quote: A purified substance from the alcohol extract exerted contractile activity on rat uterus equivalent to that of oxytocin (0.1 i.u.), which was unaffected by atropine but inhibited by competitive inhibitors of oxytocin (substance had some characteristics of a polypeptide)
  - compound: sinigrin
    compoundRu: синигрин
    classRu: глюкозинолат (горчичный гликозид)
    effectRu: после гидролиза растительным ферментом мирозиназой даёт аллилизотиоцианат — сильное раздражающее вещество, вызывающее волдыри на коже
    evidence: review
    doc: assessment-report
    page: 16
    quote: Following hydrolysis catalysed by the plant enzyme, myrosinase, the constituent sinigrin yields allyl isothiocyanate, a powerful irritant agent producing blisters on the skin.
