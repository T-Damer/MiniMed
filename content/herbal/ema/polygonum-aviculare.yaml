constituents:
  - compound: flavonoids (avicularin)
    compoundRu: флавоноиды (авикулярин)
    classRu: флавоноиды
    effectRu: флавоноиды составляют 0,1–1% травы (редко 2,5–3%), в основном производные кемпферола, кверцетина и мирицетина, прежде всего авикулярин (около 0,2%)
    evidence: review
    doc: assessment-report
    page: 5
    quote: "Flavonoids (0.1-1%; rarely 2.5-3%): derivatives of kaempferol, quercetin and myricetin, particularly avicularin (quercetin-3-O-arabinoside approximately 0.2%)"
  - compound: tannins
    compoundRu: дубильные вещества
    classRu: танины
    effectRu: содержание 3,5–4% (ратаннин, галло- и катехиновые дубильные вещества)
    evidence: review
    doc: assessment-report
    page: 5
    quote: "Tannins (3.5-4%): rhatannin, gallo- and catechol tannins"
  - compound: phenolics and flavonoids
    compoundRu: фенольные соединения и флавоноиды
    classRu: полифенолы
    effectRu: в нескольких исследованиях указано, что высокое содержание фенольных соединений и флавоноидов отвечает за большинство важных фармакологических эффектов травы
    evidence: review
    doc: assessment-report
    page: 22
    quote: It has been pointed out in the several studies that the high phenolics and flavonoid content present in the leaves and stem of the Polygonum aviculare L. is responsible for the most of important pharmacological effects of Polygonum aviculare L., herba.
  - compound: flavonol glucuronides
    compoundRu: флавонолглюкурониды
    classRu: флавоноиды
    effectRu: все изученные флавонолглюкурониды, кроме двух, при 1 мкМ значимо снижали высвобождение эластазы нейтрофилами по сравнению со стимулированным контролем
    evidence: in-vitro
    doc: assessment-report
    page: 16
    quote: "All compounds with exception of kaempferol 3-O-β-D-glucuronide and quercetin 3-O-β-(2″-O-acetyl-β-D-glucuronide) at 1 μM concentration significantly decreased the release of elastase by neutrophils compared to stimulated control."
  - compound: avicularin
    compoundRu: авикулярин
    classRu: флавоноид (гликозид кверцетина)
    effectRu: после однократного внутривенного введения крысам наибольшие концентрации авикулярина были в почках и мочевом пузыре
    evidence: animal
    doc: assessment-report
    page: 22
    quote: "Tissue (heart, liver, spleen, lung, kidney and bladder) distribution of avicularin isolated from Polygoni avicularis herba after a single i.v. administration in rat was measured by HPLC method. The concentration of avicularin in above mentioned tissues showed significant diversity within 60 minutes. Determination of avicularin indicated that kidney and bladder showed the highest concentrations of this compound"
