  quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
- kind: indication
  ru: Традиционное растительное средство для увеличения количества мочи с целью промывания мочевых путей как вспомогательное при лёгких жалобах со стороны мочевых путей
  doc: monograph
  page: 2
  quote: Traditional herbal medicinal product used to increase the amount of urine to achieve flushing of the urinary tract as an adjuvant in minor urinary tract complaints.
- kind: posology
  ru: 'Чай — взрослые и пожилые: разовая доза 2,5 г измельчённого сырья на 150 мл кипятка в виде настоя, 2–6 раз в день'
  doc: monograph
  page: 3
  quote: 'Adults and elderly Single dose Herbal tea: 2.5 g of the comminuted herbal substance in 150 ml of boiling water as a herbal infusion, 2 - 6 times daily.'
  dose: {preparationRu: 'чай: настой измельчённого сырья', amount: '2.5', unit: г, waterMl: '150', timesPerDay: 2-6, populationRu: взрослые и пожилые}
