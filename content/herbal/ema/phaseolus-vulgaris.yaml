  quote: Interaction with oral hypoglycaemic drugs and insulin is possible due to the blood sugar level reducing effect.
- kind: interaction
  ru: 'В отчёте оценки: теоретически одновременный приём с противодиабетическими средствами может привести к взаимодействию; пациентам, принимающим пероральные гипогликемические средства и инсулин, может потребоваться дополнительное внимание'
  doc: assessment-report
  page: 15
  quote: Theoretically the concomitant use with antidiabetic drugs can result in an interaction. Patients using oral hypoglycaemic drugs and insulin may require further attention.
