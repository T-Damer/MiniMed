  ru: Исследований репродуктивной токсичности, генотоксичности и канцерогенности не проводилось
  doc: monograph
  page: 5
  quote: Tests on reproductive toxicity, genotoxicity and carcinogenicity have not been performed.
- kind: statement
  ru: 'В отчёте оценки: семена (бобы) в монографии не рассматриваются, их применение отличается от применения створок; для приёма внутрь рекомендуют только препараты, которые при изготовлении подвергаются нагреванию'
  doc: assessment-report
  page: 4
  quote: It should be noted that the beans themselves are not considered in the monograph and that their use is different from that of the pods. Only preparations that are exposed to heat during manufacturing are recommended for human use.
- kind: warning
  ru: 'В отчёте оценки: при загрязнении створок семенами бобов существует теоретический риск нежелательных реакций, вызванных бобами'
  doc: assessment-report
  page: 15
  quote: If contamination of bean pods with beans should occur, there might be a theoretical risk of adverse events caused by the beans.
- kind: statement
  ru: 'В отчёте оценки: клинических данных об эффективности створок нет; их эффект при показании из монографии правдоподобен на основании длительного применения и опыта'
  doc: assessment-report
  page: 14
  quote: As a consequence a possible therapeutic role for bean pods (Phaseoli fructus sine semine) is not supported by clinical evidence. The efficacy or pharmacological effects of the bean pods in the indication found in the monograph are plausible on the basis of long-standing use and experience.
- kind: statement
  ru: 'В отчёте оценки: створки можно считать безопасными по составу и из-за длительного употребления в пищу'
  doc: assessment-report
  page: 14
  quote: Nevertheless, bean pods can be considered as safe because of the composition and the long-standing use as a food substance.
constituents:
- compound: arginine, silicic acid and chromium salts
  compoundRu: аргинин, кремниевая кислота и соли хрома
  classRu: аминокислота, неорганические вещества
  effectRu: сырьё содержит аргинин и кремниевую кислоту, а также соли хрома (ср. противодиабетическая активность)
  evidence: review
  doc: assessment-report
  page: 4
  quote: The herbal substance contains arginine and silicic acid, as well as chromium salts (cf. antidiabetic activity).
- compound: lectins and trypsin inhibitors
  compoundRu: лектины и ингибиторы трипсина
  classRu: белки семян (бобов)
  effectRu: семена (бобы) в монографии не рассматриваются; для приёма внутрь рекомендуют только препараты, прошедшие нагревание при изготовлении, так как лектины и ингибиторы трипсина чувствительны к нагреву — их активность и токсичность снижаются
  evidence: review
  doc: assessment-report
  page: 4
  quote: It should be noted that the beans themselves are not considered in the monograph and that their use is different from that of the pods. Only preparations that are exposed to heat during manufacturing are recommended for human use. Since lectins and trypsin inhibitors are heat sensitive, their activity is reduced and, with that, the toxicity of Phaseolus vulgaris (see also section 3.3).
- compound: bean pod preparations
  compoundRu: препараты из створок
  classRu: препараты из створок плодов
  effectRu: у крыс с гипергликемией препараты из створок снижали гипергликемию и уровень глюкозы натощак; использованные дозы были высокими (до 500 мг экстракта на кг массы тела), что затрудняет перенос на человека
  evidence: animal
  doc: assessment-report
  page: 13
  quote: The bean pod preparations reduced the hyperglycaemia and had a lowering effect on fasting blood glucose in hyperglycaemic rats. The doses used in the studies amounted to high levels (up to 500 mg extract per kg body weight), which makes extrapolation to human conditions difficult.
- compound: dry Phaseolus vulgaris extract from bean pods
  compoundRu: сухой экстракт створок
  classRu: сухой экстракт
  effectRu: в клиническом исследовании у 18 здоровых добровольцев сухой экстракт створок или плацебо за 30 минут до теста на толерантность к 50 г глюкозы не показал значимого влияния на толерантность к глюкозе
  evidence: clinical
  doc: assessment-report
  page: 14
  quote: A clinical trial with 18 healthy volunteers, aged 29 (±4.8) with a BMI of 23 (± 3.7) performed by Cerović et al. in 2006, showed no significant effects on glucose tolerance. The participants received either dry Phaseolus vulgaris extract from bean pods or placebo 30 minutes before a 50 g oral glucose tolerance test.
