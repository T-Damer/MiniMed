    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 2
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Традиционное растительное средство для симптоматического облегчения нарушений пищеварения, таких как вздутие и метеоризм
    doc: monograph
    page: 2
    quote: Traditional herbal medicinal product for the symptomatic relief of digestive disorders such as bloating and flatulence.
  - kind: posology
    ru: Чай — настой сырья или измельчённого сырья, подростки, взрослые и пожилые, разовая доза 0,5–2 г в 150 мл кипятка, 1–3 раза в день
    doc: monograph
    page: 3
    quote: "Adolescents, adults and elderly Single dose Herbal tea: 0.5-2 g of the herbal substance or comminuted herbal substance in 150 ml of boiling water as a herbal infusion, 1-3 times daily"
    dose: { preparationRu: чай — настой сырья или измельчённого сырья, amount: "0.5-2", unit: г, waterMl: "150", timesPerDay: "1-3", populationRu: "подростки, взрослые и пожилые" }
