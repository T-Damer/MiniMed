constituents:
  - compound: essential oil of the fruit (d-carvone, limonene)
    compoundRu: эфирное масло плодов (d-карвон, лимонен)
    classRu: эфирное масло, монотерпены
    effectRu: плоды содержат 3–7 % v/m эфирного масла, состоящего главным образом из d-карвона (50–65 %) и (+)-лимонена (до 45 %), менее 1,5 % карвеола и дигидрокарвеола
    evidence: review
    doc: assessment-report
    page: 4
    quote: Caraway fruit contains 3-7 % v/m of essential oil, consisting largely of d-carvone (50-65 %), and (+)-limonene (up to 45 %), with less than 1.5 % of carveol and dihydrocarveol.
  - compound: ethanolic caraway fruit extract
    compoundRu: этанольный экстракт плодов
    classRu: экстракт
    effectRu: экстракт (1 часть сырья на 3,5 части этанола, 31 % m/m) в концентрациях 2,5 и 10,0 мл/л показал спазмолитическую активность на подвздошной кишке морской свинки in vitro
    evidence: in-vitro
    doc: assessment-report
    page: 9
    quote: "Caraway fruit extract, 1 part drug to 3.5 parts ethanol, 31 % m/m 2.5 and 10.0 ml/l In vitro: guinea pig ileum (ESCOP, 2003) Antispasmodic activity"
  - compound: aqueous and ethanolic caraway fruit extracts
    compoundRu: водные и этанольные экстракты плодов
    classRu: экстракты
    effectRu: на моделях колита и повреждения слизистой желудка у крыс экстракты уменьшали повреждения при введении внутрь или внутрибрюшинно в дозах 100–500 мг/кг
    evidence: animal
    doc: assessment-report
    page: 10
    quote: Aqueous and ethanolic extracts of caraway fruit have been tested in several in vivo models such as rat models of colitis (Keshavarz et al., 2013) and gastric mucosal injuries (Khayyal et al., 2001, Alhaider et al., 2006, Khayyal et al., 2006). The extracts reduced lesions when administrated orally or intraperitoneally at doses of 100-500 mg/kg (Khayyal et al., 2001, Alhaider et al., 2006, Khayyal et al., 2006, Keshavarz et al., 2013).
  - compound: aqueous and ethanolic caraway fruit extracts (defatted with petroleum ether)
    compoundRu: водные и этанольные экстракты плодов (обезжиренные петролейным эфиром)
    classRu: экстракты
    effectRu: "у самок крыс сообщалось об эстрогенных эффектах: при приёме внутрь 150–300 мг/кг в течение 30 дней — изменения вагинального мазка, рост массы яичников и матки, снижение уровня гонадотропинов и рост уровня эстрогенов; эффекты наблюдали начиная с доз ≥200 мг/кг для обоих экстрактов"
    evidence: animal
    doc: assessment-report
    page: 10
    quote: Estrogenic effects have been reported from studies on aqueous and ethanolic extracts (defatted with petroleum ether) of caraway fruit in female rats. Oral doses of 150-300 mg/kg were administrated for 30 days. Results obtained indicate sequential changes in vaginal smear, increased ovary weight, increased uterus weight, decreased gonadotropins levels and increased oestrogen levels. The estrogenic effects were observed from doses of ≥200 mg/kg for both extracts (Thakur et al., 2009).
  - compound: oral caraway fruit extracts
    compoundRu: экстракты плодов (приём внутрь)
    classRu: экстракты
    effectRu: в опыте на крысах приём плодовых экстрактов внутрь повышал плазменные уровни рифампицина, пиразинамида и изониазида; клиническое значение этих данных неизвестно
    evidence: animal
    doc: assessment-report
    page: 15
    quote: In an in vivo study, oral doses of caraway fruit extracts enhanced the plasma levels of rifampicin, pyrazinamide, and isoniazid in rats. The clinical relevance of these findings is not known.
