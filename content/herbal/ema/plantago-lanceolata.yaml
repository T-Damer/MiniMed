constituents:
  - compound: iridoid glycosides (aucubin, catalpol)
    compoundRu: иридоидные гликозиды (аукубин, каталпол)
    classRu: иридоиды
    effectRu: Сырьё содержит около 2–3 % иридоидных гликозидов, главные из которых — аукубин и каталпол
    doc: assessment-report
    page: 5
    quote: The herbal substance contains about 2-3% iridoid glycosides with aucubin and catalpol as the main compounds.
    evidence: review
  - compound: mucilage polysaccharides
    compoundRu: слизистые полисахариды
    classRu: полисахариды (слизь)
    effectRu: Слизистые полисахариды, в основном арабиноза и галактоза, не всасываются и покрывают слизистую защитным слоем против местных раздражений
    doc: assessment-report
    page: 17
    quote: The mucilage polysaccharides, mainly arabinose and galactose (Bräutigam and Franz, 1985), are not resorbed and cover the mucosa with a protective layer against local irritations
    evidence: review
  - compound: acteoside, plantamajoside
    compoundRu: актеозид, плантамаджозид
    classRu: фенилэтаноиды
    effectRu: Показали противовоспалительную активность на модели кислотного отёка уха мыши (1 и/или 3 мг на ухо) и на модели колита, вызванного декстран-сульфатом натрия, у мышей (30 мг/кг)
    doc: assessment-report
    page: 18
    quote: The phenylethanoids acteoside and plantamajoside showed anti-inflammatory activity in the acid-induced mouse ear oedema with 1 and/or 3 mg/ear (Murai et al., 1995), in the dextran sulphate sodium induced colitis in mice with 30 mg/kg bw (Hausmann et al., 2007)
    evidence: animal
  - compound: aucubin
    compoundRu: аукубин
    classRu: иридоидный гликозид
    effectRu: Аукубин (100 мг/кг) показал противовоспалительную активность на модели отёка лапы мыши, вызванного каррагинаном (100 мг/кг, внутрь)
    doc: assessment-report
    page: 18
    quote: the iridoid glycosides aucubin (100 mg/kg) showed anti-inflammatory activity in the carrageenan-induced mouse paw oedema (100 mg/kg bw, p.o.)
    evidence: animal
  - compound: aucubin (safety)
    compoundRu: аукубин (безопасность)
    classRu: иридоидный гликозид
    effectRu: Максимальные дозы аукубина 800 мг/кг 4 раза в неделю не вызывали значимых изменений печёночных трансаминаз, щелочной фосфатазы, триглицеридов, глюкозы, азота мочевины крови и общего белка
    doc: assessment-report
    page: 22
    quote: Maximum aucubin doses of 800 mg/kg bodyweight 4 times a week did not cause significant changes of liver transaminases, alkaline phosphatase, triglycerides, glucose, blood urea nitrogen and total protein.
    evidence: animal
