  - kind: use-type
    ru: Традиционное растительное средство — применение основано исключительно на длительном опыте
    doc: monograph
    page: 4
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: 'Показание 1: традиционное растительное средство как обволакивающее для симптоматического лечения раздражения полости рта или глотки и связанного с ним сухого кашля'
    doc: monograph
    page: 4
    quote: Indication 1) Traditional herbal medicinal product as a demulcent for the symptomatic treatment of oral or pharyngeal irritations and associated dry cough.
  - kind: indication
    ru: 'Показание 2: традиционное растительное средство для облегчения кашля, связанного с простудой'
    doc: monograph
    page: 4
    quote: Indication 2) Traditional herbal medicinal product used for the relief of cough associated with cold.
  - kind: indication
    ru: 'Показание 3: традиционное растительное средство для лечения незначительного воспаления кожи'
    doc: monograph
    page: 4
    quote: Indication 3) Traditional herbal medicinal product used for the treatment of minor inflammation of the skin.
