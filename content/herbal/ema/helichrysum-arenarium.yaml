constituents:
  - compound: isosalipurposide
    compoundRu: изосалипурпозид
    classRu: халкон
    effectRu: характерное, преобладающее соединение соцветия
    evidence: review
    doc: assessment-report
    page: 5
    quote: "A characteristic, dominating compound of the inflorescence is isosalipurposide (2',4,4',6'-tetrahydrochalcon-6'-O-glucoside) (Czinner et al., 2002)."
  - compound: apigenin
    compoundRu: апигенин
    classRu: флавон
    effectRu: апигенин и эфирный экстракт, содержащий в основном апигенин, показали сильнейшую спазмолитическую активность на гладких мышцах и изолированных желчных пузырях (ex vivo)
    evidence: animal
    doc: assessment-report
    page: 13
    quote: Apigenin and the ether extract that contains mainly apigenin, had the strongest antispasmodic activity on smooth muscles and isolated gall bladders ex vivo.
  - compound: kaempferol-3-glycoside and naringenin-5-glycoside
    compoundRu: каемпферол-3-гликозид и нарингенин-5-гликозид
    classRu: флавоноиды
    effectRu: при внутривенном введении крысам секреция жёлчи составила 180–185 % от исходной (100 %) через 15 мин; для апигенина — 160 %
    evidence: animal
    doc: assessment-report
    page: 13
    quote: Intravenous administration of kaempferol-3-glycoside and naringenin-5-glycoside to rats caused a 180-185%, apigenin administration caused a 160% increase of bile secretion in comparison to baseline (100%) after 15 min
  - compound: polyphenols and flavonoids of the water extract
    compoundRu: полифенолы и флавоноиды водного экстракта
    classRu: полифенолы, флавоноиды
    effectRu: у лиофилизата водного экстракта соцветий донорная по водороду активность оказалась выше, чем у силибинина, а восстановительная сила и общая способность улавливать радикалы — ниже
    evidence: in-vitro
    doc: assessment-report
    page: 15
    quote: The authors studied the antioxidant properties of the lyophilised water extracts from the inflorescences of sandy everlasting, and determinated the total polyphenol and flavonoid contents in Helichrysi flos water extracts as well as in lyophilised water extracts. The hydrogen-donating ability, reducing power property and total scavenger activity of the lyophilisate were determined using spectrophotometric and chemilumenescence methods. H-donor activity of the lyophilisate was determined to be more effective than silibinine but reducing power property and total scavenger capability were lower than that of silibilin.
  - compound: naringenin
    compoundRu: нарингенин
    classRu: флавоноид
    effectRu: флавоноидная фракция была активна против грамположительных микроорганизмов, особенно стрептококков и стафилококков, в концентрациях 20–40 мкг/мл — вероятно, главным образом из-за нарингенина
    evidence: in-vitro
    doc: assessment-report
    page: 16
    quote: First investigations of the antimicrobial activity of the flavonoid fraction of sandy everlasting were conducted in the USSR, where the preparation was observed to be active against a group of Gram positive microorganisms, specially for Streptococci and Staphylococci and other bacteria in a concentrations 20-40 µg/ml which is due probably mainly to naringen (4', 5, 7-trihydroxyflavone).
