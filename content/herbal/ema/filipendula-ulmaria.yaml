constituents:
- compound: salicylates
  compoundRu: салицилаты
  classRu: салицилаты (в основном гликозиды)
  effectRu: количество салицилатов, в основном в виде гликозидов, предположительно менее 0,5 %
  evidence: review
  doc: assessment-report
  page: 3
  quote: The amount of salicylates, mostly present in the form of glycosides, is assumed to be less than 0.5% (Zeylstra, 1998; ESCOP, 2003).
- compound: salicylates (infusion)
  compoundRu: салицилаты (настой)
  classRu: салицилаты
  effectRu: по Schulz и соавт. (1998), настои содержат лишь следовые количества салицилатов, поэтому чай из лабазника считают ароматическим средством, а не салицилатным лекарством
  evidence: review
  doc: assessment-report
  page: 16
  quote: According to Schulz et al. (1998), infusions contain only trace amounts of salicylates, so meadowsweet tea is considered as an aromatic remedy rather than a salicylate medication.
- compound: flavonoids
  compoundRu: флавоноиды
  classRu: флавоноиды
  effectRu: 3–4 % в цветущей траве и до 6 % в свежих цветках, в частности спирэозид (кверцетин-4’-глюкозид), также гиперозид и другие производные кверцетина и кемпферола, например кемпферол-4’-глюкозид
  evidence: review
  doc: assessment-report
  page: 3
  quote: 'Flavonoids: from 3-4% in the flowering herb up to 6% in the fresh flowers, in particular spiraeoside (quercetin-4’-glucoside), also hyperoside, other quercetin and kaempferol derivatives, as kaempferol-4’-glucoside.'
- compound: tannins
  compoundRu: дубильные вещества
  classRu: таннины (гидролизуемые)
  effectRu: ингибирующие эластазу свойства 50 % (V/V) этанольных экстрактов цветков и листьев приписывали присутствию дубильных веществ
  evidence: review
  doc: assessment-report
  page: 12
  quote: The elastase inhibiting properties of 50% (V/V) ethanolic flower and leaf extracts were attributed to the presence of tannins (Lamaison et al., 1990).
- compound: flavonoids (methanolic flower extracts)
  compoundRu: флавоноиды (метанольные экстракты цветков)
  classRu: флавоноиды
  effectRu: метанольные экстракты цветков (основные компоненты — флавоноиды) in vitro сильно угнетали активность ксантиноксидазы
  evidence: in-vitro
  doc: assessment-report
  page: 12
  quote: Methanolic flower extracts (with flavonoids as main constituents) demonstrated to strongly inhibit xanthine oxidase activity in vitro (Kazazi et al., 2009).
