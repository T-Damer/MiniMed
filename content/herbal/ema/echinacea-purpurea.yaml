constituents:
  - compound: "cichoric acid"
    compoundRu: "цикориевая кислота"
    classRu: "производные кофейной кислоты"
    effectRu: "основной эфир кофейной кислоты в надземной части Echinacea purpurea, 1–5 %; за ней следует кафтаровая кислота"
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Cichoric acid (2,3-O-dicaffeoyl-tartaric acid) is the major caffeic ester derivative found in the aerial parts of Echinacea purpurea with a concentration range of 1 to 5%, followed by caftaric acid (2-O-caffeoyl-tartaric acid)"
  - compound: "cichoric acid"
    compoundRu: "цикориевая кислота"
    classRu: "производные кофейной кислоты"
    effectRu: "цикориевая кислота из отжатого сока Echinacea purpurea снижала выход вируса везикулярного стоматита (VSV) в клетках мышиной линии L-929; 125 мкг/мл за 4 ч снижали инфекционность VSV более чем на 50 %"
    evidence: in-vitro
    doc: assessment-report
    page: 26
    quote: "Cichoric acid from Echinacea purpurea expressed juice was found to reduce a yield of VSV in mouse L-929-cells. 125 µg/ml cichoric acid after 4 h incubation reduced the infectivity of VSV by more than 50% (Cheminat et al. 1988)."
  - compound: "alkamides"
    compoundRu: "алкамиды"
    classRu: "алкиламиды"
    effectRu: "очищенная алкамидная фракция, введённая крысам внутрь, усиливала фагоцитарную активность и фагоцитарный индекс альвеолярных макрофагов лёгких"
    evidence: animal
    doc: assessment-report
    page: 29
    quote: "A purified alkamide fraction administered orally to rats was found to enhance the phagocytic activity and phagocytic index of lung alveolar macrophages."
  - compound: "polysaccharides"
    compoundRu: "полисахариды"
    classRu: "полисахариды"
    effectRu: "содержание в сухой траве Echinacea purpurea составляет 2–7 %"
    evidence: review
    doc: assessment-report
    page: 5
    quote: "The content of polysaccharides in dry Echinacea purpurea herb is 2 to 7 % (Glavač et al. 2012)."
  - compound: "caffeic acid derivatives, alkamides, polysaccharides, melanins, lipopolysaccharides, lipoproteins"
    compoundRu: "производные кофейной кислоты, алкамиды, полисахариды, меланины, липополисахариды и липопротеины"
    classRu: "группы компонентов"
    effectRu: "считается, что действующими началами Echinacea purpurea могут быть несколько совершенно разных групп компонентов"
    evidence: review
    doc: assessment-report
    page: 5
    quote: "Several very different groups of constituents are suggested to be effective principles of Echinacea purpurea"
