  - compound: oligomeric proanthocyanidins
    compoundRu: олигомерные проантоцианидины
    classRu: конденсированные танины
    effectRu: вяжущее
    evidence: review
    doc: assessment-report
    page: 11
    quote: The astringency of the extracts of Quercus bark is mainly due to its content of oligomeric proanthocyanidins.
  - compound: tannins
    compoundRu: дубильные вещества
    classRu: танины
    effectRu: по сообщениям, антисекретолитическое, противораздражающее, противомикробное и противопаразитарное действие
    evidence: review
    doc: assessment-report
    page: 11
    quote: "Tannins occurring in oak bark are reported to have various activities: antisecretolytic, antiirritant, antimicrobial and antiparasitic."
