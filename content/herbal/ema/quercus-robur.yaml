# EMA/HMPC facts for Дуб черешчатый (кора). Draft artifact (status: proposed): Russian fields are a
# reader's rendering of the quoted English sentence; quotes are checked against the PDF page (this
# monograph's text spans are out of order, so its quotes are matched in reading position order).
plant: quercus-robur
status: proposed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано на длительном опыте
    doc: monograph
    page: 3
    quote: The product is a traditional herbal medicinal product for use in specified indications exclusively based upon long-standing use.
  - kind: indication
    ru: Лёгкая диарея
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product for symptomatic treatment of mild diarrhoea.
  - kind: indication
    ru: Небольшое воспаление слизистой рта или кожи
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product for symptomatic treatment of minor inflammation of the oral mucosa or skin.
  - kind: indication
    ru: Зуд и жжение при геморрое — после того как врач исключил серьёзные состояния
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product for symptomatic relief of itching and burning associated with haemorrhoids, after serious conditions have been excluded by a medical doctor.
  - kind: posology
    ru: Измельчённая кора в воде внутрь при диарее — взрослые и пожилые
    doc: monograph
    page: 3
    quote: a) 3 g comminuted herbal substance in 250 ml of water, three times daily.
    dose: { preparationRu: измельчённая кора в воде, amount: "3", unit: г, waterMl: "250", timesPerDay: "3", populationRu: взрослые и пожилые }
  - kind: posology
    ru: Порошок коры в капсулах или таблетках внутрь при диарее, три раза в день — взрослые и пожилые
    doc: monograph
    page: 3
    quote: b) 1 g powdered herbal substance in capsules/tablets for oral use, three times daily.
    dose: { preparationRu: порошок коры в капсулах или таблетках, amount: "1", unit: г, populationRu: взрослые и пожилые }
  - kind: posology
    ru: Сухой экстракт внутрь при диарее — взрослые и пожилые
    doc: monograph
    page: 3
    quote: "c) Dry extract: 140 mg, 4 times daily."
    dose: { preparationRu: сухой экстракт, amount: "140", unit: мг, timesPerDay: "4", populationRu: взрослые и пожилые }
  - kind: posology
    ru: Отвар для слизистой рта — 20 г на литр, взрослые и пожилые
    doc: monograph
    page: 3
    quote: "Decoction for oromucosal use: 20 g/L."
    dose: { preparationRu: отвар для слизистой рта, amount: "20", unit: г на литр, populationRu: взрослые и пожилые }
  - kind: posology
    ru: Отвар для ванны (воспаление кожи и слизистой, геморрой) — 5 г на литр, ванна 20 минут, взрослые и пожилые
    doc: monograph
    page: 3
    quote: "Decoction for bath preparation: 5 g comminuted herbal substance/1L to be added to the bath (bath duration 20 minutes)."
    dose: { preparationRu: отвар для ванны, amount: "5", unit: г на литр, populationRu: взрослые и пожилые }
  - kind: posology
    ru: Ванна — одна полная или частичная в день
    doc: monograph
    page: 4
    quote: One full or partial bath daily.
  - kind: posology
    ru: Местно — полоскания или припарки несколько раз в день
    doc: monograph
    page: 4
    quote: Topical rinses or poultices several times daily.
  - kind: age
    ru: До 18 лет не рекомендуется
    doc: monograph
    page: 4
    quote: The use in children and adolescents under 18 years of age is not recommended
    minAgeMonths: 216
  - kind: duration
    ru: При диарее — не дольше 3 дней
    doc: monograph
    page: 4
    quote: Not to be used for more than 3 days.
    maxDays: 3
  - kind: duration
    ru: Воспаление кожи и слизистой рта, геморрой — не дольше 1 недели
    doc: monograph
    page: 4
    quote: Not to be used for more than 1 week.
    maxDays: 7
  - kind: contraindication
    ru: Аллергия на кору дуба
    doc: monograph
    page: 4
    quote: Hypersensitivity to the active substance.
  - kind: contraindication
    ru: Ванны нельзя при открытых ранах, больших повреждениях и инфекции кожи и слизистых
    doc: monograph
    page: 4
    quote: "Use as bath additive: Open wounds, large skin and mucosa injuries and infection of the skin and mucosa."
  - kind: warning
    ru: Если диарея повторяется или кровь в стуле — к врачу
    doc: monograph
    page: 5
    quote: If recurrent diarrhoea or bloody stools occur, a doctor or a qualified health care practitioner should be consulted.
  - kind: warning
    ru: Воспаление кожи и слизистой рта, геморрой — горячие ванны нельзя при лихорадочных или инфекционных болезнях, сердечной недостаточности и артериальной гипертензии
    doc: monograph
    page: 5
    quote: Hot bathes should not be used in case of febrile or infectious illnesses, in heart insufficiency and hypertension.
  - kind: warning
    ru: При геморрое — если кровотечение из прямой кишки, к врачу
    doc: monograph
    page: 5
    quote: If rectal bleeding occurs during the treatment of haemorrhoids a doctor should be consulted.
  - kind: interaction
    ru: При приёме внутрь может задерживать всасывание других лекарств — принимать за 1 час и более до или после них
    doc: monograph
    page: 5
    quote: Internal absorption of concomitantly administered medicine may be delayed. For this reason, the product should be taken 1 hour or more before or after intake of other medicinal products.
  - kind: pregnancy
    ru: При беременности и кормлении грудью не рекомендуется — данных недостаточно
    doc: monograph
    page: 5
    quote: In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Описаны аллергические реакции
    doc: monograph
    page: 6
    quote: Allergic reactions have been reported.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 6
    quote: No case of overdose has been reported.
