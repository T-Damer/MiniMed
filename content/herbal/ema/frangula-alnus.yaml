# EMA/HMPC facts for Крушина ольховидная (кора). Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian fields
# are a reader's rendering of the quoted English sentence; quotes are checked against the PDF page.
plant: frangula-alnus
status: reviewed
useType: well-established
facts:
  - kind: indication
    ru: Кратковременно при эпизодическом запоре
    doc: monograph
    page: 3
    quote: Herbal medicinal product for short-term use in cases of occasional constipation.
  - kind: posology
    ru: Разовая доза — препарат, эквивалентный 10–30 мг гидроксиантраценовых производных (в пересчёте на глюкофрангулин А), один раз в день на ночь; индивидуальная доза — наименьшая, дающая комфортный мягкий стул
    doc: monograph
    page: 4
    quote: Herbal preparation equivalent to 10–30 mg hydroxyanthracene derivatives, calculated as glucofrangulin A, to be taken once daily at night. The correct individual dose is the smallest required to produce a comfortable soft-formed motion.
    dose: { preparationRu: препарат на ночь (разовая доза), amount: "10-30", unit: мг гидроксиантраценовых производных, timesPerDay: один, populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: Чай — измельчённое сырьё, эквивалентное не более 30 мг гидроксиантраценовых производных, на 150 мл кипятка; разовая доза, один раз в день на ночь
    doc: monograph
    page: 4
    quote: "to be taken once daily at night. The correct individual dose is the smallest required to produce a comfortable soft-formed motion. Herbal tea: amount of comminuted herbal substance equivalent to not more than 30 mg hydroxyanthracene derivatives in 150 ml of boiling water as herbal infusion"
    dose: { preparationRu: настой (разовая доза), amount: "30", unit: мг гидроксиантраценовых производных (не больше), waterMl: "150", timesPerDay: один, populationRu: "подростки, взрослые и пожилые" }
  - kind: age
    ru: Детям младше 12 лет нельзя
    doc: monograph
    page: 4
    quote: The use in children under 12 years of age is contraindicated
    minAgeMonths: 144
  - kind: duration
    ru: Не дольше 1 недели; обычно хватает двух-трёх приёмов за неделю
    doc: monograph
    page: 4
    quote: Not to be used for more than 1 week. Usually it is sufficient to take this medicinal product up to two to three times during that week.
    maxDays: 7
  - kind: contraindication
    ru: Непроходимость и сужение кишки, атония, аппендицит, воспалительные болезни кишечника, боль в животе неясной причины, сильное обезвоживание
    doc: monograph
    page: 5
    quote: Cases of intestinal obstructions and stenosis, atony, appendicitis, inflammatory bowel diseases (e.g. Crohn’s disease, ulcerative colitis), abdominal pain of unknown origin, severe dehydration state with water and electrolyte depletion.
  - kind: contraindication
    ru: Беременность и кормление грудью; дети младше 12 лет
    doc: monograph
    page: 5
    quote: Pregnancy and lactation (see section 4.6 and 5.3). Children under 12 years of age.
  - kind: warning
    ru: Долгого приёма стимулирующих слабительных следует избегать — он может нарушить работу кишки и привести к зависимости; если слабительное нужно каждый день — выяснить причину запора
    doc: monograph
    page: 5
    quote: Long-term use of stimulant laxatives should be avoided, as use for more than a brief period of treatment may lead to impaired function of the intestine and dependence on laxatives. If laxatives are needed every day the cause of the constipation should be investigated.
  - kind: warning
    ru: Применять, только если не помогли изменение питания или набухающие средства
    doc: monograph
    page: 5
    quote: Frangula bark preparations should only be used if a therapeutic effect cannot be achieved by a change of diet or the administration of bulk forming agents.
  - kind: warning
    ru: Нельзя без указания врача при каловой пробке и неустановленных острых или стойких жалобах со стороны ЖКТ (боль в животе, тошнота, рвота) — это могут быть признаки кишечной непроходимости
    doc: monograph
    page: 5
    quote: Like all laxatives, frangula bark preparations should not be taken by patients suffering from faecal impaction and undiagnosed, acute or persistent gastro-intestinal complaints, e.g. abdominal pain, nausea and vomiting, unless advised by a doctor, because these symptoms can be signs of potential or existing intestinal blockage (ileus).
  - kind: warning
    ru: Больным с заболеваниями почек нужно учитывать возможное нарушение электролитного баланса
    doc: monograph
    page: 5
    quote: Patients with kidney disorders should be aware of possible electrolyte imbalance.
  - kind: interaction
    ru: Принимающим сердечные гликозиды, антиаритмики, препараты, удлиняющие интервал QT, мочегонные, кортикостероиды или корень солодки — перед приёмом коры крушины к врачу
    doc: monograph
    page: 5
    quote: Patients taking cardiac glycosides, antiarrhythmic medicinal products, medicinal products inducing QT-prolongation, diuretics, adrenocorticosteroids or liquorice root, have to consult a doctor before taking frangula bark concomitantly.
  - kind: interaction
    ru: Низкий калий (при длительном злоупотреблении слабительными) усиливает действие сердечных гликозидов и взаимодействует с антиаритмиками; мочегонные, кортикостероиды и корень солодки при совместном приёме могут усиливать потерю калия
    doc: monograph
    page: 6
    quote: Hypokalaemia (resulting from long-term laxative abuse) potentiates the action of cardiac glycosides and interacts with antiarrhythmic medicinal products. Concomitant use with diuretics, adrenocorticosteroids and liquorice root may enhance loss of potassium.
  - kind: pregnancy
    ru: При беременности нельзя — по экспериментальным данным, у нескольких антраноидов (например, эмодина и франгулина) есть генотоксический риск
    doc: monograph
    page: 6
    quote: The use during pregnancy is contraindicated because of experimental data concerning a genotoxic risk of several anthranoids, e.g. emodin and frangulin.
  - kind: lactation
    ru: При кормлении грудью нельзя — после приёма антраноидов активные метаболиты (например, рейн) в малых количествах выделялись в грудное молоко
    doc: monograph
    page: 6
    quote: The use during lactation is contraindicated because after administration of anthranoids, active metabolites, such as rhein, were excreted in breast milk in small amounts.
  - kind: adverse
    ru: Боль и спазмы в животе, жидкий стул — особенно у больных с раздражённой толстой кишкой
    doc: monograph
    page: 7
    quote: Frangula bark may produce abdominal pain and spasm and passage of liquid stools, in particular in patients with irritable colon.
  - kind: warning
    ru: Боль, спазмы и жидкий стул могут быть следствием индивидуальной передозировки; тогда дозу нужно уменьшить
    doc: monograph
    page: 7
    quote: However, these symptoms may also occur generally as a consequence of individual overdosage. In such cases dose reduction is necessary.
  - kind: adverse
    ru: При хроническом приёме возможна пигментация слизистой кишки (псевдомеланоз), обычно проходит после отмены
    doc: monograph
    page: 7
    quote: Furthermore, chronic use may cause pigmentation of the intestinal mucosa (pseudomelanosis coli), which usually recedes when the patient stops taking the preparation.
  - kind: adverse
    ru: При длительном приёме возможен водно-электролитный дисбаланс, вплоть до альбуминурии и гематурии
    doc: monograph
    page: 7
    quote: Long term use may lead to water and electrolyte imbalance and may result in albuminuria and haematuria.
  - kind: adverse
    ru: Моча может окраситься в жёлтый или красно-коричневый цвет (зависит от pH) — клинического значения не имеет
    doc: monograph
    page: 7
    quote: Yellow or red-brown (pH dependent) discolouration of urine by metabolites, which is not clinically significant, may occur during the treatment.
  - kind: overdose
    ru: Схваткообразная боль и сильный понос с потерей жидкости и солей; лечение поддерживающее — обильное питьё, контроль электролитов, особенно калия (особенно важно у пожилых)
    doc: monograph
    page: 7
    quote: The major symptoms of overdose/abuse are griping pain and severe diarrhoea with consequent losses of fluid and electrolytes. Treatment should be supportive with generous amounts of fluid. Electrolytes, specifically potassium, should be monitored. This is particularly important in the elderly.
  - kind: overdose
    ru: Длительная передозировка при приёме внутрь препаратов с антраноидами может привести к токсическому гепатиту
    doc: monograph
    page: 8
    quote: Chronic ingested overdoses of anthranoid containing medicinal products may lead to toxic hepatitis.
  - kind: statement
    ru: Некоторые гидроксиантраценовые производные были мутагенны и генотоксичны в опытах in vitro, но на живых организмах это не доказано; в длительных исследованиях канцерогенности отмечено влияние на почки и толстую/слепую кишку
    doc: monograph
    page: 9
    quote: Furthermore, several hydroxyl anthracene derivatives were mutagenic and genotoxic in several in vitro test systems, however this was not proven in in vivo systems. In long term carcinogenicity studies effects on kidneys and colon/caecum were reported.
constituents:
  - compound: glucofrangulin, frangulin
    compoundRu: глюкофрангулин, франгулин
    classRu: антрагликозиды (гидроксиантраценовые производные)
    effectRu: у мышей слабительное действие примерно в 4–5 раз сильнее неопределённого экстракта сенны; для глюкофрангулина есть признаки снижения относительной эффективности
    evidence: animal
    doc: assessment-report
    page: 11
    quote: Laxative effect of glucofrangulin and frangulin nearly 4 to 5 times stronger than an undefined senna extract. For glucofrangulin signs of a reduction concerning the relative effectiveness.
  - compound: hydroxyanthracene derivatives
    compoundRu: гидроксиантраценовые производные
    classRu: антрагликозиды
    effectRu: по аналогии с другими слабительными с гидроксиантраценовыми производными, например сенной, обычно предполагают сходный механизм действия
    evidence: review
    doc: assessment-report
    page: 13
    quote: It is generally assumed, by analogy with other HAD-containing laxatives, such as senna, that the mode of action is similar.