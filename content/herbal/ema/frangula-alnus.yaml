# EMA/HMPC facts for Крушина ольховидная (кора). Draft artifact (status: proposed): Russian fields
# are a reader's rendering of the quoted English sentence; quotes are checked against the PDF page.
plant: frangula-alnus
status: proposed
useType: well-established
facts:
  - kind: indication
    ru: Кратковременно при эпизодическом запоре
    doc: monograph
    page: 4
    quote: cases of occasional constipation.
  - kind: posology
    ru: Разовая доза — сырьё, содержащее 10–30 мг антрагликозидов, один раз в день на ночь; брать наименьшую дозу, дающую мягкий стул
    doc: monograph
    page: 4
    quote: "Herbal preparation equivalent to 10–30 mg hydroxyanthracene derivatives, calculated as glucofrangulin A, to be taken once daily at night."
    dose: { preparationRu: отвар или настой на ночь, amount: "10-30", unit: мг антрагликозидов, populationRu: подростки и взрослые }
  - kind: posology
    ru: Чай — не больше 30 мг антрагликозидов на 150 мл кипятка
    doc: monograph
    page: 4
    quote: "Herbal tea: amount of comminuted herbal substance equivalent to not more than 30 mg hydroxyanthracene derivatives in 150 ml of boiling water as herbal infusion"
    dose: { preparationRu: настой, amount: "30", unit: мг антрагликозидов (не больше), waterMl: "150", populationRu: подростки и взрослые }
  - kind: age
    ru: Детям младше 12 лет нельзя
    doc: monograph
    page: 4
    quote: The use in children under 12 years of age is contraindicated
    minAgeMonths: 144
  - kind: duration
    ru: Не дольше 1 недели; обычно хватает двух-трёх приёмов за неделю
    doc: monograph
    page: 4
    quote: Not to be used for more than 1 week. Usually it is sufficient to take this medicinal product up to two to three times during that week.
    maxDays: 7
  - kind: contraindication
    ru: Непроходимость и сужение кишки, атония, аппендицит, воспалительные болезни кишечника, боль в животе неясной причины, сильное обезвоживание
    doc: monograph
    page: 5
    quote: Cases of intestinal obstructions and stenosis, atony, appendicitis, inflammatory bowel diseases (e.g. Crohn’s disease, ulcerative colitis), abdominal pain of unknown origin, severe dehydration state with water and electrolyte depletion.
  - kind: contraindication
    ru: Беременность и кормление грудью; дети младше 12 лет
    doc: monograph
    page: 5
    quote: Pregnancy and lactation (see section 4.6 and 5.3). Children under 12 years of age.
  - kind: warning
    ru: Долгий приём стимулирующих слабительных нарушает работу кишки и вызывает зависимость; если слабительное нужно каждый день — искать причину запора
    doc: monograph
    page: 5
    quote: Long-term use of stimulant laxatives should be avoided, as use for more than a brief period of treatment may lead to impaired function of the intestine and dependence on laxatives.
  - kind: warning
    ru: Сначала — изменить питание и попробовать набухающие средства
    doc: monograph
    page: 5
    quote: Frangula bark preparations should only be used if a therapeutic effect cannot be achieved by a change of diet or the administration of bulk forming agents.
  - kind: interaction
    ru: Потеря калия усиливает действие сердечных гликозидов и антиаритмиков; мочегонные, кортикостероиды и солодка усиливают потерю калия
    doc: monograph
    page: 6
    quote: Hypokalaemia (resulting from long-term laxative abuse) potentiates the action of cardiac glycosides and interacts with antiarrhythmic medicinal products. Concomitant use with diuretics, adrenocorticosteroids and liquorice root may enhance loss of potassium.
  - kind: pregnancy
    ru: При беременности нельзя — риск повреждения генов (эмодин, франгулин)
    doc: monograph
    page: 6
    quote: The use during pregnancy is contraindicated because of experimental data concerning a genotoxic risk of several anthranoids, e.g. emodin and frangulin.
  - kind: lactation
    ru: При кормлении грудью нельзя — метаболиты переходят в молоко
    doc: monograph
    page: 6
    quote: The use during lactation is contraindicated because after administration of anthranoids, active metabolites, such as rhein, were excreted in breast milk in small amounts.
  - kind: adverse
    ru: Боль и спазмы в животе, жидкий стул; при долгом приёме — потеря воды и солей, окрашивание слизистой кишки
    doc: monograph
    page: 7
    quote: Frangula bark may produce abdominal pain and spasm and passage of liquid stools, in particular in patients with irritable colon.
  - kind: adverse
    ru: Моча может окраситься в жёлтый или красно-коричневый цвет — это безопасно
    doc: monograph
    page: 7
    quote: Yellow or red-brown (pH dependent) discolouration of urine by metabolites, which is not clinically significant, may occur during the treatment.
  - kind: overdose
    ru: Схваткообразная боль и сильный понос с потерей жидкости и солей — много пить, следить за калием
    doc: monograph
    page: 7
    quote: The major symptoms of overdose/abuse are griping pain and severe diarrhoea with consequent losses of fluid and electrolytes.
constituents:
  - compound: glucofrangulin, frangulin
    compoundRu: глюкофрангулин, франгулин
    classRu: антрагликозиды (гидроксиантраценовые производные)
    effectRu: слабительное — сильнее неочищенного экстракта сенны
    evidence: animal
    doc: assessment-report
    page: 11
    quote: Laxative effect of glucofrangulin and frangulin nearly 4 to 5 times stronger than an undefined senna extract.
  - compound: hydroxyanthracene derivatives
    compoundRu: гидроксиантраценовые производные
    classRu: антрагликозиды
    effectRu: стимулирующее слабительное, механизм как у сенны
    evidence: review
    doc: assessment-report
    page: 13
    quote: It is generally assumed, by analogy with other HAD-containing laxatives, such as senna, that the mode of action is similar.
