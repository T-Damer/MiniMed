# EMA/HMPC facts for Лаванда узколистная (Lavandula angustifolia Miller), цветки. Draft artifact
# (status: proposed): Russian fields are a reader's rendering of the quoted English sentence; quotes
# are checked against the PDF. The Community monograph (final, 27 March 2012) is traditional use only,
# one indication; the assessment report also covers the essential oil, which this file does not.
plant: lavandula-angustifolia
status: reviewed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 3
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Облегчение лёгких симптомов психического напряжения и истощения, а также помощь при засыпании
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product for relief of mild symptoms of mental stress and exhaustion and to aid sleep.
  - kind: statement
    ru: Настойка — соотношение сырья и экстрагента 1:5, экстрагент этанол 50–60% по объёму
    doc: monograph
    page: 2
    quote: "Tincture (ratio of herbal substance to extraction solvent 1:5), extraction solvent ethanol 50-60% (V/V)"
  - kind: posology
    ru: "Чай: 1–2 г цветков или измельчённых цветков на 150 мл кипятка в виде настоя 3 раза в день"
    doc: monograph
    page: 3
    quote: "Adolescents, adults and elderly Herbal tea: 1-2 g of the herbal substance or comminuted herbal substance in 150 ml of boiling water as a herbal infusion 3 times daily"
    dose: { preparationRu: чай (настой), amount: "1-2", unit: г, waterMl: "150", timesPerDay: "3", populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: "Настойка: 2–4 мл 3 раза в день"
    doc: monograph
    page: 3
    quote: "Adolescents, adults and elderly Herbal tea: 1-2 g of the herbal substance or comminuted herbal substance in 150 ml of boiling water as a herbal infusion 3 times daily . Tincture: 2-4 ml, 3 times daily."
    dose: { preparationRu: настойка, amount: "2-4", unit: мл, timesPerDay: "3", populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: Приём внутрь
    doc: monograph
    page: 3
    quote: "Method of administration Oral use."
  - kind: age
    ru: Детям до 12 лет применение не рекомендуется
    doc: monograph
    page: 3
    quote: The use in children under 12 years of age is not recommended
    minAgeMonths: 144
  - kind: warning
    ru: Применение у детей до 12 лет не установлено из-за недостатка данных
    doc: monograph
    page: 3
    quote: The use in children under 12 years of age has not been established due to lack of adequate data.
    minAgeMonths: 144
  - kind: duration
    ru: Если симптомы сохраняются во время применения, нужно обратиться к врачу или квалифицированному медработнику
    doc: monograph
    page: 3
    quote: If the symptoms persist during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
  - kind: contraindication
    ru: Гиперчувствительность к действующему веществу
    doc: monograph
    page: 3
    quote: Hypersensitivity to the active substance(s).
  - kind: warning
    ru: Если симптомы ухудшаются во время применения, нужно обратиться к врачу или квалифицированному медработнику
    doc: monograph
    page: 4
    quote: If the symptoms worsen during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 4
    quote: Interactions with other medicinal products and other forms of interaction Well-established use Traditional use None reported.
  - kind: pregnancy
    ru: При беременности и кормлении грудью безопасность не установлена; данных недостаточно, применение не рекомендуется
    doc: monograph
    page: 4
    quote: Safety during pregnancy and lactation has not been established. In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: warning
    ru: Может нарушать способность управлять транспортом и механизмами; пациентам, у которых проявилось это действие, не следует водить транспорт и работать с механизмами
    doc: monograph
    page: 4
    quote: May impair ability to drive and use machines. Affected patients should not drive or operate machinery.
  - kind: adverse
    ru: Нежелательные эффекты не известны; если они возникают, нужно обратиться к врачу или квалифицированному медработнику
    doc: monograph
    page: 4
    quote: None known. If adverse reactions occur, a doctor or a qualified health care practitioner should be consulted.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 5
    quote: No case of overdose has been reported.
  - kind: statement
    ru: Исследования репродуктивной токсичности, генотоксичности и канцерогенности не проводились
    doc: monograph
    page: 5
    quote: Tests on reproductive toxicity, genotoxicity and carcinogenicity have not been performed.
  - kind: lookalike
    ru: Вид часто путают с другими видами лаванды — L. x intermedia (лавандин) и L. latifolia (лаванда широколистная, «спиклаванда»); если нет подробных требований к качеству, сырьё состоит из цветков разных видов
    doc: assessment-report
    page: 3
    quote: "The species is regularly confused with other lavender species L. x intermedia Emeric. (Lavandin) and L. latifolia MEDIK. (Spiklavender). If no detailed quality specifications are mentioned, the herbal substance consists of flowers from different flower species"
constituents:
  - compound: essential oil
    compoundRu: эфирное масло
    classRu: эфирные масла
    effectRu: цветки лаванды содержат эфирное масло (1–3%)
    evidence: review
    doc: assessment-report
    page: 3
    quote: "Lavender flower - Essential oil (1-3%)"
  - compound: tannins
    compoundRu: дубильные вещества
    classRu: танины
    effectRu: в сырье содержатся дубильные вещества — до 13%
    evidence: review
    doc: assessment-report
    page: 3
    quote: "Tannins: up to 13% in the herbal substance"
  - compound: linalool, linalyl acetate
    compoundRu: линалоол, линалилацетат
    classRu: монотерпены (основные компоненты эфирного масла)
    effectRu: основные компоненты эфирного масла — монотерпеновые спирты (60–65%), в том числе линалоол (20–50% фракции) и линалилацетат (25–46% фракции)
    evidence: review
    doc: assessment-report
    page: 3
    quote: "The main components of the essential oil are monoterpene alcohols (60-65%) such as linalool (20- 50% of the fraction), linalyl acetate (25-46% of the fraction)."
  - compound: linalool
    compoundRu: линалоол
    classRu: монотерпеновый спирт
    effectRu: на изолированной подвздошной кишке морской свинки лавандовое масло подавляло сокращения примерно на 50%; чистый линалоол действовал сходно
    evidence: in-vitro
    doc: assessment-report
    page: 12
    quote: "The ileum of the guinea-pig and the rat uterus and phrenic nerve diaphragm were used as an experimental model. These isolated organs contract when exposed to acetylcholine, histamine or noradrenaline or electrically stimulated (field stimulation). Lavender oil inhibited the contractions of the isolated ileum by about 50%. Pure linalool had similar effects."
  - compound: linalyl acetate
    compoundRu: линалилацетат
    classRu: сложный эфир монотерпенового спирта
    effectRu: в препаратах сонной артерии кролика вызывал устойчивое прогрессирующее расслабление при сокращении, вызванном фенилэфрином
    evidence: in-vitro
    doc: assessment-report
    page: 12
    quote: "Experiments were designed to investigate the relaxation mechanism of linalyl acetate as the major ingredient of lavender essential oil in rabbit carotid artery specimens. Linalyl acetate produced sustained and progressive relaxation during the contraction caused by phenylephrine."
