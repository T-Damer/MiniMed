# EMA/HMPC facts for Репешок обыкновенный (Agrimonia eupatoria L.), трава. Draft artifact
# (status: proposed): Russian fields are a reader's rendering of the quoted English sentence; quotes
# are checked against the PDF. The EU monograph (adopted 2014, last revised 28 January 2015) is
# traditional use only; its three indications are numbered 1)–3) in the source and its doses are
# lettered a), b), c) per indication.
plant: agrimonia-eupatoria
status: proposed
useType: traditional
