constituents:
  - compound: tannins (proanthocyanidins, ellagitannins)
    compoundRu: дубильные вещества (проантоцианидины, эллаготаннины)
    classRu: танины
    effectRu: содержание 3–11%, в основном проантоцианидины (конденсированные танины) с небольшой долей эллаготаннинов
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Tannins 3-11% consisting mainly of proanthocyanidins (condensed tannins) with a small proportion of ellagitannins."
  - compound: flavonoids (hyperoside)
    compoundRu: флавоноиды (гиперозид)
    classRu: флавоноиды
    effectRu: около 1,9%, главным образом гиперозид (0,37%), а также рутин, изокверцитрин, кверцитрин, изовитексин
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Flavonoids Ca. 1.9%, principally hyperoside (0.37%), together with rutin, isoquercitrin, quercitrin, isovitexin"
  - compound: ursolic acid
    compoundRu: урсоловая кислота
    classRu: тритерпеноид
    effectRu: содержание 0,6%; также эускаповая кислота и 28-β-D-глюкопиранозиловые эфиры эускаповой и торментовой кислот
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Triterpenoids Ursolic acid (0.6%); also euscapic acid and the 28-β-D-glucopyranosyl esters of euscapic acid and tormentic acid"
  - compound: tannins
    compoundRu: дубильные вещества
    classRu: танины
    effectRu: считается, что дубильные вещества вносят вклад в действие травы репешка; исследований, подтверждающих, что именно они отвечают за терапевтическое действие у людей, пока нет
    evidence: review
    doc: assessment-report
    page: 16
    quote: "The tannin constituents are therefore considered to contribute to the activity of Agrimony herb. However, studies confirming that these constituents are responsible for the therapeutic activity of Agrimony preparations in humans are currently lacking."
  - compound: agrimoniin
    compoundRu: агримониин
    classRu: эллаготаннин
    effectRu: у близкого вида Agrimonia pilosa особый интерес вызвал таннин агримониин, который до недавнего времени не описывали в A. eupatoria; противоопухолевую активность in vivo у мышей приписывают агримониину
    evidence: animal
    doc: assessment-report
    page: 14
    quote: "A related species, Agrimonia pilosa, has been investigated in a number of studies. Particular interest has been shown in the tannin agrimoniin. Until recently this constituent had not been reported in Agrimonia. eupatoria. In vivo antitumour activity in mice has been attributed to the tannin agrimoniin (Miyamoto et al. 1985)."
