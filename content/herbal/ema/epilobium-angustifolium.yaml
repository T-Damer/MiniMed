  - kind: lookalike
    ru: "В чешском фармацевтическом кодексе (1993) описана трава кипрея мелкоцветкового, горного, холмового и розового с содержанием дубильных веществ не менее 8%; при проверке на посторонние примеси и подмену виды Chamerion angustifolium (L.) Holub и Epilobium hirsutum (L.) должны отсутствовать"
    doc: assessment-report
    page: 4
    quote: "There is a monograph “Epilobii herba” available in the Czech Pharmaceutical Codex 1993 (Český farmaceutický kodex 1993). It includes the dried flowering herb of Epilobium parviflorum Schreb., Epilobium montanum L., Epilobium collinum C. C. Gmel. and Epilobium roseum Schreb. The herbal substance contains not less than 8% of tannins. According to the test for foreign matter and adulteration the two species Chamerion angustifolium (L.) Holub and Epilobium hirsutum (L.) must be absent."
constituents:
  - compound: tannins (oenothein B, oenothein A)
    compoundRu: дубильные и родственные вещества (ойнотеины B и A)
    classRu: эллаготаннины и родственные соединения
    effectRu: содержание 4–14% (например, ойнотеин B, ойнотеин A, три-, тетра- и пента-O-галлоилглюкоза)
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Tannins and related compounds (4-14%): e.g. oenothein B, oenothein A, tri-, tetra-, and penta-O- galloylglucose"
  - compound: oenothein B
    compoundRu: ойнотеин B
    classRu: эллаготаннин
    effectRu: ингибировал 5α-редуктазу in vitro, IC50 0,22 мкМ
    evidence: in-vitro
    doc: assessment-report
    page: 13
    quote: "Oenothein B In vitro, 5α-reductase Lesuisse et al.1996 Inhibition of 5α-reductase: IC50 0.22 µM"
  - compound: oenothein B
    compoundRu: ойнотеин B
    classRu: эллаготаннин
    effectRu: в клетках гормонозависимого рака простаты (LNCaP) in vitro ингибировал пролиферацию с IC50 7,8 мкМ, статистически значимо снижал PSA и подавлял активность аргиназы
    evidence: in-vitro
    doc: assessment-report
    page: 12
    quote: "Oenothein B Cells were exposed to solutions of 10, 20, and 40 µM In vitro, hormone dependent prostate cancer cells (LNCaP) Stolarczyk et al. 2013b Inhibition of proliferation of LNCaP with an IC50 value of 7.8 µM, statistically significant reduction of PSA and inhibition of arginase activity"
  - compound: myricetin-3-O-β-D-glucuronide
    compoundRu: мирицетин-3-O-β-D-глюкуронид
    classRu: флавоноид
    effectRu: in vivo, в модели каррагинанового отёка задней лапы крысы и на перфузируемом ухе кролика — выраженный противовоспалительный эффект (0,2 мг/кг) и подавление синтеза простагландинов
    evidence: animal
    doc: assessment-report
    page: 13
    quote: "Myricetin-3-O-beta-D-glucuronide Rat paw oedema: Dosage: 0.04, 0.2 & 1.0 mg/kg b.w. Route of administration: p.o Perfused rabbit ear: Concentrations of 0.1 and 1.0 µg/ml in the perfusate In vivo, carrageenan-induced oedema in the rat hind paw and perfused rabbit ear Hiermann et al. 1991 Strong anti-inflammatory effect (0.2 mg/kg/b.w.) and inhibitory effect on prostaglandin biosynthesis"
  - compound: oenothein A and B metabolites
    compoundRu: метаболиты ойнотеинов A и B
    classRu: производные эллаготаннинов
    effectRu: исследования метаболитов ойнотеинов A и B и их действия на клетки рака простаты представляются интересными для обоснования традиционного применения
    evidence: review
    doc: assessment-report
    page: 17
    quote: "Especially the investigations on metabolites of oenothein A and B and their effects on prostate cancer cells seem to be of interest with respect to the plausibility of the traditional use."
