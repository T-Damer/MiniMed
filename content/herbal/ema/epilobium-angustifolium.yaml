    ru: Облегчение симптомов нижних мочевых путей, связанных с доброкачественной гиперплазией предстательной железы, после исключения серьёзных состояний врачом
    doc: monograph
    page: 2
    quote: Traditional herbal medicinal product for the relief of lower urinary tract symptoms related to benign prostatic hyperplasia after serious conditions have been excluded by a medical doctor.
