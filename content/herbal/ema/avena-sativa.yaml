constituents:
  - compound: saponins (avenacoside A and B)
    compoundRu: сапонины (авенакозиды A и B)
    classRu: гликозилированные стероидные сапонины
    effectRu: в листьях содержатся фуростаноловые сапонины; содержание авенакозидов в листьях — 1–3 мг/г
    evidence: review
    doc: assessment-report
    page: 7
    quote: "Saponins: avenacoside A and B. These are glycosylated steroidal saponins. Leaves contain furostanol saponins. Avenacosid content of leaves varies between 1-3 mg/g."
  - compound: flavonoids (vitexin derivatives)
    compoundRu: флавоноиды (производные витексина)
    classRu: флавоноиды
    effectRu: указаны, например, производные витексина
    evidence: review
    doc: assessment-report
    page: 7
    quote: "Flavonoids: e.g. vitexin derivatives."
  - compound: tricin derivatives
    compoundRu: производные трицина
    classRu: флавоноиды
    effectRu: производные трицина выделены из травы овса
    evidence: review
    doc: assessment-report
    page: 7
    quote: "Figure 6: tricin derivatives isolated from Avena sativa herb."
  - compound: avenic acids
    compoundRu: авеновые кислоты A и B
    classRu: азотсодержащие карбоновые кислоты
    effectRu: указаны азотсодержащие карбоновые кислоты — авеновые кислоты A и B
    evidence: review
    doc: assessment-report
    page: 7
    quote: "N-containing carboxylic acids: avenic acid A and B."
  - compound: Avena sativa herb extracts
    compoundRu: экстракты травы овса
    classRu: экстракты
    effectRu: по оценке отчёта, обе серии опытов открывают интересные перспективы для нейрогенной активности овса, но данные предварительные (хранятся в документации компании), и нужны дополнительные исследования механизмов действия
    evidence: in-vitro
    doc: assessment-report
    page: 9
    quote: "Both series of experiments open interesting perspectives as a neurogenic activity of Avena sativa is concerned. As these preliminary data are on company file, more work has to be done in order to gain insight in the mechanisms of action exerted by Avena sativa extracts."
