# EMA/HMPC facts for Овёс посевной (Avena sativa L.), трава (надземная часть до цветения, сухая или
# свежая). Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian fields are a reader's rendering of the quoted
# English sentence; quotes are checked against the PDF. The Community monograph (final, 4 September
# 2008) is traditional use only, one indication. Its text layout is damaged in places (words broken
# over lines) and the assessment report PDF is clipped, so only intact passages are quoted.
