# EMA/HMPC facts for Эвкалипт (лист). ГРЛС: эвкалипт прутовидный; EMA: Eucalyptus globulus. Draft
# artifact (status: proposed): Russian fields are a reader's rendering of the quoted English sentence.
plant: eucalyptus
status: reviewed
useType: traditional
facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 3
    quote: The product is a traditional herbal medicinal product for use in the specified indication exclusively based upon long-standing use.
  - kind: indication
    ru: Облегчение кашля при простуде
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product used for relief of cough associated with cold.
  - kind: posology
    ru: Чай (настой) внутрь — подростки, взрослые и пожилые
    doc: monograph
    page: 3
    quote: "Herbal tea: 1.5 - 3 g of the comminuted herbal substance in 150 ml of boiling water as a herbal infusion, up to 4 times daily."
    dose: { preparationRu: настой, amount: "1.5-3", unit: г, waterMl: "150", timesPerDay: "до 4", populationRu: "подростки, взрослые и пожилые" }
  - kind: posology
    ru: Ингаляция — залить лист кипятком
    doc: monograph
    page: 3
    quote: "Comminuted herbal substance for infusion preparation for inhalation: 3 g of the comminuted herbal substance in boiling water, up to 3 times daily."
    dose: { preparationRu: настой для ингаляции, amount: "3", unit: г, timesPerDay: "до 3", populationRu: "подростки, взрослые и пожилые" }
  - kind: age
    ru: Детям младше 30 месяцев нельзя — риск ларингоспазма от препаратов с цинеолом
    doc: monograph
    page: 4
    quote: Children under 30 months of age, because there is a risk that cineole containing preparations, like other essential oils, can induce laryngospasm.
    minAgeMonths: 30
  - kind: age
    ru: Детям младше 12 лет не рекомендуется (измельчённое сырьё)
    doc: monograph
    page: 3
    quote: The use in children under 12 years of age is not recommended
    minAgeMonths: 144
  - kind: duration
    ru: Если симптомы держатся дольше 1 недели — к врачу
    doc: monograph
    page: 4
    quote: If the symptoms persist longer than 1 week during the use of the medicinal product, a doctor or a qualified health care practitioner should be consulted.
    maxDays: 7
  - kind: contraindication
    ru: Аллергия на эвкалипт
    doc: monograph
    page: 4
    quote: Hypersensitivity to the active substance.
  - kind: warning
    ru: При одышке, лихорадке или гнойной мокроте — к врачу или медработнику
    doc: monograph
    page: 4
    quote: When dyspnoea, fever or purulent sputum occurs, a doctor or a qualified health care practitioner should be consulted.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 5
    quote: Interactions with other medicinal products and other forms of interaction None reported.
  - kind: pregnancy
