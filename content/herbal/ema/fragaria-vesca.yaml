constituents:
  - compound: free and condensed tannins
    compoundRu: свободные и конденсированные дубильные вещества
    classRu: дубильные вещества (танины)
    effectRu: в листе оценивают 5–10 % дубильных веществ (свободных и конденсированных) по литературным источникам
    evidence: review
    doc: assessment-report
    page: 4
    quote: Free and condensed tannins. Lamaison 1990, Scholz monograph in Hagers 5th edition (1993), Blaschek (HagerRom 2006), estimated 5-10% tannins.
  - compound: free or condensed tannoids
    compoundRu: свободные или конденсированные дубильные вещества
    classRu: дубильные вещества (танины)
    effectRu: вяжущее действие земляники, возможно, связано с содержанием этих веществ (не менее 3 % в пересчёте на сухое сырьё); фармакологических исследований, доказывающих противодиарейное действие, не опубликовано
    evidence: review
    doc: assessment-report
    page: 15
    quote: The astringent effect of strawberry is possibly due to the free or condensed tannoids content (at least 3% referred to dried drug), although no pharmacology studies proving the antidiarrheal activity have been published.
  - compound: polyphenols (ellagitannins, agrimoniin, pedunculagin, gallic and ellagic acids, procyanidins)
    compoundRu: полифенолы (эллаготанины, агримониин, педункулагин, галловая и эллаговая кислоты, процианидины)
    classRu: полифенолы
    effectRu: содержание этих полифенолов может отчасти объяснять традиционное применение чая из листьев при лёгкой диарее — мягкие вяжущие, противовоспалительные и противомикробные свойства танинов
    evidence: review
    doc: assessment-report
    page: 17
    quote: The content of polyphenols such as elagitanins, agrimoniin, pedunculagin, gallic and elagic acids and procyanidins may partially explain the traditional use of the wild strawberry leaf teas, with mild astringent, anti-inflammatory and antimicrobial properties of the tannins in symptomatic treatment of mild diarrhoeas.
  - compound: Fb fraction (tannins - proanthocyanidins and ellagitannins)
    compoundRu: фракция Fb (танины — проантоцианидины и эллаготанины)
    classRu: дубильные вещества (танины)
    effectRu: наиболее активной антибактериальной фракцией экстракта листьев была фракция Fb (75 % метанол), состоящая в основном из танинов — проантоцианидинов и эллаготанинов
    evidence: in-vitro
    doc: assessment-report
    page: 14
    quote: "The most active antibacterial fraction was the Fb (MeOH 75%) fraction consisting essentially of tannins: proanthocyanidins and ellagitannins."
  - compound: leaf decoction
    compoundRu: отвар листьев
    classRu: водное извлечение
    effectRu: у крыс отвар листьев в дозе, соответствующей 1 г сырья/кг, не оказал значимого влияния на диурез при приёме внутрь
    evidence: animal
    doc: assessment-report
    page: 11
    quote: In rats, the decoction of the leaves (10 g in 100 ml) in doses corresponding to 1 g drug/kg b.w. did not have any significant influence on diuresis following oral administration
