facts:
  - kind: use-type
    ru: Традиционное растительное средство — применение основано только на длительном опыте
    doc: monograph
    page: 4
    quote: The product is a traditional herbal medicinal product for use in specified indications exclusively based upon long-standing use.
  - kind: indication
    ru: Лёгкие спастические жалобы ЖКТ, включая вздутие и метеоризм
    doc: monograph
    page: 3
    quote: Traditional herbal medicinal product for symptomatic treatment of mild, spasmodic gastro- intestinal complaints including bloating and flatulence.
  - kind: indication
    ru: Отхаркивающее при кашле, связанном с простудой
    doc: monograph
    page: 4
    quote: Traditional herbal medicinal product used as an expectorant in cough associated with cold
  - kind: posology
    ru: Чай (настой) из цельных или (свежих) измельчённых плодов — подростки старше 12 лет, взрослые, пожилые
    doc: monograph
    page: 4
    quote: "Adolescents over 12 years of age, adults, elderly: Single dose Herbal tea: 1 to 3.5 g of the whole or (freshly) comminuted or crushed aniseed in 150 ml of boiling water as a herbal infusion 3 times daily"
    dose: { preparationRu: настой, amount: "1-3.5", unit: г, waterMl: "150", timesPerDay: "3", populationRu: "подростки старше 12 лет, взрослые и пожилые" }
  - kind: age
    ru: Детям младше 12 лет не рекомендуется
    doc: monograph
    page: 4
    quote: The use in children under 12 years of age is not recommended
    minAgeMonths: 144
  - kind: duration
    ru: Не дольше двух недель
    doc: monograph
    page: 4
    quote: Not to be taken for more than two weeks.
    maxDays: 14
  - kind: statement
    ru: В доклинических исследованиях выявлен слабый мутагенный потенциал анетола; анетол и его метаболиты, вероятно, не генотоксичны in vivo. Генотоксический риск эстрагола не считается значимым при указанных условиях применения (кратковременный приём подростками, взрослыми и пожилыми) из-за малого его количества в настоях плодов аниса
    doc: monograph
    page: 6
    quote: Results from non-clinical studies showed a weak mutagenic potential of anethole. Anethole and its metabolites are unlikely to be genotoxic in vivo. The genotoxic risk4 related to estragole is not considered to be relevant in the specified conditions of use (short term use in adolescents, adults and elderly) due to the small amount present in herbal infusions prepared from aniseed.
  - kind: contraindication
    ru: Гиперчувствительность к анису, другим зонтичным (тмин, сельдерей, кориандр, укроп, фенхель) или к анетолу
    doc: monograph
    page: 4
    quote: Hypersensitivity to the active substance or to Apiaceae (Umbelliferae) (caraway, celery, coriander, dill and fennel) or to anethole.
  - kind: interaction
    ru: Взаимодействий не описано
    doc: monograph
    page: 5
    quote: Interactions with other medicinal products and other forms of interaction None reported.
  - kind: pregnancy
    ru: При беременности и кормлении грудью не рекомендуется — данных недостаточно
    doc: monograph
    page: 5
    quote: In the absence of sufficient data, the use during pregnancy and lactation is not recommended.
  - kind: adverse
    ru: Возможна аллергия — кожа или дыхательные пути
    doc: monograph
    page: 5
    quote: Allergic reactions to aniseed affecting the skin or the respiratory system may occur.
  - kind: overdose
    ru: Случаев передозировки не описано
    doc: monograph
    page: 6
    quote: No case of overdose has been reported.
