constituents:
  - compound: "tannins"
    compoundRu: "дубильные вещества"
    classRu: "танины"
    effectRu: "так как сухие спелые плоды содержат не менее 1 % танинов, традиционное применение препаратов сухих плодов при диарее и местно при лёгком воспалении слизистой оправдано их вяжущими свойствами"
    evidence: review
    doc: assessment-report
    page: 37
    quote: "As dried ripe fruits of bilberry contain at least 1% of tannins, the traditional use of the dry fruit preparations in diarrhea and topically in mild inflammation of the mucosa is justified on the basis of their astringent properties."
  - compound: "anthocyanins"
    compoundRu: "антоцианы"
    classRu: "антоцианы (флавоноиды)"
    effectRu: "общее содержание антоцианов в спелых плодах V. myrtillus составляет от 300 до 700 мг на 100 г"
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Total anthocyanin amount ranges from 300 to 700 mg per 100 g in ripe fruits of V. myrtillus"
  - compound: "anthocyanins"
    compoundRu: "антоцианы"
    classRu: "антоцианы (флавоноиды)"
    effectRu: "многие терапевтические свойства черники приписывают активности антоцианов"
    evidence: review
    doc: assessment-report
    page: 37
    quote: "Many therapeutic proprieties of bilberry is ascribed to anthocyanin activity."
  - compound: "catechin"
    compoundRu: "катехин"
    classRu: "флаван-3-олы"
    effectRu: "водный экстракт V. myrtillus (74,2 мг/г общих полифенолов, доля катехина 17,3 %) оказывал in vitro выраженное защитное действие на частицы ЛПНП при окислении, вызванном медью"
    evidence: in-vitro
    doc: assessment-report
    page: 25
    quote: "They found, that the extract, which contained 74.2±4.9 mg/g of total polyphenols with a proportion of catechin of 17.3±3.3% caused potent protective action on LDL particles during in vitro copper-mediated oxidation."
