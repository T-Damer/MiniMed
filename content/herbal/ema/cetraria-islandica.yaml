# EMA/HMPC facts for Исландский мох (цетрария исландская, Cetraria islandica (L.) Acharius s.l.),
# слоевище. Read line by line against the quotes on 2026-10-20 (status: reviewed): Russian fields are a reader's rendering of the quoted
# English sentence; quotes are checked against the PDF. The Community monograph (last revised
# 24 November 2014) is traditional use only: indication 1) and 2); preparations are lettered
# a) comminuted herbal substance, b) and c) soft extracts, d) tincture.
