  - kind: statement
    ru: В образцах из Финляндии найдено много тяжёлых металлов, прежде всего свинца, а также кадмия и ртути (Pb 30 мг/кг, Cd 0,30 мг/кг, Hg 0,075 мг/кг); лишайник способен поглощать токсичные элементы из окружающей среды
    doc: assessment-report
    page: 21
    quote: "Cetraria islandica was found to be able to absorb some toxic elements from the environment (Cercasov et al., 2002). High levels of heavy metals, especially lead, but also cadmium and mercury (Pb 30 mg/kg, Cd 0.30 mg/kg, Hg 0.075 mg/kg) were found in samples originating from Finland"
  - kind: statement
    ru: Исландский мох входит в список EFSA природных веществ, вызывающих возможные опасения; для лекарственного сырья опасений возникать не должно, так как усниновая кислота в нём не найдена или найдена лишь следами, а содержание свинца в монографии Европейской фармакопеи ограничено 10,0 ppm
    doc: assessment-report
    page: 22
    quote: "In spite of the fact that Cetraria islandica is on the EFSA list of naturally occurring substances of possible concern to human health, no safety concern should be raised for the herbal substance used for pharmaceutical purposes as usnic acid (dibenzofurane) has not been found in Cetraria islandica (Sticher, 1965, Ingólfsdóttir, 2002) or only in a traces (Airaksinen et al., 1986a) and lead content is limited to 10.0 ppm in the Ph.Eur. monograph Iceland moss."
constituents:
  - compound: polysaccharides (lichenan)
    compoundRu: полисахариды (лихенан)
    classRu: полисахариды
    effectRu: полисахариды — 25–50%; лихенан (лихенин) — линейный β-D-глюкан, растворимый в горячей воде
    evidence: review
    doc: assessment-report
    page: 4
    quote: "Polysaccharides – 25-50% - lichenan (or lichenin) – a hot water soluble, linear β-D-glucan"
  - compound: fumaroprotocetraric acid, protocetraric acid
    compoundRu: фумаропротоцетраровая и протоцетраровая кислоты
    classRu: лишайниковые кислоты (депсидоны)
    effectRu: фумаропротоцетраровая кислота — 2,6–11,5%, протоцетраровая — 0,2–0,3% в зависимости от места сбора
    evidence: review
    doc: assessment-report
    page: 5
    quote: "depsidones fumaroprotocetraric acid (2.6-11.5%) (Gudjónsdóttir and Ingólfsdóttir, 1997; Sticher, 1965) and protocetraric acid (0.2-0.3%) (Huovinen et al., 1986) depending on the collection site"
  - compound: protolichesterinic acid
    compoundRu: протолихестериновая кислота
    classRu: алифатический α-метилен-γ-лактон (лишайниковая кислота)
    effectRu: содержание 0,1–1,5% в зависимости от места сбора
    evidence: review
    doc: assessment-report
    page: 5
    quote: "protolichesterinic acid, an aliphatic α-methylene-γ-lactone (0.1-1.5%) depending on the collection site"
  - compound: usnic acid
    compoundRu: усниновая кислота
    classRu: производное дибензофурана
    effectRu: в исландском мхе найдена только следами (0,04%); в других работах не обнаружена
    evidence: review
    doc: assessment-report
    page: 5
    quote: "usnic acid, a dibenzofurane derivative, was found in Cetraria islandica only in traces (0.04%) (Laakso and Gustafsson 1952, Shibata 1958, Virtanen and Kärki 1956 in Airaksinen, 1986a), whereas usnic acid was not detected by Sticher (1965) and by Ingólfsdóttir (2002)"
  - compound: polysaccharides
    compoundRu: полисахариды
    classRu: полисахариды
    effectRu: очищенные полисахариды (углеводов >95%) показали слабую адгезию (10%) к эпителию изолированной щёчной мембраны свиньи, зависящую от концентрации
    evidence: in-vitro
    doc: assessment-report
    page: 14
    quote: "Purified polysaccharides (carbohydrates content >95%) from Lichen islandicus were investigated for bioadhesive effect on isolated porcine buccal membranes. Polysaccharides from Iceland moss showed a slight adhesion to epithelial tissue (10%). The adhesive effects were concentration dependent."
