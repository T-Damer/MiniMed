  - kind: warning
    ru: Показания 1 и 2 — всасывание одновременно принимаемых лекарств может замедляться; в качестве меры предосторожности препарат не следует принимать за ½–1 час до или после других лекарственных средств
    doc: monograph
    page: 6
    quote: "Indications 1) and 2) Absorption of concomitantly administered medicines may be delayed. As a precautionary measure, the product should not be taken ½ to 1 hour before or after intake of other medicinal products."
