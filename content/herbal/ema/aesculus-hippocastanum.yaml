    doc: assessment-report
    page: 9
    quote: The seeds of A. hippocastanum L. contain 3-10% of a mixture of acylated triterpene glycosides (saponins).
    evidence: review
  - compound: β-aescin
    compoundRu: β-эсцин
    classRu: тритерпеновый сапонин
    effectRu: β-эсцин обладает гемолитической активностью, а криптоэсцин — нет
    doc: assessment-report
    page: 10
