    doc: monograph
    page: 5
    quote: Posology Adults and elderly Standardised dry extract corresponding to a content of 21 mg triterpene glycosides calculated as protoaescigenin5 2 times daily.
    dose: {preparationRu: стандартизованный сухой экстракт, amount: '21', unit: мг тритерпеновых гликозидов (в пересчёте на протоаэсцигенин), timesPerDay: '2', populationRu: взрослые и пожилые}
