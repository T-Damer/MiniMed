# Herbal book («Травник») pilot: the only hand-authored input.
#
# Each plant links one ГРЛС raw-material name group (exact INN strings from the registry catalog),
# one EMA/HMPC herbal page and one public-domain botanical plate on Wikimedia Commons.
# Everything shown in the app is generated from those sources; nothing here is clinical text.
# Plan and selection rules: docs/research/herbal-pilot-plan-2026-10-18.md.
#
# Fields:
#   id          stable slug, used in document ids (herbal.plant.<id>); never renamed
#   ru          Russian plant name; latin = accepted binomial with authority; family
#   part        part used (ru as in ГРЛС, la as in the EMA Latin drug name)
#   grls.inn    exact ГРЛС INN / grouping-name strings (lower case) for the raw material
#   ema.page    EMA herbal page; ema.species = species the EMA document covers when it differs
#   plate       Wikimedia Commons file title and book; licence is read from Commons at fetch time
#   gf          ГФ raw-material article (edition 15, else the ГФ XIV article still in force) on
#               pharmacopoeia.regmed.ru: definition, appearance of the whole raw material, look-alikes
