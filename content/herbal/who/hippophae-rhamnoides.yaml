constituents:
  - compound: carotenoids
    compoundRu: каротиноиды
    classRu: витамины и родственные соединения
    effectRu: "витамины и родственные соединения — основные биологически активные компоненты; среди них каротиноиды (0,04–0,1 %: β- и γ-каротин, ликопин, зеаксантин и другие)"
    evidence: review
    doc: monograph
    page: 199
    quote: "Vitamins and related compounds are the major biologically active constituents. Among these are carotenoids (0.04–0.1%, β- and γ-carotene together with lycopene, zeaxanthine and others)"
  - compound: vitamins (C, B group, tocopherols, tocotrienols)
    compoundRu: витамины (C, группы B, токоферолы, токотриенолы)
    classRu: витамины
    effectRu: "витамин C — 0,2–1,4 %; витамины группы B — 0,1–0,16 %; также токоферолы и токотриенолы"
    evidence: review
    doc: monograph
    page: 199
    quote: "vitamin C (0.2–1.4%), vitamins of the B group (0.1–0.16%), tocopherols and tocotrienols."
  - compound: flavonoids
    compoundRu: флавоноиды
    classRu: флавоноиды
    effectRu: "среди других значимых компонентов — флавоноиды (особенно кемпферол, изорамнетин, рутин и катехин, а также три- и тетрагликозиды кверцетина)"
    evidence: review
    doc: monograph
    page: 199
    quote: "Other significant constituents are flavonoids (especially kaempferol, isorhamnetin, rutin and catechin, as well as quercetin tri- and tetra-glycosides)."
  - compound: ethanol extract of Hippophaë fruits
    compoundRu: этанольный экстракт плодов облепихи
    classRu: экстракт плодов
    effectRu: "у больных циррозом печени после курса лечения экстрактом плодов нормализация АЛТ и АСТ составила 80 % против 56 % при лечении витамином B"
    evidence: clinical
    doc: monograph
    page: 203
    quote: "Before treatment, the peripheral blood level of the above-listed factors was significantly higher in the subjects with liver cirrhosis. After a course of treatment with the extract of Hippophaë fruits, the rates of normalization were 80% for ALT and AST, compared to 56% following treatment with vitamin B."
