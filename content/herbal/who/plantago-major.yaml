constituents:
  - compound: iridoids
    compoundRu: иридоиды
    classRu: иридоиды
    effectRu: "в сухих листьях основные компоненты — иридоиды: аукубин, 3,4-дигидроаукубин, 6´-O-β-глюкозилаукубин, каталпол, плантареналозид и мелиттозид"
    evidence: review
    doc: monograph
    page: 325
    quote: "Dried leaves contain iridoids as the main constituents: aucubin, 3,4-dihydroaucubin, 6´-O-β−glucosylaucubin, catalpol, plantarenaloside and melittoside."
  - compound: flavonoids
    compoundRu: флавоноиды
    classRu: флавоноиды
    effectRu: "флавоноиды (апигенин, байкалеин, скутелляреин, байкалин, гомоплантагинин, непетрин, лютеолин, гиспидулин, плантагозид)"
    evidence: review
    doc: monograph
    page: 325
    quote: "flavonoids (apigenin, baicalein, scutellarein, baicalin, homoplantaginin, nepetrin, luteolin, hispidulin, plantagoside)"
  - compound: aqueous extract of dried leaves
    compoundRu: водный экстракт сухих листьев
    classRu: экстракт листьев
    effectRu: "внутрижелудочное введение водного экстракта сухих листьев в дозе 1 г/кг массы тела подавляло каррагениновый плеврит и подошвенный отёк у крыс"
    evidence: animal
    doc: monograph
    page: 329
    quote: "The intragastric administration of an aqueous extract of dried leaves of P. major at a dose of 1 g/kg bw inhibited carrageenan-induced pleurisy and plantar oedema in rats."
  - compound: hexane extract fraction of dried leaves
    compoundRu: фракция гексанового экстракта сухих листьев
    classRu: экстракт листьев
    effectRu: "кожное применение негидролизуемой хроматографической фракции (10 %) гексанового экстракта (25 %) сухих листьев значимо (p < 0,001) ускоряло сокращение и эпителизацию иссечённых ран у кроликов"
    evidence: animal
    doc: monograph
    page: 330
    quote: "The dermal application of the non-hydrolysable chromatographic fraction (10%) from the hexane extract (25%) of dried leaves of P. major significantly (p < 0.001) accelerated the rate of contraction and epithelialization of excision wounds in rabbits (81)."
  - compound: ethanol extract of leaves
    compoundRu: этанольный экстракт листьев
    classRu: экстракт листьев
    effectRu: "этанольный экстракт (0,5 мг/мл) подавлял иммуноглобулин E-зависимое высвобождение гистамина из клеток RBL-2H3 более чем на 80 %"
    evidence: in-vitro
    doc: monograph
    page: 329
    quote: "The ethanol extract (0.5 mg/ml) inhibited immunoglobulin E-dependent histamine release from RBL-2H3 cells. The inhibitory effect was greater than 80%."
