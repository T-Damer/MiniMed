plant: zea-mays
items:
  - topic: indication
    ru: "ГРЛС: показан при отёчном синдроме, связанном с нарушением функции почек; EMA: не рекомендуется, если советуют ограничить питьё"
    grls: отечный синдром, связанный с нарушением функции почек
    monograph: {doc: monograph, page: 5, quote: "Because adequate fluid intake is required during treatment, it is not recommended for patients with conditions where reduced fluid intake is advised."}
  - topic: dose
    ru: "ГРЛС: отвар по 1-3 столовые ложки каждые 3-4 часа; EMA: отвар 2-4 г на 200 мл, 2-3 раза в день"
    grls: Отвар принимают внутрь по 1-3 столовые ложки каждые 3-4 часа.
    monograph: {doc: monograph, page: 4, quote: "Herbal tea, decoction: 2 – 4 g of comminuted herbal substance in 200 ml of boiling water as a decoction (boiled for 5 minutes) 2 - 3 times daily."}
