<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMed — native visual preview</title>
<style>
.native-preview { margin:0; height:100vh; background:#fbf7ea; }
.native-preview__toolbar { box-sizing:border-box; height:44px; display:flex; align-items:center; gap:8px; padding:6px 10px; font:12px Arial,sans-serif; color:#292720; }
.native-preview__viewport { height:calc(100vh - 44px); }
</style>
</head>
<body class="native-preview">
<div class="native-preview__toolbar">
<span>Visual fixtures · same native components · no SQLite</span>
<select id="scene" aria-label="Preview scene"><option value="search">Поиск</option><option value="reader">Reader</option><option value="tools">Инструменты</option><option value="design">Дизайн-система</option></select>
<select id="theme" aria-label="Preview theme"><option value="light">Light</option><option value="dark">Dark</option></select>
</div>
<div id="native-preview-root" class="native-preview__viewport"></div>
<script>
const parameters=new URLSearchParams(location.search);
for(const id of ['scene','theme']) {
 const field=document.getElementById(id);
 if(parameters.has(id)) field.value=parameters.get(id);
 field.addEventListener('change',()=>{ parameters.set(id,field.value); location.search=parameters.toString(); });
}
</script>
<script src="shared.js"></script>
</body>
</html>
