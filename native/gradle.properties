org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# JDK 26 (the machine's default via /usr/libexec/java_home) is too new for Gradle 8.14.3/AGP
# 8.13.0; pin the Gradle daemon + toolchain to Homebrew's JDK 21 instead, same as any implicit
# constraint the existing apps/app/android build works around.
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@21/21.0.12/libexec/openjdk.jdk/Contents/Home
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.native.disableCompilerDaemon=true
