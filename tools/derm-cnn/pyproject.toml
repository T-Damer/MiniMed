[project]
name = "minimed-derm-cnn"
version = "0.1.0"
description = "Prototype: a small skin-photo CNN with optional patient details, trained outside the app"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "open-clip-torch>=3.3.0",
  "pillow>=11.0",
  "safetensors>=0.8.0",
  "scikit-learn>=1.6",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=5.22.0",
]

[tool.uv]
package = false
