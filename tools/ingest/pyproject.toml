[project]
name = "localmed-ingest"
version = "0.3.0a1"
description = "Deterministic LocalMed content-pack builder"
requires-python = ">=3.12"
dependencies = [
  "crawlee[beautifulsoup]==1.9.3",
  "pydantic==2.13.5",
  "pymupdf==1.28.2",
  "pyyaml==6.0.3",
  "typer==0.27.2",
]

[project.scripts]
medbase = "localmed_ingest.cli:app"
medbase-clinical-catalog = "localmed_ingest.clinical_catalog_cli:app"
medbase-regulated-catalog = "localmed_ingest.regulated_catalog_cli:app"
medbase-catalog-modules = "localmed_ingest.catalog_module_cli:app"
medbase-manufacturer-instructions = "localmed_ingest.manufacturer_instructions_cli:app"

medbase-terminology = "localmed_ingest.terminology_cli:app"

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localmed_ingest"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# Official Russian form names and typographic dashes appear in docstrings and comments.
"src/localmed_ingest/medical_form*.py" = ["RUF002", "RUF003"]
"src/localmed_ingest/vaccination_calendar*.py" = ["RUF002", "RUF003"]
# Russian definition text quoted in docstrings and comments uses typographic dashes.
"src/localmed_ingest/kr_*.py" = ["RUF002", "RUF003"]
"src/localmed_ingest/kim_*.py" = ["RUF002", "RUF003"]
"src/localmed_ingest/sense_*.py" = ["RUF002", "RUF003"]
"tests/test_kr_*.py" = ["RUF002", "RUF003"]
"tests/test_kim_*.py" = ["RUF002", "RUF003"]
"tests/test_sense_*.py" = ["RUF002", "RUF003"]
"tests/test_vaccination_calendar.py" = ["RUF002", "RUF003"]
"tests/test_medical_form*.py" = ["RUF002", "RUF003"]
# МНН, СМНН and ЕСКЛП are written in Cyrillic capitals in docstrings.
"src/localmed_ingest/substance_fallback.py" = ["RUF002", "RUF003"]
"tests/test_substance_fallback.py" = ["RUF002", "RUF003"]
# НСИ, МНН, ЕСКЛП and АТХ are written in Cyrillic capitals in docstrings.
"src/localmed_ingest/ddinter_severity.py" = ["RUF002", "RUF003"]
"tests/test_ddinter_severity.py" = ["RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
