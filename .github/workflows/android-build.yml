name: Android native qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/app/android/**'
      - 'apps/app/src/features/network/**'
      - 'apps/app/src/features/downloads/**'
      - 'apps/app/src/features/models/**'
      - 'scripts/check-native-bridge.mjs'
      - 'apps/app/src/composition/create-browser-core*'
      - 'packages/storage-capacitor/**'
      - 'patches/**'
      - 'bun.lock'
      - 'package.json'
      - 'apps/app/package.json'
      - 'scripts/test-native-storage.sh'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: native-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Build and validate application assets
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run build:app
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run native:source:check
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run native:sync:android
      - name: Complete ARM64 APK with inference and bundled SQLite
        working-directory: apps/app/android
        run: env -i PATH="$PATH" HOME="$HOME" JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" CI=1 ./gradlew --no-daemon assembleDebug
      - name: Retain verified complete APK and exact source
        run: |
          mkdir -p /tmp/native-apk
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,subprocess,shutil
          source=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          apk=pathlib.Path('apps/app/android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libsqlcipher.so' in z.namelist()
              assert 'lib/arm64-v8a/libai-chat.so' in z.namelist()
          out=pathlib.Path('/tmp/native-apk')
          name=f'MiniMed-native-{source[:7]}-arm64-debug.apk'
          shutil.copyfile(apk,out/name)
          (out/'SOURCE.txt').write_text(source+'\nTest APK; device test results are separate. No release publication.\n')
          (out/'SHA256.txt').write_text(hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()+'  '+name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMed-native-arm64-debug
          path: /tmp/native-apk
          retention-days: 14
      - name: Build explicit x86 storage-only test APK and JVM tests
        working-directory: apps/app/android
        run: env -i PATH="$PATH" HOME="$HOME" JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" CI=1 ./gradlew --no-daemon -PminimedStorageSmoke=true :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable hardware acceleration
        run: |
          mkdir -p /tmp/native-device
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Real-core FTS5 and DownloadManager restoration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: env -i PATH="$PATH" HOME="$HOME" ANDROID_HOME="$ANDROID_HOME" bash scripts/test-native-storage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-evidence
          path: |
            /tmp/native-device
            apps/app/android/app/build/test-results/testDebugUnitTest
          retention-days: 7
