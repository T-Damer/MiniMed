name: Fix calculator prototype

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: calculator-prototype-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.number == 135 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/medical-calculators'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/medical-calculators
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3

      - name: Apply strict TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in [
              'apps/app/src/features/assessments/AssessmentHost.tsx',
              'apps/app/src/features/calculators/CalculatorHost.tsx',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '  const refresh = (): void => setRoute(currentRoute());',
                  '  const refresh = (): void => {\n    setRoute(currentRoute());\n  };',
              )
              path.write_text(text, encoding='utf-8')

          registry = Path('apps/app/src/features/calculators/calculator-registry.ts')
          text = registry.read_text(encoding='utf-8')
          text = text.replace(
              'export const CALCULATOR_REGISTRY = [',
              'export const CALCULATOR_REGISTRY: readonly CalculatorDefinition[] = [',
          )
          text = text.replace(
              '] as const satisfies readonly CalculatorDefinition[];',
              '];',
          )
          registry.write_text(text, encoding='utf-8')

          history = Path('apps/app/src/state/calculation-history.ts')
          text = history.read_text(encoding='utf-8')
          old = '''function isCalculationRecord(value: unknown): value is CalculationRecord {
            if (!isRecord(value) || !isRecord(value.result)) return false;
            return (
              typeof value.id === 'string' &&
              typeof value.calculatorId === 'string' &&
              typeof value.subjectLabel === 'string' &&
              typeof value.createdAt === 'string' &&
              typeof value.inputSummary === 'string' &&
              value.result.ok === true &&
              typeof value.result.calculatorId === 'string' &&
              typeof value.result.formula === 'string' &&
              Array.isArray(value.result.trace) &&
              Array.isArray(value.result.warnings) &&
              (typeof value.result.value === 'number' || Array.isArray(value.result.values))
            );
          }'''.replace('          ', '')
          new = '''function isCalculationRecord(value: unknown): value is CalculationRecord {
            if (!isRecord(value)) return false;
            const result = value['result'];
            if (!isRecord(result)) return false;
            return (
              typeof value['id'] === 'string' &&
              typeof value['calculatorId'] === 'string' &&
              typeof value['subjectLabel'] === 'string' &&
              typeof value['createdAt'] === 'string' &&
              typeof value['inputSummary'] === 'string' &&
              result['ok'] === true &&
              typeof result['calculatorId'] === 'string' &&
              typeof result['formula'] === 'string' &&
              Array.isArray(result['trace']) &&
              Array.isArray(result['warnings']) &&
              (typeof result['value'] === 'number' || Array.isArray(result['values']))
            );
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('calculation-history guard did not match')
          history.write_text(text.replace(old, new), encoding='utf-8')

          view = Path('apps/app/src/features/calculators/CalculatorsView.tsx')
          text = view.read_text(encoding='utf-8')
          text = text.replace(
              '  const refresh = (): void => setRoute(currentRoute());',
              '  const refresh = (): void => {\n    setRoute(currentRoute());\n  };',
          )
          old = '''                    <Show
                      when={definition.state === 'available'}
                      fallback={
                        <small>
                          {definition.state === 'planned' ? definition.sourceRequirement : ''}
                        </small>
                      }
                    >
                      {(available) => (
                        <button
                          type="button"
                          data-testid={`calculator-open-${available().slug}`}
                          onClick={() => openCalculator(available())}
                        >
                          Открыть
                        </button>
                      )}
                    </Show>'''
          new = '''                    {definition.state === 'available' ? (
                      <button
                        type="button"
                        data-testid={`calculator-open-${definition.slug}`}
                        onClick={() => openCalculator(definition)}
                      >
                        Открыть
                      </button>
                    ) : (
                      <small>{definition.sourceRequirement}</small>
                    )}'''
          if old not in text:
              raise SystemExit('calculator availability block did not match')
          view.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Add calculator end-to-end flow
        shell: bash
        run: |
          cat > apps/app/e2e/calculators.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          import { mountBuiltApp } from './mount-built-app';

          test('calculates body surface area and writes it to a patient note', async ({ page }) => {
            await mountBuiltApp(page, { persistentOrigin: true });

            await page.getByRole('button', { name: 'Открыть медицинские калькуляторы' }).click();
            await expect(page.getByRole('heading', { name: 'Медицинские калькуляторы' })).toBeVisible();
            await page.getByTestId('calculator-open-body-surface-area-mosteller').click();

            await page.getByPlaceholder('Имя, номер карты или псевдоним').fill('Расчётный пациент');
            await page.getByLabel('Рост, см').fill('170');
            await page.getByLabel('Масса, кг').fill('70');
            await page.getByTestId('calculator-submit').click();

            const result = page.getByTestId('calculator-result');
            await expect(result).toContainText('1,82 м²');
            await result.getByTestId('calculator-save-note').click();
            await result.getByLabel('Название новой карточки').fill('Расчётный пациент');
            await result.getByRole('button', { name: 'Записать результат' }).click();

            await page.getByRole('button', { name: 'Закрыть калькуляторы' }).click();
            await page
              .locator('.app-bottom-nav')
              .getByRole('button', { name: 'Заметки', exact: true })
              .click();

            const card = page.locator('.patient-card').filter({ hasText: 'Расчётный пациент' });
            await expect(card).toBeVisible();
            await card.click();
            await expect(page.locator('.patient-note-record')).toContainText('Mosteller');

            await page.reload();
            await expect(page.locator('.patient-note-record')).toContainText('Mosteller');
          });
          EOF

      - run: bun install --frozen-lockfile
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          bunx biome check --write \
            apps/app/src/features/assessments/AssessmentHost.tsx \
            apps/app/src/features/calculators \
            apps/app/src/state/calculation-history.ts \
            apps/app/e2e/calculators.spec.ts
          bunx biome check --max-diagnostics=500 .
          bun run typecheck
          bun run test:unit
          bun run build:app

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(calculators): pass strict types and add end-to-end flow'
          git push origin HEAD:feature/medical-calculators
