name: PR 164 Android installed-core qualification
on:
  push:
    branches: [agent/startup-smoke-164]
    paths: [.github/workflows/pr164-device-check.yml]
permissions:
  contents: read
jobs:
  installed-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: d8bc80f2d66c60924cad2526d4f9f9f80d4851bb
    steps:
      - uses: actions/checkout@v7
        with:
          path: qualification
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d8bc80f2d66c60924cad2526d4f9f9f80d4851bb
          path: source
          persist-credentials: false
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Install pinned dependencies and synchronize app
        working-directory: source
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run build:app
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run native:sync:android
      - name: Build storage/UI qualification variant (not ARM inference qualification)
        working-directory: source/apps/app/android
        run: |
          env -i PATH="$PATH" HOME="$HOME" JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" CI=1 ./gradlew --no-daemon assembleDebug -x externalNativeBuildDebug -x mergeDebugNativeLibs -x stripDebugDebugSymbols
      - name: Prepare test harness and record scope
        run: |
          mkdir -p /tmp/pr164-device
          # Correct quoting in the test-only selector, without changing application sources.
          sed 's/JSON.stringify(JSON.stringify(label))/JSON.stringify(label)/g' qualification/scripts/qa-pr164-device.mjs > /tmp/pr164-harness.mjs
          node --check /tmp/pr164-harness.mjs
          printf '%s\n' 'Exact application TS/Java source d8bc80f; optional ARM-only inference JNI libraries excluded for x86 emulator. No production APK, physical-device, LLM, process-eviction or matched before/after memory claim.' > /tmp/pr164-device/SCOPE.txt
          git -C source diff --stat > /tmp/pr164-device/source-build-diff.txt
      - name: Cold installed core and warm relaunch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          cores: 2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: source
          script: env -i PATH="$PATH" HOME="$HOME" ANDROID_HOME="$ANDROID_HOME" SOURCE_SHA="$SOURCE_SHA" node /tmp/pr164-harness.mjs /tmp/pr164-device
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr164-android-installed-core
          path: /tmp/pr164-device
          retention-days: 7
          if-no-files-found: warn
