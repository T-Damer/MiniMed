name: Terminology source verification

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-source-check.yml]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install repository-pinned formatter
        run: python3 -m pip install --target /tmp/terminology-tools ruff==0.16.5
      - name: Collect bounded public reference inputs and schema
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          import zipfile
          query = '''PREFIX wdt: <http://www.wikidata.org/prop/direct/>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
          SELECT ?item ?mesh ?label ?alias WHERE {
            ?item wdt:P486 ?mesh; rdfs:label ?label.
            FILTER(STRSTARTS(?mesh, "D") && LANG(?label) = "ru")
            OPTIONAL { ?item skos:altLabel ?alias. FILTER(LANG(?alias) = "ru") }
          } LIMIT 250001'''
          plans = [('desc2026.gz', 'https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/desc2026.gz'),
                   ('wikidata-ru.json', 'https://query.wikidata.org/sparql?' + urllib.parse.urlencode({'query': query, 'format': 'json'}))]
          report = []
          with zipfile.ZipFile('terminology-reference.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name, url in plans:
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'MiniMed-terminology-research/1.0 (https://github.com/T-Damer/MiniMed)'})
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read(64 * 1024 * 1024 + 1)
                          if len(data) > 64 * 1024 * 1024:
                              raise ValueError('public reference exceeded size bound')
                      archive.writestr(name, data)
                      report.append({'path': name, 'url': url, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  except Exception as error:
                      report.append({'path': name, 'error': str(error)})
              for path in pathlib.Path('schema/sql').glob('*.sql'):
                  archive.write(path, str(path))
              for path in pathlib.Path('/tmp/terminology-tools').rglob('ruff'):
                  if path.is_file():
                      archive.write(path, 'ruff-bin')
                      break
              archive.writestr('source-download-report.json', json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-reference
          path: terminology-reference.zip
          retention-days: 1
          if-no-files-found: error
