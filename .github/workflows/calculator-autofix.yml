name: Calculator prototype autofix

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: calculator-prototype-autofix
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event.pull_request.number == 135 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/medical-calculators'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/medical-calculators
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3

      - name: Remove temporary imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/app/src/features/calculators/CalculatorsView.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  type StoredCalculationResult as NeverStoredCalculationResult,\n', '')
          text = text.replace('  AVAILABLE_CALCULATORS,\n', '')
          text = text.replace('  CALCULATOR_REGISTRY,\n', '')
          text = text.replace('\nvoid (undefined as NeverStoredCalculationResult | undefined);\n', '\n')
          path.write_text(text, encoding='utf-8')
          PY

      - run: bun install --frozen-lockfile

      - name: Format calculator changes
        run: >-
          bunx biome check --write
          apps/app/src/main.tsx
          apps/app/src/app/native-back.ts
          apps/app/src/features/assessments/AssessmentHost.tsx
          apps/app/src/features/calculators
          apps/app/src/state/calculation-history.ts
          apps/app/src/styles/calculators.css

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style(calculators): apply repository formatting'
            git push origin HEAD:feature/medical-calculators
          fi
