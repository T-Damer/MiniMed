name: Reference browser integration
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/reference-browser-check.yml]
permissions:
  contents: write
concurrency:
  group: minimed-reference-browser
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Locked dependencies and browser runtime
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          env -i PATH="$PATH" HOME="$HOME" bunx playwright install --with-deps chromium
      - name: Integrate observed progress, readiness and offline cache fixes
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 scripts/repair-reference-activation.py
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('packages/storage-sqlite/src/sqlite-medical-store.ts');s=p.read_text()
          pairs=[
            ("import { SCHEMA_SQL }", "import { resolveOpfsCacheFile } from './opfs-cache-identity';\nimport { SCHEMA_SQL }"),
            ('  opfsVfsFileName,\n',''),
            ('const vfsName = opfsVfsFileName(databaseName, byteLength);','const vfsName = resolveOpfsCacheFile(databaseName, byteLength, pool.getFileNames());'),
          ]
          for before,after in pairs:
              assert s.count(before)==1, 'OPFS recovery anchor changed: '+before
              s=s.replace(before,after)
          p.write_text(s)
          for name in ['FirstRunSetup.tsx','PackageDownloadRow.tsx']:
              p=Path('apps/app/src/features/setup')/name;s=p.read_text()
              def progress(m):
                  return m[0].replace('<progress','<DownloadProgress').replace('class="package-row__progress"','').replace('max={100}','').replace('aria-label=','label=')
              s,n=re.subn(r'<progress\b[\s\S]*?/>',progress,s)
              assert n==1, 'Expected one progress element in '+name
              p.write_text("import { DownloadProgress } from './DownloadProgress';\n"+s)
          p=Path('apps/app/src/features/setup/setup.css');s=p.read_text()
          s=s.replace('.first-run-setup {','.overlay-dialog.first-run-setup {',1)
          s=s.replace('.first-run-setup__header {','.overlay-dialog-header.first-run-setup__header {',1)
          old='  padding: calc(var(--safe-top, 0px) + 1rem) clamp(1rem, 4vw, 3rem) 1rem;\n  background: var(--theme-surface);'
          assert s.count(old)==1
          s=s.replace(old,'  padding: calc(var(--safe-top, 0px) + 1rem) clamp(1rem, 4vw, 3rem) 1rem;')
          p.write_text(s)
          p=Path('scripts/verify-reference-app.mjs');s=p.read_text()
          s=s.replace("length > 0, { timeout:","length > 0, undefined, { timeout:")
          old="  await expect(referenceRow.getByText('Установлен', { exact: true })).toBeVisible({ timeout: 180000 });"
          new="""  await expect.poll(() => page.evaluate(async () => {
            const { peekContentModuleRuntime } = await import('/src/features/modules/module-runtime-service.ts');
            const task = peekContentModuleRuntime()?.listTasks().toReversed().find((entry) => entry.moduleId === 'minimed.definition.reference.ru');
            return task ? { state: task.state, error: task.errorMessage ?? null } : null;
          }), { timeout: 180000, message: 'Reference installer must finish verification and activation' }).toEqual({ state: 'completed', error: null });"""
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace('  assert.equal(referenceGets, 1);', "  await expect.poll(() => referenceGets, { message: 'Observe exactly one reference archive GET', timeout: 10000 }).toBe(1);")
          s=s.replace('const external = [];', 'const external = [];\nlet blockedCatalogRefreshes = 0;')
          s=s.replace('    external.push(url.origin); return route.abort();', "    if (url.href === 'https://raw.githubusercontent.com/T-Damer/MiniMed/main/apps/app/src/features/modules/catalog.preview.json' && route.request().method() === 'GET') blockedCatalogRefreshes += 1;\n    else external.push(url.origin);\n    return route.abort();")
          s=s.replace("record('No uncaught page errors or external requests in the tested application path.');", "record('No uncaught page errors or unexpected external requests. Existing metadata-only catalog refreshes were blocked and used bundled fallback.');\n  report.blockedCatalogRefreshes = blockedCatalogRefreshes;")
          s=s.replace("console.error('Visible app diagnostics:', (await page.locator('body').innerText()).slice(0, 16000));", "console.error('Completed checks:', JSON.stringify(report.assertions));\n  console.error('UI counters:', JSON.stringify({ dialogs: await page.getByRole('dialog').count(), alerts: await page.getByRole('alert').count(), coreGets, referenceGets }));\n  console.error('Boot status:', await page.locator('.boot-card__title, .boot-card__description').allTextContents());\n  console.error('UI error messages:', await page.getByRole('alert').allTextContents());")
          p.write_text(s)
          PY
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write --diagnostic-level=error scripts/verify-reference-app.mjs apps/app/src/features/modules/local-definition-reference.ts apps/app/src/composition/worker-core-consent.test.ts apps/app/src/features/setup apps/app/src/app/use-app-session.ts apps/app/src/features/reference/DefinitionReferencePanel.tsx packages/storage-sqlite/src/opfs-cache-identity.ts packages/storage-sqlite/tests/opfs-cache-identity.test.ts packages/storage-sqlite/src/sqlite-medical-store.ts
          env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p packages/storage-sqlite/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p apps/app/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run packages/storage-sqlite/tests/opfs-cache-identity.test.ts apps/app/src/composition/worker-core-consent.test.ts apps/app/src/composition/worker-opfs-medical-store.test.ts apps/app/src/composition/create-browser-core.test.ts apps/app/src/composition/medical-core-lifecycle.test.ts apps/app/src/features/setup/setup-state.test.ts packages/storage/tests/reference-mount.test.ts
      - name: Build full public numeric edition and verify transport
        run: env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/prepare-definition-reference.py --version 2026.09.22-r2 --built-at 2026-09-22
      - name: Actual application and installed dictionary
        run: env -i PATH="$PATH" HOME="$HOME" node scripts/verify-reference-app.mjs
      - name: Record verified scope without replacing historical evidence
        env:
          CHECKED_SHA: ${{ github.sha }}
          CHECKED_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('data/build/reference-app-check/browser-report.json').read_text())
          report['checkedInputCommit']=os.environ['CHECKED_SHA'];report['runId']=os.environ['CHECKED_RUN']
          Path('docs/research/definition-reference-app-browser-2026-09-22.json').write_text(json.dumps(report,indent=2)+'\n')
          summary=('## Definition reference R2 and package setup — 2026-09-22\n\n'
            'The actual App offers a full-screen first-run package list. Required core is bold and starred; other real catalog packages are optional with per-package status/progress. Closing preserves downloads and dismissal. Core consent uses the existing OPFS owner and pauses its deadline during human choice. Reconnect uses the same session factory; dictionary lookup waits for active-core capability, not just registry completion. Offline core recovery only accepts an unambiguous checksum-qualified cache name when HEAD cannot supply a size.\n\n'
            'The normal search screen has a dictionary entry. Numeric schema-7 reference requests use the existing installer, registry, MedicalStore/MedicalCore and OPFS owner; ordinary clinical projections exclude the reference-only mount. The unbounded JSON preview is no longer mounted. The local public draft has 18133 source records, not reviewed canonical concepts; transport/installed sizes are 27399431/110960640 bytes. It remains local-dev, not a public download or released APK.\n\n'
            'Headless Chromium exercised actual App/core consent, closure, the complete reference installer and sourced bounded card, followed by reload with database network reads blocked. Development JS/core-report remained served. Existing metadata-only catalog refreshes were blocked, not removed. Evidence: research/definition-reference-app-browser-2026-09-22.json; input '+os.environ['CHECKED_SHA']+', run '+os.environ['CHECKED_RUN']+'.\n\n'
            'Android/native, production/offline bundle, process/install peak memory, complete corrupt/interrupted update matrix and owner-PDF annotations remain unqualified. No private PDF, model, binary, Actions artifact, release or merge was published.\n\n')
          p=Path('docs/CURRENT_STATE.md');s=p.read_text();assert s.startswith('# Current state\n')
          p.write_text('# Current state\n\n'+summary+s[len('# Current state\n'):].lstrip('\n'))
          p=Path('docs/DEFINITION_REFERENCE_PLAN.md');s=p.read_text()
          s=s.replace('Updated: 2026-09-21.','Updated: 2026-09-22.',1)
          s=s.replace("The app's `definition-draft-lookup.ts` still imports every JSON collection and rebuilds the combined index for an owner overlay.","The original `definition-draft-lookup.ts` imported every JSON collection; R2 removes that preview from the mounted application.")
          s=s.replace("**Next implementation priority: R2's public-reference vertical slice**, not another speculative compression pass.","**Current priority: qualify the implemented R2 public-reference slice on target devices and remaining lifecycle failures**, not another speculative compression pass.")
          s=s.replace('The current DEV UI has not yet switched from JSON.','The current DEV UI uses the bounded reference capability.')
          s=s.replace('### R2 — Existing installer, app composition and lifecycle (pending; next implementation)','### R2 — Existing installer, app composition and lifecycle (public browser slice implemented; device/lifecycle gates open)')
          s=s.replace('- [ ] Expose bounded reference operations','- [x] Expose bounded reference operations')
          s=s.replace('- [ ] Replace the default all-JSON definition preview','- [x] Replace the default all-JSON definition preview')
          s=s.replace('The current DEV UI is still the older JSON preview; R1/R1b alone did not fix its memory consumption.','The full public DEV reference installs and opens through the actual App; Android/install-peak measurements and full update-failure matrix remain open.')
          s += '\n- 2026-09-22: R2 public browser slice and explicit full-screen core/optional package setup verified. See `research/definition-reference-app-browser-2026-09-22.json` for exact input/run, bounded-card checks, full 18133-record install and restricted-network restart. Not Android or complete lifecycle/clinical qualification. Owner overlays and schema-8/9 application capabilities remain disabled.\n'
          p.write_text(s)
          PY
      - name: Persist checked code and numeric evidence
        env:
          PUSH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          git add scripts/verify-reference-app.mjs apps/app/src/features/modules/local-definition-reference.ts apps/app/src/composition/worker-core-consent.test.ts apps/app/src/features/setup apps/app/src/app/use-app-session.ts apps/app/src/features/reference/DefinitionReferencePanel.tsx packages/storage-sqlite/src/opfs-cache-identity.ts packages/storage-sqlite/tests/opfs-cache-identity.test.ts packages/storage-sqlite/src/sqlite-medical-store.ts docs/research/definition-reference-app-browser-2026-09-22.json docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reference): verify full app setup, sourced dictionary and offline database reopen [skip ci]'
          git fetch --depth=1 origin refs/heads/experiment/system-one-search-benchmark
          if [ "$(git rev-parse FETCH_HEAD)" != "$CHECKED_SHA" ]; then
            git rebase --onto FETCH_HEAD "$CHECKED_SHA"
          fi
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free boundary
        if: always()
        run: echo 'No SQLite binaries, private PDF/text, models, release assets or Actions artifacts uploaded. Browser result is not Android qualification.' >> "$GITHUB_STEP_SUMMARY"
