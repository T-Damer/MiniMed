name: Reference browser integration
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/reference-browser-check.yml]
permissions:
  contents: write
concurrency:
  group: minimed-reference-browser
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Locked dependencies and browser runtime
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          env -i PATH="$PATH" HOME="$HOME" bunx playwright install --with-deps chromium
      - name: Correct native progress and keep the existing dark header contract
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ['FirstRunSetup.tsx','PackageDownloadRow.tsx']:
              p=Path('apps/app/src/features/setup')/name;s=p.read_text()
              def progress(m):
                  return m[0].replace('<progress','<DownloadProgress').replace('class="package-row__progress"','').replace('max={100}','').replace('aria-label=','label=')
              s,n=re.subn(r'<progress\b[\s\S]*?/>',progress,s)
              assert n==1, 'Expected one progress element in '+name
              p.write_text("import { DownloadProgress } from './DownloadProgress';\n"+s)
          p=Path('apps/app/src/features/setup/setup.css');s=p.read_text()
          s=s.replace('.first-run-setup {','.overlay-dialog.first-run-setup {',1)
          s=s.replace('.first-run-setup__header {','.overlay-dialog-header.first-run-setup__header {',1)
          old='  padding: calc(var(--safe-top, 0px) + 1rem) clamp(1rem, 4vw, 3rem) 1rem;\n  background: var(--theme-surface);'
          assert s.count(old)==1
          s=s.replace(old,'  padding: calc(var(--safe-top, 0px) + 1rem) clamp(1rem, 4vw, 3rem) 1rem;')
          p.write_text(s)
          p=Path('scripts/verify-reference-app.mjs');s=p.read_text()
          s=s.replace("length > 0, { timeout:","length > 0, undefined, { timeout:")
          old="  await expect(referenceRow.getByText('Установлен', { exact: true })).toBeVisible({ timeout: 180000 });"
          new="""  await page.waitForFunction(async () => {
            const { getContentModuleRuntime } = await import('/src/features/modules/module-runtime-service.ts');
            const runtime = getContentModuleRuntime();
            const task = runtime.listTasks().toReversed().find((entry) => entry.moduleId === 'minimed.definition.reference.ru');
            if (task?.state === 'failed') throw new Error(task.errorMessage ?? 'Reference installation failed.');
            return task?.state === 'completed';
          }, undefined, { timeout: 180000 });"""
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace("console.error('Visible app diagnostics:', (await page.locator('body').innerText()).slice(0, 16000));", "console.error('Completed checks:', JSON.stringify(report.assertions));\n  console.error('UI counters:', JSON.stringify({ dialogs: await page.getByRole('dialog').count(), alerts: await page.getByRole('alert').count(), coreGets, referenceGets }));\n  console.error('UI error messages:', await page.getByRole('alert').allTextContents());")
          p.write_text(s)
          PY
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write --diagnostic-level=error scripts/verify-reference-app.mjs apps/app/src/features/modules/local-definition-reference.ts apps/app/src/composition/worker-core-consent.test.ts apps/app/src/features/setup
          env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p apps/app/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run apps/app/src/composition/worker-core-consent.test.ts apps/app/src/composition/worker-opfs-medical-store.test.ts apps/app/src/features/setup/setup-state.test.ts packages/storage/tests/reference-mount.test.ts
      - name: Build full public numeric edition and verify transport
        run: env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/prepare-definition-reference.py --version 2026.09.22-r2 --built-at 2026-09-22
      - name: Actual application and installed dictionary
        run: env -i PATH="$PATH" HOME="$HOME" node scripts/verify-reference-app.mjs
      - name: Persist only checked code and numeric evidence
        env:
          PUSH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('data/build/reference-app-check/browser-report.json').read_text())
          report['checkedInputCommit']=os.environ['CHECKED_SHA']
          Path('docs/research/definition-reference-app-browser-2026-09-22.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add scripts/verify-reference-app.mjs apps/app/src/features/modules/local-definition-reference.ts apps/app/src/composition/worker-core-consent.test.ts apps/app/src/features/setup docs/research/definition-reference-app-browser-2026-09-22.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(setup): verify real progress rendering and full dictionary application path [skip ci]'
          git fetch --depth=1 origin refs/heads/experiment/system-one-search-benchmark
          if [ "$(git rev-parse FETCH_HEAD)" != "$CHECKED_SHA" ]; then
            git rebase --onto FETCH_HEAD "$CHECKED_SHA"
          fi
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free boundary
        if: always()
        run: echo 'No SQLite binaries, private PDF/text, models, release assets or Actions artifacts uploaded. Browser result is not Android qualification.' >> "$GITHUB_STEP_SUMMARY"
