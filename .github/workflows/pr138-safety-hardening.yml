name: PR 138 safety hardening

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  push:
    branches:
      - agent/medication-interaction-checker

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/medication-interaction-checker
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - name: Apply interaction safety fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one replacement, found {text.count(old)}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          types = 'apps/app/src/features/interactions/interaction-types.ts'
          replace_once(
              types,
              "export type InteractionDirection = 'bidirectional' | 'subject-affects-interactant';",
              "export type InteractionDirection =\n  | 'bidirectional'\n  | 'subject-affects-interactant'\n  | 'interactant-affects-subject';",
          )
          replace_once(
              types,
              "  readonly interactionType?: InteractionAssertion['interactionType'];\n",
              "  readonly interactionType?: InteractionAssertion['interactionType'];\n  readonly direction?: InteractionDirection;\n",
          )

          knowledge = 'apps/app/src/features/interactions/interaction-knowledge.ts'
          replace_once(
              knowledge,
              "      direction: 'subject-affects-interactant',\n      conclusion: 'management-required',",
              "      direction: 'interactant-affects-subject',\n      conclusion: 'management-required',",
          )
          replace_once(
              knowledge,
              "      sourceVersion: 'Актуальная маркировка DailyMed',\n      reviewedAt: '2026-08-04',\n      quote:\n        'Escitalopram is contraindicated in patients taking MAOIs, including MAOIs such as linezolid.',",
              "      sourceVersion: 'DailyMed set ID 7d924d16-8a10-411d-be57-97c450f56de7',\n      reviewedAt: '2026-08-04',\n      quote:\n        'Escitalopram is contraindicated in patients taking MAOIs, including MAOIs such as linezolid.',",
          )
          replace_once(
              knowledge,
              "      sourceVersion: 'Актуальная маркировка DailyMed',\n      reviewedAt: '2026-08-04',\n      quote: 'Escitalopram is contraindicated in patients taking pimozide.',",
              "      sourceVersion: 'DailyMed set ID 7d924d16-8a10-411d-be57-97c450f56de7',\n      reviewedAt: '2026-08-04',\n      quote: 'Escitalopram is contraindicated in patients taking pimozide.',",
          )
          replace_once(
              knowledge,
              "      sourceVersion: 'Актуальная маркировка DailyMed',\n      reviewedAt: '2026-08-04',\n      quote: 'Metoclopramide lowers the serum concentration and urinary excretion of fosfomycin.',",
              "      sourceVersion: 'DailyMed set ID 6b9167a9-80e9-44e1-a609-c3eb78960acf',\n      reviewedAt: '2026-08-04',\n      quote: 'Metoclopramide lowers the serum concentration and urinary excretion of fosfomycin.',",
          )
          replace_once(
              knowledge,
              "      sourceVersion: 'Актуальная маркировка DailyMed',\n      reviewedAt: '2026-08-04',\n      quote: 'Cimetidine does not affect the pharmacokinetics of fosfomycin.',",
              "      sourceVersion: 'DailyMed set ID 6b9167a9-80e9-44e1-a609-c3eb78960acf',\n      reviewedAt: '2026-08-04',\n      quote: 'Cimetidine does not affect the pharmacokinetics of fosfomycin.',",
          )

          engine = 'apps/app/src/features/interactions/interaction-engine.ts'
          replace_once(
              engine,
              "const validatedKnowledge = new WeakSet<object>();\n",
              "const validatedKnowledge = new WeakSet<object>();\nconst aliasIndexes = new WeakMap<object, ReadonlyMap<string, MedicationConcept>>();\n",
          )
          replace_once(
              engine,
              "function requireText(value: string, path: string): void {\n  if (!value.trim()) throw new Error(`Medication interaction catalog: ${path} must not be empty.`);\n}\n",
              "function requireText(value: string, path: string): void {\n  if (!value.trim()) throw new Error(`Medication interaction catalog: ${path} must not be empty.`);\n}\n\nfunction isValidReviewDate(value: string): boolean {\n  if (!REVIEW_DATE_PATTERN.test(value)) return false;\n  const [year, month, day] = value.split('-').map(Number);\n  if (year === undefined || month === undefined || day === undefined) return false;\n  const parsed = new Date(Date.UTC(year, month - 1, day));\n  return (\n    parsed.getUTCFullYear() === year &&\n    parsed.getUTCMonth() === month - 1 &&\n    parsed.getUTCDate() === day\n  );\n}\n",
          )
          text = Path(engine).read_text(encoding='utf-8')
          text = text.replace('!REVIEW_DATE_PATTERN.test(evidence.reviewedAt)', '!isValidReviewDate(evidence.reviewedAt)')
          text = text.replace('!REVIEW_DATE_PATTERN.test(assertion.reviewedAt)', '!isValidReviewDate(assertion.reviewedAt)')
          Path(engine).write_text(text, encoding='utf-8')
          replace_once(
              engine,
              "function aliasIndex(\n  knowledge: MedicationInteractionKnowledgeBase,\n): ReadonlyMap<string, MedicationConcept> {\n  const index = new Map<string, MedicationConcept>();\n  for (const medication of knowledge.medications) {\n    for (const name of [medication.preferredName, ...medication.aliases]) {\n      index.set(normalizeMedicationName(name), medication);\n    }\n  }\n  return index;\n}\n",
              "function aliasIndex(\n  knowledge: MedicationInteractionKnowledgeBase,\n): ReadonlyMap<string, MedicationConcept> {\n  const cached = aliasIndexes.get(knowledge);\n  if (cached) return cached;\n  const index = new Map<string, MedicationConcept>();\n  for (const medication of knowledge.medications) {\n    for (const name of [medication.preferredName, ...medication.aliases]) {\n      index.set(normalizeMedicationName(name), medication);\n    }\n  }\n  aliasIndexes.set(knowledge, index);\n  return index;\n}\n",
          )
          replace_once(
              engine,
              "    interactionType: assertion.interactionType,\n    mechanism: assertion.mechanism,",
              "    interactionType: assertion.interactionType,\n    direction: assertion.direction,\n    mechanism: assertion.mechanism,",
          )
          replace_once(
              engine,
              "  const nonEmptyInputs = inputs.map((input) => input.trim()).filter(Boolean);\n  const boundedInputs = nonEmptyInputs.slice(0, MAX_MEDICATIONS);\n\n  for (const input of boundedInputs) {\n    const concept = resolveMedication(input, knowledge);\n    const normalized = normalizeMedicationName(input);\n    const key = concept ? `medication:${concept.id}` : `unresolved:${normalized}`;\n    if (seenKeys.has(key)) {\n      duplicateInputs.push(input);\n      continue;\n    }\n    seenKeys.add(key);\n    participants.push(participant(input, concept));\n    if (concept) resolved.push({ input, concept });\n    else unresolved.push({ input });\n  }\n",
              "  const nonEmptyInputs = inputs.map((input) => input.trim()).filter(Boolean);\n  let truncated = false;\n\n  for (const input of nonEmptyInputs) {\n    const concept = resolveMedication(input, knowledge);\n    const normalized = normalizeMedicationName(input);\n    const key = concept ? `medication:${concept.id}` : `unresolved:${normalized}`;\n    if (seenKeys.has(key)) {\n      duplicateInputs.push(input);\n      continue;\n    }\n    if (participants.length >= MAX_MEDICATIONS) {\n      truncated = true;\n      continue;\n    }\n    seenKeys.add(key);\n    participants.push(participant(input, concept));\n    if (concept) resolved.push({ input, concept });\n    else unresolved.push({ input });\n  }\n",
          )
          replace_once(
              engine,
              "    truncated: nonEmptyInputs.length > MAX_MEDICATIONS,\n",
              "    truncated,\n",
          )

          tests = 'apps/app/src/features/interactions/interaction-engine.test.ts'
          replace_once(
              tests,
              "      assertionId: 'interaction.escitalopram.maoi',\n",
              "      assertionId: 'interaction.escitalopram.maoi',\n      direction: 'bidirectional',\n",
          )
          replace_once(
              tests,
              "  it('returns an explicit reviewed negative assertion only when it exists', () => {",
              "  it('preserves the reviewed direction of a pharmacokinetic interaction', () => {\n    const result = checkMedicationInteractions(\n      ['фосфомицин', 'метоклопрамид'],\n      MEDICATION_INTERACTION_KNOWLEDGE,\n    );\n\n    expect(result.pairs[0]).toMatchObject({\n      conclusion: 'management-required',\n      direction: 'interactant-affects-subject',\n      assertionId: 'interaction.fosfomycin.metoclopramide',\n    });\n  });\n\n  it('returns an explicit reviewed negative assertion only when it exists', () => {",
          )
          replace_once(
              tests,
              "  it('reports truncation and never evaluates more than twenty unique inputs', () => {\n    const inputs = Array.from({ length: 21 }, (_, index) => `неизвестный-${index}`);\n    const result = checkMedicationInteractions(inputs, MEDICATION_INTERACTION_KNOWLEDGE);\n\n    expect(result.truncated).toBe(true);\n    expect(result.participants).toHaveLength(20);\n    expect(result.pairs).toHaveLength(190);\n  });",
              "  it('reports truncation after twenty unique inputs rather than twenty raw entries', () => {\n    const inputs = [\n      'эсциталопрам',\n      'Ципралекс',\n      ...Array.from({ length: 20 }, (_, index) => `неизвестный-${index}`),\n    ];\n    const result = checkMedicationInteractions(inputs, MEDICATION_INTERACTION_KNOWLEDGE);\n\n    expect(result.truncated).toBe(true);\n    expect(result.duplicateInputs).toEqual(['Ципралекс']);\n    expect(result.participants).toHaveLength(20);\n    expect(result.pairs).toHaveLength(190);\n  });",
          )
          replace_once(
              tests,
              "  it('rejects aliases that resolve to multiple medications', () => {",
              "  it('rejects impossible calendar review dates', () => {\n    const evidence = MEDICATION_INTERACTION_KNOWLEDGE.evidence[0];\n    expect(evidence).toBeDefined();\n    const invalid: MedicationInteractionKnowledgeBase = {\n      ...MEDICATION_INTERACTION_KNOWLEDGE,\n      evidence: evidence ? [{ ...evidence, reviewedAt: '2026-02-31' }] : [],\n    };\n\n    expect(() => validateMedicationInteractionKnowledge(invalid)).toThrow('invalid reviewedAt');\n  });\n\n  it('rejects aliases that resolve to multiple medications', () => {",
          )
          PY
      - name: Format and test
        run: |
          bunx biome check --write \
            apps/app/src/features/interactions/interaction-types.ts \
            apps/app/src/features/interactions/interaction-knowledge.ts \
            apps/app/src/features/interactions/interaction-engine.ts \
            apps/app/src/features/interactions/interaction-engine.test.ts
          bun run test:unit
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/app/src/features/interactions
          git commit -m "fix: harden medication interaction contract"
          git push origin HEAD:agent/medication-interaction-checker
