name: Release candidate preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-candidate-preflight.yml"
      - ".github/workflows/public-pilot-android-release.yml"
      - ".github/workflows/publish-dataset-modules.yml"
      - "apps/app/**"
      - "content/full-respiratory-rf-*"
      - "content/pilot-rf/**"
      - "tools/ingest/**"
      - "package.json"
      - "bun.lock"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: release-candidate-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  respiratory-dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project tools/ingest --all-groups --locked
      - name: Synchronize respiratory source PDFs
        run: >-
          uv run --project tools/ingest medbase sync
          --manifest content/full-respiratory-rf-sources.yaml
          --input-root content
          --output-root data/synced/full-respiratory-rf
          --cache-root .cache/localmed/full-respiratory-rf
          --report data/build/full-respiratory-source-sync-report.json
      - name: Prepare respiratory source text
        run: >-
          uv run --project tools/ingest medbase prepare
          --registry content/full-respiratory-rf-registry.yaml
          --source-root data/synced/full-respiratory-rf
          --output data/intermediate/full-respiratory-rf
          --force
      - name: Lint respiratory source text
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/build
          uv run --project tools/ingest medbase lint \
            --input data/intermediate/full-respiratory-rf \
            2>&1 | tee data/build/full-respiratory-lint.log
      - name: Build respiratory SQLite module
        run: >-
          uv run --project tools/ingest medbase build
          --input data/intermediate/full-respiratory-rf
          --output data/build/rf-respiratory-full.db
          --report data/build/rf-respiratory-full-report.json
      - name: Upload respiratory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-respiratory-diagnostics
          path: |
            data/build/full-respiratory-source-sync-report.json
            data/build/full-respiratory-lint.log
            data/build/rf-respiratory-full-report.json
          if-no-files-found: warn
          retention-days: 7

  android-release-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BUILD_TOOLS_VERSION: 36.0.0
      LOCALMED_VERIFY_PHASE_TIMEOUT_MS: 900000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;${BUILD_TOOLS_VERSION}"
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project tools/ingest --all-groups --locked
      - name: Verify repository
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/build
          bun run verify 2>&1 | tee data/build/release-verify.log
      - name: Lint public pilot
        run: bun run content:lint:pilot
      - name: Build public pilot
        run: bun run content:build:pilot
      - name: Benchmark public pilot
        run: bun run benchmark:pilot
      - name: Validate query coverage
        run: bun run benchmark:queries:coverage
      - name: Validate query contracts
        run: bun run benchmark:queries:contracts
      - name: Rebuild regulatory pilot
        run: bun run content:rebuild:regulatory
      - name: Stage public pilot in application
        run: |
          cp data/build/rf-public-pilot.db apps/app/public/content/core-demo.db
          cp data/build/rf-public-pilot-report.json apps/app/public/content/core-demo-report.json
      - name: Build browser application
        run: bun run build:app
      - name: Synchronize Android shell
        run: bun run native:sync:android
      - name: Assemble debug APK smoke
        working-directory: apps/app/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload Android preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-android-diagnostics
          path: |
            data/build/release-verify.log
            data/build/*.json
            apps/app/android/app/build/reports/**
            apps/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
