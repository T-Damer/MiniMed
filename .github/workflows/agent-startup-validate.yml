name: Temporary startup qualification
on:
  push:
    branches: [agent/core-open-download-contract]
    paths: [.github/workflows/agent-startup-validate.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Apply exact reviewed source patch
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'scripts/.startup-patch.{i}') for i in range(1, 5)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest() == 'a952256b4e022d11db449335b67f2373a1fe656b954b8015364e37a6bc9c1d8c'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for p in parts: p.unlink()
          # Showing navigation must not eagerly construct the optional download runtime.
          p = pathlib.Path('apps/app/src/app/AppBottomNav.tsx')
          s = p.read_text().replace('  readonly view: Accessor<RootView>;', '  readonly view: Accessor<RootView>;\n  readonly downloadsReady?: Accessor<boolean>;')
          s = s.replace("<Show when={item.id === 'settings'}>", "<Show when={item.id === 'settings' && (props.downloadsReady?.() ?? true)}>")
          p.write_text(s)
          p = pathlib.Path('apps/app/src/app/App.tsx')
          s = p.read_text().replace('          <AppBottomNav\n', '          <AppBottomNav\n            downloadsReady={() => Boolean(session.ready())}\n')
          p.write_text(s)
          PY
      - name: Install pinned tools without account environment
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" CI=1 bun install --frozen-lockfile
      - name: Format changed TypeScript only
        run: |
          git add -N apps packages docs
          git diff --name-only -z -- '*.ts' '*.tsx' | xargs -0 env -i PATH="$PATH" HOME="$RUNNER_TEMP/qualification-home" CI=1 bunx biome check --write --max-diagnostics=100
          git diff --check
      - name: Commit only this branch repair
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = agent/core-open-download-contract
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs scripts/.startup-patch.*
          git commit -m 'fix: qualify native core before heavy open and reject unbuilt downloads'
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export changed public source for review
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          names = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD~1']).decode().splitlines()
          names += subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          with zipfile.ZipFile('/tmp/startup-reviewed-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(names)):
                  p = pathlib.Path(name)
                  if p.is_file() and name.startswith(('apps/', 'packages/', 'docs/')):
                      z.write(p, name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-reviewed-source
          path: /tmp/startup-reviewed-source.zip
          retention-days: 1
  javascript:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
      - name: Independent checks
        run: |
          mkdir -p /tmp/startup-checks
          result=0
          for task in 'bunx biome check --max-diagnostics=100 .' 'bun run typecheck' 'bun run test:unit' 'bun run native:source:check' 'bun run build'; do
            name=$(echo "$task" | tr ' /:' '---' | tr -cd 'a-zA-Z0-9._-')
            env -i PATH="$PATH" HOME="$HOME" CI=1 bash -c "$task" > "/tmp/startup-checks/$name.log" 2>&1 && code=0 || code=$?
            echo "$task: $code" | tee -a /tmp/startup-checks/status.txt
            tail -50 "/tmp/startup-checks/$name.log"
            if [ "$code" != 0 ]; then result=1; fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-check-logs
          path: /tmp/startup-checks
          retention-days: 3
  android-java:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install
        run: env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
      - name: Sync native project (no APK or device claims)
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run build:app
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run native:sync:android
      - name: Compile Java and run JVM unit tests without JNI packaging
        working-directory: apps/app/android
        run: env -i PATH="$PATH" HOME="$HOME" JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" CI=1 ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest -x externalNativeBuildDebug -x mergeDebugNativeLibs -x stripDebugDebugSymbols
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-android-junit
          path: apps/app/android/app/build/test-results/testDebugUnitTest
          retention-days: 3
