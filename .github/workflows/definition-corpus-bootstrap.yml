name: Full Russian definition corpus

on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-corpus-bootstrap.yml]

permissions:
  contents: write

concurrency:
  group: minimed-definition-corpus-bootstrap
  cancel-in-progress: false

jobs:
  corpus:
    if: github.repository == 'T-Damer/MiniMed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Download existing licensed prepared data, no raw full dictionary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ru-source"
          gh api repos/T-Damer/MiniMed/releases/tags/terminology-ru-2026.9.16 > "$RUNNER_TEMP/ru-source/release.json"
          gh release download terminology-ru-2026.9.16 --repo T-Damer/MiniMed --pattern senses.jsonl.gz --pattern source.json --dir "$RUNNER_TEMP/ru-source"
      - name: Verify receipts and build complete compact corpus
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" SOURCE_DIR="$RUNNER_TEMP/ru-source" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ['SOURCE_DIR'])
          release=json.loads((p/'release.json').read_text())
          assert release['id']==389769808
          for name in ('senses.jsonl.gz','source.json'):
              asset=next(a for a in release['assets'] if a['name']==name)
              data=(p/name).read_bytes()
              assert len(data)==asset['size'] and len(data)<128*1024*1024
              assert 'sha256:'+hashlib.sha256(data).hexdigest()==asset['digest']
          source=json.loads((p/'source.json').read_text())
          assert source['sha256']=='672973ab0647e1860a321ef9962cdf3d6e44e75572ebad0adde1fd87b676a755'
          PY
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/test-definition-corpus.py
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/build-definition-corpus.py \
            --senses "$RUNNER_TEMP/ru-source/senses.jsonl.gz" --source "$RUNNER_TEMP/ru-source/source.json" \
            --output content/definition-drafts/ruwiktionary-2026.9.16.json \
            --report docs/research/bulk-definition-size-2026-09-21.json --expected-senses 6939
      - name: Attach source-aware corpus to the existing optional definition lookup
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/definition-catalog.ts')
          s=p.read_text()
          def replace(old,new):
              global s
              assert s.count(old)==1, 'Source patch anchor missing or ambiguous: '+old[:80]
              s=s.replace(old,new)
          s="import { parseSourceDefinitionCatalog } from './source-definition-catalog';\n"+s
          replace('  readonly accessed: string;','  readonly accessed: string;\n  readonly license?: string;\n  readonly licenseUrl?: string;\n  readonly attribution?: string;\n  readonly sourceSha256?: string;\n  readonly preparedSha256?: string;\n  readonly sourceUrl?: string;\n  readonly changes?: string;')
          replace('  readonly locator: string;\n}', '  readonly locator: string;\n  readonly recordSha256?: string;\n}')
          replace('  readonly version: 1;', '  readonly version: 1 | 2;')
          replace("  readonly textKind: 'editorial-paraphrase';", "  readonly textKind: 'editorial-paraphrase' | 'source-gloss';")
          replace('  readonly term: DraftDefinition;', "  readonly term: DraftDefinition;\n  readonly textKind: 'editorial-paraphrase' | 'source-gloss';")
          replace('export function parseDefinitionCatalog(input: unknown): DefinitionCatalog {', "export function parseDefinitionCatalog(input: unknown): DefinitionCatalog {\n  if (object(input)['version'] === 2) return parseSourceDefinitionCatalog(input);")
          replace('export function createDefinitionLookup(input: unknown): DefinitionLookup {\n  const catalog = parseDefinitionCatalog(input);', '''export function createDefinitionLookup(input: unknown, ...additional: readonly unknown[]): DefinitionLookup {
            if (additional.length > 7) throw new Error('Too many glossary modules.');
            const inputs = [input, ...additional].map(parseDefinitionCatalog);
            const sourceMap = new Map<number, DefinitionSource>();
            const termKinds = new Map<string, DefinitionCatalog['textKind']>();
            const terms: DraftDefinition[] = [];
            for (const input of inputs) {
              for (const source of input.sources) {
                const previous = sourceMap.get(source.id);
                if (previous && JSON.stringify(previous) !== JSON.stringify(source)) throw new Error('Conflicting glossary source IDs.');
                sourceMap.set(source.id, source);
              }
              for (const term of input.terms) {
                if (termKinds.has(term.id)) throw new Error('Duplicate glossary term identity.');
                termKinds.set(term.id, input.textKind);
                terms.push(term);
              }
            }
            if (terms.length > 50000) throw new Error('Glossary collection exceeds the runtime budget.');
            const catalog = { sources: [...sourceMap.values()], terms };''')
          replace('          term,\n          matchKind:', "          term,\n          textKind: termKinds.get(term.id) ?? 'editorial-paraphrase',\n          matchKind:")
          p.write_text(s)
          p=Path('apps/app/src/composition/definition-draft-lookup.ts')
          s=p.read_text()
          old="    pending = import('../../../../content/definition-drafts/catalog.json')\n      .then((asset) => createDefinitionLookup(asset.default))"
          assert old in s
          s=s.replace(old,"    pending = Promise.all([\n      import('../../../../content/definition-drafts/catalog.json'),\n      import('../../../../content/definition-drafts/ruwiktionary-2026.9.16.json'),\n    ])\n      .then(([editorial, source]) => createDefinitionLookup(editorial.default, source.default))")
          p.write_text(s)
          p=Path('apps/app/src/features/search/DefinitionDraftMatches.tsx')
          s=p.read_text()
          old='          Редакторские пересказы, не оригинальные цитаты. Не проверено врачом; не диагностические\n          рекомендации. Названия, части определений и пункты критериев ищутся локально. Полные\n          источники не скачиваются.'
          assert old in s
          s=s.replace(old,'          Словарные тексты и отдельные редакторские черновики. Требуют проверки; не диагностические\n          рекомендации. Поиск по названиям, определениям и пунктам критериев работает локально.\n          Полные книги и исходные дампы не скачиваются.')
          s=s.replace('<span class="definition-drafts__badge">Требует проверки</span>', '<span class="definition-drafts__badge">{hit.textKind === \'source-gloss\' ? \'Словарный текст · требует проверки\' : \'Редакторский черновик · требует проверки\'}</span>')
          old='                  <a\n                    class="definition-drafts__source"'
          assert old in s
          s=s.replace(old,'                  <>\n                  <a\n                    class="definition-drafts__source"',1)
          old='                    {citation.source.title} — {citation.locator} (внешний сайт)\n                  </a>'
          assert old in s
          s=s.replace(old,'''                    {citation.source.title} — {citation.locator} (внешний сайт)
                            </a>
                            <Show when={citation.source.licenseUrl}>
                              <p class="definition-drafts__note">{citation.source.attribution}. Выборка и нормализация; без перевода и медицинской переработки.</p>
                              <a class="definition-drafts__source" href={citation.source.licenseUrl} target="_blank" rel="noopener noreferrer">{citation.source.license}</a>
                              <a class="definition-drafts__source" href={`${citation.url}?action=history`} target="_blank" rel="noopener noreferrer">История страницы и авторы</a>
                            </Show>
                            </>''')
          p.write_text(s)
          PY
      - name: Install locked tools and run existing definition regression tests
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write packages/core/src/definition-catalog.ts packages/core/src/source-definition-catalog.ts apps/app/src/composition/definition-draft-lookup.ts apps/app/src/features/search/DefinitionDraftMatches.tsx tools/benchmarks/src/run-source-definition-quality.ts
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run packages/core/src/definition-catalog.test.ts
      - name: Measure full source-name coverage and untuned reverse lookup
        run: env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/src/run-source-definition-quality.ts
      - name: Record measured scope and preserve source attribution
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json
          from pathlib import Path
          size=json.loads(Path('docs/research/bulk-definition-size-2026-09-21.json').read_text())
          quality=json.loads(Path('docs/research/bulk-definition-quality-2026-09-21.json').read_text())
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          heading='## Full Russian definition corpus — development preview (2026-09-21)'
          assert heading not in s
          section=f'''{heading}

          The optional definition preview now loads the complete released Russian Wiktionary medical
          selection: **{size['senses']} senses / {size['distinctNames']} original names /
          {size['suppliedRussianGlosses']} supplied Russian glosses**, plus the 36 editorial starter
          cards. These are source records, not a claim of that many disjoint canonical medical concepts.
          Original `ruwikt.*` identities, source language, archive and record checksums, source line/sense
          locators, attribution and CC-BY-SA-4.0 are retained. Source text is not labelled an editorial
          paraphrase and neither source reputation nor corpus size promotes it to clinician-reviewed.

          `scripts/build-definition-corpus.py` reuses the existing licensed prepared release; it does
          not download the full multi-gigabyte dictionary onto a device. One source registry row with
          numeric references replaces repeated source descriptions. Compact JSON: {size['catalogBytes']}
          bytes; deterministic gzip comparison: {size['gzipBytes']} bytes. These figures exclude JS,
          in-memory postings, SQLite and device overhead. The 16 MiB cap applies to an optional source
          module, not a forced increase of the lightweight core.

          Actual CI measurements: source-name Top-1 {quality['sourceNameTop1']}/{quality['normalizedSourceNames']};
          reverse probes present in the combined corpus {quality['reverse']['corpusPresent']}/{quality['reverse']['total']},
          Top-5 {quality['reverse']['top5']} of those present. Keep all misses in the JSON report; no
          reverse-probe sentences were inserted into aliases. These are public authored development
          probes, not independent clinician qualification. Original starter tests also ran separately.

          The interface remains opt-in DEV-only. Browser rendering, production-bundle exclusion,
          physical-device memory and a released optional-module delivery are not established by this
          data/engine run. Existing APK and published SQLite packs are unchanged. Etymology remains
          separately planned. See `bulk-definition-size-2026-09-21.json` and
          `bulk-definition-quality-2026-09-21.json` in `docs/research` for actual evidence.

          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          p.write_text(s.replace('# Current state\n', '# Current state\n\n'+section,1))
          Path('content/definition-drafts/ruwiktionary-ATTRIBUTION.txt').write_text('Russian Wiktionary contributors; extraction by Wiktextract/Kaikki.org.\nAdapted dictionary data: CC-BY-SA-4.0, https://creativecommons.org/licenses/by-sa/4.0/\nSource terms: https://kaikki.org/ruwiktionary/ and Wikimedia Terms of Use section 7.\nChanges: selection and whitespace normalization inherited from the prepared release; compact glossary projection and joining multiple glosses. No medical rewriting or translation.\nEvery record resolves to its original page and author history, and preserves original source-line/sense and record/archive checksums.\nThis is a community lexical reference, not clinical guidance or a reviewed MeSH translation.\n')
          PY
      - name: Commit only the scoped corpus and integration changes to the same PR branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/definition-drafts/ruwiktionary-2026.9.16.json content/definition-drafts/ruwiktionary-ATTRIBUTION.txt docs/research/bulk-definition-size-2026-09-21.json docs/research/bulk-definition-quality-2026-09-21.json docs/CURRENT_STATE.md packages/core/src/definition-catalog.ts packages/core/src/source-definition-catalog.ts apps/app/src/composition/definition-draft-lookup.ts apps/app/src/features/search/DefinitionDraftMatches.tsx tools/benchmarks/src/run-source-definition-quality.ts
          git commit -m 'feat(terminology): connect all 6939 Russian source senses with measured coverage [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free summary
        if: always()
        run: echo 'No Actions artifacts, release assets, model downloads or APK builds are produced by this workflow.' >> "$GITHUB_STEP_SUMMARY"
