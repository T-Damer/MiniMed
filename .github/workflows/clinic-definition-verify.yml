name: Verify clinic definition completions
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths:
      - .github/workflows/clinic-definition-verify.yml
      - tools/ingest/src/localmed_ingest/definition_gap_inventory.py
      - tools/ingest/tests/test_definition_gap_inventory.py
      - tools/ingest/src/localmed_ingest/definition_name_completions.py
      - tools/ingest/src/localmed_ingest/clinic_definition_completions.py
      - tools/ingest/src/localmed_ingest/definition_reference_pack.py
      - tools/ingest/src/localmed_ingest/definition_reference_compact_pack.py
      - tools/ingest/tests/test_definition_name_completions.py
      - scripts/prepare-definition-reference.py
      - content/definition-drafts/**
permissions:
  contents: read
concurrency:
  group: minimed-clinic-definition-completions
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Strict checks on committed code without runtime patches
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files=(
            tools/ingest/src/localmed_ingest/definition_gap_inventory.py
            tools/ingest/tests/test_definition_gap_inventory.py
            tools/ingest/src/localmed_ingest/definition_name_completions.py
            tools/ingest/src/localmed_ingest/clinic_definition_completions.py
            tools/ingest/src/localmed_ingest/definition_reference_pack.py
            tools/ingest/src/localmed_ingest/definition_reference_compact_pack.py
            tools/ingest/tests/test_definition_name_completions.py
            scripts/prepare-definition-reference.py
          )
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format --check "${files[@]}"
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check "${files[@]}"
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright "${files[@]}"
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_definition_gap_inventory.py \
            tools/ingest/tests/test_definition_name_completions.py \
            tools/ingest/tests/test_definition_name_inventory.py \
            tools/ingest/tests/test_definition_reference_scope.py \
            tools/ingest/tests/test_definition_reference_pack.py \
            --junitxml=data/build/definition-completion-regressions.xml
      - name: Rebuild dictionary and derive the actual research queue offline
        env:
          CHECKED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" CHECKED_SHA="$CHECKED_SHA" RUN_ID="$RUN_ID" uv run --project tools/ingest python - <<'PY'
          import hashlib,json,os,runpy,sqlite3,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          def guard(event,args):
              if event in {'socket.connect','socket.getaddrinfo'}:
                  raise RuntimeError('Committed dictionary verification must stay offline')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.23-clinic-gaps','--built-at','2026-09-23']
          runpy.run_path(sys.argv[0],run_name='__main__')
          from localmed_ingest.clinic_definition_completions import load_projection
          from localmed_ingest.definition_gap_inventory import build_gap_inventory
          root=Path.cwd()
          projection=load_projection(root)
          inventory=build_gap_inventory(projection)
          output=Path('data/build/definition-gap-inventory.json')
          output.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          dbpath=Path('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-clinic-gaps.db')
          build=json.loads(Path(str(dbpath)+'.report.json').read_text())
          assert build['logicalRoundTripEqual'] is True
          assert build['entries']==inventory['sourceRecords']
          assert sum(inventory['byStatusRecords'].values())==inventory['pendingRecords']
          with sqlite3.connect(f'{dbpath.resolve().as_uri()}?mode=ro',uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert not db.execute('PRAGMA foreign_key_check').fetchall()
              actual={row[0]:json.loads(row[1]) for row in db.execute('SELECT id,metadata_json FROM knowledge_entities')}
              assert set(actual)==set(projection.entries)
              for identifier,entry in projection.entries.items():
                  assert actual[identifier]['coverage']==entry.coverage
              pending={identifier for identifier,metadata in actual.items() if metadata['coverage']=='needs-definition'}
              queued=[item['id'] for row in inventory['rows'] for item in row['pendingIdentities']]
              assert len(queued)==len(set(queued))==len(pending)==inventory['pendingRecords']
              assert set(queued)==pending
              for table in ('knowledge_facts','knowledge_relations'):
                  assert db.execute(f'SELECT count(*) FROM {table}').fetchone()==(0,)
          suites=ET.parse('data/build/definition-completion-regressions.xml').getroot()
          tests={key:sum(int(suite.get(key,'0')) for suite in suites.findall('testsuite')) for key in ('tests','failures','errors','skipped')}
          assert tests['failures']==tests['errors']==tests['skipped']==0
          summary={key:value for key,value in inventory.items() if key!='rows'}
          summary.update({'checkedCommit':os.environ['CHECKED_SHA'],'runId':os.environ['RUN_ID'],'tests':tests,'completedNames':build['completedNames'],'inventorySha256':hashlib.sha256(output.read_bytes()).hexdigest(),'installedBytes':dbpath.stat().st_size,'downloadBytes':Path(str(dbpath)+'.gz').stat().st_size,'networkAllowed':False,'sqliteInventoryIdentityMatch':True})
          Path('data/build/definition-gap-verification.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Verify checks did not modify tracked code or content
        run: git diff --exit-code
      - name: No uploaded artifacts
        if: always()
        run: echo 'Read-only verification; no source rewrites, live source fetches, uploaded artifacts, caches, database binaries, APKs or models.' >> "$GITHUB_STEP_SUMMARY"
