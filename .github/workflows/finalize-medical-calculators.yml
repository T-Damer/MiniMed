name: Finalize medical calculators branch
# Re-run after opening the draft pull request.

on:
  push:
    branches: [feature/medical-calculators]
    paths:
      - .github/workflows/finalize-medical-calculators.yml

permissions:
  contents: write

concurrency:
  group: finalize-medical-calculators
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/medical-calculators
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3

      - name: Wire calculator UI into the application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          view = Path('apps/app/src/features/calculators/CalculatorsView.tsx')
          text = view.read_text(encoding='utf-8')
          text = text.replace('  type StoredCalculationResult as NeverStoredCalculationResult,\n', '')
          text = text.replace('\nvoid (undefined as NeverStoredCalculationResult | undefined);\n', '\n')
          view.write_text(text, encoding='utf-8')

          glyph = Path('apps/app/src/components/AppGlyph.tsx')
          text = glyph.read_text(encoding='utf-8')
          text = text.replace("  | 'brain'\n", "  | 'brain'\n  | 'calculator'\n")
          marker = "      {props.name === 'system' && (\n"
          calculator = """      {props.name === 'calculator' && (\n        <>\n          <rect x=\"5\" y=\"3.5\" width=\"14\" height=\"17\" rx=\"2\" />\n          <path d=\"M8 7.5h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2\" />\n        </>\n      )}\n"""
          if calculator not in text:
              text = text.replace(marker, calculator + marker)
          glyph.write_text(text, encoding='utf-8')

          main = Path('apps/app/src/main.tsx')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              "import { AssessmentHost } from '@/features/assessments/AssessmentHost';\n",
              "import { AssessmentHost } from '@/features/assessments/AssessmentHost';\nimport { CalculatorHost } from '@/features/calculators/CalculatorHost';\n",
          )
          text = text.replace(
              "import '@/styles/assessments.css';\n",
              "import '@/styles/assessments.css';\nimport '@/styles/calculators.css';\n",
          )
          text = text.replace(
              "      <AssessmentHost />\n",
              "      <AssessmentHost />\n      <CalculatorHost />\n",
          )
          main.write_text(text, encoding='utf-8')

          assessment = Path('apps/app/src/features/assessments/AssessmentHost.tsx')
          assessment.write_text("""import { createEffect, createSignal, type JSX, onCleanup, onMount, Show } from 'solid-js';

import { AppGlyph } from '@/components/AppGlyph';
import { AssessmentsView } from '@/features/assessments/AssessmentsView';

function currentRoute(): string {
  return window.location.hash.replace(/^#\\/?/u, '');
}

export function AssessmentHost(): JSX.Element {
  const [route, setRoute] = createSignal(currentRoute());
  const open = () => route().startsWith('assessments');
  const calculatorOpen = () => route().startsWith('calculators');

  const refresh = (): void => setRoute(currentRoute());
  onMount(() => window.addEventListener('hashchange', refresh));
  onCleanup(() => window.removeEventListener('hashchange', refresh));

  createEffect(() => {
    document.documentElement.classList.toggle('assessment-route-open', open());
  });
  onCleanup(() => document.documentElement.classList.remove('assessment-route-open'));

  return (
    <Show
      when={open()}
      fallback={
        <Show when={!calculatorOpen()}>
          <button
            class="assessment-launch-button"
            type="button"
            aria-label="Открыть тесты и опросники"
            onClick={() => {
              window.location.hash = '#/assessments';
            }}
          >
            <AppGlyph name="brain" />
            <span>Тесты</span>
          </button>
        </Show>
      }
    >
      <div class="assessment-overlay-shell">
        <button
          class="assessment-overlay-close"
          type="button"
          aria-label="Закрыть тесты"
          onClick={() => {
            window.location.hash = '#/search';
          }}
        >
          <AppGlyph name="close" />
        </button>
        <AssessmentsView />
      </div>
    </Show>
  );
}
""", encoding='utf-8')

          native = Path('apps/app/src/app/native-back.ts')
          text = native.read_text(encoding='utf-8')
          text = text.replace(
              "      route.startsWith('assessments/')) &&\n",
              "      route.startsWith('assessments/') ||\n      route.startsWith('calculators/')) &&\n",
          )
          text = text.replace(
              "  if (route === 'assessments') return 'search';\n",
              "  if (route === 'assessments' || route === 'calculators') return 'search';\n",
          )
          native.write_text(text, encoding='utf-8')
          PY

      - name: Install, format, and verify
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx biome check --write \
            apps/app/src/main.tsx \
            apps/app/src/app/native-back.ts \
            apps/app/src/components/AppGlyph.tsx \
            apps/app/src/features/assessments/AssessmentHost.tsx \
            apps/app/src/features/calculators \
            apps/app/src/state/calculation-history.ts \
            apps/app/src/styles/calculators.css
          bunx biome check --max-diagnostics=500 .
          bun run typecheck
          bun run test:unit
          bun run build:app
          bun run secrets:check

      - name: Commit finalized integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-medical-calculators.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(app): integrate sourced medical calculators'
            git push origin HEAD:feature/medical-calculators
          fi
