name: Isolated Laya source probe
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/laya-source-smoke.yml]
permissions:
  contents: write
concurrency:
  group: minimed-laya-source-smoke
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Prepare a separate pinned CPU research environment
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv venv --python 3.12 "$RUNNER_TEMP/laya-env"
          env -i PATH="$PATH" HOME="$HOME" uv pip install --python "$RUNNER_TEMP/laya-env/bin/python" torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          env -i PATH="$PATH" HOME="$HOME" uv pip install --python "$RUNNER_TEMP/laya-env/bin/python" transformers==4.57.1 huggingface-hub==0.35.3 safetensors==0.6.2 numpy==2.2.6
          env -i PATH="$PATH" HOME="$HOME" uv pip install --no-deps --python "$RUNNER_TEMP/laya-env/bin/python" 'git+https://github.com/NandhaKishorM/laya.git@c7527708f9f5220c669d8aa385077cd28d04708a'
      - name: Download only multilingual assets then prohibit network during inference
        id: model
        continue-on-error: true
        run: |
          env -i PATH="$PATH" HOME="$HOME" USE_TF=0 USE_FLAX=0 TOKENIZERS_PARALLELISM=false HF_HUB_DISABLE_TELEMETRY=1 HF_HUB_DISABLE_IMPLICIT_TOKEN=1 HF_HUB_DISABLE_XET=1 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            "$RUNNER_TEMP/laya-env/bin/python" tools/benchmarks/laya_source_smoke.py \
            --model-dir "$RUNNER_TEMP/laya-model" --catalog content/definition-drafts/catalog.json \
            --report docs/research/laya-source-smoke-2026-09-23.json
      - name: Persist measured results, including an explicit failed experiment
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test -f docs/research/laya-source-smoke-2026-09-23.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/research/laya-source-smoke-2026-09-23.json');r=json.loads(p.read_text())
          r['checkedCommit']='${{ github.sha }}';r['runId']='${{ github.run_id }}'
          p.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          print('Actual model experiment status:',r['status'])
          PY
          git add docs/research/laya-source-smoke-2026-09-23.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(research): retain actual Laya source-probe outcome [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then git switch --detach "$remote"; git cherry-pick "$own"; fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Report boundary
        if: always()
        run: echo 'No private inputs, app changes, weights, model cache, Actions artifacts, APK or release uploaded. Experiment status is in its JSON, not inferred from workflow success.' >> "$GITHUB_STEP_SUMMARY"
