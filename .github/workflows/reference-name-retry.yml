name: Verify restored name edition
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/reference-name-retry.yml]
permissions:
  contents: write
concurrency:
  group: minimed-reference-name-restoration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Execute the existing full verification with actual reference suites
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess,textwrap
          from pathlib import Path
          source=Path('.github/workflows/reference-name-restoration.yml').read_text()
          blocks=re.split(r'(?m)^      - name: ',source)[1:]
          for block in blocks:
              name=block.splitlines()[0]
              if name=='No artifact uploads': continue
              marker='        run: |\n'
              if marker not in block: raise ValueError('Unknown shell block')
              command=textwrap.dedent(block.split(marker,1)[1])
              command=command.replace('$'+'{{ github.sha }}',os.environ['HEAD_SHA'])
              command=command.replace('$'+'{{ github.run_id }}',os.environ['RUN_ID'])
              if '$'+'{{' in command: raise ValueError('Unresolved workflow expression')
              if name=='Locked code checks and source-contract tests':
                  old='bunx vitest run packages/storage-sqlite/src/definition-reference-reader.test.ts'
                  assert command.count(old)==1
                  command=command.replace(old,'bunx vitest run packages/storage-sqlite/tests/definition-reference-layout.test.ts packages/storage-sqlite/tests/definition-reference-metadata.test.ts')
              env={key:os.environ[key] for key in ('PATH','HOME','RUNNER_TEMP')}
              if name=='Persist only verified content and scoped integration files':
                  env['PUSH_TOKEN']=os.environ['PUSH_TOKEN']
              print('Running: '+name,flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',command],env=env,check=True)
              if name=='Connect explicit name inventories to existing projection and reader':
                  p=Path('scripts/prepare-definition-reference.py');s=p.read_text()
                  old='    discovered_names = int(report.get("discoveredNames", 0))'
                  assert s.count(old)==1
                  s=s.replace(old,'    raw_names = report.get("discoveredNames", 0)\n    discovered_names = 0 if raw_names == 0 else number(raw_names)')
                  old='module["description"] += f" Названий для дополнения: {discovered_names:,}.".replace(",", " ")'
                  assert s.count(old)==1
                  s=s.replace(old,'module["description"] = str(module["description"]) + f" Названий для дополнения: {discovered_names:,}.".replace(",", " ")')
                  p.write_text(s)
          PY
      - name: No uploaded artifacts
        if: always()
        run: echo 'No private library, model weights, binary database, APK or Actions artifact uploaded.' >> "$GITHUB_STEP_SUMMARY"
