name: Temporary Russian dictionary input
on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-russian-input.yml]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch public Russian Wiktionary extraction, no processing or credentials
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.parse, urllib.request
          root = pathlib.Path('russian-source'); root.mkdir()
          url = 'https://kaikki.org/dictionary/downloads/ru/ru-extract.jsonl.gz'
          request = urllib.request.Request(url, headers={'User-Agent': 'MiniMedTerminology/1.0 (https://github.com/T-Damer/MiniMed)', 'Accept-Encoding': 'identity'})
          digest = hashlib.sha256(); size = 0
          with urllib.request.urlopen(request, timeout=90) as response, (root/'ru-extract.jsonl.gz').open('wb') as target:
              assert urllib.parse.urlparse(response.geturl()).hostname == 'kaikki.org'
              while block := response.read(1048576):
                  size += len(block)
                  if size > 440000000: raise ValueError('Source exceeded explicit download limit')
                  digest.update(block); target.write(block)
          with (root/'ru-extract.jsonl.gz').open('rb') as source:
              assert source.read(2) == b'\x1f\x8b'
          manifest = {'schemaVersion':1, 'url':url, 'sha256':digest.hexdigest(), 'bytes':size, 'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'license':'CC-BY-SA-4.0', 'sourceProject':'ru.wiktionary.org', 'attribution':'Russian Wiktionary contributors; extraction by Wiktextract/Kaikki.org', 'termsUrl':'https://kaikki.org/ruwiktionary/'}
          (root/'source.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: russian-dictionary-raw-input
          path: russian-source
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
