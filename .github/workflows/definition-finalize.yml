name: Finalize full definition extraction
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-finalize.yml]
permissions:
  contents: write
concurrency:
  group: minimed-mass-definitions
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'T-Damer/MiniMed'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Reuse exact verification steps from the preceding one-time workflow
        run: |
          cat > "$RUNNER_TEMP/definition-step.py" <<'PY'
          import os, re, subprocess, sys, textwrap
          from pathlib import Path
          source=Path('.github/workflows/definition-mass-extraction-followup.yml').read_text()
          name=sys.argv[1]
          marker='      - name: '+name+'\n'
          if source.count(marker)!=1: raise ValueError('Unknown/ambiguous verification step')
          block=source.split(marker,1)[1].split('\n      - name:',1)[0]
          if '        run: |\n' not in block: raise ValueError('Expected shell step')
          token='$'+'{{ github.sha }}'
          command=textwrap.dedent(block.split('        run: |\n',1)[1]).replace(token,os.environ['HEAD_SHA'])
          if '$'+'{{' in command: raise ValueError('Unresolved workflow expression')
          if name=='Audit every new source identity in combined lookup':
              command=command.replace("const clinical=load('content/definition-drafts/clinical-source-excerpts-2026.09.21.json');", "const manifest=load('content/definition-drafts/clinical-source-excerpts-2026.09.21.json') as {parts:{path:string}[]};\nconst clinical=manifest.parts.map(p=>load('content/definition-drafts/'+p.path));")
              command=command.replace('...parseDefinitionCatalog(clinical).terms', '...clinical.flatMap(p=>parseDefinitionCatalog(p).terms)').replace('prepared,clinical);','prepared,...clinical);')
          if name=='Record actual scope':
              start=command.index('          The owner-supplied Semenov/Bersenev') if '          The owner-supplied Semenov/Bersenev' in command else command.index('The owner-supplied Semenov/Bersenev')
              end=command.index('The actual Solid definition component',start)
              command=command[:start]+'Owner PDF extraction is separate; this workflow does not measure or upload that source.\n\n'+command[end:]
          subprocess.run(['bash','-e','-o','pipefail','-c',command],check=True)
          PY
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Prepare integration from the reviewed previous bootstrap and tighten boundaries'
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/definition-catalog.ts');s=p.read_text()
          assert 'additional.length > 7' in s
          p.write_text(s.replace('additional.length > 7', 'additional.length > 31'))
          p=Path('apps/app/src/composition/definition-draft-lookup.ts')
          p.write_text('''import { createDefinitionLookup, type DefinitionLookup } from '@localmed/core';
          let assets: Promise<readonly unknown[]> | undefined;
          let pending: Promise<DefinitionLookup> | undefined;
          /** Explicit DEV preview; an owner overlay remains in page memory, never uploaded. */
          export function loadDefinitionDraftLookup(overlay?: unknown): Promise<DefinitionLookup> {
            if (!import.meta.env.DEV) return Promise.reject(new Error('Definition drafts are not a published edition.'));
            assets ??= Promise.all([
              import('../../../../content/definition-drafts/catalog.json'),
              import('../../../../content/definition-drafts/ruwiktionary-2026.9.16.json'),
              import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),
              import('../../../../content/definition-drafts/clinical-source-excerpt-assets'),
            ]).then(async ([editorial, russian, prepared, clinical]) => [editorial.default, russian.default, prepared.default, ...await clinical.loadClinicalSourceExcerptAssets()])
              .catch((error: unknown) => { assets = undefined; throw error; });
            const loaded = assets;
            const build = () => loaded.then(([first, ...rest]) => overlay === undefined
              ? createDefinitionLookup(first, ...rest) : createDefinitionLookup(first, ...rest, overlay));
            if (overlay !== undefined) return build();
            pending ??= build().catch((error: unknown) => { pending = undefined; throw error; });
            return pending;
          }
          ''')
          PY
      - name: Extract bundled source summaries and tool descriptions
        run: env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Verify the local exporter and extract bundled summaries and all tool schemas'
      - name: Extract all pinned clinical detail packs into bounded shards
        run: env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Extract every full clinical detail pack from the pinned existing dataset'
      - name: Run locked definition suites and core typecheck
        run: env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Locked formatting, definition tests and real core typecheck'
      - name: Audit source-name retrieval across all shards
        run: env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Audit every new source identity in combined lookup'
      - name: Browser-check real definition component and owner-only import
        run: env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Browser qualification of the actual definition component without the whole app'
      - name: Record actual measurements and limits
        run: env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' python3 "$RUNNER_TEMP/definition-step.py" 'Record actual scope'
      - name: Commit scoped artifacts and regular fast-forward push to existing PR
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add content/definition-drafts/clinical-source-excerpts-2026.09.21.part-*.json content/definition-drafts/clinical-source-excerpt-assets.ts
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" HEAD_SHA='${{ github.sha }}' PUSH_TOKEN="$PUSH_TOKEN" python3 "$RUNNER_TEMP/definition-step.py" 'Push only scoped successful results to the same PR'
      - name: Storage-free summary
        if: always()
        run: echo 'No Actions artifacts, source PDFs, model downloads, release assets or APKs are uploaded.' >> "$GITHUB_STEP_SUMMARY"
