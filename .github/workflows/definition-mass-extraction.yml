name: Mass definition extraction
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-mass-extraction.yml]
permissions:
  contents: write
concurrency:
  group: minimed-mass-definitions
  cancel-in-progress: false
jobs:
  extract:
    if: github.repository == 'T-Damer/MiniMed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Extract entire prepared repository corpus and every tool module
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/test_prepared_definition_extraction.py
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TARGET="$RUNNER_TEMP/source-core.db" python3 - <<'PY'
          import gzip, os
          from pathlib import Path
          total=0
          with gzip.open('content/bundled/core.db.gz','rb') as source, Path(os.environ['TARGET']).open('wb') as target:
              while block:=source.read(1024*1024):
                  total+=len(block)
                  if total>2*1024**3: raise ValueError('Decoded corpus budget exceeded')
                  target.write(block)
          PY
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/extract_prepared_definitions.py \
            --sqlite "$RUNNER_TEMP/source-core.db" --tools content/tool-modules --repo-ref '${{ github.sha }}' \
            --output content/definition-drafts/prepared-source-excerpts-2026.09.21.json \
            --report docs/research/prepared-definition-extraction-2026-09-21.json \
            --mentions content/definition-drafts/instrument-mention-candidates-2026.09.21.json
      - name: Connect the validated excerpt contract and owner-only import
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/definition-catalog.ts');s=p.read_text()
          def patch(old,new):
              global s
              if s.count(old)!=1: raise ValueError('Missing or ambiguous patch anchor: '+old[:70])
              s=s.replace(old,new)
          patch("import { parseSourceDefinitionCatalog } from './source-definition-catalog';", "import { parseSourceDefinitionCatalog } from './source-definition-catalog';\nimport { parseExtractedDefinitionCatalog } from './extracted-definition-catalog';")
          patch('  readonly changes?: string;', '  readonly changes?: string;\n  readonly sourceType?: string;\n  readonly rightsStatus?: string;\n  readonly fileName?: string;')
          patch("  readonly kind: 'term' | 'symptom' | 'syndrome' | 'criterion_set';", "  readonly kind: 'term' | 'symptom' | 'syndrome' | 'criterion_set' | 'scale' | 'classification' | 'law' | 'tool' | 'history_note';")
          patch('  readonly note: string;', '  readonly note: string;\n  readonly coverage?: string;\n  readonly etymology?: readonly string[];')
          patch('  readonly version: 1 | 2;', '  readonly version: 1 | 2 | 3;')
          s=s.replace("'editorial-paraphrase' | 'source-gloss'", "'editorial-paraphrase' | 'source-gloss' | 'source-excerpt'")
          patch('export function definitionSourceUrl(source: DefinitionSource, path: string): string {', "export function definitionSourceUrl(source: DefinitionSource, path: string): string {\n  if (source.sourceType === 'owner-pdf' && !source.baseUrl && !path) return '';")
          patch("  if (object(input)['version'] === 2) return parseSourceDefinitionCatalog(input);", "  if (object(input)['version'] === 3) return parseExtractedDefinitionCatalog(input);\n  if (object(input)['version'] === 2) return parseSourceDefinitionCatalog(input);")
          p.write_text(s)
          p=Path('apps/app/src/composition/definition-draft-lookup.ts')
          p.write_text('''import { createDefinitionLookup, type DefinitionLookup } from '@localmed/core';
          let assets: Promise<readonly unknown[]> | undefined;
          let pending: Promise<DefinitionLookup> | undefined;
          /** Owner overlays are held in page memory only; no server upload or source-site requests. */
          export function loadDefinitionDraftLookup(overlay?: unknown): Promise<DefinitionLookup> {
            if (!import.meta.env.DEV) return Promise.reject(new Error('Definition drafts are not a published edition.'));
            assets ??= Promise.all([
              import('../../../../content/definition-drafts/catalog.json'),
              import('../../../../content/definition-drafts/ruwiktionary-2026.9.16.json'),
              import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),
            ]).then((entries) => entries.map((entry) => entry.default)).catch((error: unknown) => { assets = undefined; throw error; });
            const loaded = assets;
            const build = () => loaded.then(([editorial, russian, excerpts]) => overlay === undefined
              ? createDefinitionLookup(editorial, russian, excerpts)
              : createDefinitionLookup(editorial, russian, excerpts, overlay));
            if (overlay !== undefined) return build();
            pending ??= build().catch((error: unknown) => { pending = undefined; throw error; });
            return pending;
          }
          ''')
          p=Path('apps/app/src/features/search/DefinitionDraftMatches.tsx');s=p.read_text()
          patch("import type { DefinitionLookup } from '@localmed/core';", "import { parseDefinitionCatalog, type DefinitionLookup } from '@localmed/core';")
          patch('  const [attempt, setAttempt] = createSignal(1);', '''  const [attempt, setAttempt] = createSignal(1);
            const [overlay, setOverlay] = createSignal<unknown>();
            const [overlayMessage, setOverlayMessage] = createSignal('');
            let importGeneration = 0;
            async function importOverlay(file: File | undefined): Promise<void> {
              if (!file) return;
              const generation = ++importGeneration;
              try {
                if (file.size > 16 * 1024 * 1024) throw new Error('Oversized overlay');
                const value: unknown = JSON.parse(await file.text());
                const validated = parseDefinitionCatalog(value);
                if (generation !== importGeneration) return;
                setOverlay(() => value);
                setOverlayMessage(`Локальный пакет: ${validated.terms.length}. Данные только в памяти страницы; на сервер не отправляются.`);
                setAttempt((number) => number + 1);
              } catch {
                if (generation === importGeneration) setOverlayMessage('Не удалось прочитать пакет определений. Предыдущий поиск сохранён.');
              }
            }''')
          patch('lookup: await loadDefinitionDraftLookup()', 'lookup: await loadDefinitionDraftLookup(overlay())')
          patch('      <Show when={enabled()}>', '''      <Show when={enabled()}>
                  <label class="definition-drafts__import-label">
                    Добавить локальный пакет определений (JSON)
                    <input class="definition-drafts__import" type="file" accept=".json,application/json"
                      onChange={(event) => void importOverlay(event.currentTarget.files?.[0])} />
                  </label>
                  <Show when={overlayMessage()}><p class="definition-drafts__status" role="status">{overlayMessage()}</p></Show>''')
          patch("                  : 'Редакторский черновик · требует проверки'", "                  : hit.textKind === 'source-excerpt' ? 'Фрагмент источника · требует проверки' : 'Редакторский черновик · требует проверки'")
          patch('              <p class="definition-drafts__definition">{hit.term.definition}</p>', '''              <Show when={hit.term.coverage === 'mention-only'}>
                          <p class="definition-drafts__note">Только упоминание: полное описание или инструмент в этом фрагменте отсутствует.</p>
                        </Show>
                        <p class="definition-drafts__definition">{hit.term.definition}</p>
                        <Show when={hit.term.etymology?.length}>
                          <p class="definition-drafts__note">Происхождение: формулировка источника, требует проверки.</p>
                          <For each={hit.term.etymology}>{(origin) => <p class="definition-drafts__note">{origin}</p>}</For>
                        </Show>''')
          patch('                    <a\n                      class="definition-drafts__source"', '''                    <Show when={citation.url} fallback={<p class="definition-drafts__source">{citation.source.title} — {citation.locator} (локальный источник)</p>}>
                              <a
                                class="definition-drafts__source"''')
          patch('                      {citation.source.title} — {citation.locator} (внешний сайт)\n                    </a>', '                      {citation.source.title} — {citation.locator} (внешний сайт)\n                    </a>\n                    </Show>')
          patch('В этом небольшом словаре подходящих определений нет.', 'В подключённых пакетах подходящих определений не найдено.')
          p.write_text(s)
          p=Path('apps/app/src/features/search/definition-draft-matches.css')
          p.write_text(p.read_text()+'''\n.definition-drafts__definition { white-space: pre-wrap; overflow-wrap: anywhere; }
          .definition-drafts__import-label { display: grid; gap: 0.5rem; }
          .definition-drafts__import { max-width: 100%; }
          ''')
          PY
      - name: Locked formatting and source contract tests
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write packages/core/src/definition-catalog.ts packages/core/src/extracted-definition-catalog.ts packages/core/src/extracted-definition-catalog.test.ts apps/app/src/composition/definition-draft-lookup.ts apps/app/src/features/search/DefinitionDraftMatches.tsx apps/app/src/features/search/definition-draft-matches.css
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run packages/core/src/definition-catalog.test.ts packages/core/src/extracted-definition-catalog.test.ts
      - name: Typecheck the actual core package
        run: env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p packages/core/tsconfig.json
      - name: Audit every newly extracted name against combined lookup
        run: |
          cat > tools/benchmarks/src/.measure-excerpts.ts <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createDefinitionLookup, parseDefinitionCatalog } from '../../../packages/core/src/definition-catalog';
          const load=(p:string):unknown=>JSON.parse(readFileSync(p,'utf8'));
          const raw=load('content/definition-drafts/prepared-source-excerpts-2026.09.21.json');
          const parsed=parseDefinitionCatalog(raw);
          const started=performance.now();
          const lookup=createDefinitionLookup(load('content/definition-drafts/catalog.json'),load('content/definition-drafts/ruwiktionary-2026.9.16.json'),raw);
          const buildMs=performance.now()-started;
          let top1=0,top20=0;const misses:string[]=[];
          for(const term of parsed.terms){const hits=lookup.search(term.title,20);const rank=hits.findIndex(h=>h.term.id===term.id)+1;if(rank===1)top1++;if(rank>0)top20++;else misses.push(term.id);}
          const report={records:parsed.terms.length,combinedRecords:lookup.termCount,top1,top20,missingIds:misses,buildMs,currentProcessRssBytes:process.memoryUsage().rss,boundaries:'Source-name audit, not independent reverse-search/clinical or Android qualification. Same-title source collisions are retained. Owner PDF text is not uploaded to CI.'};
          writeFileSync('docs/research/prepared-definition-lookup-2026-09-21.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({...report,missingIds:undefined},null,2));
          TS
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/src/.measure-excerpts.ts
          rm tools/benchmarks/src/.measure-excerpts.ts
      - name: Record data scope without rewriting prior measurements
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/research/prepared-definition-extraction-2026-09-21.json').read_text())
          q=json.loads(Path('docs/research/prepared-definition-lookup-2026-09-21.json').read_text())
          p=Path('docs/CURRENT_STATE.md');s=p.read_text()
          note=f'''## Source-excerpt mass extraction and owner PDF overlays (2026-09-21)

          Scanned the complete bundled prepared corpus and all eight tool-module files. This pass
          produced {r['records']} source-excerpt records ({r['distinctTitles']} distinct titles),
          {r['sharedBlocks']} shared source blocks and {r['instrumentMentionCandidates']} separately
          classified instrument-mention candidates. Kinds and coverage levels, input table counts,
          actual bytes and integrity fingerprints are recorded in
          `research/prepared-definition-extraction-2026-09-21.json`.
          These are extracted source records, not that many newly discovered canonical concepts.

          The DEV definition preview now composes the old 6,975 entries with these excerpts
          ({q['combinedRecords']} combined records) and admits a bounded owner-provided JSON overlay.
          Owner data remains in page memory and is not uploaded or treated as publication permission.
          Source blocks, numbered lists, caveats and literal origin statements remain separate from
          editorial paraphrases. Mention-only scales do not acquire scoring or an interactive route.
          History/eponym references are an independent unresolved-identity inventory, not an assertion
          that every named person discovered the corresponding phenomenon.

          The user-supplied Semenov/Bersenev 2006 PDF was processed locally into 428 source records,
          covering all 42 numbered syndrome sections, 621 shared body blocks, eight criterion sets,
          seven literal etymology statements and 17 eponym-mention identities. The PDF, full extracted
          text and its boundary profile are returned privately, not committed to this public repository.
          Reproduction uses `scripts/extract_pdf_definition_profile.py` plus the owner's PDF/profile.

          Core package typecheck and the two definition Vitest suites ran in the mass-extraction job.
          The newly extracted exact-source-name audit found {q['top1']} Top-1 / {q['top20']} Top-20
          out of {q['records']} source records. Same-title collisions and missing IDs remain in the
          report; this is not reverse-definition or independent clinical qualification.
          No APK, release, source text from the owner upload, model assets or Actions artifacts were
          published. Browser integration and production-bundle checks remain separate from this run.

          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())
          if '## Source-excerpt mass extraction and owner PDF overlays' in s: raise ValueError('State entry already exists')
          p.write_text(s.replace('# Current state\n','# Current state\n\n'+note,1))
          PY
      - name: Push scoped results to the existing PR only
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/definition-drafts/prepared-source-excerpts-2026.09.21.json content/definition-drafts/instrument-mention-candidates-2026.09.21.json docs/research/prepared-definition-extraction-2026-09-21.json docs/research/prepared-definition-lookup-2026-09-21.json docs/CURRENT_STATE.md packages/core/src/definition-catalog.ts packages/core/src/extracted-definition-catalog.ts packages/core/src/extracted-definition-catalog.test.ts apps/app/src/composition/definition-draft-lookup.ts apps/app/src/features/search/DefinitionDraftMatches.tsx apps/app/src/features/search/definition-draft-matches.css
          git commit -m 'feat(definitions): connect mass source extraction and owner-only overlays [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free summary
        if: always()
        run: echo 'This job uploads no Actions artifacts, owner PDFs, model weights, releases or APKs.' >> "$GITHUB_STEP_SUMMARY"
