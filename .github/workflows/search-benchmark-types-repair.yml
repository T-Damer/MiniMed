name: Benchmark types repair (temporary)

on:
  pull_request:
    branches: [agent/concept-first-knowledge-search]
    paths: [.github/workflows/search-benchmark-types-repair.yml]

permissions:
  contents: read

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/system-one-search-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Install pinned dependencies without provider credentials
        run: env -i HOME="$HOME" PATH="$PATH" CI=true bun install --frozen-lockfile
      - name: Apply only diagnosed record-access and two explicit type repairs
        run: |
          node --input-type=module <<'JS'
          import ts from 'typescript';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve, relative } from 'node:path';
          const root = process.cwd();
          const base = 'tools/benchmarks/src/';
          function replace(path, old, value) {
            const text = readFileSync(path, 'utf8');
            if (text.split(old).length !== 2) throw new Error(`Ambiguous patch: ${path}`);
            writeFileSync(path, text.replace(old, value));
          }
          replace(base + 'run-definition-quality.ts', 'const rows = [];',
            'const rows: { id: string; origin: string; expectedRanks: number[]; rankPass: boolean; definitionReadable: boolean; exactContext: boolean; elapsedMs: number }[] = [];');
          replace(base + 'lookup-quality-cases.ts', 'documents: readonly MedicalDocumentSummary[],',
            "documents: readonly Pick<MedicalDocumentSummary, 'id' | 'title' | 'shortTitle' | 'metadata' | 'status'>[],");
          const allowed = new Set([
            'export-search-quality-frozen-candidates.ts', 'linear-reranker-baseline.ts',
            'run-search-coverage-observations.ts', 'search-quality-dataset.ts',
            'summarize-reranker-ablation.ts',
          ].map(name => resolve(base, name)));
          const configPath = resolve('tools/benchmarks/tsconfig.json');
          const config = ts.readConfigFile(configPath, ts.sys.readFile);
          if (config.error) throw new Error('Invalid TypeScript configuration');
          const parsed = ts.parseJsonConfigFileContent(config.config, ts.sys, resolve('tools/benchmarks'));
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const editsByFile = new Map();
          for (const diagnostic of ts.getPreEmitDiagnostics(program)) {
            if (diagnostic.code !== 4111 || !diagnostic.file || diagnostic.start === undefined) {
              throw new Error(ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n'));
            }
            const file = diagnostic.file;
            const path = resolve(file.fileName);
            if (!allowed.has(path)) throw new Error(`Outside repair scope: ${relative(root, path)}`);
            let property;
            function visit(node) {
              if (ts.isPropertyAccessExpression(node) && diagnostic.start >= node.name.getStart(file) && diagnostic.start < node.name.end) property = node;
              ts.forEachChild(node, visit);
            }
            visit(file);
            if (!property) throw new Error('Expected a diagnosed property access');
            const separator = file.text.slice(property.expression.end, property.name.getStart(file));
            if (!/^\s*(?:\?\.|\.)\s*$/u.test(separator)) throw new Error('Unexpected access syntax');
            const edit = { start: property.expression.end, end: property.end,
              text: `${property.questionDotToken ? '?.' : ''}[${JSON.stringify(property.name.text)}]` };
            const edits = editsByFile.get(path) ?? new Map();
            edits.set(edit.start, edit);
            editsByFile.set(path, edits);
          }
          for (const [path, edits] of editsByFile) {
            let text = readFileSync(path, 'utf8');
            for (const edit of [...edits.values()].sort((a, b) => b.start - a.start)) {
              text = text.slice(0, edit.start) + edit.text + text.slice(edit.end);
            }
            writeFileSync(path, text);
            console.log(`${relative(root, path)}: ${edits.size} compiler-diagnosed accesses repaired`);
          }
          JS
      - name: Format, typecheck and run all benchmark unit tests
        run: |
          bunx biome check --write --linter-enabled=false \
            tools/benchmarks/src/run-definition-quality.ts \
            tools/benchmarks/src/lookup-quality-cases.ts \
            tools/benchmarks/src/export-search-quality-frozen-candidates.ts \
            tools/benchmarks/src/linear-reranker-baseline.ts \
            tools/benchmarks/src/run-search-coverage-observations.ts \
            tools/benchmarks/src/search-quality-dataset.ts \
            tools/benchmarks/src/summarize-reranker-ablation.ts
          bunx tsc --noEmit -p tools/benchmarks/tsconfig.json
          bunx vitest run tools/benchmarks/src
          git diff --stat
      - name: Publish source files only with fast-forward protection
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch=experiment/system-one-search-benchmark
          git add tools/benchmarks/src/run-definition-quality.ts tools/benchmarks/src/lookup-quality-cases.ts tools/benchmarks/src/export-search-quality-frozen-candidates.ts tools/benchmarks/src/linear-reranker-baseline.ts tools/benchmarks/src/run-search-coverage-observations.ts tools/benchmarks/src/search-quality-dataset.ts tools/benchmarks/src/summarize-reranker-ablation.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(search): typecheck benchmark input records without relaxing strictness'
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha=$(git -c "http.https://github.com/.extraheader=$header" ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_sha" = "$EXPECTED_SHA"
          git -c "http.https://github.com/.extraheader=$header" push origin "HEAD:refs/heads/$branch"
          echo "Validated revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
