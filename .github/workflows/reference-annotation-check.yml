name: Reference annotation fidelity
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/reference-annotation-check.yml]
permissions:
  contents: write
concurrency:
  group: minimed-reference-annotation-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Normalize long literals without changing data or checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes={
            'tools/ingest/src/localmed_ingest/definition_reference_annotated_pack.py':[
              ('"Source-span bindings only, with unresolved person identity and review-required origin statements. "','"Source-span bindings only, with unresolved person identity "\n                "and review-required origin statements. "'),
              ('"No new biography, root translation, canonical relation, private upload or clinical qualification."','"No new biography, root translation, canonical relation, "\n                "private upload or clinical qualification."')],
            'tools/ingest/src/localmed_ingest/definition_reference_annotations.py':[
              ('"INSERT INTO definition_reference_annotation_spans VALUES (?, ?, ?, ?, ?, ?, ?)"','"INSERT INTO definition_reference_annotation_spans "\n                    "VALUES (?, ?, ?, ?, ?, ?, ?)"')],
            'tools/ingest/tests/test_definition_reference_annotations.py':[
              ("'SELECT a.kind, substr(c.original_text, a.start_offset + 1, a.end_offset - a.start_offset) '","'SELECT a.kind, substr(c.original_text, '\n            'a.start_offset + 1, a.end_offset - a.start_offset) '")]
          }
          for path,pairs in changes.items():
              p=Path(path);s=p.read_text()
              for old,new in pairs:
                  assert s.count(old)==1, path
                  s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Locked annotation-only checks, no source downloads
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/definition_reference_annotations.py tools/ingest/src/localmed_ingest/definition_reference_annotated_pack.py tools/ingest/tests/test_definition_reference_annotations.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          env -i PATH="$PATH" HOME="$HOME" bun run schema:generate
          env -i PATH="$PATH" HOME="$HOME" bun run schema:check
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_definition_reference_pack.py \
            tools/ingest/tests/test_definition_reference_compact.py \
            tools/ingest/tests/test_definition_reference_annotations.py \
            --junitxml=data/build/reference-annotations-junit.xml
      - name: Record only numeric test results and boundaries
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          suites=ET.parse('data/build/reference-annotations-junit.xml').getroot()
          stats={key:sum(int(s.get(key,'0')) for s in suites.findall('testsuite')) for key in ('tests','failures','errors','skipped')}
          assert stats['failures']==0 and stats['errors']==0
          report={'checkedCommit':'${{ github.sha }}', 'testResults':stats, 'strictPythonTypecheck':'passed', 'schemaSynchronization':'passed', 'scope':'Real ordinary projection, numeric compactor and annotated builder, using synthetic fixture text only. Owner PDF/derived private text not used in CI. No app, native, clinical or whole-workspace qualification implied.'}
          Path('docs/research/reference-annotation-check-2026-09-22.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Persist scoped verified files without overwriting parallel R2 work
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add tools/ingest/src/localmed_ingest/definition_reference_annotations.py tools/ingest/src/localmed_ingest/definition_reference_annotated_pack.py tools/ingest/tests/test_definition_reference_annotations.py docs/research/reference-annotation-check-2026-09-22.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(reference): qualify source-scoped annotation bindings and atomic rejection [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then
            git restore packages/storage-sqlite/src/generated/schema.ts
            git switch --detach "$remote"
            git cherry-pick "$own"
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free summary
        if: always()
        run: echo 'Only synthetic annotation tests. No PDFs, database binaries, models, release assets or Actions artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"
