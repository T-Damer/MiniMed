name: Definition fill and reliability verification
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths:
      - .github/workflows/definition-reliability-batch.yml
permissions:
  contents: write
concurrency:
  group: minimed-definition-reliability-batch
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2a6f1a098d407c05317d5879c2c412054e035c48
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Install locked dependencies without source execution credentials
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile --ignore-scripts
          (cd baseline-source && env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile --ignore-scripts)
          env -i PATH="$PATH" HOME="$HOME" uv sync --python 3.12 --project tools/ingest --all-groups --locked
      - name: Execute search and acquisition regressions
        run: |
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" node node_modules/vitest/vitest.mjs run packages/search-lexical packages/storage-sqlite --reporter=default --reporter=json --outputFile=data/build/definition-reliability-tests.json
          env -i PATH="$PATH" HOME="$HOME" node node_modules/typescript/bin/tsc -p packages/search-lexical/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" node node_modules/typescript/bin/tsc -p packages/storage-sqlite/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check tools/ingest/src/localmed_ingest/catalog_definition_completions.py tools/ingest/tests/test_catalog_definition_completions.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright tools/ingest/src/localmed_ingest/catalog_definition_completions.py tools/ingest/tests/test_catalog_definition_completions.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q tools/ingest/tests/test_catalog_definition_completions.py tools/ingest/tests/test_definition_gap_inventory.py tools/ingest/tests/test_definition_name_completions.py tools/ingest/tests/test_definition_name_inventory.py tools/ingest/tests/test_definition_reference_scope.py tools/ingest/tests/test_definition_reference_pack.py --junitxml=data/build/catalog-regressions.xml
      - name: Acquire one bounded source batch
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.catalog_definition_completions --root "$PWD" --batch 2026.09.23-reliability --limit 40
      - name: Build ordinary dictionary offline and verify source identities
        env:
          CHECKED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" CHECKED_SHA="$CHECKED_SHA" RUN_ID="$RUN_ID" uv run --project tools/ingest python - <<'PY'
          import hashlib,json,os,runpy,sqlite3,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          def guard(event,args):
              if event in {'socket.connect','socket.getaddrinfo'}:
                  raise RuntimeError('Dictionary verification must stay offline')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.23-reliability','--built-at','2026-09-23']
          runpy.run_path(sys.argv[0],run_name='__main__')
          from localmed_ingest.clinic_definition_completions import load_projection
          from localmed_ingest.definition_gap_inventory import build_gap_inventory
          projection=load_projection(Path.cwd())
          inventory=build_gap_inventory(projection)
          dbpath=Path('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-reliability.db')
          build=json.loads(Path(str(dbpath)+'.report.json').read_text())
          assert build['logicalRoundTripEqual'] is True
          assert build['entries']==inventory['sourceRecords']
          with sqlite3.connect(f'{dbpath.resolve().as_uri()}?mode=ro',uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert not db.execute('PRAGMA foreign_key_check').fetchall()
              actual={row[0]:json.loads(row[1]) for row in db.execute('SELECT id,metadata_json FROM knowledge_entities')}
              assert set(actual)==set(projection.entries)
              assert all(actual[k]['coverage']==v.coverage for k,v in projection.entries.items())
              for table in ('knowledge_facts','knowledge_relations'):
                  assert db.execute(f'SELECT count(*) FROM {table}').fetchone()==(0,)
          suite=ET.parse('data/build/catalog-regressions.xml').getroot()
          tests={k:sum(int(s.get(k,'0')) for s in suite.findall('testsuite')) for k in ('tests','failures','errors','skipped')}
          js=json.loads(Path('data/build/definition-reliability-tests.json').read_text())
          assert tests['failures']==tests['errors']==tests['skipped']==0
          assert js['numFailedTests']==0 and js['numFailedTestSuites']==0
          report={k:v for k,v in inventory.items() if k!='rows'}
          report.update({'checkedCommit':os.environ['CHECKED_SHA'],'runId':os.environ['RUN_ID'],'pythonTests':tests,'javascriptTests':js['numPassedTests'],'installedBytes':dbpath.stat().st_size,'downloadBytes':Path(str(dbpath)+'.gz').stat().st_size,'databaseSha256':hashlib.sha256(dbpath.read_bytes()).hexdigest(),'sqliteIdentityAndCoverageMatch':True,'logicalRoundTripEqual':True,'networkAllowedDuringBuild':False})
          Path('docs/research/definition-reliability-build-2026-09-23.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Compare frozen baseline and current reader on the identical database
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          db="$PWD/apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-reliability.db"
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/definition-reliability-audit.mjs sample "$db" baseline-source/packages/storage-sqlite/src/definition-reference-reader.ts data/build/search-before.json 2a6f1a098d407c05317d5879c2c412054e035c48
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/definition-reliability-audit.mjs sample "$db" packages/storage-sqlite/src/definition-reference-reader.ts data/build/search-after.json "$CHECKED_SHA"
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/definition-reliability-audit.mjs compare data/build/search-before.json data/build/search-after.json docs/research/definition-reliability-search-2026-09-23.json
      - name: Commit only validated short excerpts and receipts to the existing PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/experiment/system-one-search-benchmark
          git diff --exit-code -- packages tools scripts .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/definition-drafts/catalog-completions-2026.09.23-reliability.json content/definition-drafts/completion-inputs.json docs/research/catalog-completions-2026.09.23-reliability.json docs/research/definition-reliability-build-2026-09-23.json docs/research/definition-reliability-search-2026-09-23.json
          git commit -m 'data(definitions): add verified catalog batch and reliability receipts'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:experiment/system-one-search-benchmark
      - name: Report without artifact storage
        if: always()
        run: |
          echo 'One bounded acquisition; no schedule, cache uploads, artifacts, database binaries, models, APK, merge or release.' >> "$GITHUB_STEP_SUMMARY"
          for file in docs/research/catalog-completions-2026.09.23-reliability.json docs/research/definition-reliability-build-2026-09-23.json docs/research/definition-reliability-search-2026-09-23.json; do
            if test -f "$file"; then echo "REPORT $file"; cat "$file"; fi
          done
