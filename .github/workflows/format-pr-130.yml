name: Format PR 130 once

on:
  push:
    branches: [agent/l-note-legal-hard-benchmarks]
    paths:
      - ".github/workflows/format-pr-130.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/l-note-legal-hard-benchmarks
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - run: bunx biome check --write .
      - name: Commit safe formatter changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply final Biome fixes"
          git push origin HEAD:agent/l-note-legal-hard-benchmarks
