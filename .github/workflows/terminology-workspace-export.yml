name: Temporary terminology verification workspace

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-workspace-export.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover the application's existing pinned build inputs
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import pathlib, urllib.request, hashlib, json
          root = pathlib.Path('apps/app/public/tessdata'); root.mkdir(parents=True)
          report = []
          for lang in ('eng', 'rus'):
              url = f'https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0/{lang}.traineddata.gz'
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(25000001)
              assert 0 < len(data) <= 25000000 and data[:2] == b'\x1f\x8b'
              (root / f'{lang}.traineddata.gz').write_bytes(data)
              report.append({'url': url, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          pathlib.Path('build-inputs.json').write_text(json.dumps(report, indent=2))
          PY
          tar -czf ocr-build-inputs.tar.gz apps/app/public/tessdata build-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-ocr-build-inputs
          path: ocr-build-inputs.tar.gz
          retention-days: 2
          if-no-files-found: error
