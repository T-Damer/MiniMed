name: Temporary terminology verification workspace

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-workspace-export.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export original tracked application media only
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import pathlib, subprocess, tarfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('application-media.tar.gz', 'w:gz') as archive:
              for name in files:
                  path = pathlib.Path(name)
                  if not name.startswith(('apps/app/', 'apps/landing/')) or not path.is_file() or path.is_symlink():
                      continue
                  if path.suffix.lower() not in {'.jpg','.jpeg','.png','.webp','.avif','.gif','.ico','.mp3','.wav','.ogg'}:
                      continue
                  if path.stat().st_size > 16000000:
                      raise ValueError('Unexpected large media asset: ' + name)
                  archive.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-application-media
          path: application-media.tar.gz
          retention-days: 2
          if-no-files-found: error
