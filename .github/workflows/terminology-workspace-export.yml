name: Temporary terminology verification workspace

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-workspace-export.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.py', '.json', '.jsonl', '.yaml', '.yml', '.toml', '.md', '.sql', '.lock', '.css', '.scss', '.html', '.xml', '.sh', '.txt', '.svg'}
          with tarfile.open('workspace.tar.gz', 'w:gz') as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink() or name.startswith(('data/', '.cache/')):
                      continue
                  if path.suffix in extensions or name in ('.gitignore', '.npmrc', '.bun-version'):
                      archive.add(path, arcname=name, recursive=False)
          print('Source archive bytes:', pathlib.Path('workspace.tar.gz').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-verification-source
          path: workspace.tar.gz
          retention-days: 2
          if-no-files-found: error
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.3'
      - name: Install locked public dependencies
        run: env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
      - name: Export toolchain without credentials
        run: |
          cp "$(command -v bun)" bun-1.2.3
          tar -czf js-tools.tar.gz bun-1.2.3 node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-verification-tools
          path: js-tools.tar.gz
          retention-days: 2
          if-no-files-found: error
