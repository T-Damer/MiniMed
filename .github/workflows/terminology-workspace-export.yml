name: Temporary terminology verification workspace

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-workspace-export.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Prepare pinned offline test dependencies without provider credentials
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked --python 3.13
      - name: Archive only dependencies and split bounded artifacts
        run: |
          cp "$(command -v bun)" ./bun-offline
          tar -czf terminology-test-dependencies.tar.gz node_modules tools/ingest/.venv bun-offline
          split -b 180M -d terminology-test-dependencies.tar.gz dependencies.part-
          sha256sum terminology-test-dependencies.tar.gz > dependencies.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-dependencies-0
          path: |
            dependencies.part-00
            dependencies.sha256
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-dependencies-1
          path: dependencies.part-01
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-dependencies-2
          path: dependencies.part-02
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-dependencies-3
          path: dependencies.part-03
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn
