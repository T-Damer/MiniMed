name: Temporary terminology verification workspace

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-workspace-export.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Prepare pinned offline test dependencies without provider credentials
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked --python 3.13
      - name: Snapshot public tracked code and existing public fixtures only
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import pathlib, subprocess, tarfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          excluded = {'.gguf', '.safetensors', '.pem', '.p12', '.pfx', '.key', '.apk', '.aab'}
          with tarfile.open('terminology-source-workspace.tar.gz', 'w:gz') as archive:
              for name in files:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink():
                      continue
                  if name.startswith(('data/raw/', 'data/intermediate/', 'data/synced/')) or path.name.startswith('.env'):
                      continue
                  if path.suffix.lower() in excluded or path.stat().st_size > 600000000:
                      continue
                  archive.add(path, arcname=name, recursive=False)
          pathlib.Path('workspace-revision.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY
      - name: Archive locked test dependencies and Bun for local verification
        run: |
          cp "$(command -v bun)" ./bun-offline
          tar -czf terminology-test-dependencies.tar.gz node_modules tools/ingest/.venv bun-offline
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-source-workspace
          path: |
            terminology-source-workspace.tar.gz
            workspace-revision.txt
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-test-dependencies
          path: terminology-test-dependencies.tar.gz
          retention-days: 2
          if-no-files-found: error
