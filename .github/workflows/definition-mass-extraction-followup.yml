name: Full clinical definition extraction
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-mass-extraction-followup.yml]
permissions:
  contents: write
concurrency:
  group: minimed-mass-definitions
  cancel-in-progress: false
jobs:
  extract:
    if: github.repository == 'T-Damer/MiniMed'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Prepare integration from the reviewed previous bootstrap and tighten boundaries
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/definition-mass-extraction.yml').read_text()
          section=source.split('      - name: Connect the validated excerpt contract and owner-only import\n',1)[1].split('      - name: Locked formatting',1)[0]
          program=section.split("python3 - <<'PY'\n",1)[1].rsplit('\n          PY',1)[0]
          exec(compile(textwrap.dedent(program),'reviewed-integration-bootstrap','exec'))
          p=Path('apps/app/src/composition/definition-draft-lookup.ts');s=p.read_text()
          s=s.replace("              import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),", "              import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),\n              import('../../../../content/definition-drafts/clinical-source-excerpts-2026.09.21.json'),") if "              import(" in s else s.replace("  import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),", "  import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),\n  import('../../../../content/definition-drafts/clinical-source-excerpts-2026.09.21.json'),")
          if 'clinical-source-excerpts-2026' not in s:
              target="import('../../../../content/definition-drafts/prepared-source-excerpts-2026.09.21.json'),"
              assert target in s
              s=s.replace(target,target+"\nimport('../../../../content/definition-drafts/clinical-source-excerpts-2026.09.21.json'),")
          s=s.replace('([editorial, russian, excerpts])','([editorial, russian, excerpts, clinical])').replace('createDefinitionLookup(editorial, russian, excerpts)', 'createDefinitionLookup(editorial, russian, excerpts, clinical)').replace('createDefinitionLookup(editorial, russian, excerpts, overlay)', 'createDefinitionLookup(editorial, russian, excerpts, clinical, overlay)')
          p.write_text(s)
          p=Path('packages/core/src/extracted-definition-catalog.ts');s=p.read_text()
          old="      return origins[value];"
          assert old in s
          s=s.replace(old,"      const statement = origins[value];\n      if (statement === undefined) throw new Error('Missing etymology statement.');\n      return statement;")
          old="    return text(row['sourceStatement'], 2048);"
          assert old in s
          s=s.replace(old,"""    const block = blocks.get(integer(row['block']));
              const start = row['start']; const end = row['end'];
              const statement = text(row['sourceStatement'], 2048);
              if (!block || typeof start !== 'number' || typeof end !== 'number' || !Number.isSafeInteger(start) || !Number.isSafeInteger(end) || start < 0 || end <= start || [...block.text].slice(start, end).join('') !== statement) throw new Error('Etymology does not match the cited source span.');
              return statement;""")
          old="    const note = text(row['note'] ?? '', 4096, true);"
          assert old in s
          s=s.replace(old,"""    const caveats = array(row['sourceCaveats'] ?? [], 30).map((entry) => {
                const caution = object(entry);
                return `${text(caution['field'], 80)}: ${typeof caution['value'] === 'string' ? text(caution['value'], 16384) : text(JSON.stringify(caution['value']), 16384)}`;
              });
              const note = [text(row['note'] ?? '', 4096, true), ...caveats].filter(Boolean).join('\\n');""")
          p.write_text(s)
          p=Path('scripts/extract_prepared_definitions.py');s=p.read_text()
          s=s.replace('"scale" if tool.get("kind") == "assessment" else "tool"', 'kind_for(tool["title"]) if kind_for(tool["title"]) != "term" else "tool"')
          p.write_text(s)
          PY
      - name: Verify the local exporter and extract bundled summaries and all tool schemas
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/test_prepared_definition_extraction.py
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TARGET="$RUNNER_TEMP/source-core.db" python3 - <<'PY'
          import gzip, os
          from pathlib import Path
          total=0
          with gzip.open('content/bundled/core.db.gz','rb') as source, Path(os.environ['TARGET']).open('wb') as target:
              while block:=source.read(1024*1024):
                  total+=len(block)
                  if total>2*1024**3: raise ValueError('Decoded corpus budget exceeded')
                  target.write(block)
          PY
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/extract_prepared_definitions.py \
            --sqlite "$RUNNER_TEMP/source-core.db" --tools content/tool-modules --repo-ref '${{ github.sha }}' \
            --output content/definition-drafts/prepared-source-excerpts-2026.09.21.json \
            --report docs/research/prepared-definition-extraction-2026-09-21.json \
            --mentions content/definition-drafts/instrument-mention-candidates-2026.09.21.json
      - name: Extract every full clinical detail pack from the pinned existing dataset
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" python3 scripts/extract_clinical_dataset_definitions.py --network \
            --output content/definition-drafts/clinical-source-excerpts-2026.09.21.json \
            --report docs/research/clinical-definition-extraction-2026-09-21.json \
            --mentions content/definition-drafts/clinical-instrument-mentions-2026.09.21.json
      - name: Locked formatting, definition tests and real core typecheck
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write packages/core/src/definition-catalog.ts packages/core/src/extracted-definition-catalog.ts packages/core/src/extracted-definition-catalog.test.ts apps/app/src/composition/definition-draft-lookup.ts apps/app/src/features/search/DefinitionDraftMatches.tsx apps/app/src/features/search/definition-draft-matches.css
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run packages/core/src/definition-catalog.test.ts packages/core/src/extracted-definition-catalog.test.ts
          env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p packages/core/tsconfig.json
      - name: Audit every new source identity in combined lookup
        run: |
          cat > tools/benchmarks/src/.measure-excerpts.ts <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createDefinitionLookup, parseDefinitionCatalog } from '../../../packages/core/src/definition-catalog';
          const load=(p:string):unknown=>JSON.parse(readFileSync(p,'utf8'));
          const prepared=load('content/definition-drafts/prepared-source-excerpts-2026.09.21.json');
          const clinical=load('content/definition-drafts/clinical-source-excerpts-2026.09.21.json');
          const terms=[...parseDefinitionCatalog(prepared).terms,...parseDefinitionCatalog(clinical).terms];
          const started=performance.now();
          const lookup=createDefinitionLookup(load('content/definition-drafts/catalog.json'),load('content/definition-drafts/ruwiktionary-2026.9.16.json'),prepared,clinical);
          const buildMs=performance.now()-started;
          let top1=0,top20=0;const misses:string[]=[];
          for(const term of terms){const hits=lookup.search(term.title,20);const rank=hits.findIndex(h=>h.term.id===term.id)+1;if(rank===1)top1++;if(rank>0)top20++;else misses.push(term.id);}
          const report={records:terms.length,combinedRecords:lookup.termCount,top1,top20,missingIds:misses,buildMs,currentProcessRssBytes:process.memoryUsage().rss,boundaries:'Source-name audit only, not independent reverse-search, clinical or Android qualification. Same-title source records retain separate identities. Owner PDF text is not uploaded to CI.'};
          writeFileSync('docs/research/prepared-definition-lookup-2026-09-21.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({...report,missingIds:undefined},null,2));
          TS
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/src/.measure-excerpts.ts
          rm tools/benchmarks/src/.measure-excerpts.ts
      - name: Browser qualification of the actual definition component without the whole app
        run: |
          env -i PATH="$PATH" HOME="$HOME" bunx playwright install --with-deps chromium
          cat > apps/app/.definition-check.config.ts <<'TS'
          import { defineConfig } from 'vite';
          import solid from 'vite-plugin-solid';
          import { resolve } from 'node:path';
          import { readFileSync } from 'node:fs';
          const root=process.cwd();
          const paths=JSON.parse(readFileSync(resolve(root,'tsconfig.base.json'),'utf8')).compilerOptions.paths;
          export default defineConfig({root:resolve(root,'apps/app'),plugins:[solid()],resolve:{alias:{'@':resolve(root,'apps/app/src'),...Object.fromEntries(Object.entries(paths).map(([k,v])=>[k,resolve(root,(v as string[])[0])]))},server:{host:'127.0.0.1',port:4319,strictPort:true,fs:{allow:[root]}}});
          TS
          cat > apps/app/.definition-check.html <<'HTML'
          <!doctype html><html><body><div id="root"></div><script type="module" src="/src/.definition-check.tsx"></script></body></html>
          HTML
          cat > apps/app/src/.definition-check.tsx <<'TS'
          import { render } from 'solid-js/web';
          import { createSignal } from 'solid-js';
          import { DefinitionDraftMatches } from './features/search/DefinitionDraftMatches';
          function App(){const[q,setQ]=createSignal('Ясперс');return <><input aria-label="Запрос" value={q()} onInput={e=>setQ(e.currentTarget.value)}/><DefinitionDraftMatches query={q()}/></>;}
          render(()=><App/>,document.getElementById('root')!);
          TS
          env -i PATH="$PATH" HOME="$HOME" bunx vite --config apps/app/.definition-check.config.ts > "$RUNNER_TEMP/definition-vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          cat > .definition-browser-check.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:430,height:920}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const remote=[];await page.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1')return route.continue();remote.push(u.hostname);return route.abort();});
            for(let i=0;;i++){try{await page.goto('http://127.0.0.1:4319/.definition-check.html');break;}catch(e){if(i===30)throw e;await new Promise(r=>setTimeout(r,500));}}
            await page.locator('.definition-drafts__checkbox').check();
            await page.getByTestId('definition-draft-card').first().waitFor({timeout:30000});
            const initial=await page.locator('.definition-drafts__title').allTextContents();assert(initial.some(t=>t.includes('Ясперс')));
            const text='Проверочный термин — точное локальное определение.';
            const owner={version:3,id:'browser.owner',reviewStatus:'requires-review',publicationState:'local-dev',textKind:'source-excerpt',sources:[{id:2001,title:'Локальный учебный источник',authority:'professional-reference',accessed:'2026-09-21',sourceType:'owner-pdf',fileName:'fixture.pdf',baseUrl:'',sourceSha256:'a'.repeat(64),rightsStatus:'owner-only',releaseEligible:false}],blocks:[{id:1,source:2001,text,locator:'PDF p. 42',textSha256:'b'.repeat(64)}],terms:[{id:'browser.owner.term',title:'Проверочный термин',kind:'term',aliases:[],blockIds:[1],coverage:'definition',note:'Требует проверки'}]};
            await page.locator('.definition-drafts__import').setInputFiles({name:'owner.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(owner))});
            await page.getByLabel('Запрос').fill('Проверочный термин');
            await page.getByText(text,{exact:true}).waitFor({timeout:30000});
            assert((await page.locator('.definition-drafts__source').allTextContents()).some(t=>t.includes('локальный источник')));
            await page.locator('.definition-drafts__import').setInputFiles({name:'broken.json',mimeType:'application/json',buffer:Buffer.from('{bad')});
            await page.getByText('Не удалось прочитать пакет определений. Предыдущий поиск сохранён.',{exact:true}).waitFor();
            assert(await page.getByText(text,{exact:true}).isVisible());
            assert.deepEqual(errors,[]);assert.deepEqual(remote,[]);
            writeFileSync('docs/research/definition-component-browser-2026-09-21.json',JSON.stringify({actualSolidComponent:true,viewport:{width:430,height:920},checks:['opt-in public source load','owner JSON import','local source citation','invalid overlay preserves lookup','no remote requests','no browser exceptions'],passed:true,boundaries:'Isolated actual component and real loader/core; not full application, production bundle, Android or owner-PDF clinical validation.'},null,2)+'\n');
          }finally{await browser.close();}
          JS
          env -i PATH="$PATH" HOME="$HOME" node .definition-browser-check.mjs
          rm .definition-browser-check.mjs apps/app/.definition-check.config.ts apps/app/.definition-check.html apps/app/src/.definition-check.tsx
      - name: Record actual scope
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/research/prepared-definition-extraction-2026-09-21.json').read_text())
          c=json.loads(Path('docs/research/clinical-definition-extraction-2026-09-21.json').read_text())
          q=json.loads(Path('docs/research/prepared-definition-lookup-2026-09-21.json').read_text())
          p=Path('docs/CURRENT_STATE.md');s=p.read_text()
          note=f'''## Mass source definitions and owner-only overlays (2026-09-21)

          The lightweight core contains mostly pointers, so its exhaustive scan added only {r['records']}
          summary/tool-description records. A separate complete scan of {c['examined']['detail_packs']}
          pinned clinical detail packs produced {c['records']} source-excerpt records, plus
          {c['instrumentMentionCandidates']} separate mention-only review candidates. Original source
          text, numbered criterion lists, source snapshots and exact chunk/anchor locators are retained.
          These counts are source records, not disjoint canonical concepts or clinically qualified scales.
          Combined DEV lookup has {q['combinedRecords']} records. Source-name audit: {q['top1']} Top-1
          and {q['top20']} Top-20 out of {q['records']} newly extracted records. All misses remain in
          the report. Independent reverse-definition qualification is not established.

          The owner-supplied Semenov/Bersenev 2006 textbook was separately processed locally into
          428 records and 621 shared source blocks, covering all 42 numbered syndrome sections.
          Eight criterion sets, seven literal etymology statements and 17 unresolved eponym/name
          identities remain attributed to the source. The PDF, text and source profile are returned
          privately, not committed here. The generic checksum-bound PDF profile importer is checked in.

          The actual Solid definition component was browser-tested in isolation with the real loader
          and core: opt-in source loading, owner JSON import, local citations, invalid-file preservation
          and no external network requests. Core typecheck and both definition unit suites passed.
          No complete app build, production-bundle audit, physical-device or clinical validation is
          claimed. Sources remain requires-review/local-dev; no APK, released data or merge occurred.
          See the prepared/clinical extraction, lookup and component-browser reports under research/.

          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())
          if '## Mass source definitions and owner-only overlays' in s: raise ValueError('State note already exists')
          p.write_text(s.replace('# Current state\n','# Current state\n\n'+note,1))
          PY
      - name: Push only scoped successful results to the same PR
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/extract_prepared_definitions.py content/definition-drafts/*source-excerpts-2026.09.21.json content/definition-drafts/*mention*2026.09.21.json docs/research/*definition*2026-09-21.json docs/CURRENT_STATE.md packages/core/src/definition-catalog.ts packages/core/src/extracted-definition-catalog.ts packages/core/src/extracted-definition-catalog.test.ts apps/app/src/composition/definition-draft-lookup.ts apps/app/src/features/search/DefinitionDraftMatches.tsx apps/app/src/features/search/definition-draft-matches.css
          git commit -m 'feat(definitions): connect full clinical extraction and tested owner overlays [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free summary
        if: always()
        run: echo 'No Actions artifacts, owner PDFs, model assets, releases or APKs are uploaded.' >> "$GITHUB_STEP_SUMMARY"
