name: Publish clinical snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-clinical-snapshot
  cancel-in-progress: false

env:
  CHANNEL_TAG: datasets-preview-1
  RETRY_MAX_ATTEMPTS: 8
  RETRY_INITIAL_DELAY_SECONDS: 90
  RETRY_MAX_DELAY_SECONDS: 900
  RETRY_BACKOFF_FACTOR: 2
  MINIMED_HTTP_RETRY_MAX_ATTEMPTS: 8
  MINIMED_HTTP_RETRY_INITIAL_DELAY_SECONDS: 30
  MINIMED_HTTP_RETRY_MAX_DELAY_SECONDS: 600
  MINIMED_HTTP_RETRY_BACKOFF_FACTOR: 2

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true
      - name: Install pinned dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project tools/ingest --all-groups --locked
      - name: Discover and mirror official recommendations
        run: |
          chmod +x scripts/retry-step.sh
          scripts/retry-step.sh bun run content:catalog:clinical
          scripts/retry-step.sh bun run content:sync:clinical:all
      - name: Build verified databases for text-layer recommendations
        run: scripts/retry-step.sh bun run content:build:clinical:documents -- --all --allow-partial --force
      - name: Name and package immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_TAG="$(bun -e "
            const plan = await Bun.file('data/build/official-clinical-source-plan/discovery.json').json();
            const date = plan.generatedAt.slice(0, 10).replaceAll('-', '.');
            const checksum = plan.sourceCatalogChecksum.replace('sha256:', '').slice(0, 12);
            process.stdout.write('clinical-' + date + '-' + checksum);
          ")"
          echo "SNAPSHOT_TAG=$SNAPSHOT_TAG" >> "$GITHUB_ENV"
          bun run content:package:clinical:snapshot -- \
            --output-root release-clinical \
            --snapshot-id "$SNAPSHOT_TAG" \
            --release-base-url \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${SNAPSHOT_TAG}" \
            --allow-partial \
            --force
          bun -e "
            const files = [...new Bun.Glob('*').scanSync('release-clinical')];
            if (files.length > 1000) throw new Error('GitHub Release asset limit exceeded');
            for (const file of files) {
              if (Bun.file('release-clinical/' + file).size >= 2 * 1024 ** 3) {
                throw new Error(file + ' exceeds the 2 GiB GitHub Release asset limit');
              }
            }
            console.log(files.length + ' release assets validated');
          "
      - name: Build channel catalog
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL_TAG}/catalog.preview.json" \
            --output data/build/base-catalog.json \
            || cp apps/app/src/features/modules/catalog.preview.json data/build/base-catalog.json
          bun scripts/merge-clinical-snapshot-catalog.ts \
            data/build/base-catalog.json \
            release-clinical/catalog-fragment.json \
            data/build/catalog.preview.json
      - name: Publish immutable snapshot and update channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1; then
            echo "Immutable snapshot already exists: $SNAPSHOT_TAG" >&2
            exit 1
          fi
          gh release create "$SNAPSHOT_TAG" release-clinical/* \
            --title "Clinical recommendations ${SNAPSHOT_TAG}" \
            --notes "Immutable MiniMed snapshot: individual SQLite modules and source PDF archives." \
            --prerelease \
            --target "$GITHUB_SHA"
          gh release upload "$CHANNEL_TAG" data/build/catalog.preview.json --clobber
