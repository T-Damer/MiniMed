name: Definition-only source scope verification
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-only-scope-verify.yml]
permissions:
  contents: write
concurrency:
  group: minimed-definition-only-source-scope
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Connect source selection to the existing ordinary builders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path);s=p.read_text()
              assert s.count(old)==1,(path,old)
              p.write_text(s.replace(old,new))
          pack='tools/ingest/src/localmed_ingest/definition_reference_pack.py'
          replace(pack,'from .sqlite_builder import inspect_integrity, write_sqlite_pack','from .sqlite_builder import inspect_integrity, write_sqlite_pack\nfrom .definition_reference_scope import definition_scope')
          replace(pack,'    built_at: str,\n) -> dict[str, object]:\n    projection = Projection()','    built_at: str,\n    definitions_only: bool = False,\n) -> dict[str, object]:\n    projection = Projection()')
          replace(pack,'    return projection.build(output, edition_id=edition_id, version=version, built_at=built_at)','    selection = None\n    if definitions_only:\n        selected_ids, selection = definition_scope(projection.entries)\n        projection.entries = {key: entry for key, entry in projection.entries.items() if key in selected_ids}\n    report = projection.build(output, edition_id=edition_id, version=version, built_at=built_at)\n    report["selection"] = selection\n    return report')
          compact='tools/ingest/src/localmed_ingest/definition_reference_compact_pack.py'
          replace(compact,'    compact_metadata: bool = False,\n','    compact_metadata: bool = False,\n    definitions_only: bool = False,\n')
          replace(compact,'            built_at=built_at,\n        )','            built_at=built_at,\n            definitions_only=definitions_only,\n        )')
          replace(compact,'        "entries": baseline["entries"],','        "entries": baseline["entries"],\n        "selection": baseline.get("selection"),')
          prepare='scripts/prepare-definition-reference.py'
          replace(prepare,'from localmed_ingest.definition_reference_pack import obj','from localmed_ingest.definition_reference_pack import number, obj')
          replace(prepare,'def record_label(count: int) -> str:','def record_label(count: int, *, definitions_only: bool = False) -> str:')
          replace(prepare,'noun = "исходных записей"','noun = "исходных определений" if definitions_only else "исходных записей"') if Path(prepare).read_text().count('noun = "исходных записей"')==1 else None
          p=Path(prepare);s=p.read_text();s=s.replace('noun = "исходных записей"','noun = "исходных определений" if definitions_only else "исходных записей"');s=s.replace('noun = "исходная запись"','noun = "исходное определение" if definitions_only else "исходная запись"');s=s.replace('noun = "исходные записи"','noun = "исходных определения" if definitions_only else "исходные записи"');p.write_text(s)
          replace(prepare,'    args = parser.parse_args()','    parser.add_argument("--scope", choices=("definitions", "reference"), default="definitions")\n    args = parser.parse_args()')
          replace(prepare,'        compact_metadata=False,\n    )','        compact_metadata=False,\n        definitions_only=args.scope == "definitions",\n    )\n    if args.scope == "definitions":\n        selection = obj(report["selection"])\n        if number(selection["sourceRecordsBefore"]) != expected_entries:\n            raise ValueError("Definition scope differs from the complete source manifest")\n        expected_entries = number(selection["definitionRecordsAfter"])')
          replace(prepare,'"description": record_label(expected_entries)','"description": record_label(expected_entries, definitions_only=args.scope == "definitions")')
          replace(prepare,'            ": русские определения, описания, шкалы и контекст с точными "\n            "ссылками. Предварительная редакция, требующая проверки."','            ": определения с исходными формулировками и ссылками. "\n            "Предварительная редакция, требующая проверки."\n            if args.scope == "definitions"\n            else ": справочные записи и контекст. Предварительная редакция, требующая проверки."')
          replace(prepare,'    report["sourceManifestSha256"] = sha256(source_manifest)','    report["scope"] = args.scope\n    report["sourceManifestSha256"] = sha256(source_manifest)')
          PY
      - name: Locked strict Python checks and real SQLite regression tests
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/definition_reference_scope.py tools/ingest/src/localmed_ingest/definition_reference_pack.py tools/ingest/src/localmed_ingest/definition_reference_compact_pack.py scripts/prepare-definition-reference.py tools/ingest/tests/test_definition_reference_scope.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q tools/ingest/tests/test_definition_reference_scope.py tools/ingest/tests/test_definition_reference_pack.py --junitxml=data/build/definition-scope-tests.xml
      - name: Build the ordinary definitions-only dictionary offline
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import sys,runpy
          def guard(event,args):
              if event in {'socket.connect','socket.__new__','socket.getaddrinfo'}:
                  raise RuntimeError('Offline build forbids networking')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.22-definitions-only','--built-at','2026-09-22']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
      - name: Compare the selected identities and every original source block
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import hashlib,json,sqlite3,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          from localmed_ingest.definition_reference_pack import Projection
          from localmed_ingest.definition_reference_scope import definition_scope
          from localmed_ingest.definition_source_manifest import read_source_manifest
          def guard(event,args):
              if event in {'socket.connect','socket.__new__','socket.getaddrinfo'}:
                  raise RuntimeError('Offline verification forbids networking')
          sys.addaudithook(guard)
          root=Path.cwd();manifest=root/'content/definition-drafts/source-inputs.json'
          inputs,raw_count=read_source_manifest(root,manifest)
          projection=Projection()
          for path in inputs:
              raw=path.read_bytes();projection.add(json.loads(raw),hashlib.sha256(raw).hexdigest())
          selected,selection=definition_scope(projection.entries)
          assert raw_count==selection['sourceRecordsBefore']
          dbpath=root/'apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-definitions-only.db'
          build=json.loads(Path(str(dbpath)+'.report.json').read_text())
          assert build['selection']==selection and build['logicalRoundTripEqual'] is True
          link_count=0
          with sqlite3.connect(f'{dbpath.as_uri()}?mode=ro',uri=True) as db:
              assert {r[0] for r in db.execute('SELECT id FROM knowledge_entities')}==selected
              assert db.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert not db.execute('PRAGMA foreign_key_check').fetchall()
              for table in ('knowledge_facts','knowledge_relations'):
                  assert db.execute(f'SELECT count(*) FROM {table}').fetchone()==(0,)
              for identifier,(_,chunk) in projection.chunks.items():
                  actual=db.execute('SELECT original_text,metadata_json FROM chunks WHERE id=?',(identifier,)).fetchone()
                  assert actual and actual[0]==chunk.original_text and json.loads(actual[1])==chunk.metadata
              for source in projection.sources.values():
                  row=db.execute('SELECT metadata_json FROM documents WHERE id=?',(source.id,)).fetchone()
                  assert row and json.loads(row[0])['source']==source.descriptor
              for identifier in selected:
                  entry=projection.entries[identifier]
                  row=db.execute('SELECT canonical_name,metadata_json FROM knowledge_entities WHERE id=?',(identifier,)).fetchone()
                  assert row and row[0]==entry.title
                  metadata=json.loads(row[1])
                  assert metadata['coverage']==entry.coverage and metadata['textKind']==entry.text_kind
                  assert metadata['reviewStatus']=='requires-review'
                  links=db.execute('SELECT substr(link_type,11),chunk_id FROM definition_reference_links WHERE entity_id=? ORDER BY id',(identifier,)).fetchall()
                  assert links==entry.links
                  link_count+=len(links)
          suites=ET.parse('data/build/definition-scope-tests.xml').getroot()
          tests={key:sum(int(s.get(key,'0')) for s in suites.findall('testsuite')) for key in ('tests','failures','errors','skipped')}
          assert not tests['failures'] and not tests['errors']
          summary={k:v for k,v in selection.items() if k!='excludedEntries'}
          report={'checkedCommit':'${{ github.sha }}','runId':'${{ github.run_id }}','selection':summary,'tests':tests,'strictPythonChecks':'passed','sourceManifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'sourceBlocksCompared':len(projection.chunks),'sourceDescriptorsCompared':len(projection.sources),'retainedLinksCompared':link_count,'exactSelectedIdentitySet':True,'allSourceTextAndMetadataExact':True,'installedBytes':dbpath.stat().st_size,'downloadBytes':Path(str(dbpath)+'.gz').stat().st_size,'logicalRoundTripEqual':True,'networkRequests':0,'boundary':'Scope selection and source fidelity, not new source acquisition, unique concepts, clinical review, independent search quality or device validation. All original blocks remain present; no payload-pruning gain is claimed.'}
          Path('docs/research/definition-only-scope-2026-09-22.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          section=f'''## Definitions-only dictionary scope — 2026-09-22

          Default DEV preparation now selects **{len(selected)} source-local definition candidates**
          from **{raw_count} authoring/reference records**. This is selection, not new acquisition.
          Article titles, section excerpts, instrument-only descriptions, history and lexical glosses
          do not inflate the medical-definition count. Full original inputs and every source block,
          context, source descriptor and review/rights marker are retained unchanged.
          The explicit `--scope reference` option builds the full authoring/reference view.
          No automatic clinical approval, synonym merging, executable scale or treatment decision.
          Verified {tests['tests']} scoped tests, strict Python checks, a complete ordinary SQLite build,
          exact selected identities, all {len(projection.chunks)} source blocks and {link_count} retained links.
          Evidence: `research/definition-only-scope-2026-09-22.json`.
          DEV version: `2026.09.22-definitions-only`. No APK, release, model or private-source upload.
          Next acquisition targets actual definitions in guidelines, medical dictionaries and named
          teaching sources, not article-count growth. User-provided scales remain a separate local intake.

          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          for name in ('docs/CURRENT_STATE.md','docs/DEFINITION_REFERENCE_PLAN.md'):
              p=Path(name);a,b=p.read_text().split('\n',1);p.write_text(a+'\n\n'+section+b)
          p=Path('docs/REFERENCE_SOURCE_POLICY.md');s=p.read_text();a,b=s.split('\n',1)
          p.write_text(a+'\n\n## Definition unit override — 2026-09-22\n\nThe user requests definitions rather than growth in article/header counts. A dictionary entry\nneeds a source-supported definition. Scales, criteria, algorithms and source overviews remain\nseparate reference material unless the record itself defines a named concept. Their presence\ndoes not imply an executable calculator or a treatment rule. Clinical recommendations,\nprofessional medical dictionaries, named textbooks and inspected specialist sites are eligible\nsource families; no source family is automatically clinically reviewed or cleared for reuse.\nThe default new DEV dictionary view excludes source-gloss lexical entries without deleting\ntheir authoring sources; `--scope reference` keeps the full reference selection available.\nOriginal text/context is retained, not silently rewritten into a synthetic consensus.\n\n'+b)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit only tested scoped code and reports to the same PR
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add tools/ingest/src/localmed_ingest/definition_reference_scope.py tools/ingest/src/localmed_ingest/definition_reference_pack.py tools/ingest/src/localmed_ingest/definition_reference_compact_pack.py tools/ingest/tests/test_definition_reference_scope.py scripts/prepare-definition-reference.py docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md docs/REFERENCE_SOURCE_POLICY.md docs/research/definition-only-scope-2026-09-22.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): build a source-faithful definitions-only dictionary [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: No uploads or release
        if: always()
        run: echo 'No private document, source profile, database binary, model, APK, cache or Actions artifact uploaded.' >> "$GITHUB_STEP_SUMMARY"
