name: Medical terminology intake
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-intake-check.yml]
permissions:
  contents: write
concurrency:
  group: minimed-definition-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Strict tests include the actual intake policy and source-fidelity boundaries
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format tools/ingest/tests/test_wikipedia_scope_policy.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check tools/ingest/tests/test_wikipedia_scope_policy.py tools/ingest/src/localmed_ingest/wikipedia_scope.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright tools/ingest/tests/test_wikipedia_scope_policy.py tools/ingest/src/localmed_ingest/wikipedia_scope.py
          mkdir -p data/build/definition-intake
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_wikipedia_scope_policy.py tools/ingest/tests/test_wikipedia_scope.py \
            tools/ingest/tests/test_wikipedia_definitions.py tools/ingest/tests/test_definition_reference_pack.py \
            tools/ingest/tests/test_definition_reference_compact.py --junitxml=data/build/definition-intake/tests.xml
      - name: Regenerate only the prior generated intake, retaining all acquired source evidence
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('content/definition-drafts/ruwiki-medical-2026.09.22')
          manifest=json.loads((root/'manifest.json').read_bytes())
          assert manifest['intakePolicySha256']
          original=(root/'acquisition-manifest.json').read_bytes()
          assert hashlib.sha256(original).hexdigest()==manifest['acquisitionManifestSha256']
          for part in manifest['parts']:
              path=root/part['path']
              assert path.parent==root and path.name.startswith('admitted-') and path.suffix=='.json'
              raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==part['sha256'] and len(raw)==part['bytes']
          (root/'intake-firstpass-report.json').write_bytes((root/'intake-report.json').read_bytes())
          Path('docs/research/definition-intake-firstpass-build-2026-09-22.json').write_bytes(Path('docs/research/definition-intake-build-2026-09-22.json').read_bytes())
          for part in manifest['parts']: (root/part['path']).unlink()
          (root/'manifest.json').write_bytes(original)
          PY
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import runpy,sys
          def guard(event,args):
              if event in {'socket.connect','socket.getaddrinfo'}: raise RuntimeError('Offline intake only')
          sys.addaudithook(guard)
          sys.argv=['wikipedia_scope','--collection','content/definition-drafts/ruwiki-medical-2026.09.22','--selection','content/definition-drafts/ruwiki-selection-2026.09.22.json','--policy','content/definition-drafts/ruwiki-scope-2026.09.22.json']
          runpy.run_module('localmed_ingest.wikipedia_scope',run_name='__main__')
          PY
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/refresh-definition-inputs.py --collection content/definition-drafts/ruwiki-medical-2026.09.22
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/prepare-definition-reference.py --version 2026.09.22-terms-final --built-at 2026-09-22
      - name: Verify every new source text and locator against final SQLite
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import hashlib,json,sqlite3,xml.etree.ElementTree as ET
          from pathlib import Path
          collection=Path('content/definition-drafts/ruwiki-medical-2026.09.22')
          manifest=json.loads((collection/'manifest.json').read_bytes())
          source_manifest=json.loads(Path('content/definition-drafts/source-inputs.json').read_bytes())
          intake=json.loads((collection/'intake-report.json').read_bytes())
          old_intake=json.loads((collection/'intake-firstpass-report.json').read_bytes())
          for category in ('Категория:Гистология','Категория:Патогистология','Категория:Гастроэнтерология','Категория:Диагностические методы в гастроэнтерологии','Категория:Симптомы гастроэнтерологических заболеваний'):
              assert category not in intake['traversal']['excludedCategories'],category
          acquisition=json.loads((collection/'acquisition-manifest.json').read_bytes())
          delta=json.loads(Path('docs/research/definition-expansion-2026-09-22.json').read_bytes())
          dbpath=Path('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-terms-final.db')
          report=json.loads(Path(str(dbpath)+'.report.json').read_bytes())
          assert report['entries']==source_manifest['entries']==delta['combinedRecords']
          assert report['logicalRoundTripEqual'] is True
          assert all('/admitted-' in row['path'] for row in source_manifest['inputs'] if '/ruwiki-medical-' in row['path'])
          raw_ids=set();kept_ids=set();count=0
          for part in acquisition['parts']:
              raw=(collection/part['path']).read_bytes()
              assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256']
              raw_ids.update(term['id'] for term in json.loads(raw)['terms'])
          with sqlite3.connect(f'file:{dbpath}?mode=ro',uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
              for part in manifest['parts']:
                  payload=json.loads((collection/part['path']).read_bytes());blocks={b['id']:b for b in payload['blocks']}
                  for term in payload['terms']:
                      linked=db.execute('SELECT c.original_text,c.metadata_json FROM definition_reference_links l JOIN chunks c ON c.id=l.chunk_id WHERE l.entity_id=? AND l.link_type=?',(term['id'],'reference:definition')).fetchall()
                      assert len(linked)==1,term['id']
                      block=blocks[term['blockIds'][0]];assert linked[0][0]==block['text'],term['id']
                      metadata=json.loads(linked[0][1])
                      for key in ('pageId','path','apiResponseSha256','sourcePageRecordSha256','retrievedAt','revisionBinding','intakePolicySha256'):
                          assert metadata[key]==block[key],(term['id'],key)
                      kept_ids.add(term['id']);count+=1
              for identity in raw_ids-kept_ids:
                  assert db.execute('SELECT 1 FROM knowledge_entities WHERE id=?',(identity,)).fetchone() is None
              assert 'ruwiki.definition.8543697' in kept_ids
          assert count==manifest['entries']==intake['admittedDescriptions']
          suites=ET.parse('data/build/definition-intake/tests.xml').getroot()
          stats={key:sum(int(s.get(key,'0')) for s in suites.findall('testsuite')) for key in ('tests','failures','errors','skipped')}
          assert stats['failures']==stats['errors']==0
          result={'inputCommit':'${{ github.sha }}','runId':'${{ github.run_id }}','tests':stats,'acquiredDescriptions':intake['acquiredDescriptions'],'admittedDescriptions':count,'quarantinedAcquiredDescriptions':len(raw_ids-kept_ids),'restoredFromRawQueue':len(kept_ids-raw_ids),'additionalRecordsAfterDisciplineFilterFix':count-old_intake['admittedDescriptions'],'combinedRecords':report['entries'],'newNameSurfaces':delta['newNameSurfaces'],'existingNamesWithAnotherSource':delta['existingNameSurfacesWithAdditionalSource'],'sourceTextAndLocatorsExact':True,'originalAcquisitionFilesUnchanged':True,'quarantinedIdsAbsentFromRuntime':True,'intakeNetworkRequests':0,'integrity':'ok','foreignKeyViolations':0,'sqliteBytes':dbpath.stat().st_size,'downloadBytes':Path(str(dbpath)+'.gz').stat().st_size,'sqliteSha256':hashlib.sha256(dbpath.read_bytes()).hexdigest(),'sourceManifestSha256':report['sourceManifestSha256'],'boundaries':'Offline scope intake and actual full SQLite rebuild. Every new record compared to source text/locators. Not clinical review, semantic deduplication or browser/Android/reverse-search qualification. First-pass overly broad person-category filters are recorded separately, not erased.'}
          Path('docs/research/definition-intake-build-2026-09-22.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Keep current plan and state aligned with the final admitted corpus
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/research/definition-intake-build-2026-09-22.json').read_text())
          section=f'''## Content-first dictionary expansion — 2026-09-22

          Breaking DEV code/file formats are permitted by the user. R3/R5 source collection,
          source-fidelity QA and database refreshes now precede more compatibility/installer work.
          Existing personal data, source wording and provenance remain protected.

          Acquired introductions before medical scope intake: {report['acquiredDescriptions']}.
          Active admitted new source records: **{report['admittedDescriptions']}**.
          Quarantined acquired descriptions: {report['quarantinedAcquiredDescriptions']}; restored
          over-filtered source records: {report['restoredFromRawQueue']}. The scope pass excludes
          irrelevant cultural/consumer branches, while preserving medical alternate paths.
          A first-pass person-category prefix mistake was corrected: medical histology and
          gastroenterology branches are retained. All raw snapshots/shards remain audit evidence,
          excluded from runtime inputs. Earlier acquisition/first-pass reports are not current totals.

          Combined source/editorial corpus: **{report['combinedRecords']} records**. The new source
          adds **{report['newNameSurfaces']}** previously absent normalized name surfaces and
          **{report['existingNamesWithAnotherSource']}** additional source descriptions for known names.
          These are not proven disjoint canonical concepts or reviewed clinical recommendations.
          Supplied origin notes are unchanged; scale descriptions do not become executable scoring.
          The owner textbook's 450 private records are separate and were not publicly uploaded.

          Final SQLite: **{report['sqliteBytes']} bytes installed / {report['downloadBytes']} bytes
          gzip**. All {report['admittedDescriptions']} new records matched exact text and source
          locators. {report['tests']['tests']} selected Python cases passed, including actual policy
          regressions, plus strict authoring checks and SQLite integrity/foreign keys.
          No new app/browser/Android or independent reverse-search qualification is claimed.

          Runtime inputs are pinned in `content/definition-drafts/source-inputs.json`. Prepare
          version `2026.09.22-terms-final` with the existing script. Generated database/descriptor
          files stay local; no release or APK was published. Evidence:
          `research/definition-intake-build-2026-09-22.json`,
          `research/definition-expansion-2026-09-22.json`, and the collection's `intake-report.json`.

          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          p=Path('docs/CURRENT_STATE.md');s=p.read_text();anchor='## Content-first dictionary expansion — 2026-09-22';a=s.index(anchor);b=s.find('\n## ',a+len(anchor));assert b>a
          p.write_text(s[:a]+section+s[b:])
          p=Path('docs/DEFINITION_REFERENCE_PLAN.md');s=p.read_text()
          s=s.replace('- 2026-09-22 source-scope QA: active source subset', '- 2026-09-22 first-pass source-scope QA (superseded by corrected discipline matching below): source subset')
          s+=f"\n- 2026-09-22 final content edition: {report['admittedDescriptions']} new source descriptions, {report['combinedRecords']} total, {report['newNameSurfaces']} previously absent normalized names. {report['quarantinedAcquiredDescriptions']} acquired nonmedical-path descriptions stay outside runtime inputs. Corrected exact person-category matching restores {report['additionalRecordsAfterDisciplineFilterFix']} medical records compared with the first intake. Actual SQLite/gzip sizes are {report['sqliteBytes']}/{report['downloadBytes']} bytes; every new record's text and provenance matched, {report['tests']['tests']} selected tests passed. See `research/definition-intake-build-2026-09-22.json`. Continue terminology/source coverage, not compatibility work.\n"
          p.write_text(s)
          PY
      - name: Commit only scoped data and actual evidence to the existing PR
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add tools/ingest/tests/test_wikipedia_scope_policy.py content/definition-drafts/source-inputs.json \
            content/definition-drafts/ruwiki-medical-2026.09.22 docs/research/definition-expansion-2026-09-22.json \
            docs/research/definition-intake-firstpass-build-2026-09-22.json docs/research/definition-intake-build-2026-09-22.json \
            docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): refresh dictionary with medically scoped Russian source descriptions [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Publication boundary
        if: always()
        run: echo 'Only source data and numeric reports. No new source requests, private text, SQLite binaries, models, releases, APKs or Actions artifacts.' >> "$GITHUB_STEP_SUMMARY"
