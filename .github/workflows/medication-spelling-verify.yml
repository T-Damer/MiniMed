name: Verify medication suffixes and selected definitions
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths:
      - .github/workflows/medication-spelling-verify.yml
      - packages/search-lexical/src/medication-*.ts
      - tools/benchmarks/medication-suffix-audit.mjs
      - tools/benchmarks/selected-completion-reader-audit.mjs
      - tools/ingest/src/localmed_ingest/selected_completion_batch.py
      - tools/ingest/tests/test_selected_completion_transport.py
      - content/reference-authoring/selected-gap-fills-2026.09.23-suffix.json
permissions:
  contents: write
concurrency:
  group: minimed-medication-spelling-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BATCH_ID: 2026.09.23-suffix-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c66e84f31632f3847c735a300ce15b1ca596019
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Install locked dependencies without execution credentials
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile --ignore-scripts
          (cd baseline-source && env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile --ignore-scripts)
          env -i PATH="$PATH" HOME="$HOME" uv sync --python 3.12 --project tools/ingest --all-groups --locked
      - name: Commit mechanical formatting before measuring source
        id: source
        run: |
          # Formatter edits become an inspectable commit BEFORE tests. No runtime source patches,
          # changed gold answers, ignored checks or uncommitted implementation enter measurement.
          env -i PATH="$PATH" HOME="$HOME" bun x biome check --write tools/benchmarks/medication-suffix-audit.mjs tools/benchmarks/selected-completion-reader-audit.mjs
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format tools/ingest/src/localmed_ingest/selected_completion_batch.py tools/ingest/tests/test_selected_completion_transport.py tools/ingest/src/localmed_ingest/clinic_definition_completions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/benchmarks/medication-suffix-audit.mjs tools/benchmarks/selected-completion-reader-audit.mjs tools/ingest/src/localmed_ingest/selected_completion_batch.py tools/ingest/tests/test_selected_completion_transport.py tools/ingest/src/localmed_ingest/clinic_definition_completions.py
          if ! git diff --cached --quiet; then git commit -m 'style(search): format suffix audit and selected source intake before verification'; fi
          git diff --exit-code -- packages tools scripts .github
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test committed lookup and acquisition contracts
        run: |
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" bun scripts/restore-core.mjs
          env -i PATH="$PATH" HOME="$HOME" node node_modules/vitest/vitest.mjs run packages/search-lexical packages/core packages/storage-sqlite --reporter=default --reporter=json --outputFile=data/build/suffix-tests.json
          for package in search-lexical core storage-sqlite; do
            env -i PATH="$PATH" HOME="$HOME" node node_modules/typescript/bin/tsc -p "packages/$package/tsconfig.json"
          done
          env -i PATH="$PATH" HOME="$HOME" node node_modules/typescript/bin/tsc -p apps/app/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" bun x biome check packages/search-lexical/src/medication-spelling.ts packages/search-lexical/src/medication-lookup.ts packages/search-lexical/src/medication-suffix.test.ts tools/benchmarks/medication-suffix-audit.mjs tools/benchmarks/selected-completion-reader-audit.mjs
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check tools/ingest/src/localmed_ingest/selected_completion_batch.py tools/ingest/src/localmed_ingest/clinic_definition_completions.py tools/ingest/tests/test_selected_completion_transport.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format --check tools/ingest/src/localmed_ingest/selected_completion_batch.py tools/ingest/src/localmed_ingest/clinic_definition_completions.py tools/ingest/tests/test_selected_completion_transport.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright tools/ingest/src/localmed_ingest/selected_completion_batch.py tools/ingest/src/localmed_ingest/clinic_definition_completions.py tools/ingest/tests/test_selected_completion_transport.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q tools/ingest/tests/test_selected_completion_transport.py tools/ingest/tests/test_catalog_definition_completions.py tools/ingest/tests/test_definition_gap_inventory.py tools/ingest/tests/test_definition_name_completions.py tools/ingest/tests/test_definition_name_inventory.py tools/ingest/tests/test_definition_reference_scope.py tools/ingest/tests/test_definition_reference_pack.py --junitxml=data/build/suffix-python-tests.xml
      - name: Independently fetch selected short definitions
        id: acquisition
        continue-on-error: true
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.selected_completion_batch --root "$PWD" --authoring content/reference-authoring/selected-gap-fills-2026.09.23-suffix.json --batch "$BATCH_ID"
      - name: Build ordinary dictionary offline and verify identities
        env:
          CHECKED_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" BATCH_ID="$BATCH_ID" CHECKED_SHA="$CHECKED_SHA" RUN_ID="$RUN_ID" ACQUISITION_OUTCOME="$ACQUISITION_OUTCOME" uv run --project tools/ingest python - <<'PY'
          import hashlib,json,os,runpy,sqlite3,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          batch=os.environ['BATCH_ID']
          acquisition=json.loads(Path(f'docs/research/selected-completions-{batch}.json').read_text())
          accepted=acquisition['acquisition']['accepted']
          assert type(accepted) is int and accepted>=0
          assert acquisition['after']['definitionRecords']-acquisition['before']['definitionRecords']==accepted
          assert (os.environ['ACQUISITION_OUTCOME']=='success')==(accepted>0)
          def guard(event,args):
              if event in {'socket.connect','socket.connect_ex','socket.getaddrinfo'}:
                  raise RuntimeError('Dictionary verification must stay offline')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version',batch,'--built-at','2026-09-23']
          runpy.run_path(sys.argv[0],run_name='__main__')
          from localmed_ingest.clinic_definition_completions import load_projection
          from localmed_ingest.definition_gap_inventory import build_gap_inventory
          projection=load_projection(Path.cwd())
          inventory=build_gap_inventory(projection)
          dbpath=Path(f'apps/app/public/content/definition-reference/minimed.definition.reference.{batch}.db')
          build=json.loads(Path(str(dbpath)+'.report.json').read_text())
          assert build['logicalRoundTripEqual'] is True
          assert build['entries']==inventory['sourceRecords']
          with sqlite3.connect(f'{dbpath.resolve().as_uri()}?mode=ro',uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert not db.execute('PRAGMA foreign_key_check').fetchall()
              actual={row[0]:json.loads(row[1]) for row in db.execute('SELECT id,metadata_json FROM knowledge_entities')}
              assert set(actual)==set(projection.entries)
              assert all(actual[k]['coverage']==v.coverage for k,v in projection.entries.items())
              for table in ('knowledge_facts','knowledge_relations'):
                  assert db.execute(f'SELECT count(*) FROM {table}').fetchone()==(0,)
          suite=ET.parse('data/build/suffix-python-tests.xml').getroot()
          tests={k:sum(int(s.get(k,'0')) for s in suite.findall('testsuite')) for k in ('tests','failures','errors','skipped')}
          js=json.loads(Path('data/build/suffix-tests.json').read_text())
          assert tests['failures']==tests['errors']==tests['skipped']==0
          assert js['numFailedTests']==0 and js['numFailedTestSuites']==0
          report={k:v for k,v in inventory.items() if k!='rows'}
          report.update({'checkedCommit':os.environ['CHECKED_SHA'],'runId':os.environ['RUN_ID'],'pythonTests':tests,'javascriptTests':js['numPassedTests'],'installedBytes':dbpath.stat().st_size,'downloadBytes':Path(str(dbpath)+'.gz').stat().st_size,'databaseSha256':hashlib.sha256(dbpath.read_bytes()).hexdigest(),'sqliteIdentityAndCoverageMatch':True,'logicalRoundTripEqual':True,'networkAllowedDuringBuild':False,'acquisitionOutcome':os.environ['ACQUISITION_OUTCOME'],'acceptedDefinitions':accepted})
          Path(f'docs/research/selected-completion-build-{batch}.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Verify new definition text and exact navigation with the actual reader
        if: steps.acquisition.outcome == 'success'
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/selected-completion-reader-audit.mjs "apps/app/public/content/definition-reference/minimed.definition.reference.${BATCH_ID}.db" "content/definition-drafts/selected-completions-${BATCH_ID}.json" "docs/research/selected-completion-reader-${BATCH_ID}.json"
      - name: Compare suffix lookup with isolated previous core on the same database
        env:
          CHECKED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/medication-suffix-audit.mjs "$PWD/apps/app/public/content/core.db" baseline-source/packages/core/src/create-medical-core.ts "docs/research/medication-suffix-${BATCH_ID}.json" "$CHECKED_SHA"
          git diff --exit-code -- packages tools scripts .github
      - name: Record the measured current state
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" BATCH_ID="$BATCH_ID" RUN_ID="$RUN_ID" python3 - <<'PY'
          import json,os
          from pathlib import Path
          batch=os.environ['BATCH_ID']
          path=Path(f'docs/research/medication-suffix-{batch}.json')
          report=json.loads(path.read_text())
          build=json.loads(Path(f'docs/research/selected-completion-build-{batch}.json').read_text())
          report.update({'runId':os.environ['RUN_ID'],'javascriptTests':build['javascriptTests'],'typechecks':['search-lexical','core','storage-sqlite','app']})
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          state=Path('docs/CURRENT_STATE.md')
          text=state.read_text()
          heading=f'## Medication suffixes and selected definitions — {batch}'
          if heading not in text:
              user=report['byFamily']['user-kanephron']
              section=f"{heading}\n\nOrdinary medication lookup now handles omitted one-letter source suffixes without deleting full source identities or editing explicit product markers. User Kanephron variants Top-1: {user['before']['top1']} → {user['after']['top1']}/{user['after']['total']}; prior 162 regressions retained; {report['exactChecked']} exact queries unchanged. Broader marked-name misses remain in `research/medication-suffix-{batch}.json`; these are developer tests, not independent clinician logs or device timing. Independently refetched {build['acceptedDefinitions']} source definitions; ordinary offline reference has {build['definitionRecords']} definition records and {build['pendingRecords']} pending across {build['sourceRecords']} retained identities. Source outcomes and SQLite/reader evidence: `research/selected-completions-{batch}.json`, `research/selected-completion-build-{batch}.json`. All new content stays local-dev/requires-review. No model, APK, public release, merge or automatic medical rules.\n\n"
              state.write_text(text.replace('# Current state\n\n','# Current state\n\n'+section,1))
          PY
      - name: Push validated implementation and evidence to the existing PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/experiment/system-one-search-benchmark
          git diff --exit-code -- packages tools scripts .github
          if test -f "content/definition-drafts/selected-completions-${BATCH_ID}.json"; then
            git add "content/definition-drafts/selected-completions-${BATCH_ID}.json" content/definition-drafts/completion-inputs.json
            git add "docs/research/selected-completion-reader-${BATCH_ID}.json"
          fi
          git add docs/CURRENT_STATE.md "docs/research/selected-completions-${BATCH_ID}.json" "docs/research/selected-completion-build-${BATCH_ID}.json" "docs/research/medication-suffix-${BATCH_ID}.json"
          git commit -m 'data(search): record verified suffix recovery and selected source completions'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:experiment/system-one-search-benchmark
      - name: Report explicit source outcomes without artifact storage
        if: always()
        run: |
          echo 'One bounded source batch; no scheduled collection, cache uploads, Actions artifacts, database binaries, models, APK, merge or release.' >> "$GITHUB_STEP_SUMMARY"
          for file in "docs/research/selected-completions-${BATCH_ID}.json" "docs/research/selected-completion-build-${BATCH_ID}.json" "docs/research/selected-completion-reader-${BATCH_ID}.json"; do
            if test -f "$file"; then echo "REPORT $file"; cat "$file"; fi
          done
