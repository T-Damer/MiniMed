name: Definition description and MSD qualification
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-description-qualify.yml]
permissions:
  contents: write
concurrency:
  group: minimed-definition-description-qualification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Pin the baseline and connect the separate inverse handler
        run: |
          set -euo pipefail
          baseline=packages/storage-sqlite/src/.definition-reader-baseline.ts
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/T-Damer/MiniMed/ed4c84a1ab6b461a7d345df06d880a35ae66f6a0/packages/storage-sqlite/src/definition-reference-reader.ts' -o "$baseline"
          test "$(git hash-object "$baseline")" = '975363ba6533db140a62560e2e1ac33dde4d49ce'
          python3 - <<'PY'
          import json
          from pathlib import Path
          def edit(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          path='packages/search-lexical/src/definition-description.ts'
          edit(path,'|утрат\\p{L}*|потер[яию]\\p{L}*','')
          edit(path,'normalizeSurfaceText(value).split',"normalizeSurfaceText(value.replace(/[;!?]/gu, '.')).split")
          edit(path,'const normalized = normalizeSurfaceText(value);',"const normalized = normalizeSurfaceText(value.replace(/[;!?]/gu, '.'));")
          path='packages/search-lexical/src/definition-description.test.ts'
          edit(path,"value.terms.map((term) => term.stem)).toEqual(['запах', 'ощущаются'])","value.terms.map((term) => term.surface)).toEqual(['запахи', 'ощущаются'])")
          edit(path,"term.stem === 'бол'","term.stem === 'боль'")
          path='packages/storage-sqlite/tests/definition-description-search.test.ts'
          edit(path,'l.link_type = \'reference:definition\'',"l.link_type IN ('reference:definition','reference:item')")
          p=Path('packages/storage-sqlite/package.json');data=json.loads(p.read_text())
          assert '@localmed/search-lexical' not in data['dependencies']
          data['dependencies']['@localmed/search-lexical']='workspace:*'
          data['dependencies']=dict(sorted(data['dependencies'].items()))
          p.write_text(json.dumps(data,indent=2)+'\n')
          p=Path('packages/search-lexical/src/index.ts');s=p.read_text()
          assert "export * from './definition-description';" not in s
          p.write_text("export * from './definition-description';\n"+s)
          p=Path('packages/storage-sqlite/src/definition-reference-reader.ts');s=p.read_text()
          assert 'planDefinitionDescription' not in s
          s="import { planDefinitionDescription, rankDefinitionDescriptions } from '@localmed/search-lexical';\n"+s
          anchor='      const tokens = [...new Set(normalized.match(/[\\p{L}\\p{N}]+/gu) ?? [])];'
          assert s.count(anchor)==1
          s=s.replace(anchor,'      const description = planDefinitionDescription(query);\n'+anchor)
          old='      if (results.length >= limit) return results;'
          assert s.count(old)==1
          new='''      if (results.length >= limit && !description?.descriptive) return results;
                if (description) {
                  const evidence = new Map<string, Row>();
                  // Two bounded indexed branches. No source-body table scan or corpus JS index.
                  for (const expression of [description.conjunction, description.disjunction]) {
                    const candidates = await sql.read(
                      `/* definition-description */ WITH matches AS MATERIALIZED (
                        SELECT rowid, rank AS score FROM definition_reference_fts
                        WHERE definition_reference_fts MATCH ? ORDER BY rank LIMIT 96
                      ) SELECT ${HEADER}, c.id AS chunk_id,
                        substr(c.original_text, 1, 4096) AS evidence, MIN(m.score) AS score
                      FROM matches m JOIN chunks c ON c.rowid = m.rowid
                      JOIN ${links} l ON l.chunk_id = c.id
                      JOIN knowledge_entities e ON e.id = l.entity_id
                      WHERE l.review_status = 'proposed'
                        AND l.link_type IN ('reference:definition','reference:item')
                        AND json_extract(e.metadata_json, '$.coverage') IN ('definition','explicit-definition')
                        AND ${SCOPE}
                      GROUP BY e.id, c.id ORDER BY score, e.id, c.id LIMIT 96`,
                      [expression, ...scope],
                    );
                    if (candidates.length > 96) throw new Error('Reverse definition SQL budget exceeded.');
                    for (const row of candidates) evidence.set(`${string(row['id'], 256)}:${string(row['chunk_id'], 256)}`, row);
                  }
                  const grouped = new Map<string, { row: Row; text: string; retrievalRank: number }>();
                  for (const row of evidence.values()) {
                    const id = string(row['id'], 256);
                    const text = string(row['evidence'], 8192);
                    const previous = grouped.get(id);
                    grouped.set(id, { row, text: [...(previous ? `${previous.text}; ${text}` : text)].slice(0, 4096).join(''),
                      retrievalRank: previous?.retrievalRank ?? grouped.size });
                  }
                  const ranked = rankDefinitionDescriptions(description, [...grouped].map(([id, value]) => ({ id, text: value.text, retrievalRank: value.retrievalRank })));
                  const descriptions = ranked.map((item) => {
                    const value = grouped.get(item.id);
                    if (!value) throw new Error('Unresolved reverse definition identity.');
                    return hit(value.row, 'text');
                  });
                  if (descriptions.length) {
                    const ordered = description.descriptive ? [...descriptions, ...results] : [...results, ...descriptions];
                    const seen = new Set<string>();
                    return ordered.filter((item) => {
                      if (seen.has(item.id)) return false;
                      seen.add(item.id); return true;
                    }).slice(0, limit);
                  }
                }'''
          # Strip the fixed heredoc indentation, leaving the original six-space method body.
          lines=new.splitlines();new='\n'.join(line[10:] if line.startswith('                ') else line for line in lines)
          s=s.replace(old,new);p.write_text(s)
          PY
      - name: Locked tooling and scoped regression checks
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          # Only adds an existing internal workspace edge; no external package version is changed.
          env -i PATH="$PATH" HOME="$HOME" bun install
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write \
            packages/search-lexical/src/definition-description.ts packages/search-lexical/src/definition-description.test.ts \
            packages/search-lexical/src/index.ts packages/storage-sqlite/src/definition-reference-reader.ts \
            packages/storage-sqlite/tests/definition-description-search.test.ts tools/benchmarks/definition-description-audit.ts
          env -i PATH="$PATH" HOME="$HOME" bun run --cwd packages/search-lexical typecheck
          env -i PATH="$PATH" HOME="$HOME" bun run --cwd packages/storage-sqlite typecheck
          env -i PATH="$PATH" HOME="$HOME" bun run --cwd apps/app typecheck
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run \
            packages/search-lexical/src/definition-description.test.ts \
            packages/storage-sqlite/tests/definition-description-search.test.ts \
            packages/storage-sqlite/tests/definition-reference-layout.test.ts \
            packages/storage-sqlite/tests/definition-reference-metadata.test.ts \
            --reporter=json --outputFile=data/build/definition-description-vitest.json
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_selected_definition_excerpts.py tools/ingest/tests/test_definition_reference_pack.py \
            tools/ingest/tests/test_definition_reference_scope.py tools/ingest/tests/test_definition_name_inventory.py \
            tools/ingest/tests/test_definition_name_completions.py --junitxml=data/build/description-content-tests.xml
      - name: Compile inspected MSD definitions without duplicating existing definition names
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from localmed_ingest.definition_reference_pack import Projection,encoded
          from localmed_ingest.definition_reference_scope import definition_scope
          from localmed_ingest.definition_source_manifest import read_source_manifest,write_source_manifest
          from localmed_ingest.definition_name_inventory import read_name_manifest,add_name_inventory
          from localmed_ingest.definition_name_completions import read_completion_manifest,apply_name_completions
          from localmed_ingest.selected_definition_excerpts import compile_selected_definitions
          def guard(event,args):
              if event in {'socket.connect','socket.getaddrinfo'}: raise RuntimeError('Compilation must be offline')
          sys.addaudithook(guard)
          root=Path.cwd();manifest=root/'content/definition-drafts/source-inputs.json'
          original=json.loads(manifest.read_bytes());inputs,_=read_source_manifest(root,manifest)
          p=Projection()
          def load(path):
              raw=path.read_bytes();return json.loads(raw),hashlib.sha256(raw).hexdigest()
          for path in inputs:p.add(*load(path))
          selected,_=definition_scope(p.entries);p.entries={key:value for key,value in p.entries.items() if key in selected}
          for path in read_name_manifest(root):add_name_inventory(p,*load(path))
          for path in read_completion_manifest(root):apply_name_completions(p,*load(path))
          names={name for entry in p.entries.values() if entry.coverage in {'definition','explicit-definition'} for name in entry.names}
          authoring=root/'content/reference-authoring/msd-definitions-2026.09.23-b.json'
          catalog,report=compile_selected_definitions(json.loads(authoring.read_bytes()),names)
          report['authoringFileSha256']=hashlib.sha256(authoring.read_bytes()).hexdigest()
          report['previousManifest']=original
          if catalog['terms']:
              destination=root/'content/definition-drafts/msd-definitions-2026.09.23-b.json'
              assert not destination.exists()
              destination.write_text(encoded(catalog)+'\n',encoding='utf-8')
              write_source_manifest(root,(*inputs,destination),manifest)
          Path('data/build/msd-description-intake.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({key:report[key] for key in ['selectedDefinitions','selectedIds','deferred']},ensure_ascii=False,indent=2))
          PY
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import runpy,sys
          def guard(event,args):
              if event in {'socket.connect','socket.getaddrinfo'}: raise RuntimeError('Build must be offline')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.23-reverse-definitions-1','--built-at','2026-09-23']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
      - name: Same-corpus baseline and exhaustive exact-name regression audit
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/definition-description-audit.ts \
            apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-reverse-definitions-1.db \
            packages/storage-sqlite/src/.definition-reader-baseline.ts \
            docs/research/definition-description-search-2026-09-23.json
      - name: Verify source fidelity and record actual scope
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import hashlib,json,sqlite3,xml.etree.ElementTree as ET
          from pathlib import Path
          from localmed_ingest.definition_reference_pack import Projection
          from localmed_ingest.definition_source_manifest import read_source_manifest
          root=Path.cwd();rpath=root/'docs/research/definition-description-search-2026-09-23.json'
          r=json.loads(rpath.read_bytes());intake=json.loads(Path('data/build/msd-description-intake.json').read_bytes())
          previous=intake.pop('previousManifest')
          for row in previous['inputs']:
              raw=(root/row['path']).read_bytes();assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          p=Projection();inputs,_=read_source_manifest(root,root/'content/definition-drafts/source-inputs.json')
          for path in inputs:
              raw=path.read_bytes();p.add(json.loads(raw),hashlib.sha256(raw).hexdigest())
          database=root/'apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-reverse-definitions-1.db'
          with sqlite3.connect(f'{database.as_uri()}?mode=ro',uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert not db.execute('PRAGMA foreign_key_check').fetchall()
              for identifier,(_,block) in p.chunks.items():
                  row=db.execute('SELECT original_text,metadata_json FROM chunks WHERE id=?',(identifier,)).fetchone()
                  assert row and row[0]==block.original_text and json.loads(row[1])==block.metadata
              for table in ('knowledge_facts','knowledge_relations'):
                  assert db.execute(f'SELECT count(*) FROM {table}').fetchone()==(0,)
          suites=ET.parse('data/build/description-content-tests.xml').getroot()
          pytests={key:sum(int(row.get(key,'0')) for row in suites.findall('testsuite')) for key in ['tests','failures','errors','skipped']}
          js=json.loads(Path('data/build/definition-description-vitest.json').read_bytes())
          assert js['numFailedTests']==0 and pytests['failures']==pytests['errors']==0
          r.update({'checkedCommit':'${{ github.sha }}','runId':'${{ github.run_id }}','pythonTests':pytests,
            'vitest':{'passed':js['numPassedTests'],'failed':js['numFailedTests'],'total':js['numTotalTests']},
            'typechecks':['search-lexical','storage-sqlite','app'],'msdIntake':intake,
            'unchangedExistingSourceFiles':True,'sourceBlocksCompared':len(p.chunks),
            'installedBytes':database.stat().st_size,'downloadBytes':Path(str(database)+'.gz').stat().st_size})
          rpath.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          note=f'''# Definition description handler and MSD intake — 2026-09-23

          The exact-name path remains first and unchanged. A separate description query plan removes
          only anchored navigation framing, reuses the existing light Russian stemmer with limited
          case-ending support, and searches definition/item evidence through two bounded FTS branches.
          At most 192 evidence rows, 4096 Unicode characters per row and 20 returned cards. Shared
          blocks for a candidate are bounded again to 4096 characters before ranking. No corpus JS
          index, new SQLite owner, neural model, remote query or new external dependency.

          Ranking measures distinct feature coverage, rarity within the bounded pool and proximity,
          rather than accepting one common word. Clause-local absence cues are retained; this is not
          general semantic entailment or clinical negation/subject/time understanding. Exact source
          texts and locators remain unchanged. Long descriptions, remote synonyms, ambiguous clauses
          and evidence beyond the bounded text window are limitations. Existing lexical fallback
          remains when no bounded description candidate qualifies; never infer a diagnosis/confidence.

          ## Actual same-corpus comparison

          Frozen authored source-derived cases: {r['corpusEligible']}/{r['cases']} present in corpus.
          Before Top-1/Top-20: {r['before']['top1']}/{r['before']['top20']}.
          After Top-1/Top-20: {r['after']['top1']}/{r['after']['top20']}.
          Exact-name queries compared: {r['exactIdentityGuard']['checked']}; changes: {len(r['exactIdentityGuard']['changes'])}.
          Both readers used the same complete new database; new source acquisition is not credited
          as a ranking gain. All misses/rank regressions and negative controls remain in JSON.
          These queries are not independent clinical/colloquial evaluation, nor an Android benchmark.
          No per-query aliases or target-specific rules were added and gold was not changed.

          MSD candidates inspected: {intake['candidates']}; added: {intake['selectedDefinitions']};
          existing-definition names deferred: {len(intake['deferred'])}. One source sentence per
          selected title, with original wording and available source author/reviewer/edition fields.
          Full HTML is not archived: hashes bind selected excerpts/prepared inputs, not original pages.
          Medical review and redistribution review remain open. No full articles or scoring rules.
          Original sources remain unchanged; compared {len(p.chunks)} source blocks in final SQLite.

          Passed {pytests['tests']} Python tests and {js['numPassedTests']} selected Vitest cases.
          Search-lexical, storage-sqlite and app typechecks passed. No whole-repository CI claim.
          Installed SQLite: {r['installedBytes']} bytes; gzip: {r['downloadBytes']} bytes.
          These are file sizes, not target-device RAM. No APK, release, merge, model or UI migration.

          Reproduce: prepare DEV version `2026.09.23-reverse-definitions-1`, then run
          `tools/benchmarks/definition-description-audit.ts` with the database, the pinned baseline
          reader (commit ed4c84a) and a new report path. The complete numerical outcome is in
          `definition-description-search-2026-09-23.json`.
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())
          Path('docs/research/definition-description-delivery-2026-09-23.md').write_text(note+'\n')
          for name in ('docs/CURRENT_STATE.md','docs/DEFINITION_REFERENCE_PLAN.md'):
              path=Path(name);heading,body=path.read_text().split('\n',1)
              section=f"## Reverse definition handler — 2026-09-23\n\nAdded {intake['selectedDefinitions']} selected MSD definitions and a bounded description-to-term path. Exact identity lookup remains first. Same-corpus developer Top-20: {r['before']['top20']} → {r['after']['top20']} / {r['corpusEligible']}. All {r['exactIdentityGuard']['checked']} exact-name outputs are unchanged. This is not independent clinical search qualification. Full bounds, source limits and remaining misses: `research/definition-description-delivery-2026-09-23.md` and its JSON. No model, APK or release.\n\n"
              path.write_text(heading+'\n\n'+section+body)
          PY
      - name: Persist verified scoped work and remove this temporary workflow
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/definition-description-qualify.yml
          git add packages/search-lexical/src/definition-description.ts packages/search-lexical/src/definition-description.test.ts packages/search-lexical/src/index.ts packages/storage-sqlite/src/definition-reference-reader.ts packages/storage-sqlite/package.json packages/storage-sqlite/tests/definition-description-search.test.ts bun.lock tools/benchmarks/definition-description-audit.ts content/definition-drafts/source-inputs.json docs/research/definition-description-search-2026-09-23.json docs/research/definition-description-delivery-2026-09-23.md docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md
          if [ -f content/definition-drafts/msd-definitions-2026.09.23-b.json ]; then git add content/definition-drafts/msd-definitions-2026.09.23-b.json; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(search): qualify inverse definition lookup and selected MSD content [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then git switch --detach "$remote"; git cherry-pick "$own"; fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: No artifact or model upload
        if: always()
        run: echo 'No personal sources, models, Actions artifacts/cache, binary database, APK or release uploaded.' >> "$GITHUB_STEP_SUMMARY"
