name: Specialist teaching source batch
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/specialist-teaching-batch.yml]
permissions:
  contents: write
concurrency:
  group: minimed-specialist-teaching-batch
  cancel-in-progress: false
jobs:
  collect-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Source archive window and empty-batch diagnostics
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('tools/ingest/src/localmed_ingest/specialist_teaching_discovery.py');s=p.read_text()
          pairs=[
              ('issues_per_journal: int = 12, articles_per_journal: int = 18\n', 'issues_per_journal: int = 12, articles_per_journal: int = 18,\n    *, issue_offset: int = 0\n'),
              ('    if output.exists() or not 1 <= issues_per_journal <= 16', '    if not 0 <= issue_offset <= 200:\n        raise ValueError("Invalid bounded issue offset")\n    if output.exists() or not 1 <= issues_per_journal <= 16'),
              ('for issue in issues[:issues_per_journal]:', 'for issue in issues[issue_offset : issue_offset + issues_per_journal]:'),
              ('"issuesPerJournalLimit": issues_per_journal,', '"issuesPerJournalLimit": issues_per_journal,\n        "issueOffset": issue_offset,'),
              ('    args = parser.parse_args()\n', '    parser.add_argument("--issue-offset", type=int, default=0)\n    args = parser.parse_args()\n'),
              ('result = discover(args.root, args.output)', 'result = discover(args.root, args.output, issue_offset=args.issue_offset)'),
          ]
          if 'issue_offset: int' not in s:
              for old,new in pairs:
                  assert s.count(old)==1,old
                  s=s.replace(old,new)
          ast.parse(s);p.write_text(s)
          p=Path('tools/ingest/src/localmed_ingest/specialist_journal_collect.py');s=p.read_text()
          old='        if not counts["articles"]:\n            raise ValueError("No selected full-text article could be prepared")\n        os.rename(staged, output)'
          new='        os.rename(staged, output)\n        if not counts["articles"]:\n            raise ValueError("No full-text article prepared; diagnostics preserved")'
          if 'diagnostics preserved' not in s:
              assert s.count(old)==1
              s=s.replace(old,new)
          ast.parse(s);p.write_text(s)
          p=Path('tools/ingest/tests/test_specialist_teaching_batch.py');s=p.read_text()
          if 'test_empty_acquisition_preserves_reasons_without_publishing_text' not in s:
              s=s.replace('import copy\n','import copy\nimport json\nfrom pathlib import Path\n')
              s+='''

          def test_empty_acquisition_preserves_reasons_without_publishing_text(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              from localmed_ingest import specialist_journal_collect as collector
              def read(url: str) -> bytes:
                  return b"User-agent: *\\nAllow: /\\n" if url.endswith("robots.txt") else b"<html></html>"
              def unavailable(*_args: object, **_kwargs: object) -> dict[str, object]:
                  raise ValueError("Synthetic unavailable rights")
              def pause(_seconds: float) -> None:
                  return None
              monkeypatch.setattr(collector, "read_original", read)
              monkeypatch.setattr(collector, "capture_page", unavailable)
              monkeypatch.setattr(collector.time, "sleep", pause)
              selection=tmp_path / "selection.json"
              selection.write_text(json.dumps({"version":1,
                  "sourcePolicy":"specialist-medical-sources-2026-09-22",
                  "articles":[{"journal":"RFD","articleId":"1001","focus":"fixture"}]}))
              output=tmp_path / "pending"
              with pytest.raises(ValueError, match="diagnostics preserved"):
                  collector.collect(selection, output)
              report=json.loads((output / "collection-report.json").read_text())
              assert report["articles"][0]["status"] == "pending-source-review"
              assert not list((output / "records").iterdir())
              assert not list((output / "evidence").iterdir())


          def test_issue_offset_is_bounded_before_any_network_request(tmp_path: Path) -> None:
              from localmed_ingest.specialist_teaching_discovery import discover
              for value in (-1, 201):
                  with pytest.raises(ValueError, match="offset"):
                      discover(tmp_path, tmp_path / "output", issue_offset=value)
          '''
          ast.parse(s);p.write_text(s)
          PY
      - name: Locked scoped checks
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/specialist_teaching_discovery.py tools/ingest/src/localmed_ingest/specialist_journal_bundles.py tools/ingest/src/localmed_ingest/specialist_journal_collect.py tools/ingest/tests/test_specialist_teaching_batch.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_specialist_teaching_batch.py \
            tools/ingest/tests/test_specialist_journal_reference.py \
            tools/ingest/tests/test_specialist_journal_inline.py \
            tools/ingest/tests/test_specialist_journal_admission.py \
            tools/ingest/tests/test_definition_reference_pack.py \
            --junitxml=data/build/specialist-teaching-tests.xml
      - name: Discover a declared archival window
        run: |
          if [ ! -f content/definition-drafts/specialist-teaching-discovery-2026.09.22-c/discovery-report.json ]; then
            env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.specialist_teaching_discovery \
              --issue-offset 20 --output content/definition-drafts/specialist-teaching-discovery-2026.09.22-c
          fi
      - name: Collect full text without weakening language or rights gates
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json
          from pathlib import Path
          from localmed_ingest.specialist_journal_collect import collect,replay
          root=Path('content/definition-drafts/specialist-teaching-discovery-2026.09.22-c')
          report=json.loads((root/'discovery-report.json').read_text())
          collections=[]; failures=[]
          for i,name in enumerate(report['selections'],1):
              output=Path(f'content/definition-drafts/specialist-teaching-acquired-2026.09.22-c{i}')
              try:
                  if output.exists():
                      replay(output)
                      result=json.loads((output/'collection-report.json').read_text())
                  else:
                      result=collect(root/name,output)
                  if not result['counts'].get('articles',0): raise ValueError('Previously recorded pending-only batch')
                  collections.append(output.as_posix())
                  print(json.dumps({'batch':i,'counts':result['counts']}))
              except ValueError as error:
                  failures.append({'selection':name,'status':'batch-pending','reason':str(error)[:300]})
          (root/'batch-results.json').write_text(json.dumps({'collections':collections,'failures':failures},indent=2)+'\n')
          if not collections: raise RuntimeError('No eligible full source text; keep candidates pending')
          PY
      - name: Replay source text and activate bounded numeric bundles offline
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json,sys
          from pathlib import Path
          from localmed_ingest.specialist_journal_refresh import compose_selected
          from localmed_ingest.specialist_journal_bundles import activate_bundles,verify_bundles
          def guard(event,args):
              if event in {'socket.connect','socket.__new__','socket.getaddrinfo'}: raise RuntimeError('Offline replay forbids networking')
          sys.addaudithook(guard)
          batches=json.loads(Path('content/definition-drafts/specialist-teaching-discovery-2026.09.22-c/batch-results.json').read_text())
          destination=Path('content/definition-drafts/specialist-teaching-active-2026.09.22-c')
          compose_selected(tuple(Path(p) for p in batches['collections']),destination)
          report=activate_bundles(Path.cwd(),destination,'journal.reference.teaching.2026.09.22-c')
          verify_bundles(destination)
          print(json.dumps({'counts':report['counts'],'records':report['refresh']['combinedRecords']},indent=2))
          PY
      - name: Build complete real SQLite offline
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import runpy,sys
          def guard(event,args):
              if event in {'socket.connect','socket.__new__','socket.getaddrinfo'}: raise RuntimeError('Offline build forbids networking')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.22-specialist-teaching-c','--built-at','2026-09-22']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
      - name: Verify source replay, complete SQLite projection and application reader
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/verify-specialist-journal-reference.py \
            --selected content/definition-drafts/specialist-teaching-active-2026.09.22-c \
            --database apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-teaching-c.db \
            --report data/build/specialist-teaching-fidelity.json --cards data/build/specialist-teaching-cards.json
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/src/verify-specialist-journal-cards.ts \
            apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-teaching-c.db \
            data/build/specialist-teaching-cards.json data/build/specialist-teaching-reader.json
      - name: Record measured content coverage and source boundaries
        run: |
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('content/definition-drafts')
          selection=json.loads((root/'specialist-teaching-active-2026.09.22-c/selection-report.json').read_text())
          discovery=json.loads((root/'specialist-teaching-discovery-2026.09.22-c/discovery-report.json').read_text())
          stem=Path('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-teaching-c.db')
          tests={key:sum(int(s.get(key,'0')) for s in ET.parse('data/build/specialist-teaching-tests.xml').getroot().findall('testsuite')) for key in ('tests','failures','errors','skipped')}
          report={'checkedCommit':'${{ github.sha }}','runId':'${{ github.run_id }}','tests':tests,'strictPythonChecks':'passed','discovery':discovery,'counts':selection['counts'],'refresh':selection['refresh'],'articles':[{k:row.get(k) for k in ('title','journal','doi','publicationDate','articleType','license','nonCommercialOnly','status','reason','records','blocks','names')} for row in selection['articles']],'fidelity':json.loads(Path('data/build/specialist-teaching-fidelity.json').read_text()),'reader':json.loads(Path('data/build/specialist-teaching-reader.json').read_text()),'installedBytes':stem.stat().st_size,'downloadBytes':Path(str(stem)+'.gz').stat().st_size,'boundary':'Dated specialist sources, not current guideline approval or clinical review. Rights/language gates unchanged. No new browser/device/model qualification.'}
          Path('docs/research/specialist-teaching-batch-2026-09-22.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          c=selection['counts'];r=selection['refresh']
          lines=['## Specialist lecture/review batch — 2026-09-22','',
            f"Admitted {c['articles']} source articles; added {r['addedRecords']} source-local records.",
            f"Active corpus: **{r['combinedRecords']}**. Candidate window: offset {discovery['issueOffset']}, up to 12 issues per journal.",
            f"Excluded sentence/context labels: {c.get('excludedCandidateLabels',0)}; pending articles: {c.get('pendingArticles',0)}.",
            'Exact author wording, publication dates, classification variants and source context are retained.',
            'The recent-issue batch did not pass acquisition. Rights/language gates were not relaxed.',
            'These archival sources are not current guideline or clinical approval. No Wikipedia/private inputs added.',
            f"Actual SQLite: {stem.stat().st_size} bytes; gzip: {Path(str(stem)+'.gz').stat().st_size} bytes.",
            f"Passed {tests['tests']} scoped tests, strict Python checks, source replay and complete SQLite fidelity.",
            'Numeric bundles preserve all declared source/block/label-span references reversibly.',
            'Actual reader reconstructs complete source cards. No Android/reverse-search gain inferred.',
            'Evidence: `research/specialist-teaching-batch-2026-09-22.json`.',
            'Prepare DEV version `2026.09.22-specialist-teaching-c`; no binary release or APK.',
            'Content collection remains ahead of compatibility/installer/model work.','']
          for name in ('docs/CURRENT_STATE.md','docs/DEFINITION_REFERENCE_PLAN.md'):
              p=Path(name); first,rest=p.read_text().split('\n',1);p.write_text(first+'\n\n'+'\n'.join(lines)+'\n'+rest)
          print(json.dumps({k:report[k] for k in ('tests','counts','fidelity','reader','installedBytes','downloadBytes')},ensure_ascii=False,indent=2))
          PY
      - name: Commit scoped verified data to the same PR
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add tools/ingest/src/localmed_ingest/specialist_teaching_discovery.py tools/ingest/src/localmed_ingest/specialist_journal_bundles.py tools/ingest/src/localmed_ingest/specialist_journal_collect.py tools/ingest/tests/test_specialist_teaching_batch.py content/definition-drafts/specialist-teaching-discovery-2026.09.22-c content/definition-drafts/specialist-teaching-acquired-2026.09.22-c* content/definition-drafts/specialist-teaching-active-2026.09.22-c content/definition-drafts/source-inputs.json docs/research/specialist-teaching-batch-2026-09-22.json docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): add licensed teaching articles with full source context [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Preserve acquisition checkpoint on failure without activating it
        if: failure()
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f content/definition-drafts/specialist-teaching-discovery-2026.09.22-c/discovery-report.json ]; then exit 0; fi
          git add tools/ingest/src/localmed_ingest/specialist_teaching_discovery.py tools/ingest/src/localmed_ingest/specialist_journal_bundles.py tools/ingest/src/localmed_ingest/specialist_journal_collect.py tools/ingest/tests/test_specialist_teaching_batch.py content/definition-drafts/specialist-teaching-discovery-2026.09.22-c
          for path in content/definition-drafts/specialist-teaching-acquired-2026.09.22-c*; do
            if [ -d "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(content): preserve source acquisition checkpoint; integration not qualified [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free summary
        if: always()
        run: echo 'No private PDF, database binary, model, APK or Actions artifacts uploaded by this source workflow.' >> "$GITHUB_STEP_SUMMARY"
