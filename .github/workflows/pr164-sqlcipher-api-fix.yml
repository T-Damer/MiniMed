name: PR164 pinned SQLCipher API correction
on:
  push:
    branches: [agent/core-open-download-contract]
    paths: [.github/workflows/pr164-sqlcipher-api-fix.yml]
permissions:
  contents: read
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply exact published-API corrections and remove this helper
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          from pathlib import Path
          for name in ['apps/app/android/app/src/main/java/dev/localmed/search/LocalMedDatabasePlugin.java', 'apps/app/android/app/src/androidTest/java/dev/localmed/search/BundledSqliteTest.java']:
              p = Path(name)
              s = p.read_text()
              assert s.count('SQLiteDatabase.create(null)') == 1, name
              p.write_text(s.replace('SQLiteDatabase.create(null)', 'SQLiteDatabase.create(null, new char[0])'))
          p = Path('apps/app/android/app/src/main/java/dev/localmed/search/NativePackDatabase.java')
          s = p.read_text()
          assert s.count('(database, error) -> {') == 1
          s = s.replace('import java.io.File;', 'import java.io.File;\nimport android.database.sqlite.SQLiteDatabaseCorruptException;')
          s = s.replace('(database, error) -> {', 'database -> {')
          s = s.replace('                throw error;', '                SQLiteDatabaseCorruptException error =\n                    new SQLiteDatabaseCorruptException("Content database is corrupt.");\n                throw error;')
          p.write_text(s)
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          old = "Android's existing SQLite bridge now uses the pinned requery engine with bundled FTS5 instead of"
          assert old in s
          p.write_text(s.replace(old, "Android's existing SQLite bridge now uses pinned SQLCipher Community in plaintext mode instead of", 1))
          p = Path('docs/NATIVE_SQLITE.md')
          s = p.read_text()
          s = s.replace('See ADR 0018 for the Android bundled engine and persistent native transfer integration.', 'See ADR 0018 for SQLCipher Community 4.18.0 (empty-key plaintext packs) and persistent native transfers.\nThe pinned artifact requires an explicit empty password for in-memory probes; file opens remain read-only.')
          p.write_text(s)
          Path('.github/workflows/pr164-sqlcipher-api-fix.yml').unlink()
          PY
          git diff --check
      - name: Commit corrected source only to PR164
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = agent/core-open-download-contract
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: match SQLCipher 4.18 probe and corruption callback signatures'
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
