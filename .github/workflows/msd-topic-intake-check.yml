name: MSD topic inventory and definition gaps
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/msd-topic-intake-check.yml]
permissions:
  contents: write
concurrency:
  group: minimed-msd-topic-intake
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Check source boundaries and the actual reader diagnostic before networking
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=['tools/ingest/src/localmed_ingest/msd_topic_intake.py','tools/ingest/tests/test_msd_topic_intake.py','tools/benchmarks/msd-definition-reader-audit.ts','content/definition-drafts/completion-inputs.json']
          Path('data/build').mkdir(parents=True,exist_ok=True)
          Path('data/build/msd-before.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}))
          p=Path(paths[2]);s=p.read_text()
          old="    if (!source || !expectedSource || source['title'] !== expectedSource.title || source['releaseEligible'] !== false) {"
          new="    const descriptor = source?.['source'];\n    if (!descriptor || typeof descriptor !== 'object' || Array.isArray(descriptor) || !expectedSource ||\n      (descriptor as Record<string, unknown>)['title'] !== expectedSource.title ||\n      (descriptor as Record<string, unknown>)['releaseEligible'] !== false) {"
          assert s.count(old)==1,'Source descriptor diagnostic already changed'
          p.write_text(s.replace(old,new))
          Path('tools/benchmarks/.msd-reader-check.json').write_text(json.dumps({'extends':'./tsconfig.json','include':['msd-definition-reader-audit.ts']}))
          PY
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/msd_topic_intake.py tools/ingest/tests/test_msd_topic_intake.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q tools/ingest/tests/test_msd_topic_intake.py tools/ingest/tests/test_definition_name_completions.py tools/ingest/tests/test_definition_reference_pack.py --junitxml=data/build/msd-topic-tests.xml
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write tools/benchmarks/msd-definition-reader-audit.ts
          env -i PATH="$PATH" HOME="$HOME" bunx tsc -p tools/benchmarks/.msd-reader-check.json --noEmit
      - name: Collect advertised topic maps and at most sixty missing-definition pages
        run: env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.msd_topic_intake --output data/build/msd-topic-pass --max-pages 60
      - name: Register source-validated completions
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path.cwd();out=root/'data/build/msd-topic-pass'
          report=json.loads((out/'report.json').read_bytes())
          assert report['definitionsPrepared']>0,'No definitions acquired'
          inventory=root/'content/reference-authoring/msd-topic-inventory-2026.09.23.json'
          completions=root/'content/definition-drafts/msd-topic-completions-2026.09.23.json'
          assert not inventory.exists() and not completions.exists()
          shutil.copyfile(out/'topics.json',inventory);shutil.copyfile(out/'completions.json',completions)
          manifest=root/'content/definition-drafts/completion-inputs.json'
          value=json.loads(manifest.read_bytes());data=completions.read_bytes()
          value['inputs'].append({'path':completions.relative_to(root).as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          manifest.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          report['completionFileSha256']=hashlib.sha256(data).hexdigest()
          report['inventorySha256']=hashlib.sha256(inventory.read_bytes()).hexdigest()
          report['checkedCommit']='${{ github.sha }}';report['runId']='${{ github.run_id }}'
          report['earlierPassedButUnpublishedRun']='35898925103'
          Path('docs/research/msd-topic-intake-2026-09-23.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Build the ordinary knowledge edition without networking
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import runpy,sys
          def guard(event,args):
              if event in {'socket.connect','socket.getaddrinfo'}:raise RuntimeError('Preparation is offline')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.23-msd-topics-1','--built-at','2026-09-23']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/msd-definition-reader-audit.ts apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-msd-topics-1.db content/definition-drafts/msd-topic-completions-2026.09.23.json docs/research/msd-topic-reader-2026-09-23.json
      - name: Verify source projection and record measured delivery scope
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json,sqlite3,xml.etree.ElementTree as ET
          from pathlib import Path
          from localmed_ingest.definition_reference_pack import Projection
          root=Path.cwd();db=root/'apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.23-msd-topics-1.db'
          path=root/'docs/research/msd-topic-intake-2026-09-23.json';report=json.loads(path.read_bytes())
          payload=json.loads((root/'content/definition-drafts/msd-topic-completions-2026.09.23.json').read_bytes())
          projection=Projection();projection.add(payload['catalog'],report['completionFileSha256'])
          build=json.loads(Path(str(db)+'.report.json').read_bytes());assert build['logicalRoundTripEqual']
          with sqlite3.connect(f'{db.as_uri()}?mode=ro',uri=True) as conn:
              assert conn.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert not conn.execute('PRAGMA foreign_key_check').fetchall()
              definitions=conn.execute("SELECT count(*) FROM knowledge_entities WHERE json_extract(metadata_json,'$.coverage') IN ('definition','explicit-definition')").fetchone()[0]
              pending=conn.execute("SELECT count(*) FROM knowledge_entities WHERE json_extract(metadata_json,'$.coverage')='needs-definition'").fetchone()[0]
              for target in payload['targets']:
                  row=conn.execute("SELECT canonical_name,json_extract(metadata_json,'$.coverage') FROM knowledge_entities WHERE id=?",(target['id'],)).fetchone()
                  assert row==(target['expectedTitle'],'definition')
                  roles=conn.execute('SELECT link_type FROM definition_reference_links WHERE entity_id=? ORDER BY id',(target['id'],)).fetchall()
                  assert roles==[('reference:definition',),('reference:annotation',)]
              for identifier,(_,chunk) in projection.chunks.items():
                  row=conn.execute('SELECT original_text,metadata_json FROM chunks WHERE id=?',(identifier,)).fetchone()
                  assert row and row[0]==chunk.original_text and json.loads(row[1])==chunk.metadata
          suites=ET.parse('data/build/msd-topic-tests.xml').getroot()
          report['tests']={k:sum(int(s.get(k,'0')) for s in suites.findall('testsuite')) for k in ('tests','failures','errors','skipped')}
          reader=json.loads(Path('docs/research/msd-topic-reader-2026-09-23.json').read_bytes())
          assert reader['definitionsRead']==report['definitionsPrepared']
          report.update({'definitionsInEdition':definitions,'namesNeedingDefinition':pending,'searchableRecords':build['entries'],'installedBytes':db.stat().st_size,'downloadBytes':Path(str(db)+'.gz').stat().st_size,'logicalRoundTripEqual':True,'newSourceBlocksCompared':len(projection.chunks),'actualReader':{k:reader[k] for k in ['definitionsRead','namedTop1','namedTop20','framedTop1','framedTop20']}})
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          note=f'''# MSD topic inventory and sourced definitions — 2026-09-23

          Inspected all three advertised Russian topic sitemap files: **{report['uniqueTopicUrls']} unique URLs**.
          This is page inventory, not a complete dictionary of terms, and stays outside the phone package.
          Inspected **{report['pagesScheduled']}** scheduled professional-version pages and accepted
          **{report['definitionsPrepared']}** short complete source definitions for previously empty names.
          Other outcomes remain in the acquisition report. No overlong text was truncated to fit.

          The normal knowledge edition now has **{definitions} definition records** and
          **{pending} pending-name records**, **{build['entries']} searchable records** in total.
          Original name IDs and discovery annotations remain intact. Source response, paragraph and
          excerpt hashes are distinguished; only the short source excerpt is stored, not full articles.
          All records remain source-local, medical-review-required and release-ineligible.
          No clinical synonym, canonical merge, executable scale or classification adaptation is inferred.

          **{report['tests']['tests']} scoped Python tests passed**, strict Python and the reader's
          TypeScript checks passed. The normal SQLite build/integrity/round-trip checks passed.
          Actual app reader reconstructed all **{reader['definitionsRead']}** definitions with exact text
          and sources. Named lookup: **{reader['namedTop1']} Top-1 / {reader['namedTop20']} Top-20**;
          framed `Что такое ...?`: **{reader['framedTop1']} Top-1 / {reader['framedTop20']} Top-20**.
          These are source/name checks, not independent paraphrase or clinical search quality.
          Files: **{db.stat().st_size} SQLite bytes / {Path(str(db)+'.gz').stat().st_size} gzip bytes**;
          not device memory. No whole-app/Android evaluation, model integration, binary release or APK.

          Earlier run 35898925103 collected/built successfully but its final push was rejected by a
          concurrent branch advance. This new measured run repeats acquisition and adds the actual
          reader check; publication uses ordinary non-force replay and refuses source-file conflicts.
          The inverse-search companion changes remain untouched by this source intake.

          Reports: `msd-topic-intake-2026-09-23.json`, `msd-topic-reader-2026-09-23.json`.
          Method: `msd-topic-intake-method-2026-09-23.md`.
          Ordinary preparer version: `2026.09.23-msd-topics-1`.
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())
          Path('docs/research/msd-topic-delivery-2026-09-23.md').write_text(note+'\n')
          PY
      - name: Prepare delivery checkout after all source execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: experiment/system-one-search-benchmark
          path: .verified-delivery
      - name: Publish only verified files with bounded non-force replay
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          destination=Path('.verified-delivery');before=json.loads(Path('data/build/msd-before.json').read_text())
          for name,receipt in before.items():
              assert hashlib.sha256((destination/name).read_bytes()).hexdigest()==receipt,'Concurrent change: '+name
          new=['content/reference-authoring/msd-topic-inventory-2026.09.23.json','content/definition-drafts/msd-topic-completions-2026.09.23.json','docs/research/msd-topic-intake-2026-09-23.json','docs/research/msd-topic-reader-2026-09-23.json','docs/research/msd-topic-delivery-2026-09-23.md']
          for name in new:assert not (destination/name).exists(),'Concurrent output: '+name
          for name in [*before,*new]:
              target=destination/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,target)
          PY
          cd .verified-delivery
          git add tools/ingest/src/localmed_ingest/msd_topic_intake.py tools/ingest/tests/test_msd_topic_intake.py tools/benchmarks/msd-definition-reader-audit.ts content/reference-authoring/msd-topic-inventory-2026.09.23.json content/definition-drafts/msd-topic-completions-2026.09.23.json content/definition-drafts/completion-inputs.json docs/research/msd-topic-intake-2026-09-23.json docs/research/msd-topic-reader-2026-09-23.json docs/research/msd-topic-delivery-2026-09-23.md
          git diff --cached --check
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): deliver sourced MSD definitions and measured topic coverage [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:experiment/system-one-search-benchmark; then exit 0; fi
            own=$(git rev-parse HEAD)
            git fetch --no-tags origin refs/heads/experiment/system-one-search-benchmark
            git switch --detach FETCH_HEAD
            git cherry-pick "$own"
          done
          echo 'Concurrent publication remained unresolved; no force push.' >&2
          exit 1
      - name: Scope summary
        if: always()
        run: echo 'No full articles, private documents, models, artifacts, binary database, APK or release uploaded. Topic URL coverage is not terminology completeness.' >> "$GITHUB_STEP_SUMMARY"
