name: Specialty terminology acquisition
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-specialty-collect.yml]
permissions:
  contents: write
concurrency:
  group: minimed-specialty-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Acquire with the existing serial identified API client
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.wikipedia_definitions \
            --config content/definition-drafts/ruwiki-selection-specialties-2026.09.22.json \
            --output content/definition-drafts/ruwiki-specialties-2026.09.22 \
            --cache data/build/ruwiki-specialties-api
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json
          from pathlib import Path
          from localmed_ingest.wikipedia_scope import intake
          folder=Path('content/definition-drafts/ruwiki-specialties-2026.09.22')
          result=intake(folder, Path('content/definition-drafts/ruwiki-selection-specialties-2026.09.22.json'), Path('content/definition-drafts/ruwiki-scope-2026.09.22.json'))
          print(json.dumps({k:result[k] for k in ('acquiredDescriptions','admittedDescriptions','quarantinedAcquiredDescriptions','kinds')},ensure_ascii=False))
          PY
      - name: Persist source evidence only, not yet runtime admission
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add content/definition-drafts/ruwiki-specialties-2026.09.22
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(reference): archive specialty source acquisition for deduplicated admission [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then
            git switch --detach "$remote"
            git cherry-pick "$own"
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage boundary
        if: always()
        run: echo 'Public attributed source evidence only. No runtime manifest change, private documents, database binary, model, APK or Actions artifact upload.' >> "$GITHUB_STEP_SUMMARY"
