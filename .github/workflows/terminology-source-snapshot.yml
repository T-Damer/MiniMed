name: Temporary terminology source snapshot
on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/workflows/terminology-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact tracked source text for local Linux verification
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json, pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          manifest = {}
          with tarfile.open('source-snapshot.tar.gz', 'w:gz') as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if not path.is_file() or path.is_symlink() or path.name.startswith('.env'):
                      continue
                  if name.startswith(('data/', 'content/', 'node_modules/', '.git/')):
                      continue
                  if path.suffix not in {'.ts', '.tsx', '.js', '.mjs', '.py', '.md', '.yml', '.yaml', '.toml', '.json', '.sql', '.css', '.scss', '.astro'}:
                      continue
                  if path.stat().st_size > 50000000:
                      raise ValueError('Unexpected source size: ' + name)
                  archive.add(path, arcname=name, recursive=False)
                  manifest[name] = subprocess.check_output(['git','hash-object',name],text=True).strip()
          pathlib.Path('source-manifest.json').write_text(json.dumps({'sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'blobs': manifest}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: terminology-local-source
          path: |
            source-snapshot.tar.gz
            source-manifest.json
          retention-days: 2
