name: Recover staged PR164 queue patch
on:
  push:
    branches: [agent/core-open-download-contract]
    paths: [.github/workflows/pr164-build-diagnostic.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover known content-addressed patch fragments (no source execution)
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = [
            '211d8d6f532db296161e6cc26b55823519e5d00d',
            '3b800e8dc19d3801a820db0cae7dc3ea4b396da3',
            'aaa15b3386bc5b72d1e0641666c0bc12b1e1e638',
            'c67da4935aff06cd99667f822a97a0300a891021',
            'c7b370a38be830bb829f30adb4a864c91e687539',
            'b82f7265300c930419f53174b96122dd99ac7198',
            'b285f726d96bad2bb57520529ff1225fe0bfd017',
          ]
          out = pathlib.Path('/tmp/queue-recovery'); out.mkdir()
          parts = []
          for i, sha in enumerate(shas):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/T-Damer/MiniMed/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as r: data = json.load(r)
              part = base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest() == sha
              parts.append(part)
              (out/f'part-{i+1}.txt').write_bytes(part)
          stream = b''.join(parts)
          (out/'fragments.base64').write_bytes(stream)
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(base64.b64decode(stream[:len(stream)//4*4]))
          (out/'recovered.patch').write_bytes(patch)
          report = {'partBytes': [len(p) for p in parts], 'patchBytes': len(patch), 'complete': decoder.eof,
                    'sha256': hashlib.sha256(patch).hexdigest(), 'files': patch.decode('utf8', errors='replace').count('diff --git ')}
          (out/'RECOVERY.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          print(patch[-1200:].decode('utf8',errors='replace'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr164-recovered-queue
          path: /tmp/queue-recovery
          retention-days: 7
