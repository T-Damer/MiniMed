name: PR164 bounded build diagnostic
on:
  push:
    branches: [agent/core-open-download-contract]
    paths: [.github/workflows/pr164-build-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Extract errors from the completed native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr164-diagnostic
          gh api /repos/T-Damer/MiniMed/actions/jobs/101520682708/logs > /tmp/pr164-build.log
          python3 - <<'PY'
          import pathlib
          lines=pathlib.Path('/tmp/pr164-build.log').read_text(encoding='utf-8-sig').splitlines()
          hits=[i for i,s in enumerate(lines) if any(t in s for t in ('error:', 'What went wrong:', 'Execution failed', 'FAILURE:', 'BUILD FAILED', 'Could not resolve'))]
          selected=set()
          for i in hits[-15:]: selected.update(range(max(0,i-3),min(len(lines),i+14)))
          output='\n'.join(lines[i] for i in sorted(selected))[-18000:]
          pathlib.Path('/tmp/pr164-diagnostic/errors.txt').write_text(output)
          print(output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr164-build-diagnostic
          path: /tmp/pr164-diagnostic/errors.txt
          retention-days: 1
