name: Apply and qualify recovered PR164 queue
on:
  push:
    branches: [agent/core-open-download-contract]
    paths: [.github/workflows/pr164-build-diagnostic.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Retrieve exact reviewed source patches
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code e8629d18325ff1ddef30b8b7ab3ffedcdc8b6445 HEAD -- . ':!.github/workflows/pr164-build-diagnostic.yml'
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          shas=['211d8d6f532db296161e6cc26b55823519e5d00d','3b800e8dc19d3801a820db0cae7dc3ea4b396da3','aaa15b3386bc5b72d1e0641666c0bc12b1e1e638','c67da4935aff06cd99667f822a97a0300a891021','c7b370a38be830bb829f30adb4a864c91e687539','b82f7265300c930419f53174b96122dd99ac7198','b285f726d96bad2bb57520529ff1225fe0bfd017']
          def blob(sha):
              req=urllib.request.Request(f'https://api.github.com/repos/T-Damer/MiniMed/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['READ_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r: value=json.load(r)
              data=base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          recovered=lzma.LZMADecompressor().decompress(base64.b64decode(b''.join(blob(s) for s in shas)))
          prefix=recovered[:recovered.rfind(b'diff --git ')]
          assert hashlib.sha256(prefix).hexdigest()=='8b3b64ae51c7542d50a4493f5ed231905321b156a86662a2918c8264e90287be'
          tail=lzma.decompress(blob('e7617d91c94b89f1be2fcc6f95ad8364573cb9a6'))
          assert hashlib.sha256(tail).hexdigest()=='0820d44c3b9845b3b266625c0202067be290f24a6090a1b14087c63d8a52f4b9'
          pathlib.Path('/tmp/queue-prefix.patch').write_bytes(prefix)
          pathlib.Path('/tmp/queue-tail.patch').write_bytes(tail)
          PY
      - name: Apply source and remove temporary helper
        run: |
          env -i PATH="$PATH" HOME="$HOME" git apply --check /tmp/queue-prefix.patch
          env -i PATH="$PATH" HOME="$HOME" git apply /tmp/queue-prefix.patch
          env -i PATH="$PATH" HOME="$HOME" git apply --exclude=.github/workflows/pr164-build-diagnostic.yml --check /tmp/queue-tail.patch
          env -i PATH="$PATH" HOME="$HOME" git apply --exclude=.github/workflows/pr164-build-diagnostic.yml /tmp/queue-tail.patch
          rm .github/workflows/pr164-build-diagnostic.yml
          git add -N apps packages docs
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
      - name: Format changed source; full checks remain independent
        run: |
          mkdir -p /tmp/queue-upload
          git diff --name-only -z -- '*.ts' '*.tsx' '*.css' '*.json' | xargs -0 env -i PATH="$PATH" HOME="$HOME" CI=1 bunx biome check --write --max-diagnostics=100 > /tmp/queue-upload/format.log 2>&1 && code=0 || code=$?
          echo "Formatting/lint exit: $code (independent full lint is still required)"
          tail -80 /tmp/queue-upload/format.log
          git diff --check
      - name: Commit only the requested branch, without force
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = agent/core-open-download-contract
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add apps packages docs scripts/check-native-bridge.mjs
          git commit -m 'feat: unify persistent download queue across core modules images ECG speech models and APKs'
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact source diff and portable patch
        if: always()
        run: |
          mkdir -p /tmp/queue-upload
          git diff --binary e8629d18325ff1ddef30b8b7ab3ffedcdc8b6445 > /tmp/queue-upload/changes.patch
          git rev-parse HEAD > /tmp/queue-upload/SOURCE.txt
          python3 - <<'PY'
          import pathlib,subprocess,zipfile,hashlib
          out=pathlib.Path('/tmp/queue-upload')
          (out/'SHA256.txt').write_text(hashlib.sha256((out/'changes.patch').read_bytes()).hexdigest()+'  changes.patch\n')
          names=subprocess.check_output(['git','diff','--name-only','e8629d18325ff1ddef30b8b7ab3ffedcdc8b6445']).decode().splitlines()
          with zipfile.ZipFile(out/'changed-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name)
                  if p.is_file() and not p.is_symlink() and p.stat().st_size<1_000_000:z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr164-uploaded-queue-source
          path: /tmp/queue-upload
          retention-days: 14
  javascript:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
      - name: Independent source and unit checks
        run: |
          mkdir -p /tmp/queue-checks
          result=0
          for task in 'bun run check' 'bun run typecheck' 'bun run test:unit' 'bun run native:source:check' 'bun run build:app'; do
            name=$(echo "$task" | tr ' /:' '---' | tr -cd 'a-zA-Z0-9._-')
            env -i PATH="$PATH" HOME="$HOME" CI=1 bash -c "$task" > "/tmp/queue-checks/$name.log" 2>&1 && code=0 || code=$?
            echo "$task: $code" | tee -a /tmp/queue-checks/status.txt
            tail -70 "/tmp/queue-checks/$name.log"
            if [ "$code" != 0 ]; then result=1; fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr164-queue-checks
          path: /tmp/queue-checks
          retention-days: 7
  browser:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 bun run build:app
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 bunx playwright install --with-deps chromium --only-shell
      - name: Navigation and queue while core remains unavailable
        run: |
          set -o pipefail
          env -i PATH="$PATH" HOME="$HOME" CI=1 bunx playwright test apps/app/e2e/startup-shell.spec.ts apps/app/e2e/unified-downloads.spec.ts --reporter=list 2>&1 | tee queue-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr164-queue-browser
          path: |
            queue-e2e.log
            test-results
          retention-days: 7
  android:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Build complete ARM64 APK with compatible SQLite
        run: |
          mkdir -p /tmp/queue-android
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run build:app > /tmp/queue-android/web-build.log 2>&1
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run native:sync:android
          cd apps/app/android
          set -o pipefail
          env -i PATH="$PATH" HOME="$HOME" JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" CI=1 ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee /tmp/queue-android/build.log
      - name: Record APK provenance and native contents
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,zipfile,shutil
          apk=pathlib.Path('apps/app/android/app/build/outputs/apk/debug/app-debug.apk')
          sha=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libsqlcipher.so' in z.namelist()
              assert 'lib/arm64-v8a/libai-chat.so' in z.namelist()
          out=pathlib.Path('/tmp/queue-android')
          name=f'MiniMed-pr164-queue-{sha[:7]}-arm64-debug.apk'
          shutil.copyfile(apk,out/name)
          (out/'SOURCE.txt').write_text(sha+'\nTest build, not a published release or device qualification.\n')
          (out/'SHA256.txt').write_text(hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()+'  '+name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr164-queue-android
          path: /tmp/queue-android
          retention-days: 7
