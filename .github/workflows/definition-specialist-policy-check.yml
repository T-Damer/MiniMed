name: Specialist reference source policy
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-specialist-policy-check.yml]
permissions:
  contents: write
concurrency:
  group: minimed-specialist-source-policy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Add the source boundary to the normal preparer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare-definition-reference.py');s=p.read_text()
          old='from localmed_ingest.definition_source_manifest import read_source_manifest\n'
          assert s.count(old)==1
          s=s.replace(old,old+'from localmed_ingest.definition_source_policy import require_active_definition_source\nfrom localmed_ingest.definition_reference_pack import obj\n')
          old='    inputs, expected_entries = read_source_manifest(root, source_manifest)\n'
          assert s.count(old)==1
          s=s.replace(old,old+'    for source_input in inputs:\n        require_active_definition_source(obj(json.loads(source_input.read_bytes())))\n')
          p.write_text(s)
          PY
      - name: Locked scoped tests and type checks
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/definition_source_policy.py tools/ingest/tests/test_definition_source_policy.py scripts/prepare-definition-reference.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          mkdir -p data/build/specialist-policy
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_definition_source_policy.py \
            tools/ingest/tests/test_definition_reference_pack.py \
            tools/ingest/tests/test_definition_reference_compact.py \
            --junitxml=data/build/specialist-policy/tests.xml
      - name: Preserve prior selection and regenerate active manifest without deleting source text
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          from localmed_ingest.definition_source_manifest import read_source_manifest, write_source_manifest
          from localmed_ingest.definition_source_policy import is_wikipedia_input, POLICY_ID
          root=Path.cwd()
          manifest=root/'content/definition-drafts/source-inputs.json'
          before=manifest.read_bytes()
          inputs,total=read_source_manifest(root,manifest)
          active=[];excluded=[];lexical=0
          for path in inputs:
              payload=json.loads(path.read_bytes())
              descriptor=next(row for row in json.loads(before)['inputs'] if row['path']==path.relative_to(root).as_posix())
              if is_wikipedia_input(payload): excluded.append(descriptor)
              else:
                  active.append(path)
                  lexical+=sum(isinstance(t.get('id'),str) and t['id'].startswith('ruwikt.') for t in payload['terms'])
          assert excluded and active, 'Selection must exclude only explicit Wikipedia inputs'
          archive=root/'content/definition-drafts/archived-manifests/source-inputs.with-wikipedia-2026.09.22.json'
          archive.parent.mkdir(parents=True,exist_ok=True)
          with archive.open('xb') as handle:handle.write(before)
          staged=root/'data/build/specialist-policy/source-inputs.json'
          selected=write_source_manifest(root,tuple(active),staged)
          read_source_manifest(root,staged)
          assert manifest.read_bytes()==before, 'Source manifest changed during selection'
          assert selected['entries']==total-sum(row['entries'] for row in excluded)
          os.replace(staged,manifest)
          report={'policy':POLICY_ID,'previousRecords':total,'excludedWikipediaRecords':sum(r['entries'] for r in excluded),
              'selectedRecords':selected['entries'],'retainedWiktionaryLexicalSenses':lexical,
              'selectedOtherSourceRecords':selected['entries']-lexical,'excludedInputs':excluded,
              'priorManifestSha256':hashlib.sha256(before).hexdigest(),'activeManifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'archivedManifest':archive.relative_to(root).as_posix(),'sourceFilesDeleted':0,
              'boundary':'Wikipedia only is excluded. Retained sources including Wiktionary are not automatically medically approved. No new specialist articles imported in this policy pass.'}
          Path('data/build/specialist-policy/selection.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Build current selected reference with no network creation
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import runpy,sys
          def offline(event,args):
              if event in ('socket.__new__','socket.connect','socket.getaddrinfo'):
                  raise RuntimeError('Source-policy rebuild is offline')
          sys.addaudithook(offline)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.22-specialist-policy','--built-at','2026-09-22']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
      - name: Verify selected identities and preserved input receipts, record actual measurements
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json,sqlite3,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from localmed_ingest.definition_source_manifest import read_source_manifest
          root=Path.cwd();report=json.loads(Path('data/build/specialist-policy/selection.json').read_text())
          manifest=root/'content/definition-drafts/source-inputs.json'
          inputs,count=read_source_manifest(root,manifest)
          expected={t['id'] for p in inputs for t in json.loads(p.read_bytes())['terms']}
          assert len(expected)==count
          old=json.loads((root/report['archivedManifest']).read_bytes())
          for descriptor in old['inputs']:
              raw=(root/descriptor['path']).read_bytes()
              assert len(raw)==descriptor['bytes'] and hashlib.sha256(raw).hexdigest()==descriptor['sha256']
          db=root/'apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-policy.db'
          build=json.loads(Path(str(db)+'.report.json').read_text())
          with sqlite3.connect(f'file:{db}?mode=ro',uri=True) as connection:
              assert connection.execute('PRAGMA integrity_check').fetchone()==('ok',)
              assert connection.execute('PRAGMA foreign_key_check').fetchall()==[]
              actual={r[0] for r in connection.execute("SELECT id FROM knowledge_entities WHERE json_extract(metadata_json,'$.definitionReference')=1")}
              assert actual==expected and not any(i.startswith('ruwiki.definition.') for i in actual)
              report['sqliteWikipediaRecords']=0
          assert build['logicalRoundTripEqual'] is True and build['entries']==count
          suites=ET.parse('data/build/specialist-policy/tests.xml').getroot().findall('testsuite')
          report.update({'checkedCommit':'${{ github.sha }}','runId':'${{ github.run_id }}',
              'tests':{key:sum(int(s.get(key,'0')) for s in suites) for key in ('tests','failures','errors','skipped')},
              'installedBytes':db.stat().st_size,'downloadBytes':Path(str(db)+'.gz').stat().st_size,
              'sqliteSha256':hashlib.sha256(db.read_bytes()).hexdigest(),'sourceInputsUnchanged':True,
              'exactSelectedIdentitySet':True,'logicalRoundTripEqual':True,'integrity':'ok','foreignKeyViolations':0,
              'strictTypecheck':'passed','newSourceArticles':0,'publishedBinary':False})
          output=root/'docs/research/definition-specialist-policy-2026-09-22.json'
          output.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          header=f'''## Source-policy override: specialist medicine, no Wikipedia — 2026-09-22

          The user rejects Wikipedia as a medical reference source. Stop new Wikipedia collection;
          the normal preparer now rejects direct Wikipedia inputs. Active selection contains
          **{count} records** after excluding **{report['excludedWikipediaRecords']} Wikipedia records**.
          Original files and the preceding manifest are retained as audit evidence, not runtime inputs.
          The retained **{report['retainedWiktionaryLexicalSenses']} Wiktionary senses** are a separate pre-existing
          lexical collection, not professional clinical authority. No new specialist articles were
          imported in this policy pass; other retained sources remain review-required.

          Actual offline rebuild: {report['installedBytes']} SQLite bytes / {report['downloadBytes']} gzip bytes.
          Selected identities match exactly, excluded Wikipedia identities are absent, all input files
          retain their preceding hashes, and numeric-projection round-trip/integrity checks pass.
          This changes future DEV builds, not already installed editions or published APKs.
          Source policy and candidate families: `REFERENCE_SOURCE_POLICY.md`; measured evidence:
          `research/definition-specialist-policy-2026-09-22.json`. New build version:
          `2026.09.22-specialist-policy`. Subsequent work is specialist textbook/reference chapters,
          journals and original guideline/instrument documents, not wiki growth, models or installers.

          '''
          header='\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines())
          for path in ('docs/DEFINITION_REFERENCE_PLAN.md','docs/CURRENT_STATE.md'):
              p=Path(path);s=p.read_text();first,rest=s.split('\n',1)
              assert '## Source-policy override:' not in s
              rest=rest.replace('## Specialty terms and fuller reference sections — 2026-09-22','## Earlier Wikipedia-inclusive selection (superseded) — 2026-09-22',1)
              p.write_text(first+'\n\n'+header+'\n'+rest.lstrip())
          p=Path('AGENTS.md');s=p.read_text();anchor='## Before editing\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,'## Medical source policy (user decision, 2026-09-22)\n\nRead `docs/REFERENCE_SOURCE_POLICY.md` before reference acquisition. Do not collect new Wikipedia\ncontent or put archived Wikipedia records back into the active app manifest. Prioritize specialist\nmedical teaching/reference works, source guidelines and substantive journal articles; assess each\ndocument, not merely the domain. Retain source classifications, versions and detail; no silent\nsubstitution, clinical promotion or rights assumptions. Historical source files remain unchanged.\n\n'+anchor)
          p.write_text(s)
          PY
      - name: Commit only verified selection and source-policy changes
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add scripts/prepare-definition-reference.py tools/ingest/src/localmed_ingest/definition_source_policy.py tools/ingest/tests/test_definition_source_policy.py content/definition-drafts/source-inputs.json content/definition-drafts/archived-manifests/source-inputs.with-wikipedia-2026.09.22.json docs/research/definition-specialist-policy-2026-09-22.json docs/DEFINITION_REFERENCE_PLAN.md docs/CURRENT_STATE.md AGENTS.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): activate specialist-first source selection without Wikipedia [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: No publication or source downloads
        if: always()
        run: echo 'Source-policy selection and offline rebuild only. No source articles, private files, models, binaries, releases or Actions artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"
