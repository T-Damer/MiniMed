name: PR 138 final formatting

on:
  push:
    branches:
      - agent/medication-interaction-checker

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/medication-interaction-checker
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - name: Use semantic unavailable-state output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/app/src/features/search/SearchHome.tsx')
          text = path.read_text(encoding='utf-8')
          opening = '<div class="search-scope-unavailable paper-card">'
          start = text.index(opening)
          text = text[:start] + '<output class="search-scope-unavailable paper-card">' + text[start + len(opening):]
          closing = text.index('\n        </div>\n      </Show>', start)
          text = text[:closing] + '\n        </output>\n      </Show>' + text[closing + len('\n        </div>\n      </Show>'):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and verify changed files
        run: |
          bunx biome check --write \
            apps/app/src/features/interactions/interaction-engine.ts \
            apps/app/src/features/search/SearchHome.tsx
          bun run typecheck
          bun run test:unit
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/app/src/features/interactions/interaction-engine.ts \
            apps/app/src/features/search/SearchHome.tsx
          git commit -m "fix: satisfy final interaction checker checks"
          git push origin HEAD:agent/medication-interaction-checker
