name: Remove completed source transfer
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/source-intake-checkout.yml]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Delete only this pass's already materialized source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/T-Damer/MiniMed/actions/artifacts/10736789424
          echo 'Deleted temporary 9,116,729-byte public-source transfer 10736789424 after local receipt verification; no other artifacts touched.' >> "$GITHUB_STEP_SUMMARY"
