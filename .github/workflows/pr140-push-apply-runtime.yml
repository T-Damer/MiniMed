name: PR 140 push runtime integration

on:
  push:
    branches: [refactor/declarative-assessment-dependencies]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/declarative-assessment-dependencies
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - name: Integrate declarations with module lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('apps/app/src/features/modules/browser-module-runtime.ts')
          text = path.read_text()

          import_line = "import { findAssessmentDependenciesInStore } from '@/features/assessments/assessment-module-dependencies';\n"
          manifest_import = "import { resolveDeclaredAssessmentDependencies } from '@/features/assessments/assessment-module-manifest';\n"
          if manifest_import not in text:
              if import_line not in text:
                  raise SystemExit('dependency scanner import not found')
              text = text.replace(import_line, import_line + manifest_import, 1)

          marker = "  private async scanAssessmentDependencies(\n"
          helper = dedent("""
            private async commitAssessmentDependencies(
              moduleId: string,
              version: string,
              generation: number,
              assessmentIds: readonly string[],
            ): Promise<void> {
              if (!this.isCurrentAssessmentDependencyScan(moduleId, version, generation)) return;
              if (assessmentIds.length > 0) {
                await preloadAssessmentDefinitions(assessmentIds).catch((cause: unknown) => {
                  console.warn(`Unable to preload questionnaires required by ${moduleId}.`, cause);
                });
              }
              if (!this.isCurrentAssessmentDependencyScan(moduleId, version, generation)) return;
              setAssessmentModuleDependencies(moduleId, version, assessmentIds, ASSESSMENT_CATALOG);
            }

          """)
          helper = ''.join(f'  {line}\n' if line else '\n' for line in helper.splitlines())
          if 'private async commitAssessmentDependencies(' not in text:
              if marker not in text:
                  raise SystemExit('scan method marker not found')
              text = text.replace(marker, helper + marker, 1)

          old_descriptor = dedent("""
              if (descriptor?.kind !== 'clinical') {
                if (this.isCurrentAssessmentDependencyScan(moduleId, version, generation)) {
                  removeAssessmentModuleDependencies(moduleId, ASSESSMENT_CATALOG);
                }
                return;
              }
              const bytes = await this.backend.readIndexBytes(moduleId, version);
          """)
          new_descriptor = dedent("""
              if (descriptor?.kind !== 'clinical') {
                if (this.isCurrentAssessmentDependencyScan(moduleId, version, generation)) {
                  removeAssessmentModuleDependencies(moduleId, ASSESSMENT_CATALOG);
                }
                return;
              }

              let declaredAssessmentIds: readonly string[] | null = null;
              try {
                declaredAssessmentIds = resolveDeclaredAssessmentDependencies(
                  descriptor.tags,
                  ASSESSMENT_CATALOG,
                );
              } catch (cause) {
                console.warn(
                  `Unable to parse questionnaire dependency declarations for ${moduleId}; falling back to content scan.`,
                  cause,
                );
              }
              if (declaredAssessmentIds !== null) {
                await this.commitAssessmentDependencies(
                  moduleId,
                  version,
                  generation,
                  declaredAssessmentIds,
                );
                return;
              }

              const bytes = await this.backend.readIndexBytes(moduleId, version);
          """)
          if 'let declaredAssessmentIds: readonly string[] | null = null;' not in text:
              if old_descriptor not in text:
                  raise SystemExit('descriptor block not found')
              text = text.replace(old_descriptor, new_descriptor, 1)

          old_commit = dedent("""
                const assessmentIds = await findAssessmentDependenciesInStore(store);
                if (!this.isCurrentAssessmentDependencyScan(moduleId, version, generation)) return;
                if (assessmentIds.length > 0) {
                  await preloadAssessmentDefinitions(assessmentIds).catch((cause: unknown) => {
                    console.warn(`Unable to preload questionnaires required by ${moduleId}.`, cause);
                  });
                }
                if (!this.isCurrentAssessmentDependencyScan(moduleId, version, generation)) return;
                setAssessmentModuleDependencies(moduleId, version, assessmentIds, ASSESSMENT_CATALOG);
          """)
          new_commit = dedent("""
                const assessmentIds = await findAssessmentDependenciesInStore(store);
                await this.commitAssessmentDependencies(moduleId, version, generation, assessmentIds);
          """)
          if old_commit in text:
              text = text.replace(old_commit, new_commit, 1)
          elif 'await this.commitAssessmentDependencies(moduleId, version, generation, assessmentIds);' not in text:
              raise SystemExit('scan commit block not found')

          path.write_text(text)
          PY
      - name: Format changed files
        run: >-
          bunx biome format --write
          apps/app/src/features/assessments/assessment-module-manifest.ts
          apps/app/src/features/assessments/assessment-module-manifest.test.ts
          apps/app/src/features/modules/browser-module-runtime.ts
      - name: Run focused tests
        run: >-
          bunx vitest run
          apps/app/src/features/assessments/assessment-module-manifest.test.ts
          apps/app/src/features/assessments/assessment-module-dependencies.test.ts
          apps/app/src/features/assessments/assessment-packs.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/app/src/features/assessments/assessment-module-manifest.ts \
            apps/app/src/features/assessments/assessment-module-manifest.test.ts \
            apps/app/src/features/modules/browser-module-runtime.ts
          git commit -m "refactor: prefer declared questionnaire dependencies"
          git push origin HEAD:refactor/declarative-assessment-dependencies
