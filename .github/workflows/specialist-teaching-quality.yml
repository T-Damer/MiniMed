name: Specialist teaching label fidelity
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/specialist-teaching-quality.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Strict source-selection checks
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/specialist_journal_admission.py tools/ingest/tests/test_specialist_teaching_labels.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          mkdir -p data/build
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_specialist_teaching_labels.py \
            tools/ingest/tests/test_specialist_teaching_batch.py \
            tools/ingest/tests/test_specialist_journal_reference.py \
            tools/ingest/tests/test_specialist_journal_inline.py \
            tools/ingest/tests/test_specialist_journal_admission.py \
            tools/ingest/tests/test_definition_reference_pack.py \
            --junitxml=data/build/specialist-teaching-quality-tests.xml
      - name: Recompose the same captured sources without fetching any article
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          from localmed_ingest.definition_source_manifest import read_source_manifest,write_source_manifest
          from localmed_ingest.specialist_journal_refresh import compose_selected
          from localmed_ingest.specialist_journal_bundles import load_selected,activate_bundles,verify_bundles
          def guard(event,args):
              if event in {'socket.connect','socket.__new__','socket.getaddrinfo'}: raise RuntimeError('Offline source QA forbids networking')
          sys.addaudithook(guard)
          root=Path.cwd()
          base=root/'content/definition-drafts'
          previous=base/'specialist-teaching-active-2026.09.22-c'
          current=base/'specialist-teaching-active-2026.09.22-d'
          old_report,old_articles=load_selected(previous)
          verify_bundles(previous)
          batches=json.loads((base/'specialist-teaching-discovery-2026.09.22-c/batch-results.json').read_text())
          report=compose_selected(tuple(Path(p) for p in batches['collections']),current)
          _,new_articles=load_selected(current)
          old_by_source={a['sources'][0]['sourceUrl']:a for a in old_articles}
          new_by_source={a['sources'][0]['sourceUrl']:a for a in new_articles}
          assert set(old_by_source)==set(new_by_source)
          removed=[]
          for url,old in old_by_source.items():
              new=new_by_source[url]
              assert old['sources']==new['sources'] and old['blocks']==new['blocks']
              old_terms={t['id']:t for t in old['terms']}
              new_terms={t['id']:t for t in new['terms']}
              assert new_terms.keys() <= old_terms.keys()
              assert all(t==old_terms[k] for k,t in new_terms.items())
              assert sum(t.get('recordRole')=='article-overview-not-independent-term' for t in new_terms.values())==1
              for key in old_terms.keys()-new_terms.keys():
                  term=old_terms[key]
                  removed.append({'id':key,'title':term['title'],'sourceUrl':url,'labelEvidence':term['labelEvidence'],'textRetainedInArticle':True})
          manifest=base/'source-inputs.json'
          initial=manifest.read_bytes()
          paths,count=read_source_manifest(root,manifest)
          retired={str((root/p).resolve()) for p in old_report['refresh']['newInputs']}
          assert retired <= {str(p) for p in paths}
          retained=tuple(p for p in paths if str(p) not in retired)
          (current/'preceding-manifest.json').write_bytes(initial)
          baseline=current/'without-superseded-bundle.json'
          temporary=write_source_manifest(root,retained,baseline)
          assert temporary['entries']==old_report['refresh']['previousRecords']
          assert manifest.read_bytes()==initial
          manifest.write_bytes(baseline.read_bytes());baseline.unlink()
          report=activate_bundles(root,current,'journal.reference.teaching.2026.09.22-d')
          verify_bundles(current)
          assert report['counts']['articles']==old_report['counts']['articles']
          assert report['counts']['blocks']==old_report['counts']['blocks']
          assert report['counts']['tables']==old_report['counts']['tables']
          assert report['refresh']['combinedRecords']==count-len(removed)
          qa={'beforeRecords':count,'beforeBatchRecords':old_report['counts']['records'],'afterBatchRecords':report['counts']['records'],'afterRecords':report['refresh']['combinedRecords'],'removedStandaloneLabels':sorted(removed,key=lambda r:r['id']),'articleSourcesAndBlocksExact':True,'allRetainedTermsExact':True,'archivedPriorManifestSha256':hashlib.sha256(initial).hexdigest(),'networkRequests':0,'boundary':'Lexical/contextual screening only. Every source paragraph remains readable; no parent name is fabricated for an incomplete subtype and no clinical interpretation is approved.'}
          (current/'label-quality-report.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'counts':report['counts'],'removedLabels':len(removed),'records':qa['afterRecords']},indent=2))
          PY
      - name: Rebuild the final selected dictionary offline
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import runpy,sys
          def guard(event,args):
              if event in {'socket.connect','socket.__new__','socket.getaddrinfo'}: raise RuntimeError('Offline database build forbids networking')
          sys.addaudithook(guard)
          sys.argv=['scripts/prepare-definition-reference.py','--version','2026.09.22-specialist-teaching-d','--built-at','2026-09-22']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
      - name: Compare every source block and reconstruct all admitted cards
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/verify-specialist-journal-reference.py \
            --selected content/definition-drafts/specialist-teaching-active-2026.09.22-d \
            --database apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-teaching-d.db \
            --report data/build/specialist-teaching-quality-fidelity.json --cards data/build/specialist-teaching-quality-cards.json
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/src/verify-specialist-journal-cards.ts \
            apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-teaching-d.db \
            data/build/specialist-teaching-quality-cards.json data/build/specialist-teaching-quality-reader.json
      - name: Record exact new coverage and unmodified source wording
        run: |
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          selected=Path('content/definition-drafts/specialist-teaching-active-2026.09.22-d')
          data=json.loads((selected/'selection-report.json').read_text())
          qa=json.loads((selected/'label-quality-report.json').read_text())
          articles=[a for a in data['articles'] if a.get('status')=='selected-requires-clinical-review']
          tests={key:sum(int(s.get(key,'0')) for s in ET.parse('data/build/specialist-teaching-quality-tests.xml').getroot().findall('testsuite')) for key in ('tests','failures','errors','skipped')}
          database=Path('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialist-teaching-d.db')
          report={'checkedCommit':'${{ github.sha }}','runId':'${{ github.run_id }}','tests':tests,'strictPythonChecks':'passed','counts':data['counts'],'refresh':data['refresh'],'labelReview':qa,'journals':dict(Counter(a['journal'] for a in articles)),'publicationDateRange':[min(a['publicationDate'] for a in articles),max(a['publicationDate'] for a in articles)],'nonCommercialOnlyArticles':sum(a['nonCommercialOnly'] for a in articles),'fidelity':json.loads(Path('data/build/specialist-teaching-quality-fidelity.json').read_text()),'reader':json.loads(Path('data/build/specialist-teaching-quality-reader.json').read_text()),'installedBytes':database.stat().st_size,'downloadBytes':Path(str(database)+'.gz').stat().st_size,'boundary':'Source/label fidelity and file-backed reader, not full clinical or current-guideline review, independent reverse-search performance, UI/device measurement or publication eligibility.'}
          Path('docs/research/specialist-teaching-quality-2026-09-22.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          c=data['counts'];r=data['refresh']
          lines=['## Specialist teaching source intake — final label selection, 2026-09-22','',
            f"Same {c['articles']} complete specialist articles; **{r['addedRecords']}** selected source records.",
            f"Active corpus **{r['combinedRecords']}**; the earlier 18384/153 intermediate intake is superseded.",
            f"Includes {c['articleOverviews']} article cards, {c.get('definitionCandidates',0)} definition candidates and {c.get('sectionCards',0)} source-section cards.",
            f"All {c['blocks']} original blocks and {c['tables']} source tables are unchanged; {len(qa['removedStandaloneLabels'])} additional clause/subtype labels are context-only.",
            'Incomplete stage names are not rewritten into diagnoses or counted as independent terms.',
            'Author dates, classifications and licensing remain explicit; all records require review.',
            f"Actual SQLite: {database.stat().st_size} bytes / {Path(str(database)+'.gz').stat().st_size} gzip bytes.",
            f"Passed {tests['tests']} selected tests, strict checks, source replay, complete SQLite fidelity and actual-reader reconstruction.",
            'Evidence: `research/specialist-teaching-quality-2026-09-22.json`.',
            'Prepare DEV version `2026.09.22-specialist-teaching-d`. No Wikipedia, private source, model, release or APK added.','']
          for name in ('docs/CURRENT_STATE.md','docs/DEFINITION_REFERENCE_PLAN.md'):
              p=Path(name);first,rest=p.read_text().split('\n',1);p.write_text(first+'\n\n'+'\n'.join(lines)+'\n'+rest)
          print(json.dumps({key:report[key] for key in ('tests','counts','journals','publicationDateRange','fidelity','reader','installedBytes','downloadBytes')},ensure_ascii=False,indent=2))
          PY
      - name: Commit only qualified source selection and tests
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add tools/ingest/src/localmed_ingest/specialist_journal_admission.py tools/ingest/tests/test_specialist_teaching_labels.py content/definition-drafts/specialist-teaching-active-2026.09.22-d content/definition-drafts/source-inputs.json docs/research/specialist-teaching-quality-2026-09-22.json docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(content): retain full specialist sources without contextual pseudo-term cards [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: No artifacts or releases
        if: always()
        run: echo 'Offline replay of already captured licensed sources. No source fetch, private input, model, binary database, APK or Actions artifact upload.' >> "$GITHUB_STEP_SUMMARY"
