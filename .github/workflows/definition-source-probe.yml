name: Definition source availability
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe public Wikimedia metadata with identified low-rate requests
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          endpoint='https://ru.wikipedia.org/w/api.php'
          categories=['Категория:Медицинская терминология','Категория:Симптомы заболеваний человека','Категория:Синдромы по алфавиту','Категория:Медицинские шкалы','Категория:Анатомия человека','Категория:Психопатологические синдромы','Категория:Симптомы психических расстройств','Категория:Медицинская диагностика']
          params={'action':'query','format':'json','formatversion':'2','prop':'categoryinfo','titles':'|'.join(categories),'maxlag':'5'}
          request=urllib.request.Request(endpoint+'?'+urllib.parse.urlencode(params),headers={'User-Agent':'MiniMedTermCollector/0.1 (https://github.com/T-Damer/MiniMed; limited source-linked reference research)','Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=35) as response:
              data=json.load(response)
          print(json.dumps(data,ensure_ascii=False))
          time.sleep(1)
          params={'action':'query','format':'json','formatversion':'2','prop':'extracts|revisions|pageprops','titles':'Атаксия|Дисметрия|Шкала комы Глазго','exintro':'1','explaintext':'1','exlimit':'20','rvprop':'ids|timestamp','maxlag':'5'}
          with urllib.request.urlopen(urllib.request.Request(endpoint+'?'+urllib.parse.urlencode(params),headers={'User-Agent':request.headers['User-agent']}),timeout=35) as response:
              data=json.load(response)
          print(json.dumps({'pages':[{'id':p.get('pageid'),'title':p.get('title'),'extractCharacters':len(p.get('extract','')),'revision':p.get('revisions'),'pageprops':p.get('pageprops')} for p in data.get('query',{}).get('pages',[])],'warnings':data.get('warnings'),'error':data.get('error')},ensure_ascii=False))
          PY
