name: Specialty reference rebuild
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-specialty-refresh.yml]
permissions:
  contents: write
concurrency:
  group: minimed-specialty-reference-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Finalize numeric source identities and nonduplicated table provenance
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('tools/ingest/src/localmed_ingest/wikipedia_reference_refresh.py');s=p.read_text()
          start=s.index('    page_id = integer(text(record.term["id"])')
          end=s.index('    html = text(parsed["text"]',start)
          replacement=('    page_id = integer(int(text(record.term["id"]).rsplit(".", 1)[1]), 1)\n'
              '    if integer(parsed["pageid"], 1) != page_id or integer(parsed["revid"], 1) != revision:\n'
              '        raise ValueError("Parsed source belongs to another page or revision")\n')
          s=s[:start]+replacement+s[end:]
          s=s.replace('"tableGeometry": section.tables,','"tableGeometry": [\n'
              '                [[int(bool(cell["header"])), integer(cell["rowspan"], 1),\n'
              '                  integer(cell["colspan"], 1)] for cell in row]\n'
              '                for table in section.tables for row in table\n'
              '            ],\n'
              '            "tableRowCounts": [len(table) for table in section.tables],')
          s=s.replace('"newSourceRecords": len(added), "combinedRecords":', '"newSourceRecords": len(added), "newRecordIds": sorted(added), "combinedRecords":')
          s=s.replace('"sourceType": "wikipedia-api-parsed-sections",','"sourceType": "wikipedia-api-parsed-sections",\n        "tableGeometryEncoding": "header/rowspan/colspan; split rows by tableRowCounts",')
          pairs=[
              ('"tables preserve physical cells and declared spans. Layout, scripts and media omitted. "', '"tables preserve physical cells and declared spans. "\n            "Layout, scripts and media omitted. "'),
              ('"Article revision is pinned; transcluded templates may reflect render-time versions. "', '"Article revision is pinned; "\n            "transcluded templates may reflect render-time versions. "'),
              ('"Exact API response is archived. Table geometry requires review. Media are not copied. "', '"Exact API response is archived. Table geometry requires review. "\n            "Media are not copied. "'),
              ('"Table/list content is reference-only, not approved scoring. Raw archives stay off-device."', '"Table/list content is reference-only, not approved scoring. "\n            "Raw archives stay off-device."'),
          ]
          for old,new in pairs:
              assert old in s
              s=s.replace(old,new)
          compile(s,str(p),'exec');p.write_text(s)
          p=Path('tools/ingest/tests/test_wikipedia_reference_refresh.py');s=p.read_text()
          s=s.replace('import copy\n','import copy\nimport json\n').replace('    import json\n','')
          p.write_text(s)
          PY
      - name: Strict scoped authoring checks and synthetic tests
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          files='tools/ingest/src/localmed_ingest/wikipedia_reference_sections.py tools/ingest/src/localmed_ingest/wikipedia_reference_refresh.py tools/ingest/tests/test_wikipedia_reference_refresh.py scripts/verify-reference-source-refresh.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files
          mkdir -p data/build/definition-specialties
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q \
            tools/ingest/tests/test_wikipedia_reference_refresh.py \
            tools/ingest/tests/test_wikipedia_definitions.py \
            tools/ingest/tests/test_wikipedia_scope.py \
            tools/ingest/tests/test_definition_reference_pack.py \
            tools/ingest/tests/test_definition_reference_compact.py \
            --junitxml=data/build/definition-specialties/tests.xml
      - name: Compose unique new terms and pinned instrument reference sections
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.wikipedia_reference_refresh \
            --collection content/definition-drafts/ruwiki-specialties-2026.09.22 \
            --output content/definition-drafts/ruwiki-reference-2026.09.22-v2 \
            --cache data/build/definition-section-api --date 2026-09-22
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python scripts/prepare-definition-reference.py \
            --version 2026.09.22-specialties-2 --built-at 2026-09-22
      - name: Compare source replay and actual SQLite with network creation prohibited
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python - <<'PY'
          import sys, runpy
          def no_network(event,args):
              if event in ('socket.__new__','socket.connect','socket.getaddrinfo'):
                  raise RuntimeError('Source replay must be offline')
          sys.addaudithook(no_network)
          sys.argv=['scripts/verify-reference-source-refresh.py',
            '--edition','content/definition-drafts/ruwiki-reference-2026.09.22-v2',
            '--incoming','content/definition-drafts/ruwiki-specialties-2026.09.22',
            '--database','apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialties-2.db',
            '--report','data/build/definition-specialties/source-fidelity.json']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
          entries=$(python3 -c 'import json;print(json.load(open("content/definition-drafts/source-inputs.json"))["entries"])')
          env -i PATH="$PATH" HOME="$HOME" bun scripts/verify-definition-reference.ts \
            apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialties-2.db \
            data/build/definition-specialties/reader.json "$entries" corpus
      - name: Read complete upgraded cards through the bounded application reader
        run: |
          cat > scripts/.reference-refresh-read-check.ts <<'TS'
          import { Database } from 'bun:sqlite';
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createSqliteDefinitionReference } from '../packages/storage-sqlite/src/definition-reference-reader';
          const report=JSON.parse(readFileSync('content/definition-drafts/ruwiki-reference-2026.09.22-v2/refresh-report.json','utf8'));
          const db=new Database('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialties-2.db',{readonly:true});
          try {
            const reader=await createSqliteDefinitionReference({async read(sql,params){return db.query(sql).all(...params) as Record<string,unknown>[];}});
            let cards=0,blocks=0,slices=0;const missingNames=[];
            for(const id of report.newRecordIds){
              const card=await reader.getCard(id);assert(card);
              const hits=await reader.search(card.title,20);assert(hits.length<=20);
              if(!hits.some(h=>h.id===id))missingNames.push({id,title:card.title});
            }
            for(const row of report.sectionResults.filter(r=>r.sections)){
              assert(await reader.getCard(row.id));cards++;
              let after: string|undefined;
              do{
                const page=await reader.listBlocks(row.id,after);assert(page.blocks.length<=8);
                for(const b of page.blocks){
                  blocks++;let offset=0;let text='';
                  for(;;){
                    const part=await reader.readBlock(row.id,b.chunkId,offset);assert(part);
                    assert(Array.from(part.text).length<=4096);text+=part.text;slices++;
                    assert(await reader.getSource(part.sourceId));
                    if(part.nextOffset===null)break;
                    assert(part.nextOffset>offset);offset=part.nextOffset;
                  }
                  const stored=db.query('SELECT original_text FROM chunks WHERE id=?').get(b.chunkId) as {original_text:string};
                  assert.equal(text,stored.original_text);
                }
                after=page.next??undefined;
              }while(after);
            }
            const result={newRecordNamesChecked:report.newRecordIds.length,newRecordNamesInTop20:report.newRecordIds.length-missingNames.length,missingNames,enrichedCardsRead:cards,blocksRead:blocks,textSlices:slices,maxTextSliceCodePoints:4096,boundary:'Real SQLite reader, not browser/native or independent reverse-search quality.'};
            writeFileSync('data/build/definition-specialties/cards.json',JSON.stringify(result,null,2)+'\n');
            console.log(JSON.stringify({...result,missingNames:missingNames.length}));
          }finally{db.close();}
          TS
          env -i PATH="$PATH" HOME="$HOME" bun scripts/.reference-refresh-read-check.ts
          rm scripts/.reference-refresh-read-check.ts
      - name: Record measured corpus and content-first progress
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          folder=Path('data/build/definition-specialties')
          refresh=json.loads(Path('content/definition-drafts/ruwiki-reference-2026.09.22-v2/refresh-report.json').read_text())
          fidelity=json.loads((folder/'source-fidelity.json').read_text());reader=json.loads((folder/'reader.json').read_text());cards=json.loads((folder/'cards.json').read_text())
          suites=ET.parse(folder/'tests.xml').getroot()
          stats={k:sum(int(s.get(k,'0')) for s in suites.findall('testsuite')) for k in ('tests','failures','errors','skipped')}
          assert stats['failures']==0 and stats['errors']==0
          archive=Path('apps/app/public/content/definition-reference/minimed.definition.reference.2026.09.22-specialties-2.db.gz')
          result={'inputCommit':'${{ github.sha }}','runId':'${{ github.run_id }}','tests':stats,'refresh':{k:v for k,v in refresh.items() if k not in ('sectionResults','newRecordIds')},'fidelity':fidelity,'reader':reader,'cards':cards,'downloadBytes':archive.stat().st_size,'boundary':'Source collection, real rebuild and bounded reader checks only. No new UI/native/clinical/model qualification.'}
          Path('docs/research/definition-specialties-2026-09-22.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          note=f'''## Specialty terms and fuller reference sections — 2026-09-22\n\nActive corpus: **{refresh['combinedRecords']} source/editorial records**, including\n**{refresh['newSourceRecords']} additional page identities** from the new specialty batch.\nExisting page IDs were not counted twice. {refresh['enrichedCards']} scale/classification\ncards now contain {refresh['renderedSections']} source sections and\n{refresh['renderedTables']} reference tables. Unsupported layouts retain their old whole cards\nand are listed for review. These are not clinically approved or executable instruments.\n\nActual SQLite: {fidelity['sqliteBytes']} installed bytes; {archive.stat().st_size} gzip bytes.\n{stats['tests']} selected tests passed. Every projected source block was compared with SQLite,\nrevision-render records were replayed offline, and full enriched cards were reconstructed\nthrough the bounded reader. Raw HTML/API evidence is excluded from runtime downloads.\nNo private source, released core, APK or model was changed. More collection and substantive\nsource sections remain ahead of compatibility/installer work. Evidence:\n`research/definition-specialties-2026-09-22.json`. Prepare DEV version\n`2026.09.22-specialties-2` through the existing preparer.\n\n'''
          p=Path('docs/CURRENT_STATE.md');s=p.read_text();p.write_text(s.replace('# Current state\n\n','# Current state\n\n'+note,1))
          p=Path('docs/DEFINITION_REFERENCE_PLAN.md');s=p.read_text();p.write_text(s.replace('## Product outcome',note+'## Product outcome',1))
          PY
      - name: Persist scoped verified sources and reports without replacing concurrent work
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add tools/ingest/src/localmed_ingest/wikipedia_reference_sections.py tools/ingest/src/localmed_ingest/wikipedia_reference_refresh.py tools/ingest/tests/test_wikipedia_reference_refresh.py scripts/verify-reference-source-refresh.py content/definition-drafts/ruwiki-reference-2026.09.22-v2 content/definition-drafts/source-inputs.json docs/research/definition-specialties-2026-09-22.json docs/CURRENT_STATE.md docs/DEFINITION_REFERENCE_PLAN.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(reference): add deduplicated specialty terms and sourced instrument sections [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then
            git switch --detach "$remote"
            git cherry-pick "$own"
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: No release or artifact upload
        if: always()
        run: echo 'Attributed public source refresh only. No private text, models, SQLite binaries, release assets, APKs or Actions artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"
