name: Public Russian pilot Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TOOLS_VERSION: 36.0.0
  # Certificate of the persistent prerelease key (secrets MINIMED_ANDROID_*). Every APK must carry
  # it so that a new release installs over the previous one and keeps the user's local data.
  PRERELEASE_CERT_SHA256: 684fde01054b3860f02f406c4d90a55f0c2bb2370f624770848ebbf4d42fb970

jobs:
  build-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release: MiniMed')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Read release metadata
        shell: bash
        run: |
          version="$(bun -p "require('./release.json').version")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "APK_NAME=MiniMed-$version-rf-public-pilot-debug.apk" >> "$GITHUB_ENV"
          echo "APK_LATEST_NAME=MiniMed-android.apk" >> "$GITHUB_ENV"
          echo "CORE_DATABASE_NAME=MiniMed-$version-core.db" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Install and verify release tree
        run: |
          bun install --frozen-lockfile
          uv sync --project tools/ingest --all-groups --locked
          # verify runs benchmark:all: the real-corpus query sets against the released core.db.
          bun run verify
          bun run benchmark:queries:coverage
          bun run benchmark:queries:contracts
          bun run content:rebuild:regulatory
          bun run build:app
          bun run native:sync:android

      - name: Restore the prerelease signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MINIMED_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "MINIMED_ANDROID_KEYSTORE_BASE64 is missing: an ephemeral key would break updates" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minimed-prerelease.p12"

      - name: Assemble debug APK signed with the prerelease key
        working-directory: apps/app/android
        env:
          MINIMED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MINIMED_ANDROID_KEYSTORE_PASSWORD }}
          MINIMED_ANDROID_KEY_ALIAS: ${{ secrets.MINIMED_ANDROID_KEY_ALIAS }}
        run: |
          MINIMED_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/minimed-prerelease.p12" \
            ./gradlew --no-daemon --stacktrace assembleDebug
          rm -f "$RUNNER_TEMP/minimed-prerelease.p12"

      - name: Verify APK, signature and downloadable source-linked corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          apk_source="apps/app/android/app/build/outputs/apk/debug/app-debug.apk"
          apk="release-output/${APK_NAME}"
          apk_latest="release-output/${APK_LATEST_NAME}"
          original_db="apps/app/public/content/core.db"
          release_db="release-output/${CORE_DATABASE_NAME}"
          example_ct="release-output/example-ct.dcm"
          example_mri="release-output/example-mri.nii"

          test -s "$apk_source"
          cp "$apk_source" "$apk"
          cp "$apk" "$apk_latest"
          cp apps/app/src/assets/example-ct.dcm "$example_ct"
          cp apps/app/src/assets/example-mri.nii "$example_mri"
          # Info-ZIP exits 1 when warnings occurred but the operation succeeded. Aligned APKs
          # routinely trigger that, and pipefail would abort before corpus checks.
          unzip_apk() {
            set +e
            unzip "$@"
            local status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
              return 0
            fi
            return "$status"
          }
          unzip_apk -l "$apk" | tee release-output/APK-CONTENTS.txt
          embedded_path="$(awk '$(NF) ~ /(^|\/)core\.db$/ { print $NF; exit }' release-output/APK-CONTENTS.txt)"
          if [ -n "$embedded_path" ]; then
            echo "APK must download core.db at first launch" >&2
            exit 1
          fi

          aapt="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          apksigner="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          "$aapt" dump badging "$apk" | tee release-output/APK-BADGING.txt
          "$aapt" dump permissions "$apk" | tee release-output/APK-PERMISSIONS.txt
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-output/APK-SIGNATURE.txt
          if ! grep -q "Signer #1 certificate SHA-256 digest: ${PRERELEASE_CERT_SHA256}$" \
            release-output/APK-SIGNATURE.txt; then
            echo "APK is not signed with the persistent prerelease key" >&2
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)" APK_FILE="$apk" python3 - <<'PY'
          import hashlib
          import json
          import os
          import sqlite3
          from pathlib import Path

          apk = Path(os.environ['APK_FILE'])
          db_path = Path('apps/app/public/content/core.db')
          report = json.loads(Path('apps/app/public/content/core-report.json').read_text(encoding='utf-8'))
          db = sqlite3.connect(f'file:{db_path}?mode=ro', uri=True)
          try:
              quick_check = db.execute('PRAGMA quick_check').fetchone()[0]
              foreign_key_violations = len(db.execute('PRAGMA foreign_key_check').fetchall())
              pack = db.execute('SELECT id, version, schema_version FROM content_packs').fetchone()
              documents = db.execute(
                  'SELECT id, title, source_type, metadata_json FROM documents ORDER BY id'
              ).fetchall()
              sections = db.execute('SELECT COUNT(*) FROM sections').fetchone()[0]
              chunks = db.execute(
                  'SELECT id, document_version_id, original_text, metadata_json FROM chunks'
              ).fetchall()
              aliases = db.execute('SELECT COUNT(*) FROM aliases').fetchone()[0]
              profiles = db.execute('SELECT COUNT(*) FROM embedding_profiles').fetchone()[0]
              embeddings = db.execute('SELECT COUNT(*) FROM chunk_embeddings').fetchone()[0]
              fts_chunks = db.execute('SELECT COUNT(*) FROM chunks_fts').fetchone()[0]

              assert quick_check == 'ok'
              assert foreign_key_violations == 0
              assert pack and pack[0] == 'minimed.core.ru' and pack[2] == 2
              assert not report['errors']
              assert len(documents) == report['documents']
              assert sections == report['sections']
              assert len(chunks) == fts_chunks == report['chunks']
              assert aliases == report['aliases']
              assert profiles == report['embeddingProfiles']
              assert embeddings == report['embeddings']
              assert all(row[2].strip() for row in chunks)
              source_index = [
                  {'documentId': doc_id, 'title': title, 'sourceType': source_type}
                  for doc_id, title, source_type, _ in documents
              ]
          finally:
              db.close()

          apk_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          db_sha = hashlib.sha256(db_path.read_bytes()).hexdigest()
          assert f'sha256:{db_sha}' == report['outputChecksum']
          evidence = {
              'releaseVersion': os.environ['RELEASE_VERSION'],
              'sourceCommit': os.environ['SOURCE_SHA'],
              'apk': {'path': str(apk), 'sha256': apk_sha, 'bytes': apk.stat().st_size},
              'downloadableDatabase': {
                  'url': (
                      f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/'
                      f'{os.environ["RELEASE_TAG"]}/{os.environ["CORE_DATABASE_NAME"]}'
                  ),
                  'sha256': db_sha,
                  'bytes': db_path.stat().st_size,
                  'pack': {'id': pack[0], 'version': pack[1], 'schemaVersion': pack[2]},
                  'documents': len(documents),
                  'sections': sections,
                  'chunks': len(chunks),
                  'aliases': aliases,
                  'embeddingProfiles': profiles,
                  'embeddings': embeddings,
              },
              'sourceIndex': source_index,
          }
          Path('release-output/APK-SHA256.txt').write_text(f'{apk_sha}  {apk.name}\n', encoding='utf-8')
          Path('release-output/DB-SHA256.txt').write_text(
              f'{db_sha}  {os.environ["CORE_DATABASE_NAME"]}\n', encoding='utf-8'
          )
          Path('release-output/VERIFICATION.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('release-output/SOURCE-INDEX.json').write_text(
              json.dumps(source_index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          cp "$original_db" "$release_db"

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: MiniMed-${{ env.RELEASE_VERSION }}-verification
          path: |
            release-output/*.txt
            release-output/SOURCE-INDEX.json
            release-output/VERIFICATION.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and database GitHub prerelease
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' &&
              contains(github.event.head_commit.message, 'release: MiniMed')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="release-output/${APK_NAME}"
          apk_latest="release-output/${APK_LATEST_NAME}"
          release_db="release-output/${CORE_DATABASE_NAME}"
          example_ct="release-output/example-ct.dcm"
          example_mri="release-output/example-mri.nii"
          notes=$(cat <<EOF
          MiniMed ${RELEASE_VERSION} is a debug-signed engineering prerelease of the offline-first medical reference.

          Changes:
          - signed with a persistent key: from this release on, new APKs install over the previous one and keep local data;
          - updating from 0.6.42 or older still requires removing the old app once (export a notes backup first);
          - search home: an empty query shows «Разделы» with worded counts instead of the endless catalog.

          Catalog packs are downloaded separately, with their preview/review status preserved.
          The browser application is under /app/. The local/GitHub download switch is DEV-only.

          Boundaries:
          - SQL/content-pack schema remains version 2; source identifiers and anchors are preserved;
          - unreviewed content and experimental tools are not clinically qualified;
          - private source libraries, patient data and model weights are not bundled;
          - production signing and physical-device qualification remain outstanding.
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" "$apk_latest" "$release_db" "$example_ct" "$example_mri" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" "$apk_latest" "$release_db" "$example_ct" "$example_mri" --title "MiniMed ${RELEASE_VERSION}" --notes "$notes" --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload "$RELEASE_TAG" release-output/VERIFICATION.json release-output/APK-SHA256.txt release-output/DB-SHA256.txt --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true ]; then
            echo "Draft assets uploaded; update android-latest after final publication."
            exit 0
          fi
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$apk_latest" --clobber
          else
            gh release create android-latest "$apk_latest" --title "MiniMed Android latest" --notes "$notes" --prerelease --target "${GITHUB_SHA}"
          fi
