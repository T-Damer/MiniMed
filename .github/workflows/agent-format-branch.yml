name: Format agent branch

on:
  push:
    branches:
      - agent/l-note-legal-hard-benchmarks

permissions:
  contents: write

jobs:
  biome:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/l-note-legal-hard-benchmarks
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - run: bunx biome check --write .
      - name: Commit safe formatting fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: apply Biome safe fixes"
          git push origin HEAD:agent/l-note-legal-hard-benchmarks
