name: Deploy landing and browser app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "apps/app/**"
      - "content/regulatory-rf-pilot/**"
      - "content/reference-rf-pilot/**"
      - "packages/**"
      - "tools/ingest/**"
      - "package.json"
      - "release.json"
      - "bun.lock"
      - "uv.lock"
      - ".github/workflows/landing-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv sync --project tools/ingest --all-groups --locked
      - name: Download released content databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -p "require('./release.json').version")"
          mkdir -p apps/app/public/content
          # Matching tag is created later by the Android release job; ship without the
          # optional companion packs when this version is not published yet.
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern medications.db --dir apps/app/public/content --clobber \
            || echo "medications.db not on v$version; Pages ships without it"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern ambulatory.db --dir apps/app/public/content --clobber \
            || echo "ambulatory.db not on v$version; Pages ships without it"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern "MiniMed-$version-core.db" --dir apps/app/public/content --clobber \
            || echo "MiniMed-$version-core.db not on v$version; Pages keeps the tracked core pack"
          if [ -f "apps/app/public/content/MiniMed-$version-core.db" ]; then
            mv "apps/app/public/content/MiniMed-$version-core.db" apps/app/public/content/core-demo.db
          fi
      - name: Build regulatory and reference databases
        run: |
          mkdir -p apps/app/public/content
          uv run --project tools/ingest medbase lint --input content/regulatory-rf-pilot
          uv run --project tools/ingest medbase build \
            --input content/regulatory-rf-pilot \
            --output apps/app/public/content/regulatory.db \
            --report apps/app/public/content/regulatory-report.json
          uv run --project tools/ingest medbase lint --input content/reference-rf-pilot
          uv run --project tools/ingest medbase build \
            --input content/reference-rf-pilot \
            --output apps/app/public/content/reference.db \
            --report apps/app/public/content/reference-report.json
      - name: Build landing and browser application
        run: |
          bun run build:landing
          bun run build:app
          mkdir -p apps/app/dist/content
          for pack in medications.db ambulatory.db; do
            if [ -f "apps/app/public/content/$pack" ]; then
              cp "apps/app/public/content/$pack" "apps/app/dist/content/$pack"
            fi
          done
          mkdir -p apps/landing/dist/app
          cp -R apps/app/dist/. apps/landing/dist/app/
          touch apps/landing/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
