name: Deploy landing and browser app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "apps/app/**"
      - "packages/**"
      - "package.json"
      - "release.json"
      - "bun.lock"
      - ".github/workflows/landing-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - name: Download released medication database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -p "require('./release.json').version")"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern medications.db --dir apps/app/public/content --clobber
      - name: Build landing and browser application
        run: |
          bun run build:landing
          bun run build:app
          mkdir -p apps/landing/dist/app
          cp -R apps/app/dist/. apps/landing/dist/app/
          touch apps/landing/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
