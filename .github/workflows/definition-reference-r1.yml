name: Verify SQLite definition reference R1
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/definition-reference-r1.yml]
permissions:
  contents: write
concurrency:
  group: minimed-definition-reference-r1
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'T-Damer/MiniMed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
          no-cache: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Complete reference-only index construction and owned connection cleanup
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ingest/src/localmed_ingest/definition_reference_pack.py')
          s=p.read_text()
          old='                    for index, (role, chunk_id) in enumerate(entry.links):'
          assert s.count(old)==1
          new='''                    database.execute(
                                  "INSERT INTO knowledge_fts("
                                  "entity_id, canonical_name, aliases, facts, relations) "
                                  "VALUES (?, ?, ?, ?, ?)",
                                  (entry.id, entry.title, " ".join(entry.names[1:]), "", ""),
                              )
          '''.rstrip()+'\n'+old
          s=s.replace(old,new)
          s=s.replace('from dataclasses import dataclass, field', 'from contextlib import closing\nfrom dataclasses import dataclass, field')
          s=s.replace('with sqlite3.connect(staged) as database:', 'with closing(sqlite3.connect(staged)) as database, database:')
          old='            integrity, foreign_keys, *_ = inspect_integrity(staged)'
          assert s.count(old)==1
          s=s.replace(old,'            with closing(sqlite3.connect(staged)) as compact_database:\n                compact_database.execute("VACUUM")\n'+old)
          old='    if not isinstance(value, dict) or any(not isinstance(key, str) for key in value):'
          assert s.count(old)==1
          s=s.replace(old,'    if not isinstance(value, dict):\n        raise ValueError("Expected a JSON object")\n    if any(not isinstance(key, str) for key in cast(dict[object, object], value)):')
          s=s.replace('# Module-local numbers are not global identity. Exact descriptors can be shared across shards.', '# Module-local numbers are not global identity.\n            # Exact source descriptors can be shared across shards.')
          for old,new in [
            ('"INSERT INTO knowledge_document_links VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"', '"INSERT INTO knowledge_document_links "\n                            "VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"'),
            ('"INSERT INTO definition_reference_fts(definition_reference_fts) VALUES (\'rebuild\')"', '"INSERT INTO definition_reference_fts(definition_reference_fts) "\n                    "VALUES (\'rebuild\')"'),
            ('"INSERT INTO definition_reference_fts(definition_reference_fts, rank) VALUES (\'integrity-check\', 1)"', '"INSERT INTO definition_reference_fts(definition_reference_fts, rank) "\n                    "VALUES (\'integrity-check\', 1)"'),
            ('"Source-local draft navigation only. No approved knowledge facts/relations, app lifecycle or Android qualification."', '("Source-local draft navigation only. "\n                "No approved facts/relations, app lifecycle or Android qualification.")'),
          ]:
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Install locked tools and format only touched files
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format tools/ingest/src/localmed_ingest/definition_reference_pack.py tools/ingest/tests/test_definition_reference_pack.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix tools/ingest/src/localmed_ingest/definition_reference_pack.py tools/ingest/tests/test_definition_reference_pack.py
          env -i PATH="$PATH" HOME="$HOME" bunx biome check --write packages/storage/src/definition-reference.ts packages/storage/src/index.ts packages/storage-sqlite/src/definition-reference-reader.ts packages/storage-sqlite/src/index.ts scripts/verify-definition-reference.ts
          env -i PATH="$PATH" HOME="$HOME" bun run schema:generate
          env -i PATH="$PATH" HOME="$HOME" bun run schema:check
      - name: Validate source projection and strict storage types
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright tools/ingest/src/localmed_ingest/definition_reference_pack.py tools/ingest/tests/test_definition_reference_pack.py
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q tools/ingest/tests/test_definition_reference_pack.py
          env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p packages/storage/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" bunx tsc --noEmit -p packages/storage-sqlite/tsconfig.json
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run packages/core/src/definition-catalog.test.ts packages/core/src/extracted-definition-catalog.test.ts packages/storage-sqlite/tests/opfs-pack.test.ts
          env -i PATH="$PATH" HOME="$HOME" bunx vitest run packages/storage-sqlite/tests/sqlite-medical-store.test.ts -t 'projects identities and ranking fields'
      - name: Build synthetic boundary fixture and entire checked-in definition corpus
        run: |
          env -i PATH="$PATH" HOME="$HOME" PYTHONPATH=tools/ingest/src:tools/ingest/tests uv run --project tools/ingest python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from localmed_ingest.definition_reference_pack import build_definition_reference,digest,obj,seq
          from test_definition_reference_pack import fixture,write_input
          out=Path('data/build/reference-r1');out.mkdir(parents=True,exist_ok=True)
          data=fixture()
          blocks=seq(data['blocks'],100)
          body='😀аб'*5000
          blocks.append({'id':99,'source':1,'text':body,'path':'chapter','locator':'Synthetic Unicode pagination block','textSha256':digest(body)})
          seq(data['terms'],100).append({'id':'fixture.long','title':'Длинный проверочный термин','kind':'term','aliases':[], 'blockIds':[99], 'itemBlocks':[2,3]*6, 'coverage':'definition','note':''})
          write_input(out,data,'fixture.json')
          build_definition_reference((Path('fixture.json'),),out/'fixture.db',input_root=out,edition_id='fixture.reference',version='1',built_at='2026-09-21')
          root=Path('content/definition-drafts')
          manifest=json.loads((root/'clinical-source-excerpts-2026.09.21.json').read_text())
          parts=[]
          for part in manifest['parts']:
              path=root/part['path']
              assert path.resolve().is_relative_to(root.resolve())
              assert hashlib.sha256(path.read_bytes()).hexdigest()==part['sha256']
              parts.append(path)
          assert len(parts)==5
          inputs=(root/'catalog.json',root/'ruwiktionary-2026.9.16.json',root/'prepared-source-excerpts-2026.09.21.json',*parts)
          report=build_definition_reference(inputs,out/'corpus.db',input_root=Path('.'),edition_id='minimed.definition.reference.2026-09-21',version='r1',built_at='2026-09-21')
          assert report['entries']==18133
          Path('docs/research/definition-reference-sqlite-build-2026-09-21.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Exercise real file-backed bounded reads in separate fresh processes
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun scripts/verify-definition-reference.ts data/build/reference-r1/fixture.db docs/research/definition-reference-sqlite-fixture-2026-09-21.json 3 fixture
          env -i PATH="$PATH" HOME="$HOME" bun scripts/verify-definition-reference.ts data/build/reference-r1/corpus.db docs/research/definition-reference-sqlite-runtime-2026-09-21.json 18133 corpus
      - name: Record completed R1 versus pending application work
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('docs/research/definition-reference-sqlite-build-2026-09-21.json').read_text())
          r=json.loads(Path('docs/research/definition-reference-sqlite-runtime-2026-09-21.json').read_text())
          note=f'''## Definition reference execution — R1 (2026-09-21)

          Active plan: [DEFINITION_REFERENCE_PLAN.md](DEFINITION_REFERENCE_PLAN.md). R1 now projects
          all {b['entries']} public draft records into the existing content/knowledge tables, with
          proposed source-local identities, shared source blocks, no approved facts/relations and an
          external-content reference FTS index (numbered migration 006). It keeps the ordinary clinical
          FTS/ranking untouched. The new storage adapter receives an already-owned executor; it does
          not open another worker/connection. Searches return at most 20 headers; source text is read
          only on request in 4,096-code-point pieces; block descriptors are paged in groups of eight.

          Actual file-backed host measurements: SQLite {b['sqliteBytes']} bytes; reader creation
          {r['creationMs']:.3f} ms; source names returning a result {r['namesWithAResult']}/{r['sourceNameSurfaces']}.
          Fresh process RSS before open / after open / after audit:
          {r['rssBytes']['beforeOpen']} / {r['rssBytes']['afterOpen']} / {r['rssBytes']['afterAudit']} bytes.
          These are NOT Android PSS, a peak, or independent reverse-search quality. The audit reads
          bounded batches of source names outside the reader. Reports: research/definition-reference-sqlite-*-2026-09-21.json.

          R2 is next: wire this through the existing installer, database owner and MedicalCore/app,
          then qualify offline restart/update/removal and actual mobile memory. The current DEV UI
          still uses the older JSON preview until that integration is implemented; no silent switch,
          no claim that the app memory issue is already fixed. No private PDF/text, SQLite binaries,
          APK, model weights, release artifacts or merge are published by R1.

          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())
          p=Path('docs/CURRENT_STATE.md');s=p.read_text();head,sep,tail=s.partition('\n');p.write_text(head+'\n\n'+note+'\n'+tail)
          p=Path('docs/TECHNICAL_PLAN.md');s=p.read_text();head,sep,tail=s.partition('\n');p.write_text(head+'\n\n## Active definition-reference subplan\n\nFollow [DEFINITION_REFERENCE_PLAN.md](DEFINITION_REFERENCE_PLAN.md) for the ordered SQLite reference work in PR #180. Current evidence and remaining integration gates are recorded in CURRENT_STATE.md; host storage checks do not qualify the app or Android.\n\n'+tail)
          p=Path('docs/DEFINITION_REFERENCE_PLAN.md');s=p.read_text();start=s.index('### R1 ');end=s.index('### R2 ',start)
          s=s[:start]+s[start:end].replace('- [ ]','- [x]').replace('(active)','(implemented; host storage checks passed)')+s[end:]
          s+='\n- 2026-09-21: R1 implemented and verified on the full 18,133-record public corpus. See the three `research/definition-reference-sqlite-*-2026-09-21.json` reports. Numbered migration 006 adds only the reference projection index/view; ordinary clinical ranking is unchanged. R2–R5 are not completed. The old DEV JSON UI remains in place until the existing-owner application integration is qualified.\n'
          p.write_text(s)
          PY
      - name: Commit only verified source, generated schema, plan and reports
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ingest/src/localmed_ingest/definition_reference_pack.py tools/ingest/tests/test_definition_reference_pack.py packages/storage/src/definition-reference.ts packages/storage/src/index.ts packages/storage-sqlite/src/definition-reference-reader.ts packages/storage-sqlite/src/index.ts packages/storage-sqlite/src/generated/schema.ts scripts/verify-definition-reference.ts docs/DEFINITION_REFERENCE_PLAN.md docs/TECHNICAL_PLAN.md docs/CURRENT_STATE.md docs/research/definition-reference-sqlite-build-2026-09-21.json docs/research/definition-reference-sqlite-fixture-2026-09-21.json docs/research/definition-reference-sqlite-runtime-2026-09-21.json
          git commit -m 'feat(definitions): verify R1 SQLite reference and advance execution plan [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: Storage-free summary
        if: always()
        run: echo 'R1 produces no uploaded Actions artifacts, source PDFs, SQLite binaries, APKs, model weights or releases.' >> "$GITHUB_STEP_SUMMARY"
