name: PR 152 autofix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pr152-autofix
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/minimed-reader-library-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/minimed-reader-library-polish
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3

      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          calculators = Path('apps/app/src/features/calculators/CalculatorsView.tsx')
          text = calculators.read_text(encoding='utf-8')
          if "step={input.inputStep ?? (input.integer ? 1 : 'any')}" not in text:
              pattern = re.compile(
                  r'(?P<indent>\s*)inputmode="decimal"\n'
                  r'(?P=indent)value=\{schemaValues\(\)\[input\.id\] \?\? \'\'\}\n'
                  r'(?P=indent)onInput=\{\(event\) => setSchemaValue\(input\.id, event\.currentTarget\.value\)\}'
              )
              def calculator_input(match: re.Match[str]) -> str:
                  indent = match.group('indent')
                  return (
                      f'{indent}type="number"\n'
                      f"{indent}inputmode={{input.integer ? 'numeric' : 'decimal'}}\n"
                      f'{indent}min={{input.minimum}}\n'
                      f'{indent}max={{input.maximum}}\n'
                      f"{indent}step={{input.inputStep ?? (input.integer ? 1 : 'any')}}\n"
                      f"{indent}value={{schemaValues()[input.id] ?? ''}}\n"
                      f'{indent}onInput={{(event) => setSchemaValue(input.id, event.currentTarget.value)}}'
                  )
              text, count = pattern.subn(calculator_input, text, count=1)
              print(f'calculator constraints patched: {count}')
          calculators.write_text(text, encoding='utf-8')

          editor = Path('apps/app/src/features/notes/NoteMarkdownEditor.tsx')
          text = editor.read_text(encoding='utf-8')
          text = text.replace(
              '<div class="note-markdown-editor__toolbar" aria-label="Форматирование заметки">',
              '<div class="note-markdown-editor__toolbar" role="toolbar" aria-label="Форматирование заметки">',
          )
          text = text.replace(
              '<div class="note-markdown-editor__preview" aria-label="Предпросмотр Markdown">',
              '<div class="note-markdown-editor__preview" role="region" aria-label="Предпросмотр Markdown">',
          )
          text = text.replace(
              "return value.replace(/[\\[\\]]/gu, '').trim();",
              "return value.replaceAll('[', '').replaceAll(']', '').trim();",
          )
          editor.write_text(text, encoding='utf-8')

          markdown = Path('apps/app/src/features/library/SafeMarkdown.tsx')
          text = markdown.read_text(encoding='utf-8')
          text = text.replace(
              '<span class="safe-markdown__math-inline" aria-label={`LaTeX: ${token.text}`}>',
              '<span class="safe-markdown__math-inline" role="math" aria-label={`LaTeX: ${token.text}`}>',
          )
          text = text.replace(
              '<pre class="safe-markdown__math" aria-label="Блок LaTeX">',
              '<pre class="safe-markdown__math" role="math" aria-label="Блок LaTeX">',
          )
          markdown.write_text(text, encoding='utf-8')
          PY

      - name: Format changed sources
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx biome check --write . || true

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: format PR polish and wire calculator constraints'
            git push origin HEAD:codex/minimed-reader-library-polish
          fi
