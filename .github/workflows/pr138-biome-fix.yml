name: PR 138 Biome fix

on:
  push:
    branches:
      - agent/medication-interaction-checker

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/medication-interaction-checker
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - name: Fix deterministic test and accessibility issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checker = Path('apps/app/src/features/interactions/MedicationInteractionChecker.tsx')
          text = checker.read_text(encoding='utf-8')
          text = text.replace(
              '<div class="interaction-examples" aria-label="Примеры проверок">',
              '<div class="interaction-examples" role="group" aria-label="Примеры проверок">',
          )
          checker.write_text(text, encoding='utf-8')

          e2e = Path('apps/app/e2e/medication-interactions.spec.ts')
          text = e2e.read_text(encoding='utf-8')
          text = text.replace(
              "checker.getByText('Противопоказано')",
              "checker.getByText('Противопоказано', { exact: true })",
          )
          e2e.write_text(text, encoding='utf-8')
          PY
      - name: Apply repository formatting
        run: |
          bunx biome check --write \
            apps/app/e2e/medication-interactions.spec.ts \
            apps/app/src/features/interactions/MedicationInteractionChecker.tsx \
            apps/app/src/features/interactions/interaction-engine.test.ts \
            apps/app/src/features/interactions/interaction-engine.ts \
            apps/app/src/features/interactions/interaction-knowledge.ts \
            apps/app/src/features/interactions/interaction-types.ts \
            apps/app/src/features/search/SearchHome.tsx \
            apps/app/src/main.tsx \
            apps/app/src/styles/medication-interactions.css
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/app/e2e/medication-interactions.spec.ts apps/app/src/features/interactions apps/app/src/features/search/SearchHome.tsx apps/app/src/main.tsx apps/app/src/styles/medication-interactions.css
          git commit -m "fix: satisfy interaction checker CI"
          git push origin HEAD:agent/medication-interaction-checker
