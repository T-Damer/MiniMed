name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - run: bunx biome check --max-diagnostics=500 .
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run native:source:check
      - run: bun run build
      - run: bun run benchmark:all
      - run: bun run secrets:check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: false
      - run: uv sync --project tools/ingest --all-groups --locked
      - run: uv run --project tools/ingest medbase lint --input content/fixtures
      - run: uv run --project tools/ingest medbase lint --input content/regulatory-rf-pilot
      - run: uv run --project tools/ingest medbase lint --input content/reference-rf-pilot
      - run: uv run --project tools/ingest ruff format --check tools/ingest/src tools/ingest/tests
      - run: uv run --project tools/ingest ruff check tools/ingest/src tools/ingest/tests
      - run: uv run --project tools/ingest pyright tools/ingest/src tools/ingest/tests
      - run: uv run --project tools/ingest pytest tools/ingest/tests
      - run: >-
          uv run --project tools/ingest medbase build
          --input content/fixtures
          --output data/build/core.db
          --json-output packages/test-fixtures/src/generated/core-demo.json
          --report data/build/core-report.json
      - run: >-
          uv run --project tools/ingest medbase build
          --input content/regulatory-rf-pilot
          --output data/build/rf-regulatory-pilot.db
          --report data/build/rf-regulatory-pilot-report.json
      - run: >-
          uv run --project tools/ingest medbase build
          --input content/reference-rf-pilot
          --output data/build/reference-rf-pilot.db
          --report data/build/reference-rf-pilot-report.json
      - run: git diff --exit-code -- packages/test-fixtures/src/generated/core-demo.json


  search-quality-v2:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'experiment/system-one-search-benchmark' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: false
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project tools/ingest --all-groups --locked
      - name: Restore core and build public pilot
        run: |
          bun run content:restore:core
          bun run content:lint:pilot
          bun run content:build:pilot
      - name: Search benchmark regression tests
        run: >-
          bunx vitest run
          packages/core/src/query-group-ranking.test.ts
          packages/core/src/query-document-index.test.ts
          packages/core/tests/core.test.ts
          tools/benchmarks/src/legacy-training-mask.test.ts
          tools/benchmarks/src/frozen-embedding-baseline.test.ts
          tools/benchmarks/src/linear-reranker-baseline.test.ts
          tools/benchmarks/src/lookup-quality-cases.test.ts
          tools/benchmarks/src/search-quality-dataset.test.ts
      - name: Exact-identity audit + deterministic lookup sample
        run: >-
          bun run --filter @localmed/benchmarks benchmark:lookup-quality --
          --max=500
          --core=apps/app/public/content/core.db
          --report=data/build/search-quality-v2-lookup.json
      - name: Freeze candidates and run reranker ablations
        run: |
          bun run benchmark:freeze-training --             --core=data/build/rf-public-pilot.db             --mode=hybrid             --limit=40
          bun run benchmark:freeze-candidates --             --core=data/build/rf-public-pilot.db             --mode=hybrid             --limit=40
          bun run benchmark:linear-reranker
          bun run benchmark:embedding-baseline
      - name: Print storage-free search summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          build = Path("data/build")
          lookup_path = build / "search-quality-v2-lookup.json"
          linear_path = build / "search-quality-linear-reranker-report.json"
          embedding_path = build / "search-quality-frozen-embedding-report.json"

          print("=== LOOKUP ===")
          if lookup_path.exists():
              lookup = json.loads(lookup_path.read_text())
              print(json.dumps({
                  "eligibleSurfaceCount": lookup.get("eligibleSurfaceCount"),
                  "metrics": lookup.get("metrics"),
                  "identityAudit": lookup.get("identityAudit"),
                  "failures": lookup.get("failures", [])[:10],
              }, ensure_ascii=False, indent=2))
          else:
              print("lookup report missing")

          print("=== LINEAR RERANKER ===")
          if linear_path.exists():
              linear = json.loads(linear_path.read_text())
              print(json.dumps({
                  "train": linear.get("train"),
                  "test": linear.get("test"),
                  "weights": linear.get("model", {}).get("weightsByFeature"),
                  "runtime": linear.get("runtime"),
                  "abstention": linear.get("abstention"),
              }, ensure_ascii=False, indent=2))
          else:
              print("linear report missing")

          print("=== PORTABLE EMBEDDING ===")
          if embedding_path.exists():
              embedding = json.loads(embedding_path.read_text())
              print(json.dumps({
                  "test": embedding.get("test"),
                  "profile": embedding.get("embeddingProfile"),
                  "runtime": embedding.get("runtime"),
                  "abstention": embedding.get("abstention"),
              }, ensure_ascii=False, indent=2))
          else:
              print("embedding report missing")
          PY
          {
            echo "### Search-quality v2"
            echo
            echo "No Actions artifacts or caches are uploaded by this job."
            echo "Benchmark reports remain ephemeral; metrics are printed in the job log."
          } >> "$GITHUB_STEP_SUMMARY"
