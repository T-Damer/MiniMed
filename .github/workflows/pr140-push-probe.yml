name: PR 140 push probe

on:
  push:
    branches: [refactor/declarative-assessment-dependencies]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/declarative-assessment-dependencies
          fetch-depth: 0
      - name: Write one-shot marker
        shell: bash
        run: |
          if test -f .github/pr140-push-probe.txt; then
            exit 0
          fi
          printf 'push workflow executed\n' > .github/pr140-push-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr140-push-probe.txt
          git commit -m "ops: confirm PR 140 branch workflow"
          git push origin HEAD:refactor/declarative-assessment-dependencies
