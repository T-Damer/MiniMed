name: Apply verified terminology source patch

on:
  push:
    branches: [agent/medical-terminology-collector]
    paths: [.github/terminology-transfer/ready.json]

permissions:
  contents: write

concurrency:
  group: terminology-verified-source-transfer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact base and result blobs, then apply source-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, json, pathlib, subprocess
          root = pathlib.Path('.github/terminology-transfer')
          manifest = json.loads((root / 'ready.json').read_text())
          assert manifest['schemaVersion'] == 1 and manifest['parts'] == 4
          paths = manifest['paths']
          assert len(paths) == len(set(paths)) and 1 <= len(paths) <= 60
          assert all(p.startswith(('packages/','apps/app/src/','apps/app/e2e/','tools/ingest/','tools/benchmarks/src/','docs/')) and p.endswith(('.ts','.tsx','.py','.md')) for p in paths)
          assert not any('/generated/' in p or '..' in pathlib.PurePosixPath(p).parts for p in paths)
          for p in paths:
              before = manifest['baseBlobs'][p]
              result = subprocess.run(['git','rev-parse',f'HEAD:{p}'],text=True,capture_output=True)
              assert (result.stdout.strip() if result.returncode == 0 else None) == before, p
          encoded = ''.join((root / f'part-{i}.txt').read_text().strip() for i in range(4))
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == manifest['compressedSha256']
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(data, max_length=160001)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == manifest['uncompressedBytes'] <= 160000
          assert hashlib.sha256(patch).hexdigest() == manifest['sha256']
          target = pathlib.Path('/tmp/terminology-source.patch'); target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(changed) == sorted(paths)
          for p in paths:
              assert subprocess.check_output(['git','hash-object',p],text=True).strip() == manifest['resultBlobs'][p], p
          PY
      - name: Commit exact source changes without force pushing
        env:
          TRANSFER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(search): integrate source-backed terms, occurrences and measured reader lookup'
          auth_header="$(printf 'x-access-token:%s' "$TRANSFER_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:agent/medical-terminology-collector
          git rev-parse HEAD > verification-source-sha.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Install locked dependencies in a clean environment
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
      - name: Source and ingestion verification
        shell: bash
        run: |
          set -euo pipefail
          {
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run check
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run typecheck
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run test:unit
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run python:check
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run native:source:check
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run benchmark:all
            env -i PATH="$PATH" HOME="$HOME" CI=1 bun run secrets:check
          } 2>&1 | tee terminology-checks.log
      - name: Build real application and synthetic terminology browser fixtures
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=1 bun run build:app
          env -i PATH="$PATH" HOME="$HOME" CI=1 uv run --project tools/ingest python tools/ingest/tests/build_terminology_e2e.py data/build/terminology-e2e
          env -i PATH="$PATH" HOME="$HOME" CI=1 bunx playwright install chromium --only-shell --with-deps
      - name: Real Chromium terminology and existing search-reader checks
        shell: bash
        run: |
          set -euo pipefail
          {
            env -i PATH="$PATH" HOME="$HOME" CI=1 bunx playwright test apps/app/e2e/terminology.spec.ts --workers=1 --retries=0 --reporter=list
            env -i PATH="$PATH" HOME="$HOME" CI=1 bunx playwright test apps/app/e2e/search.spec.ts --grep 'toggles the document outline on desktop|renders ordinary lookup on a phone-sized' --workers=1 --retries=0 --reporter=list
          } 2>&1 | tee terminology-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminology-search-reader-evidence
          path: |
            verification-source-sha.txt
            terminology-checks.log
            terminology-browser.log
            test-results
          retention-days: 7
          if-no-files-found: warn
