name: Collect specialist journal draft batch
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/specialist-journal-collect.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.0
          enable-cache: false
      - name: Locked acquisition into unselected source drafts
        run: |
          env -i PATH="$PATH" HOME="$HOME" uv sync --project tools/ingest --all-groups --locked
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.specialist_journal_collect \
            --selection content/definition-drafts/specialist-journal-selection-2026.09.22.json \
            --output content/definition-drafts/specialist-journals-2026.09.22
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest python -m localmed_ingest.specialist_journal_collect \
            --output content/definition-drafts/specialist-journals-2026.09.22 --replay
      - name: Show scoped static and test diagnostics without claiming qualification
        run: |
          files='tools/ingest/src/localmed_ingest/specialist_journal_reference.py tools/ingest/src/localmed_ingest/specialist_journal_collect.py tools/ingest/tests/test_specialist_journal_reference.py'
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff format $files
          set +e
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest ruff check --fix $files > /tmp/journal-lint.txt 2>&1
          lint=$?
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pyright $files > /tmp/journal-types.txt 2>&1
          types=$?
          env -i PATH="$PATH" HOME="$HOME" uv run --project tools/ingest pytest -q tools/ingest/tests/test_specialist_journal_reference.py > /tmp/journal-tests.txt 2>&1
          tests=$?
          set -e
          cat /tmp/journal-lint.txt /tmp/journal-types.txt /tmp/journal-tests.txt
          printf '{"lintExit":%s,"typecheckExit":%s,"testExit":%s,"scope":"Draft diagnostics, not a qualified database build"}\n' "$lint" "$types" "$tests" > docs/research/specialist-journal-draft-diagnostics-2026-09-22.json
      - name: Preserve draft sources but do not change selected app corpus
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add content/definition-drafts/specialist-journals-2026.09.22 tools/ingest/src/localmed_ingest/specialist_journal_reference.py tools/ingest/src/localmed_ingest/specialist_journal_collect.py tools/ingest/tests/test_specialist_journal_reference.py docs/research/specialist-journal-draft-diagnostics-2026-09-22.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): stage original specialist articles with source fidelity and review diagnostics [skip ci]'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
      - name: No publication
        if: always()
        run: echo 'Review-only acquisition. Active manifest unchanged. No Wikipedia, private files, released database, APK, model or Actions artifacts.' >> "$GITHUB_STEP_SUMMARY"
