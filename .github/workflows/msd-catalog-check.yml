name: MSD catalog qualification
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/msd-catalog-check.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect public section structure, never topic prose
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json,hashlib,time,re,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          host='https://www.msdmanuals.com'
          def get(path,limit=16000000):
              time.sleep(5.1)
              request=urllib.request.Request(host+urllib.parse.quote(path,safe='/-._~'),headers={'User-Agent':'MiniMedCatalogResearch/0.1 (+https://github.com/T-Damer/MiniMed)','Accept-Encoding':'identity'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  body=response.read(limit+1)
                  if len(body)>limit:raise ValueError('Metadata budget exceeded')
                  return body
          robots=get('/robots.txt').decode()
          rules=[re.compile(re.escape(line.partition(':')[2].strip()).replace(r'\*','.*')) for line in robots.splitlines() if line.lower().startswith('disallow:') and line.partition(':')[2].strip()]
          def checked(path):
              if any(rule.search(path) for rule in rules):raise ValueError('Robots excluded')
              return get(path)
          class Next(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script' and dict(attrs).get('id')=='__NEXT_DATA__':self.active=True
              def handle_endtag(self,tag):
                  if tag=='script':self.active=False
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
          raw=checked('/ru/professional/неврологические-расстройства')
          p=Next();p.feed(raw.decode());pp=json.loads(''.join(p.parts))['props']['pageProps']
          def shape(v,depth=0):
              if depth>9:return type(v).__name__
              if isinstance(v,dict):return {key:shape(value,depth+1) for key,value in v.items()}
              if isinstance(v,list):return {'length':len(v),'firstShape':shape(v[0],depth+1) if v else None}
              return type(v).__name__
          result={'checkedCommit':'${{ github.sha }}','sectionSha256':hashlib.sha256(raw).hexdigest(),'sectionShape':None,'metadataExamples':[]}
          for comp in pp['componentProps'].values():
              item=comp.get('fields',{}).get('data',{}).get('item',{})
              if 'SectionChildrens' not in item:continue
              result['sectionShape']=shape(item['SectionChildrens'])
              def examples(v,path=''):
                  if isinstance(v,dict):
                      small={}
                      for k,x in v.items():
                          if isinstance(x,str) and any(t in k.lower() for t in ('name','title','path','url','id')) and len(x)<500 and '<' not in x:small[k]=x
                          elif isinstance(x,dict) and k.lower().endswith(('name','title','url')):
                              small[k]={a:b for a,b in x.items() if a in ('value','path') and isinstance(b,str) and len(b)<500 and '<' not in b}
                      if small and len(result['metadataExamples'])<15:result['metadataExamples'].append({'path':path,'values':small})
                      for k,x in v.items():examples(x,path+'/'+k)
                  elif isinstance(v,list):
                      for i,x in enumerate(v[:2]):examples(x,path+'/'+str(i))
              examples(item['SectionChildrens'])
          raw=checked('/ru/sitemap.xml');xml=ET.fromstring(raw)
          result['sitemaps']=[node.text for node in xml.findall('.//{*}loc')]
          matches=[v for v in result['sitemaps'] if '/professional-topic' in v]
          if matches:
              path=urllib.parse.urlsplit(matches[0]).path;raw=checked(path);xml=ET.fromstring(raw)
              result['topicSitemap']={'path':path,'root':xml.tag,'count':len(xml.findall('.//{*}loc')),'firstUrl':ET.tostring(list(xml)[0],encoding='unicode')[:2000]}
          Path('docs/research/msd-section-shape-2026-09-23.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Save metadata contract only
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add docs/research/msd-section-shape-2026-09-23.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(content): record inspected section and topic-sitemap contracts [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then git switch --detach "$remote"; git cherry-pick "$own"; fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
