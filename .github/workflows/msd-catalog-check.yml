name: MSD catalog qualification
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths: [.github/workflows/msd-catalog-check.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect public catalog metadata, no article fetch
        run: |
          env -i PATH="$PATH" HOME="$HOME" python3 - <<'PY'
          import json,hashlib,time,re,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          host='https://www.msdmanuals.com'
          def get(path,limit=16000000):
              time.sleep(5.1)
              url=host+urllib.parse.quote(path,safe='/-._~')
              request=urllib.request.Request(url,headers={'User-Agent':'MiniMedCatalogResearch/0.1 (+https://github.com/T-Damer/MiniMed)','Accept-Encoding':'identity'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  body=response.read(limit+1)
                  if len(body)>limit: raise ValueError('Metadata budget exceeded')
                  return body
          robots=get('/robots.txt').decode()
          forbidden=[re.compile(re.escape(line.partition(':')[2].strip()).replace(r'\*','.*')) for line in robots.splitlines() if line.lower().startswith('disallow:') and line.partition(':')[2].strip()]
          def allowed(path):
              if any(rule.search(path) for rule in forbidden): raise ValueError('Robots excluded path')
          class Next(HTMLParser):
              def __init__(self): super().__init__(); self.active=False;self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script' and dict(attrs).get('id')=='__NEXT_DATA__':self.active=True
              def handle_endtag(self,tag):
                  if tag=='script':self.active=False
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
          result={'checkedCommit':'${{ github.sha }}','robotsSha256':hashlib.sha256(robots.encode()).hexdigest(),'pages':[]}
          for path in ['/ru/professional/health-topics','/ru/professional/неврологические-расстройства','/ru/sitemap.xml']:
              allowed(path);raw=get(path);item={'path':path,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              if path.endswith('.xml'):
                  root=ET.fromstring(raw);item.update({'root':root.tag,'locations':len(root.findall('.//{*}loc')),'firstLocations':[node.text for node in root.findall('.//{*}loc')[:5]]})
              else:
                  parser=Next();parser.feed(raw.decode('utf-8'));data=json.loads(''.join(parser.parts))
                  pp=data['props']['pageProps'];item['componentShapes']=[]
                  def shape(value,depth=0):
                      if depth>3:return type(value).__name__
                      if isinstance(value,dict):return {k:shape(v,depth+1) for k,v in value.items() if not k.lower().endswith(('description','text','html'))}
                      if isinstance(value,list):return {'length':len(value),'firstShape':shape(value[0],depth+1) if value else None}
                      return type(value).__name__
                  for k,v in pp.get('componentProps',{}).items():
                      if isinstance(v,dict):item['componentShapes'].append({'id':k,'shape':shape(v)})
                  titles=[]
                  def walk(value):
                      if isinstance(value,dict):
                          if 'titlecomputed_t' in value and 'relativeurlcomputed_s' in value:titles.append({k:value[k] for k in ('uniqueid_t','titlecomputed_t','relativeurlcomputed_s') if k in value})
                          for v in value.values():walk(v)
                      elif isinstance(value,list):
                          for v in value:walk(v)
                  walk(pp.get('componentProps',{}));item['topicMetadataRows']=len(titles);item['firstTitles']=titles[:4]
              result['pages'].append(item)
          Path('docs/research/msd-index-shape-2026-09-23.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Save only inspected metadata shape
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add docs/research/msd-index-shape-2026-09-23.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(content): record inspected MSD catalog structure [skip ci]'
          own=$(git rev-parse HEAD)
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin experiment/system-one-search-benchmark
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != '${{ github.sha }}' ]; then git switch --detach "$remote"; git cherry-pick "$own"; fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/experiment/system-one-search-benchmark
