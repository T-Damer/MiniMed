name: RapidFuzz medication experiment
on:
  push:
    branches: [experiment/system-one-search-benchmark]
    paths:
      - .github/workflows/rapidfuzz-medication-experiment.yml
      - tools/benchmarks/rapidfuzz-medication-experiment.py
      - tools/benchmarks/current-medication-matcher-experiment.mjs
permissions:
  contents: write
concurrency:
  group: minimed-rapidfuzz-medication-experiment
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.3
          no-cache: true
      - name: Install repository dependencies and isolated RapidFuzz
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun install --frozen-lockfile --ignore-scripts
          python3 -m venv .rapidfuzz-venv
          .rapidfuzz-venv/bin/pip install --disable-pip-version-check --no-cache-dir rapidfuzz==3.14.6
      - name: Restore unchanged core corpus
        run: env -i PATH="$PATH" HOME="$HOME" bun scripts/restore-core.mjs
      - name: Generate deterministic cases and compare candidate generators
        run: |
          mkdir -p data/build
          python3 tools/benchmarks/rapidfuzz-medication-experiment.py generate             --db apps/app/public/content/core.db             --previous docs/research/medication-suffix-2026.09.23-suffix-1.json             --output data/build/rapidfuzz-medication-cases.json             --per-family 100
          env -i PATH="$PATH" HOME="$HOME" bun tools/benchmarks/current-medication-matcher-experiment.mjs             apps/app/public/content/core.db             data/build/rapidfuzz-medication-cases.json             data/build/current-medication-matcher.json
          .rapidfuzz-venv/bin/python tools/benchmarks/rapidfuzz-medication-experiment.py score             --db apps/app/public/content/core.db             --cases data/build/rapidfuzz-medication-cases.json             --current data/build/current-medication-matcher.json             --output docs/research/rapidfuzz-medication-experiment-2026-09-24.json
      - name: Validate experiment scripts
        run: |
          env -i PATH="$PATH" HOME="$HOME" bun x biome check tools/benchmarks/current-medication-matcher-experiment.mjs
          python3 -m py_compile tools/benchmarks/rapidfuzz-medication-experiment.py
          git diff --exit-code -- packages apps content
      - name: Record isolated experiment only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/research/rapidfuzz-medication-experiment-2026-09-24.json')
          report=json.loads(p.read_text())
          current=report['currentMatcher']
          projected=report['rapidfuzz']['osa-with-source-marker-projection']['sweep']
          lines=[
            '# RapidFuzz OSA medication-name experiment — 2026-09-24',
            '',
            'Isolated benchmark only; RapidFuzz is not an application dependency.',
            '',
            f"- Deterministic cases: {report['cases']}.",
            f"- Current MiniMed candidate matcher: Top-1 {current['top1']}/{current['cases']}, Top-8 {current['top8']}/{current['cases']}.",
            '- RapidFuzz scorer: OSA.normalized_similarity; cutoffs are swept rather than selected against one hand-picked example.',
            '- osa-full-names is library-only; osa-with-source-marker-projection adds only the same source-backed one-letter marker projection used by MiniMed.',
            '',
            '| cutoff | RapidFuzz projected Top-1 | Top-8 | negative controls with candidates | us/case |',
            '| ---: | ---: | ---: | ---: | ---: |',
          ]
          for key, row in projected.items():
            lines.append(f"| {key} | {row['top1']}/{row['total']} | {row['top8']}/{row['total']} | {row['negativeControlsWithCandidates']}/{len(report['negativeControls'])} | {row['microsecondsPerCase']:.1f} |")
          lines += [
            '',
            'The JSON receipt contains per-family metrics and bounded miss samples. Mechanical corruptions are not independent clinician logs, and candidate recall is not medication substitution or diagnostic validation.',
            ''
          ]
          Path('docs/research/rapidfuzz-medication-experiment-2026-09-24.md').write_text('\n'.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/rapidfuzz-medication-experiment-2026-09-24.json docs/research/rapidfuzz-medication-experiment-2026-09-24.md
          git commit -m 'test(search): record isolated RapidFuzz medication experiment'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:experiment/system-one-search-benchmark
      - name: No artifact or cache uploads
        if: always()
        run: echo 'Pinned RapidFuzz is installed only inside this one-shot experiment; no model, database binary, APK, artifact or cache upload.' >> "$GITHUB_STEP_SUMMARY"
