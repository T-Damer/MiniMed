name: Validate Russian regulatory pack

# Content builds run locally (user decision 2026-09-29); start this workflow by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulatory-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project tools/ingest --all-groups --locked

      - name: Build direct regulatory pack
        run: |
          bun run content:lint:regulatory
          bun run content:build:regulatory
          sha256sum data/build/rf-regulatory-pilot.db | cut -d' ' -f1 > /tmp/direct-regulatory.sha256

      - name: Rebuild through declared source manifest
        run: |
          bun run content:sync:regulatory
          uv run --project tools/ingest medbase lint --input data/synced/rf-regulatory-pilot
          bun run content:build:regulatory:synced
          sha256sum data/build/rf-regulatory-pilot.db | cut -d' ' -f1 > /tmp/synced-regulatory.sha256
          diff -u /tmp/direct-regulatory.sha256 /tmp/synced-regulatory.sha256

      - name: Run source-grounded regulatory benchmark
        run: bun run benchmark:regulatory

      - name: Upload regulatory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regulatory-pack-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/build/rf-regulatory-pilot-report.json
            data/build/rf-regulatory-pilot-benchmark.json
            data/build/regulatory-source-sync-report.json
