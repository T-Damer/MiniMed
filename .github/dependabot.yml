version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # tools/ingest is a uv project. The pip ecosystem updates pyproject.toml without regenerating
  # uv.lock, which makes every such pull request fail `uv sync --locked`.
  - package-ecosystem: uv
    directory: /tools/ingest
    schedule:
      interval: weekly
