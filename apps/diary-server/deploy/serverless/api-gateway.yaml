# API Gateway of the serverless diary (ADR-0027): /api/* goes to the container; the bare domain and
# /diary send people to the pages on GitHub Pages (a fragment like #c=… survives the redirect).
# CORS is the container's (DIARY_CORS_ORIGINS): the gateway's own CORS refuses capacitor:// origins.
# ${CONTAINER_ID} and ${INVOKER_SA} are filled by scripts/diary-serverless-deploy.sh.
openapi: 3.0.0
info:
  title: minimed-diary
  version: 1.0.0
paths:
  /:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 302
        http_headers:
          Location: https://t-damer.github.io/MiniMed/app/?profile=diaries
        content:
          text/plain: ""
  /diary:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 302
        http_headers:
          Location: https://t-damer.github.io/MiniMed/app/diary/
        content:
          text/plain: ""
  # Short links for the QR codes on the slides (DIARY-DEMO2): the doctor's sign-in opened on «Демо»,
  # and the patient's demo diary made on the visitor's device.
  /demo:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 302
        http_headers:
          Location: https://t-damer.github.io/MiniMed/app/?profile=diaries&demo
        content:
          text/plain: ""
  /demo/patient:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 302
        http_headers:
          Location: https://t-damer.github.io/MiniMed/app/diary/#demo
        content:
          text/plain: ""
  # The app was served from this domain on the VM (2026-10-27 – 11-01); browsers that installed it
  # keep that version in a service worker that never updates, because nothing here answers /sw.js.
  # This one retires it: caches cleared, unregistered, the page reloaded — onto the redirect to Pages.
  /sw.js:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 200
        http_headers:
          Content-Type: application/javascript; charset=utf-8
          Cache-Control: no-cache
        content:
          application/javascript: "self.addEventListener('install', () => self.skipWaiting());\nself.addEventListener('activate', (event) => event.waitUntil((async () => {\n  for (const key of await caches.keys()) await caches.delete(key);\n  await self.registration.unregister();\n  for (const client of await self.clients.matchAll({ type: 'window' })) client.navigate(client.url);\n})()));\n"
  /api/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${CONTAINER_ID}
        service_account_id: ${INVOKER_SA}
