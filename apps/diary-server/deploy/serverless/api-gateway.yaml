# API Gateway of the serverless diary (ADR-0027): /api/* goes to the container; the bare domain and
# /diary send people to the pages on GitHub Pages (a fragment like #c=… survives the redirect).
# CORS is the container's (DIARY_CORS_ORIGINS): the gateway's own CORS refuses capacitor:// origins.
# ${CONTAINER_ID} and ${INVOKER_SA} are filled by scripts/diary-serverless-deploy.sh.
openapi: 3.0.0
info:
  title: minimed-diary
  version: 1.0.0
paths:
  /:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 302
        http_headers:
          Location: https://t-damer.github.io/MiniMed/app/?profile=diaries
        content:
          text/plain: ""
  /diary:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 302
        http_headers:
          Location: https://t-damer.github.io/MiniMed/app/diary/
        content:
          text/plain: ""
  /api/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${CONTAINER_ID}
        service_account_id: ${INVOKER_SA}
