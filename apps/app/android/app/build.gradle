apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

import groovy.json.JsonSlurper

// Explicit emulator-only storage qualification. Normal APK tasks keep the full ARM inference runtime.
def storageSmoke = providers.gradleProperty('minimedStorageSmoke').orNull == 'true'
if (storageSmoke && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Storage-smoke variant must never be packaged as a release')
}

def releaseMetadata = new JsonSlurper().parse(file('../../../../release.json'))

android {
    namespace = "dev.localmed.search"
    compileSdk = rootProject.ext.compileSdkVersion
    // Pinned to the NDK actually installed for this project — see
    // docs/adr/0015-native-llama-cpp-android-runtime.md.
    ndkVersion "27.3.13750724"
    defaultConfig {
        applicationId "dev.localmed.search"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseMetadata.androidVersionCode
        versionName releaseMetadata.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Keep small shipped companions; core and large optional editions are downloaded.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:core.db:medications.db:mkb.db:ambulatory.db'
        }
        ndk {
            // The optional inference runtime is ARM-only; storage qualification is explicitly x86.
            abiFilters(storageSmoke ? 'x86_64' : 'arm64-v8a')
        }
        if (!storageSmoke) {
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_shared"
                    targets "ai-chat"
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    if (!storageSmoke) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
                version "3.22.1"
            }
        }
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // SQLite 3.50.4 source pin: upstream README names an unpublished tag. Never use master-SNAPSHOT.
    implementation 'com.github.requery:sqlite-android:0bbaa7a8b4c485c0d4b385425113fe33ead6c3c0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
