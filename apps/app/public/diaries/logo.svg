<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Дневники пациентов</title>
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3b5747"/>
      <stop offset="1" stop-color="#223329"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a21"/>
      <stop offset="1" stop-color="#2a4033"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ea"/>
      <stop offset="1" stop-color="#ece3cb"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8653d"/>
      <stop offset="1" stop-color="#7c4428"/>
    </linearGradient>
  </defs>
  <!-- Page block peeking out on the right and at the bottom -->
  <rect x="124" y="84" width="314" height="378" rx="36" fill="#e8dfc5" stroke="#cbc0a7" stroke-width="4"/>
  <path d="M418 120v300M402 446H160" stroke="#cbc0a7" stroke-width="3" fill="none" opacity="0.8"/>
  <!-- Cover -->
  <rect x="80" y="56" width="340" height="388" rx="42" fill="url(#leather)"/>
  <path d="M122 56h-0c-23 0-42 19-42 42v304c0 23 19 42 42 42h14V56z" fill="url(#spine)"/>
  <rect x="98" y="74" width="304" height="352" rx="30" fill="none" stroke="#d9c9a3" stroke-width="4" stroke-dasharray="12 9" opacity="0.75"/>
  <!-- Checklist label -->
  <rect x="162" y="112" width="208" height="228" rx="20" fill="url(#paper)" stroke="#cbc0a7" stroke-width="3"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="186" y="140" width="34" height="34" rx="8" stroke="#2f4638" stroke-width="7"/>
    <path d="M193 157l9 9 20-24" stroke="#2f4638" stroke-width="9"/>
    <path d="M240 157h104" stroke="#8a8574" stroke-width="11"/>
    <rect x="186" y="208" width="34" height="34" rx="8" stroke="#2f4638" stroke-width="7"/>
    <path d="M193 225l9 9 20-24" stroke="#2f4638" stroke-width="9"/>
    <path d="M240 225h84" stroke="#8a8574" stroke-width="11"/>
    <rect x="186" y="276" width="34" height="34" rx="8" stroke="#2f4638" stroke-width="7"/>
    <path d="M240 293h96" stroke="#b9b29d" stroke-width="11"/>
  </g>
  <!-- Medical badge -->
  <circle cx="266" cy="384" r="36" fill="#f3ecd9" stroke="#cbc0a7" stroke-width="3"/>
  <circle cx="266" cy="384" r="28" fill="none" stroke="#cbc0a7" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M256 362h20v12h12v20h-12v12h-20v-12h-12v-20h12z" fill="#b5452f"/>
  <!-- Strap with a brass snap -->
  <rect x="384" y="214" width="62" height="78" rx="20" fill="url(#strap)"/>
  <rect x="392" y="222" width="46" height="62" rx="14" fill="none" stroke="#d9b48a" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.8"/>
  <circle cx="421" cy="253" r="13" fill="#c9a24e" stroke="#8e6d2a" stroke-width="3"/>
</svg>
