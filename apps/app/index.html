<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00000000" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The theme chosen in Settings (state/theme.ts), applied before the first paint.
      try {
        const theme = localStorage.getItem('minimed.theme.v1');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // Storage is blocked: the device's scheme decides.
      }
    </script>
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="MiniMed — offline-first поиск по локальному корпусу клинических материалов."
    />
    <title>MiniMed — локальная медицинская картотека</title>
    <!--
      Boot surface: the Android splash drawn again by the page (same ground, the same wallet image
      at the same size and place; see res/drawable/splash_icon.xml), so the native splash fades
      onto an identical picture. It covers the app until the first screen is ready, then
      src/app/boot-surface.ts plays its exit. Inline, because it must paint before any stylesheet.
    -->
    <style>
      :root {
        --boot-background: #f3ecd9;
      }
      html:not(:has(#root > *)) {
        background: var(--boot-background);
      }
      .boot-surface {
        position: fixed;
        z-index: 2147483000;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-background);
        pointer-events: none;
      }
      .boot-surface__icon {
        width: 190px;
        height: 190px;
      }
      .boot-surface--leaving {
        animation: boot-surface-out 360ms cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      .boot-surface__icon--leaving {
        animation: boot-surface-icon-out 300ms cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      @keyframes boot-surface-out {
        to {
          opacity: 0;
        }
      }
      @keyframes boot-surface-icon-out {
        to {
          opacity: 0;
          transform: scale(1.12);
        }
      }
      /* Also follows the theme chosen in the app (data-theme, see state/theme.ts). */
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-background: #2d2721;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Для запуска MiniMed нужен JavaScript.</noscript>
    <div id="boot-surface" class="boot-surface" aria-hidden="true">
      <img class="boot-surface__icon" src="./boot-icon.png" alt="" width="190" height="190" />
    </div>
    <script>
      // On Android the splash icon is centred on the screen, the WebView sits between the system
      // bars: move ours to the same spot (MiniMedBoot comes from LocalMedSystemUiPlugin).
      (() => {
        const bridge = window.MiniMedBoot;
        const icon = document.querySelector('.boot-surface__icon');
        if (!bridge || !icon) return;
        const place = () => {
          icon.style.translate = `0 ${bridge.iconShiftY()}px`;
        };
        place();
        window.addEventListener('resize', place);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
