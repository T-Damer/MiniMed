<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <!-- The diaries' own notebook icon (public/diaries/), not the main app's wallet. -->
    <link rel="icon" href="../diaries/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="../diaries/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="../diaries/apple-touch-icon.png" />
    <!--
      iOS Safari reads the manifest once, while the page loads, and a manifest's start_url has no
      room for the invitation (#i=...): the home-screen icon would then open an empty diary. Without
      a manifest, iOS adds the page's current address, including the fragment, so the icon opens
      the patient's diary. Every other browser gets the manifest (installable on Android Chrome).
    -->
    <script>
      (() => {
        var ua = navigator.userAgent;
        var ios =
          /iPhone|iPad|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (ios) return;
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = './manifest.webmanifest';
        document.head.appendChild(link);
      })();
    </script>
    <meta name="theme-color" content="#f3ecd9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Дневник" />
    <meta name="description" content="Дневник самоконтроля MiniMed: записи хранятся только на этом устройстве." />
    <title>Дневник самоконтроля</title>
  </head>
  <body class="diary-body">
    <noscript>Для дневника нужен JavaScript.</noscript>
    <div id="diary-root"></div>
    <script type="module" src="/src/diary/main.tsx"></script>
  </body>
</html>
